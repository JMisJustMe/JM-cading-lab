name: Apply Estate Contact Organ Propagation v1.1

on:
  push:
    branches: [main]
    paths:
      - 'governance/contact-organ/**'
      - 'apps/**'
      - 'lyrics/**'
      - 'money-menu/**'
      - 'games-beyond/**'
      - 'coding-estate/**'
      - 'recovery/**'
      - 'estate-publication/apps-tools-games/**'
      - '.github/workflows/apply-estate-contact-organ-propagation-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estate-contact-organ-propagation-v1-1
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate independent 28-body registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('governance/contact-organ/recipient_registry_v1_1.json').read_text())['recipients']
          assert len(rows)==28 and len({x['id'] for x in rows})==28
          assert sum(x['id'].startswith('cross-') for x in rows)==3
          assert sum(x['id'].startswith('phone-') for x in rows)==25
          assert all(not x['remote'] for x in rows if x['id'].startswith('phone-'))
          print('28-body registry PASS')
          PY

      - name: Compile independent v1.1 propagator
        run: python3 -m py_compile governance/contact-organ/propagate_contact_organ_v1_1.py

      - name: Check common Contact Organ donor syntax
        run: node --check governance/contact-organ/JM_ESTATE_CONTACT_ORGAN_v1_0.js

      - name: Check cross-device donor syntax
        run: node --check governance/contact-organ/JM_ESTATE_CROSS_DEVICE_CONTACT_ADAPTER_v1_0.js

      - name: Materialise or preserve exact runtime diagnostic
        id: materialise
        shell: bash
        run: |
          set +e
          mkdir -p estate-publication/contact-organ-descendants
          python3 governance/contact-organ/propagate_contact_organ_v1_1.py > /tmp/jm-contact-v1-1.log 2>&1
          code=$?
          cat /tmp/jm-contact-v1-1.log
          cp /tmp/jm-contact-v1-1.log estate-publication/contact-organ-descendants/PROPAGATION_RUNTIME_DIAGNOSTIC_v1_1.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify generated receipt when materialisation completed
        if: steps.materialise.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('estate-publication/contact-organ-descendants')
          r=json.loads((root/'PROPAGATION_RECEIPT_v1_1.json').read_text())
          assert r['totalRecipients']==28 and r['crossRecipients']==3 and r['phoneRecipients']==25
          cross={'cross-continuity','cross-forge','cross-private-arcade'}
          bad=[]
          for row in r['results']:
              if not row['status'].startswith('MATERIALIZED_'): continue
              p=Path(row['descendant']); text=p.read_text(encoding='utf-8')
              if 'JM_ESTATE_CONTACT_ORGAN_PATCH_v1_1' not in text: bad.append((row['recipientId'],'marker'))
              has_cross='JMCrossDeviceContactAdapter' in text
              if row['recipientId'] in cross and not has_cross: bad.append((row['recipientId'],'cross donor missing'))
              if row['recipientId'] not in cross and has_cross: bad.append((row['recipientId'],'cross donor leaked into phone-only body'))
              rec=json.loads((p.parent/'PATCH_RECEIPT_v1_1.json').read_text())
              if rec.get('parentMutated') is not False: bad.append((row['recipientId'],'parent mutation'))
          assert not bad,bad
          print(f"MATERIALIZED {r['materialized']}/28; RECOVERY OPEN {r['recoveryOpen']}; semantic gates PASS")
          PY

      - name: Commit descendants, receipts, recovery queue or diagnostic
        run: |
          set -euo pipefail
          git config user.name 'JM Contact Organ Propagation Gate v1.1'
          git config user.email 'actions@users.noreply.github.com'
          git add estate-publication/contact-organ-descendants
          git diff --cached --quiet && exit 0
          git commit -m 'Record Contact Organ v1.1 materialisation or runtime diagnostic [skip ci]'
          for attempt in $(seq 1 20); do
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

      - name: Fail only after diagnostic has been preserved
        if: steps.materialise.outputs.exit_code != '0'
        run: exit 1
