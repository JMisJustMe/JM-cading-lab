name: Audit Estate Classification Integrity v1.2

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "games-beyond/**"
      - "navigator/stringline.json"
      - "registry/estate-classification-authority-v1.0.json"
      - "registry/estate-classification-integrity-receipt-v1.0.json"
      - "registry/routeos-v108a5-recovery-authority.json"
      - "registry/build050-latest-source-reconciliation-authority.json"
      - "registry/portal-engine-access-line-authority.json"
      - "governance/verify_estate_classification.py"
      - ".github/workflows/audit-estate-classification-v1-2.yml"
  pull_request:
    paths:
      - "apps/**"
      - "games-beyond/**"
      - "navigator/stringline.json"
      - "registry/estate-classification-authority-v1.0.json"
      - "registry/estate-classification-integrity-receipt-v1.0.json"
      - "governance/verify_estate_classification.py"

permissions:
  contents: read

jobs:
  integrity:
    name: Prove current seats, versions, plurality and recovery truth
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Run the single classification authority verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/verify_estate_classification.py --root .
