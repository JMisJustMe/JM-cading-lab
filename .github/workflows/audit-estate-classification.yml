name: Audit Estate Classification Integrity

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "games-beyond/**"
      - "navigator/stringline.json"
      - "registry/estate-classification-authority-v1.0.json"
      - "registry/estate-classification-integrity-receipt-v1.0.json"
      - "governance/verify_estate_classification.py"
      - "governance/JM_ESTATE_CLASSIFICATION_INTEGRITY_AUDIT_v1_0.md"
      - ".github/workflows/audit-estate-classification.yml"
  pull_request:
    paths:
      - "apps/**"
      - "games-beyond/**"
      - "navigator/stringline.json"
      - "registry/estate-classification-authority-v1.0.json"
      - "governance/verify_estate_classification.py"

permissions:
  contents: read

jobs:
  classify:
    name: Legacy gate routed through current classification authority
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Run the shared Estate classification verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/verify_estate_classification.py --root .
