name: Audit Estate Head Public Contract

on:
  push:
    branches: [main]
    paths:
      - "registry/estate-head-public-current.json"
      - "registry/estate-gap-governance-breach-v0.2.json"
      - "registry/estate-head-games-beyond-canonical-v0.2.json"
      - "navigator/stringline.json"
      - ".github/workflows/audit-estate-head-public-contract.yml"
  pull_request:
    paths:
      - "registry/estate-head-public-current.json"
      - "registry/estate-gap-governance-breach-v0.2.json"
      - "registry/estate-head-games-beyond-canonical-v0.2.json"
      - "navigator/stringline.json"
      - ".github/workflows/audit-estate-head-public-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Keep owner Head, Stringline and public contract aligned
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Validate current public contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          errors=[]
          current=json.loads(Path('registry/estate-head-public-current.json').read_text())
          stringline=json.loads(Path('navigator/stringline.json').read_text())
          annex=json.loads(Path('registry/estate-head-games-beyond-canonical-v0.2.json').read_text())
          gaps=json.loads(Path('registry/estate-gap-governance-breach-v0.2.json').read_text())

          version=current.get('current_public_subset_version')
          if version not in {'v0.3.0','v0.3.1'}:
              errors.append(f'Current Estate Head public contract has unsupported current version: {version!r}')
          if current.get('body_count')!=61:
              errors.append('Estate Head governed body count drift')
          if current.get('project_head_count')!=11:
              errors.append('Project Head count drift')

          gap_states=Counter(x.get('state') for x in gaps.get('body_gaps',[]))
          expected_gap={'OPEN':35,'PARTIAL':20,'RESOLVED':1}
          if dict(gap_states)!=expected_gap:
              errors.append(f'Live gap register drift: {dict(gap_states)}')
          if current.get('gap_snapshot')!=expected_gap:
              errors.append('Public contract gap snapshot drift')

          projects={x.get('id'):x for x in stringline.get('seed_project_strings',[])}
          games=projects.get('games-beyond',{})
          game_ids={x.get('id') for x in games.get('bodies',[])}
          required={'games-house','routeos-platform','glyphplay','gameforge','glyphforge','playform','tboys-core-clash','gamecore'}
          if game_ids!=required:
              errors.append(f'Games&Beyond Stringline mismatch: {sorted(game_ids)}')
          if current.get('stringline',{}).get('games_beyond_project_body_count')!=len(required):
              errors.append('Public contract Stringline body count drift')
          if annex.get('status')!='MAIN_STRINGLINE_CONSUMED':
              errors.append('Games&Beyond canonical annex is not consumed')

          pipeline=current.get('source_authority_pipeline',{})
          if pipeline.get('stages')!=6 or pipeline.get('owner_gate')!='MOUNTED':
              errors.append('Source-authority pipeline contract weakened')
          allowed_deployment_states={
              'PUBLIC_CONSUMPTION_NEXT',
              'PUBLIC_CONSUMED',
              'PUBLIC_ROUTE_REPAIR_WAVE_01_CANDIDATE_DEPLOYMENT',
          }
          if current.get('deployment_state') not in allowed_deployment_states:
              errors.append(f"Unknown public deployment state: {current.get('deployment_state')!r}")

          if version=='v0.3.1' and current.get('public_route_repair_wave_01',{}).get('status')!='SOURCE_REPAIRED_LIVE_PROOF_PENDING':
              errors.append('v0.3.1 public-route repair boundary is missing')

          forbidden={'owner_mount','owner_registry_sha256','private_source_paths','owner_notes','raw_gap_evidence'}
          if forbidden & set(current):
              errors.append('Private owner field leaked into public contract')

          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              raise SystemExit(1)
          print(f'Estate Head public contract PASS: {version}; 61 bodies; 56 gaps; 8 Games&Beyond bodies; six-stage owner gate mounted; deployment={current.get("deployment_state")}.')
          PY
