name: Build AILatheo v3 Receiver APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified-browser/ailatheo-creation-runtime.mjs'
      - 'unified-browser/ailatheo-native-touch-carrier.mjs'
      - 'tests/ailatheo-android-touch-carrier.spec.mjs'
      - 'unified-browser/OPEN_FIRST_AILATHEO_CREATION_WORKBENCH_v3_0_ALPHA.html'
      - 'coding-estate/integration/**'
      - 'coding-estate/sovereign-batch-four/direct/toolchain-native.mjs'
      - 'coding-estate/sovereign-batch-six/direct/game-input-native-*.mjs'
      - 'tools/Build-JMAndroidForgeApk.ps1'
      - 'scripts/build_ailatheo_v3_receiver_carrier.mjs'
      - '.github/workflows/build-ailatheo-v3-receiver-apk.yml'
  pull_request:
    paths:
      - 'unified-browser/ailatheo-creation-runtime.mjs'
      - 'unified-browser/ailatheo-native-touch-carrier.mjs'
      - 'tests/ailatheo-android-touch-carrier.spec.mjs'
      - 'unified-browser/OPEN_FIRST_AILATHEO_CREATION_WORKBENCH_v3_0_ALPHA.html'
      - 'coding-estate/integration/**'
      - 'coding-estate/sovereign-batch-four/direct/toolchain-native.mjs'
      - 'coding-estate/sovereign-batch-six/direct/game-input-native-*.mjs'
      - 'tools/Build-JMAndroidForgeApk.ps1'
      - 'scripts/build_ailatheo_v3_receiver_carrier.mjs'
      - '.github/workflows/build-ailatheo-v3-receiver-apk.yml'

permissions:
  contents: write

jobs:
  receiver-apk:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize exact AILatheo receiver carrier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $carrier = Join-Path $env:RUNNER_TEMP 'ailatheo-receiver-carrier'
          node scripts/build_ailatheo_v3_receiver_carrier.mjs $carrier
          if (-not (Test-Path -LiteralPath (Join-Path $carrier 'index.html'))) { throw 'AILatheo receiver carrier index.html missing.' }
          $html = Get-Content -LiteralPath (Join-Path $carrier 'index.html') -Raw
          foreach ($needle in @('Pulse Pad','Glow Orb','Gate Bloom','VISIBLE CONSEQUENCE','PERSISTED STATE RECOVERED')) {
            if (-not $html.Contains($needle)) { throw "Native touch carrier missing $needle" }
          }

      - name: Build and signature-verify AILatheo APK
        shell: pwsh
        env:
          JM_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.JM_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          JM_ANDROID_RELEASE_STOREPASS: ${{ secrets.JM_ANDROID_RELEASE_STOREPASS }}
          JM_ANDROID_RELEASE_KEYPASS: ${{ secrets.JM_ANDROID_RELEASE_KEYPASS }}
          JM_ANDROID_RELEASE_KEY_ALIAS: ${{ vars.JM_ANDROID_RELEASE_KEY_ALIAS }}
          JM_ANDROID_RELEASE_CERT_SHA256: ${{ vars.JM_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $carrier = Join-Path $env:RUNNER_TEMP 'ailatheo-receiver-carrier'
          $buildOut = Join-Path $env:RUNNER_TEMP 'ailatheo-receiver-build'
          $artifact = Join-Path $env:RUNNER_TEMP 'ailatheo-receiver-artifact'
          New-Item -ItemType Directory -Path $buildOut,$artifact -Force | Out-Null

          $execution = Get-Content -LiteralPath (Join-Path $carrier 'AILATHEO_NATIVE_EXECUTION.json') -Raw | ConvertFrom-Json
          $versionName = [string]$execution.carrier.versionName
          $versionCode = [int]$execution.carrier.versionCode
          $existingProof = 'downloads/AILATHEO_RECEIVER_BUILD_PROOF.json'
          if (Test-Path -LiteralPath $existingProof) {
            $previous = Get-Content -LiteralPath $existingProof -Raw | ConvertFrom-Json
            if ($versionCode -le [int]$previous.version_code) {
              throw "VERSION_CODE_HOLD: $versionCode is not higher than previous $($previous.version_code)."
            }
          }
          $signer = Join-Path $env:RUNNER_TEMP 'jm-signing-identity.jks'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            # Throwaway TEST certificate, reused across TWO builds in this job only.
            # No key is published, and no PR APK is entitled to release/update claims.
            $env:JM_ANDROID_RELEASE_KEY_ALIAS = 'jm-ci-disposable'
            $env:JM_ANDROID_RELEASE_STOREPASS = 'JMCITest-' + [guid]::NewGuid().ToString('N')
            $env:JM_ANDROID_RELEASE_KEYPASS = $env:JM_ANDROID_RELEASE_STOREPASS
            & keytool -genkeypair -noprompt -keystore $signer -storepass $env:JM_ANDROID_RELEASE_STOREPASS `
              -keypass $env:JM_ANDROID_RELEASE_KEYPASS -alias $env:JM_ANDROID_RELEASE_KEY_ALIAS `
              -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable JM CI Test, O=Nonrelease' 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'TEST_SIGNER_CREATE_FAILED' }
            $fingerprintText = (& keytool -list -v -keystore $signer -alias $env:JM_ANDROID_RELEASE_KEY_ALIAS `
              -storepass $env:JM_ANDROID_RELEASE_STOREPASS 2>&1 | Out-String)
            $fingerprintHit = [regex]::Match($fingerprintText, 'SHA256:\\s*([0-9A-Fa-f:]{95})')
            if (-not $fingerprintHit.Success) { throw 'TEST_SIGNER_FINGERPRINT_MISSING' }
            $expectedSigner = ($fingerprintHit.Groups[1].Value -replace ':','').ToLowerInvariant()
            $releaseClaim = $false
          }
          else {
            $required = @('JM_ANDROID_RELEASE_KEYSTORE_BASE64','JM_ANDROID_RELEASE_STOREPASS',
              'JM_ANDROID_RELEASE_KEYPASS','JM_ANDROID_RELEASE_KEY_ALIAS','JM_ANDROID_RELEASE_CERT_SHA256')
            foreach ($name in $required) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "RELEASE_SIGNER_HOLD: missing protected owner signing custody: $name. NO PUBLIC APK PUBLISHED."
              }
            }
            try { [IO.File]::WriteAllBytes($signer,[Convert]::FromBase64String($env:JM_ANDROID_RELEASE_KEYSTORE_BASE64)) }
            catch { throw 'RELEASE_SIGNER_HOLD: protected keystore encoding was invalid.' }
            $expectedSigner = $env:JM_ANDROID_RELEASE_CERT_SHA256
            $releaseClaim = $true
          }

          $lines = @(& 'tools/Build-JMAndroidForgeApk.ps1' `
            -SourceDirectory $carrier `
            -ProjectName 'AILatheo Creation' `
            -PackageName 'com.jmisjustme.ailatheocreation' `
            -VersionName $versionName `
            -VersionCode $versionCode `
            -OutputRoot $buildOut `
            -SigningMode release `
            -SigningKeystorePath $signer `
            -ExpectedSignerSha256 $expectedSigner 2>&1)
          $lines | ForEach-Object { Write-Host $_ }
          $jsonLine = $lines | Where-Object { $_ -is [string] -and $_.TrimStart().StartsWith('{') } | Select-Object -Last 1
          if (-not $jsonLine) { throw 'Forge builder returned no JSON result.' }
          $result = $jsonLine | ConvertFrom-Json
          if (-not $result.success) { throw 'Forge builder did not report success.' }
          if (-not $result.update_ready -or $result.signing_mode -ne 'release') {
            throw 'RELEASE_SIGNING_BROKEN: signer was not owner-pinned.'
          }
          if ($result.signer_cert_sha256 -ne ($expectedSigner -replace ':','').ToLowerInvariant()) {
            throw 'RELEASE_SIGNER_CONTINUITY_MISMATCH'
          }
          if (-not $releaseClaim) {
            # Prove distinct successive versions inherit one signer, without touching release custody.
            $round2 = Join-Path $env:RUNNER_TEMP 'ailatheo-signing-continuity-second'
            New-Item -ItemType Directory -Path $round2 -Force | Out-Null
            $secondLines = @(& 'tools/Build-JMAndroidForgeApk.ps1' `
              -SourceDirectory $carrier -ProjectName 'AILatheo Creation' `
              -PackageName 'com.jmisjustme.ailatheocreation' `
              -VersionName '3.0.2-ci' -VersionCode ($versionCode+1) `
              -OutputRoot $round2 -SigningMode release `
              -SigningKeystorePath $signer -ExpectedSignerSha256 $expectedSigner 2>&1)
            $secondJson = $secondLines | Where-Object { $_ -is [string] -and $_.TrimStart().StartsWith('{') } | Select-Object -Last 1
            if (-not $secondJson) { throw 'SECOND_SIGNED_BUILD_HOLD' }
            $second = $secondJson | ConvertFrom-Json
            if (-not $second.success -or $second.signer_cert_sha256 -ne $result.signer_cert_sha256) {
              throw 'TWO_VERSION_CERTIFICATE_CONTINUITY_FAILED'
            }
            Write-Host 'JM_SIGNER_TWO_VERSION_CONTINUITY_PASS: distinct versionCodes, identical owner-supplied test signer'
          }
          if (-not (Test-Path -LiteralPath $result.apk)) { throw 'Built APK is missing.' }
          if (-not (Test-Path -LiteralPath $result.receipt)) { throw 'Build receipt is missing.' }
          $actual = (Get-FileHash -LiteralPath $result.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne ([string]$result.sha256).ToLowerInvariant()) { throw 'Built APK SHA-256 mismatch.' }
          Add-Type -AssemblyName System.IO.Compression
          $package = [IO.Compression.ZipFile]::OpenRead($result.apk)
          try {
            $entry = $package.GetEntry('assets/index.html')
            if (-not $entry) { throw 'Signed APK does not contain assets/index.html.' }
            $stream = $entry.Open()
            $memory = [IO.MemoryStream]::new()
            try { $stream.CopyTo($memory); $embedded = $memory.ToArray() }
            finally { $stream.Dispose(); $memory.Dispose() }
            $embeddedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($embedded)).ToLowerInvariant()
            $carrierHash = (Get-FileHash -LiteralPath (Join-Path $carrier 'index.html') -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($embeddedHash -ne $carrierHash) { throw 'Signed APK embedded HTML differs from the exact JM carrier source.' }
            $text = [Text.Encoding]::UTF8.GetString($embedded)
            foreach ($needle in @('Pulse Pad','Glow Orb','Gate Bloom','VISIBLE CONSEQUENCE','PERSISTED STATE RECOVERED')) {
              if (-not $text.Contains($needle)) { throw "APK asset missing $needle" }
            }
          }
          finally { $package.Dispose() }
          Write-Host "AILATHEO_APK_ASSET_EXACT_SHA256=$embeddedHash"

          $receipt = Get-Content -LiteralPath $result.receipt -Raw | ConvertFrom-Json
          if ($receipt.outcome -ne 'PASS') { throw 'Forge receipt is not PASS.' }
          if ($receipt.automatic_install_to_device) { throw 'Forge receipt incorrectly claims device installation.' }

          Copy-Item -LiteralPath $result.apk -Destination (Join-Path $artifact 'AILatheo_Creation_v3_0_alpha.apk')
          Copy-Item -LiteralPath $result.receipt -Destination (Join-Path $artifact 'ANDROID_BUILD_RECEIPT.json')
          Copy-Item -LiteralPath (Join-Path $carrier 'AILATHEO_NATIVE_EXECUTION.json') -Destination $artifact
          Copy-Item -LiteralPath (Join-Path $carrier 'AILatheoCreation.onebody.json') -Destination $artifact

          [ordered]@{
            schema='jm.ailatheo.receiver-build-proof/1.0'
            status=$(if ($releaseClaim) { 'APK_BUILD_PINNED_RELEASE_SIGNER' } else { 'CI_TEST_CERTIFICATE_CONTINUITY_PASS_NOT_RELEASE' })
            source_sha='${{ github.sha }}'
            package='com.jmisjustme.ailatheocreation'
            version_name=$versionName
            version_code=$versionCode
            signer_cert_sha256=$result.signer_cert_sha256
            signer_release_custody_verified=$releaseClaim
            update_ready=$releaseClaim
            apk='AILatheo_Creation_v3_0_alpha.apk'
            bytes=(Get-Item (Join-Path $artifact 'AILatheo_Creation_v3_0_alpha.apk')).Length
            sha256=$actual
            embedded_carrier_sha256=$embeddedHash
            apk_asset_exact_source_readback=$true
            app_entry='assets/index.html'
            browser_interaction_tested_in_separate_workflow=$true
            forge_receipt_outcome=$receipt.outcome
            installed=$false
            owner_runtime_ding=$false
            boundary='APK BUILT ≠ APK INSTALLED; APK INSTALLED ≠ OWNER RUNTIME DING'
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $artifact 'AILATHEO_RECEIVER_BUILD_PROOF.json') -Encoding UTF8

          if ($releaseClaim) { Write-Host 'AILATHEO_RELEASE_SIGNING_PASS' } else { Write-Host 'AILATHEO_CI_TEST_SIGNING_ONLY' }
          Write-Host "APK_BYTES=$((Get-Item (Join-Path $artifact 'AILatheo_Creation_v3_0_alpha.apk')).Length)"
          Write-Host "APK_SHA256=$actual"

      - name: Upload receiver build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'ailatheo-ci-test-only-not-release' || 'ailatheo-v3-receiver-apk' }}
          path: '${{ runner.temp }}/ailatheo-receiver-artifact/*'
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK to download door
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'ailatheo-receiver-artifact'
          New-Item -ItemType Directory -Path 'downloads' -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $artifact 'AILatheo_Creation_v3_0_alpha.apk') -Destination 'downloads/AILatheo_Creation_v3_0_alpha.apk' -Force
          Copy-Item -LiteralPath (Join-Path $artifact 'AILATHEO_RECEIVER_BUILD_PROOF.json') -Destination 'downloads/AILATHEO_RECEIVER_BUILD_PROOF.json' -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AILatheo_Creation_v3_0_alpha.apk downloads/AILATHEO_RECEIVER_BUILD_PROOF.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish verified AILatheo v3 APK [skip ci]"
            git push origin HEAD:main
          }
