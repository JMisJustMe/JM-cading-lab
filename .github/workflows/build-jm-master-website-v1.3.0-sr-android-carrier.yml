name: JM Master Website v1.3.0 SR Android Carrier

on:
  workflow_dispatch:
  push:
    paths:
      - 'website/master/v1.3.0-sr/android-carrier/**'
      - 'website/master/v1.3.0-sr/AUTHORITY.json'
      - '.github/workflows/build-jm-master-website-v1.3.0-sr-android-carrier.yml'

permissions:
  contents: write

concurrency:
  group: jm-master-website-v1-3-0-sr-android-carrier
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: website/master/v1.3.0-sr/android-carrier
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create temporary proof signing identity
        run: |
          keytool -genkeypair -noprompt -keystore proof-upload.jks \
            -storepass jm-proof-only -keypass jm-proof-only \
            -alias jm-proof -keyalg RSA -keysize 4096 -validity 3650 \
            -dname 'CN=JM Living Estate Carrier Proof, O=JM, C=GB'

      - name: Compile carrier APK and proof AAB
        run: gradle --no-daemon clean :app:assembleDebug :app:bundleRelease

      - name: Build universal APK from AAB
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/debug/app-debug.apk outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_DEBUG.apk
          cp app/build/outputs/bundle/release/app-release.aab outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_PROOF.aab
          curl -fsSL -o bundletool.jar 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar'
          java -jar bundletool.jar build-apks \
            --bundle=outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_PROOF.aab \
            --output=outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0.apks --mode=universal \
            --ks=proof-upload.jks --ks-pass=pass:jm-proof-only --ks-key-alias=jm-proof --key-pass=pass:jm-proof-only
          unzip -p outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0.apks universal.apk > outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_UNIVERSAL.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_DEBUG.apk > outputs/DEBUG_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs outputs/JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_UNIVERSAL.apk > outputs/UNIVERSAL_SIGNATURE.txt
          sha256sum outputs/* > outputs/SHA256SUMS.txt

      - name: Write build receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          def meta(name):
              path = Path('outputs') / name
              return {
                  'name': name,
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest()
              }

          receipt = {
              'schema': 'jm.website.android-carrier-receipt/v1',
              'status': 'BUILD_PASS_DEVICE_CONTACT_OPEN',
              'body': 'MASTER WEBSITE',
              'version': 'v1.3.0 SR',
              'package': 'com.jmisjustme.livingestate',
              'versionCode': 130,
              'versionName': '1.3.0',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'workflowRun': os.environ['GITHUB_RUN_ID'],
              'debugApk': meta('JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_DEBUG.apk'),
              'proofAab': meta('JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_PROOF.aab'),
              'universalApk': meta('JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0_UNIVERSAL.apk'),
              'carrierRoute': 'Android document picker → exact Master OneBody identity check → private persistent storage → local/offline WebView',
              'exactMasterRequiredMarkers': ['MASTER WEBSITE', 'v1.3.0 SR'],
              'signingBoundary': 'Temporary proof key; not owner production/update key.',
              'embeddedFinalApk': 'OPEN_LATER_REFINEMENT',
              'physicalDeviceDing': 'OPEN',
              'cloudflareOverwritten': False,
              'intakeChamberMerged': False
          }
          Path('outputs/ANDROID_CARRIER_BUILD_RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          registry = Path('../../../../registry/website')
          registry.mkdir(parents=True, exist_ok=True)
          (registry / 'jmisjustme-master-website-v1.3.0-sr-android-carrier-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: JMISJUSTME_LIVING_ESTATE_CARRIER_v1.3.0
          retention-days: 30
          path: website/master/v1.3.0-sr/android-carrier/outputs/

      - name: Seat receipt
        working-directory: .
        run: |
          git config user.name 'JM Master Website Android Carrier'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/website/jmisjustme-master-website-v1.3.0-sr-android-carrier-receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record JM Master Website v1.3.0 SR Android carrier receipt [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
