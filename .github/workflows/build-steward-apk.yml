name: Build JM Estate Storage Steward APK
on:
  push:
    branches: [steward-native-border-v0.9b-clean]
    paths: ['android/steward-native-border-v0.9b/**', '.github/workflows/build-steward-apk.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android/steward-native-border-v0.9b } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > build.exit
          exit "$code"
      - run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
          printf 'JM Estate Storage Steward v0.9C Field Channel\nStable field-signed debug build; side-by-side package; not production signed.\n' > app/build/outputs/apk/debug/BUILD_RECEIPT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JM_ESTATE_STORAGE_STEWARD_v0_9C_FIELD_APK
          path: |
            android/steward-native-border-v0.9b/app/build/outputs/apk/debug/app-debug.apk
            android/steward-native-border-v0.9b/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/steward-native-border-v0.9b/app/build/outputs/apk/debug/BUILD_RECEIPT.txt
          if-no-files-found: error
      - name: Record build status and compiler tail
        if: always()
        working-directory: .
        env:
          STEWARD_RUN_ID: ${{ github.run_id }}
          STEWARD_RUN_ATTEMPT: ${{ github.run_attempt }}
          STEWARD_SOURCE_SHA: ${{ github.sha }}
          STEWARD_JOB_STATUS: ${{ job.status }}
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p .github/steward-build-status
          tail -n 220 android/steward-native-border-v0.9b/build.log > .github/steward-build-status/v0.9c.log 2>/dev/null || true
          python3 - <<'PY'
          import json, os
          body = {
              "body": "JM Estate Storage Steward v0.9C Field Channel APK",
              "run_id": int(os.environ["STEWARD_RUN_ID"]),
              "run_attempt": int(os.environ["STEWARD_RUN_ATTEMPT"]),
              "source_sha": os.environ["STEWARD_SOURCE_SHA"],
              "job_status": os.environ["STEWARD_JOB_STATUS"],
              "artifact_name": "JM_ESTATE_STORAGE_STEWARD_v0_9C_FIELD_APK",
              "production_signed": False,
              "stable_field_signed": True,
              "side_by_side_package": "com.jmisjustme.estatesteward.field"
          }
          with open('.github/steward-build-status/v0.9c.json', 'w', encoding='utf-8') as f:
              json.dump(body, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
          git config user.name "JM Steward Build Receipt"
          git config user.email "actions@users.noreply.github.com"
          git add .github/steward-build-status/v0.9c.json .github/steward-build-status/v0.9c.log
          git commit -m "Record Steward v0.9C build status [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          } || echo "::warning::APK artifact is valid, but the optional repository receipt could not be pushed."
