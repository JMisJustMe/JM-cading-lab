name: Census Contact Organ Actions Artifact Vault v1.2.11

on:
  push:
    branches: [main]
    paths:
      - 'governance/contact-organ/census_actions_artifact_vault_v1_2_11.py'
      - '.github/workflows/census-contact-organ-actions-artifact-vault-v1-2-11.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: contact-organ-actions-artifact-vault-census-v1-2-11
  cancel-in-progress: false

jobs:
  census-retained-artifact-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate census
        run: |
          set -euo pipefail
          python3 -m py_compile governance/contact-organ/census_actions_artifact_vault_v1_2_11.py

      - name: Enumerate whole retained Actions artifact vault
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 governance/contact-organ/census_actions_artifact_vault_v1_2_11.py \
            | tee estate-publication/contact-organ-descendants/ACTIONS_ARTIFACT_VAULT_CENSUS_RUNTIME_v1_2_11.txt

      - name: Verify census denominator and accounting boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('estate-publication/contact-organ-descendants')
          r=json.loads((root/'ACTIONS_ARTIFACT_VAULT_CENSUS_v1_2_11.json').read_text())
          assert r['artifactRowsEnumerated'] == r['apiReportedArtifacts']
          assert r['retainedArtifacts'] >= r['alreadyClearedWindow']['retainedArtifactsInWindow']
          assert r['retainedBytes'] >= r['alreadyClearedWindow']['retainedBytesInWindow']
          assert r['retainedArtifacts'] == r['alreadyClearedWindow']['retainedArtifactsInWindow'] + r['remainingVault']['retainedArtifactsOutsideClearedWindow']
          assert r['retainedBytes'] == r['alreadyClearedWindow']['retainedBytesInWindow'] + r['remainingVault']['retainedBytesOutsideClearedWindow']
          a=r['accounting']
          assert a['totalRecipients']==28
          assert a['materialized']==6
          assert a['materializationOpen']==22
          assert a['unresolved']==0
          print('Artifact vault census v1.2.11 PASS', {
              'retainedArtifacts':r['retainedArtifacts'],
              'retainedGiB':r['retainedGiB'],
              'alreadyCleared':r['alreadyClearedWindow']['retainedArtifactsInWindow'],
              'remaining':r['remainingVault']['retainedArtifactsOutsideClearedWindow'],
              'remainingGiB':r['remainingVault']['remainingGiB'],
          })
          PY

      - name: Commit whole-vault census receipt
        run: |
          set -euo pipefail
          git config user.name 'JM Contact Organ Artifact Census v1.2.11'
          git config user.email 'actions@users.noreply.github.com'
          git add estate-publication/contact-organ-descendants/ACTIONS_ARTIFACT_VAULT_CENSUS_v1_2_11.json \
                  estate-publication/contact-organ-descendants/ACTIONS_ARTIFACT_VAULT_CENSUS_RUNTIME_v1_2_11.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record whole Contact Organ artifact-vault census v1.2.11 [skip ci]'
          for attempt in $(seq 1 20); do
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
