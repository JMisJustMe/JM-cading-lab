name: Inspect JM Owner Vault Cloudflare Readiness

# Original JM-owned provider-native rail. No ChatGPT plugin, no repository
# receipt commits, no deployed content mutation and no private owner-key use.
on:
  pull_request:
    paths:
      - ".github/workflows/check-owner-vault-cloudflare.yml"
      - "tools/owner_vault_provider_readiness.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jm-owner-vault-cloudflare-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Prove independent readiness classifier (offline / no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out original JM source
        uses: actions/checkout@v4
      - name: Run hostile provider fixture contract
        run: |
          set -euo pipefail
          python3 -m py_compile tools/owner_vault_provider_readiness.py
          python3 tools/owner_vault_provider_readiness.py --self-test

  inspect:
    name: Inspect external provider state read-only, only when requested
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: jmisjustme-estate
      BUCKET_NAME: jm-estate-owner-vault
    steps:
      - name: Check out original JM source
        uses: actions/checkout@v4
      - name: Inspect project, bucket and LIVE ANONYMOUS function route by HTTPS GET only
        shell: bash
        run: |
          set -euo pipefail
          # Raw provider payloads live only in ephemeral CI temp, not the
          # repository, artifact, PR or persisted source file.
          tmp="$(mktemp -d "${RUNNER_TEMP}/jm-vault-readiness.XXXXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT
          for name in project bucket live; do printf '{}\n' > "$tmp/$name.json"; done
          JM_PROJECT_HTTP=0
          JM_BUCKET_HTTP=0
          JM_LIVE_HTTP=0
          export JM_PROJECT_HTTP JM_BUCKET_HTTP JM_LIVE_HTTP

          # Inaccessible secrets mean a bounded HOLD, not a phantom empty
          # account, invented bucket or login retry in chat.
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            JM_PROJECT_HTTP="$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$tmp/project.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}")" || JM_PROJECT_HTTP=0
            JM_BUCKET_HTTP="$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$tmp/bucket.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}")" || JM_BUCKET_HTTP=0
          else
            echo "Provider credentials absent in this external runner — values not requested in chat."
          fi

          # Never send the owner secret or a private body to this public GET.
          JM_LIVE_HTTP="$(curl -sS --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            -o "$tmp/live.json" -w '%{http_code}' \
            "https://jmisjustme-estate.pages.dev/api/owner/vault?mode=status&jm_readiness_run=${GITHUB_RUN_ID}")" || JM_LIVE_HTTP=0

          export JM_PROJECT_HTTP JM_BUCKET_HTTP JM_LIVE_HTTP
          # Creates only a sanitized CI-run-specific GitHub Actions summary;
          # no stale receipt push, no R2 or deployed Estate mutations.
          python3 tools/owner_vault_provider_readiness.py --inspect \
            "$tmp/project.json" "$tmp/bucket.json" "$tmp/live.json"
