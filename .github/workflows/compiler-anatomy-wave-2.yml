name: JM Compiler Anatomy Native Maturation Wave 2

on:
  push:
    branches:
      - agent/compiler-anatomy-native-maturation-wave-2
    paths:
      - 'coding-estate/everybody/native-maturation/**'
      - 'coding-estate/everybody/compiler-core.mjs'
      - 'coding-estate/everybody/body-registry.json'
      - '.github/workflows/compiler-anatomy-wave-2.yml'
  pull_request:
    paths:
      - 'coding-estate/everybody/native-maturation/**'
      - 'coding-estate/everybody/compiler-core.mjs'
      - 'coding-estate/everybody/body-registry.json'

permissions:
  contents: read

jobs:
  compiler-anatomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Run compiler anatomy negative and positive gates
        run: node coding-estate/everybody/native-maturation/compiler-anatomy-wave-2-selftest.mjs
      - name: Run PrimeBody and TokenBody source-custody gates
        run: node coding-estate/everybody/native-maturation/primebody-tokenbody-wave-2-selftest.mjs
      - name: Re-run EveryBody portable conformance
        run: node coding-estate/everybody/selftest.mjs
      - name: Re-run exact native frontend tests
        run: node coding-estate/everybody/native-selftest.mjs
