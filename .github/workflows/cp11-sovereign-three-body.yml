name: JM CP11 Sovereign Three-Body Contact
on:
  push:
    paths:
      - 'engine/demo/cp11-sovereign-contact-v0.5.html'
      - 'tests/cp11-sovereign-contact.mjs'
      - '.github/workflows/cp11-sovereign-three-body.yml'
  pull_request:
    paths:
      - 'engine/demo/cp11-sovereign-contact-v0.5.html'
      - 'tests/cp11-sovereign-contact.mjs'
      - '.github/workflows/cp11-sovereign-three-body.yml'
permissions:
  contents: read
jobs:
  real-three-body-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Three.js and Chromium driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund three@0.180.0 playwright-core@1.56.0
      - name: Execute 3 original sovereign bodies against real WebGL combat
        run: node tests/cp11-sovereign-contact.mjs
      - name: Preserve GPU scene and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp11-three-body-native-webgl
          path: cp11-native-evidence/*.png
          if-no-files-found: ignore
