name: Deploy Authoritative Public JM Estate to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare-authoritative-public-source.yml"
      - "index.html"
      - "estate-*.js"
      - "estate*.css"
      - "author-home-door.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - "robots.txt"
      - "sitemap.xml"
      - "404.html"
      - "apps/**"
      - "author/**"
      - "coding-estate/**"
      - "estate/**"
      - "fresh-app-lab/**"
      - "games-beyond/**"
      - "lyrics/**"
      - "money-menu/**"
      - "navigator/**"
      - "recent/**"
      - "recovery/**"
      - "theory/**"
      - "registry/estate-map.json"
      - "registry/estate-head-public-current.json"
      - "registry/theory-wing.json"
      - "registry/lyrics-house.json"
      - "registry/money-menu-publication-receipt-v1.2.json"

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Assemble, prove, deploy and receipt the current public Estate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current authoritative source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prove the Money Menu carrier
        shell: bash
        run: |
          set -euo pipefail
          test -s money-menu/index.html
          actual="$(sha256sum money-menu/index.html | awk '{print $1}')"
          expected='7d718cc18fbf558599fb92f4ddb298aea815c0c0252c5c45e58683c619623f7d'
          test "$actual" = "$expected"
          echo "PASS money-menu/index.html $actual"

      - name: Assemble current governed public Estate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate

          for file in \
            index.html estate-app.js estate-accessibility.js estate-head-public-consumer.js \
            estate.css estate-accessibility.css icon.svg manifest.webmanifest sw.js \
            author-home-door.js robots.txt sitemap.xml 404.html cading.html; do
            [ ! -f "$file" ] || cp "$file" cloudflare-estate/
          done

          for dir in apps author coding-estate estate fresh-app-lab games-beyond lyrics navigator recent recovery theory; do
            [ ! -d "$dir" ] || cp -a "$dir" "cloudflare-estate/$dir"
          done

          mkdir -p cloudflare-estate/money-menu cloudflare-estate/registry
          cp money-menu/index.html money-menu/STATUS.md money-menu/PUBLICATION_RECEIPT.json cloudflare-estate/money-menu/

          for file in \
            estate-map.json estate-head-public-current.json theory-wing.json lyrics-house.json \
            money-menu-publication-receipt-v1.2.json money-menu-web-mesh-connection-v1.0.json \
            recent-chat-convergence-v1.0.json recent-chat-convergence-receipt-v1.0.json \
            recent-chat-convergence-estate-map-receipt-v1.0.json \
            recent-chat-convergence-live-door-receipt-v1.0.json \
            recent-chat-convergence-cloudflare-live-receipt-v1.0.json \
            recent-chat-convergence-final-receipt-v1.0.json \
            recent-chat-convergence-classification-receipt-v1.0.json \
            github-pages-route-repair-receipt-v1.0.json; do
            [ ! -f "registry/$file" ] || cp "registry/$file" "cloudflare-estate/registry/$file"
          done

          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache, must-revalidate
          /sw.js
            Cache-Control: no-store, no-cache, must-revalidate
            Service-Worker-Allowed: /
          /404.html
            Cache-Control: no-store, no-cache, must-revalidate
            Clear-Site-Data: "cache"
          /money-menu/*
            Cache-Control: no-store, no-cache, must-revalidate
          /recent/*
            Cache-Control: no-store, no-cache, must-revalidate
          /theory/*
            Cache-Control: no-store, no-cache, must-revalidate
          /games-beyond/*
            Cache-Control: no-store, no-cache, must-revalidate
          /apps/*
            Cache-Control: no-store, no-cache, must-revalidate
          /lyrics/*
            Cache-Control: no-store, no-cache, must-revalidate
          EOF

          cat > cloudflare-estate/_redirects <<'EOF'
          /money-menu /money-menu/index.html 200
          /money-menu/ /money-menu/index.html 200
          /recent /recent/index.html 200
          /recent/ /recent/index.html 200
          /apps /apps/index.html 200
          /apps/ /apps/index.html 200
          /games-beyond /games-beyond/index.html 200
          /games-beyond/ /games-beyond/index.html 200
          /theory /theory/index.html 200
          /theory/ /theory/index.html 200
          /lyrics /lyrics/index.html 200
          /lyrics/ /lyrics/index.html 200
          /recovery /recovery/index.html 200
          /recovery/ /recovery/index.html 200
          /* /index.html 200
          EOF

      - name: Prove every named source door before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = [
              ('index.html', 'Your work no longer lives as scattered HTMLs'),
              ('money-menu/index.html', 'JM Money Menu · Public Contact Carrier v1.2'),
              ('money-menu/index.html', '242 routes'),
              ('money-menu/index.html', 'Enquiry → brief → scope → receipt'),
              ('apps/index.html', 'NON-GAME APPS HOUSE'),
              ('games-beyond/index.html', 'Games&Beyond'),
              ('theory/index.html', 'JM Theory Multihub'),
              ('lyrics/index.html', 'JM Lyrics'),
              ('recent/index.html', 'The Estate'),
              ('theory/biohouse-nervous-signal-route/index.html', 'Attention, Suggestion'),
              ('theory/trasta/index.html', 'Trust the trace'),
              ('theory/reality-route-ethos/index.html', 'Reality is not'),
              ('games-beyond/recent-direction/index.html', 'More game'),
              ('sw.js', 'jm-web-estate-v1.4.6-money-menu-public-contact'),
              ('404.html', 'JM ESTATE ROUTE REPAIR'),
          ]

          root = Path('cloudflare-estate')
          failed = []
          for relative, marker in checks:
              path = root / relative
              if not path.is_file() or not path.stat().st_size:
                  failed.append(f'MISSING {relative}')
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if marker not in text:
                  failed.append(f'MARKER {relative}: {marker!r}')
                  continue
              if 'Returning to the JM Web Estate' in text:
                  failed.append(f'STALE_SHELL {relative}')
                  continue
              print(f'PASS {relative} :: {marker}')

          if failed:
              raise SystemExit('PUBLIC SOURCE GATE FAILED\n' + '\n'.join(failed))
          PY

          python3 -m json.tool cloudflare-estate/registry/estate-map.json >/dev/null
          python3 -m json.tool cloudflare-estate/registry/estate-head-public-current.json >/dev/null

      - name: Deploy authoritative public source
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove current Cloudflare public contact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen

          base = 'https://jmisjustme-estate.pages.dev'
          checks = [
              ('/', 'Your work no longer lives as scattered HTMLs'),
              ('/money-menu/', 'JM Money Menu · Public Contact Carrier v1.2'),
              ('/apps/', 'NON-GAME APPS HOUSE'),
              ('/games-beyond/', 'Games&Beyond'),
              ('/theory/', 'JM Theory Multihub'),
              ('/lyrics/', 'JM Lyrics'),
              ('/recent/', 'The Estate'),
          ]
          run = os.environ.get('GITHUB_RUN_ID', 'manual')
          pending = checks[:]
          for attempt in range(1, 61):
              next_pending = []
              for path, marker in pending:
                  url = f'{base}{path}?jm-push={run}-{attempt}'
                  try:
                      request = Request(url, headers={
                          'User-Agent': 'JM-Estate-Cloudflare-Proof/1.0',
                          'Cache-Control': 'no-cache',
                      })
                      with urlopen(request, timeout=25) as response:
                          body = response.read().decode('utf-8', 'replace')
                          code = response.status
                  except Exception as exc:
                      print('WAIT', path, type(exc).__name__)
                      next_pending.append((path, marker))
                      continue
                  if code == 200 and marker in body and 'Returning to the JM Web Estate' not in body:
                      print('LIVE PASS', path, marker)
                  else:
                      print('WAIT', path, code, marker)
                      next_pending.append((path, marker))
              if not next_pending:
                  pending = []
                  break
              pending = next_pending
              time.sleep(3)
          if pending:
              raise SystemExit('LIVE CONTACT FAILED: ' + ', '.join(path for path, _ in pending))
          PY

      - name: Seal current Cloudflare deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'schema': 'JM.CloudflareAuthoritativeRouteReceipt/1.2',
              'verified_utc': datetime.now(timezone.utc).isoformat(),
              'state': 'PASS_CURRENT_PUBLIC_ESTATE_SOURCE_AND_LIVE_CONTACT',
              'source_commit': os.environ.get('GITHUB_SHA'),
              'workflow_run': os.environ.get('GITHUB_RUN_ID'),
              'host': 'https://jmisjustme-estate.pages.dev',
              'routes': [
                  '/', '/money-menu/', '/apps/', '/games-beyond/',
                  '/theory/', '/lyrics/', '/recent/'
              ],
              'deployment_source': 'current governed public repository source',
              'self_erasure': False,
              'silent_parallel_lane': False,
              'ding': False,
              'claim_boundary': 'Source assembly, Cloudflare deployment and named live contact routes passed. Owner-side physical acceptance and Ding remain separate.'
          }
          path = Path('registry/cloudflare-authoritative-route-receipt-v1.2.json')
          path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          git config user.name 'JM Cloudflare Authoritative Route Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/cloudflare-authoritative-route-receipt-v1.2.json
          if git diff --cached --quiet; then
            echo 'Receipt already current.'
            exit 0
          fi
          git commit -m 'Seal current Cloudflare authoritative Estate deployment [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
