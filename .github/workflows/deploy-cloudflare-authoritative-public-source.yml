name: Deploy Authoritative Public JM Estate to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare-authoritative-public-source.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current authoritative source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble only the governed public Estate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate

          for file in \
            index.html estate-app.js estate-accessibility.js estate-head-public-consumer.js \
            estate.css estate-accessibility.css icon.svg manifest.webmanifest sw.js \
            robots.txt sitemap.xml 404.html cading.html; do
            if [ -f "$file" ]; then cp "$file" cloudflare-estate/; fi
          done

          for dir in apps author coding-estate estate fresh-app-lab games-beyond lyrics navigator recent recovery theory; do
            if [ -d "$dir" ]; then cp -a "$dir" "cloudflare-estate/$dir"; fi
          done

          mkdir -p cloudflare-estate/registry
          for file in \
            estate-map.json estate-head-public-current.json theory-wing.json lyrics-house.json \
            recent-chat-convergence-v1.0.json recent-chat-convergence-receipt-v1.0.json \
            recent-chat-convergence-estate-map-receipt-v1.0.json \
            recent-chat-convergence-live-door-receipt-v1.0.json \
            recent-chat-convergence-cloudflare-live-receipt-v1.0.json \
            recent-chat-convergence-final-receipt-v1.0.json \
            recent-chat-convergence-classification-receipt-v1.0.json \
            github-pages-route-repair-receipt-v1.0.json; do
            if [ -f "registry/$file" ]; then cp "registry/$file" "cloudflare-estate/registry/$file"; fi
          done

          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache, must-revalidate
          /sw.js
            Cache-Control: no-store, no-cache, must-revalidate
            Service-Worker-Allowed: /
          /404.html
            Cache-Control: no-store, no-cache, must-revalidate
            Clear-Site-Data: "cache"
          /recent/*
            Cache-Control: no-store, no-cache, must-revalidate
          /theory/biohouse-nervous-signal-route/*
            Cache-Control: no-store, no-cache, must-revalidate
          /theory/trasta/*
            Cache-Control: no-store, no-cache, must-revalidate
          /theory/reality-route-ethos/*
            Cache-Control: no-store, no-cache, must-revalidate
          /games-beyond/recent-direction/*
            Cache-Control: no-store, no-cache, must-revalidate
          EOF

          cat > cloudflare-estate/_redirects <<'EOF'
          /recent /recent/index.html 200
          /recent/ /recent/index.html 200
          /apps /apps/index.html 200
          /apps/ /apps/index.html 200
          /games-beyond /games-beyond/index.html 200
          /games-beyond/ /games-beyond/index.html 200
          /theory /theory/index.html 200
          /theory/ /theory/index.html 200
          /lyrics /lyrics/index.html 200
          /lyrics/ /lyrics/index.html 200
          /recovery /recovery/index.html 200
          /recovery/ /recovery/index.html 200
          /theory/biohouse-nervous-signal-route /theory/biohouse-nervous-signal-route/index.html 200
          /theory/biohouse-nervous-signal-route/ /theory/biohouse-nervous-signal-route/index.html 200
          /theory/trasta /theory/trasta/index.html 200
          /theory/trasta/ /theory/trasta/index.html 200
          /theory/reality-route-ethos /theory/reality-route-ethos/index.html 200
          /theory/reality-route-ethos/ /theory/reality-route-ethos/index.html 200
          /games-beyond/recent-direction /games-beyond/recent-direction/index.html 200
          /games-beyond/recent-direction/ /games-beyond/recent-direction/index.html 200
          EOF

      - name: Prove assembled public bodies before deployment
        shell: bash
        run: |
          set -euo pipefail
          checks=(
            'index.html|Your work no longer lives as scattered HTMLs'
            'apps/index.html|NON-GAME APPS HOUSE'
            'games-beyond/index.html|Games&Beyond'
            'theory/index.html|JM Theory Multihub'
            'lyrics/index.html|JM Lyrics'
            'recent/index.html|The Estate'
            'theory/biohouse-nervous-signal-route/index.html|Attention, Suggestion'
            'theory/biohouse-nervous-signal-route/v1.0.html|Nervous Signal Route v1.0'
            'theory/trasta/index.html|Trust the trace'
            'theory/reality-route-ethos/index.html|Reality is not'
            'games-beyond/recent-direction/index.html|More game'
          )
          for check in "${checks[@]}"; do
            path="${check%%|*}"; marker="${check#*|}"
            test -s "cloudflare-estate/$path"
            grep -q "$marker" "cloudflare-estate/$path"
            ! grep -q 'Returning to the JM Web Estate' "cloudflare-estate/$path"
          done
          grep -q 'jm-web-estate-v1.4.2-route-repair' cloudflare-estate/sw.js
          grep -q 'JM ESTATE ROUTE REPAIR' cloudflare-estate/404.html

      - name: Deploy authoritative public source
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove Android contact with exact files and directory routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://jmisjustme-estate.pages.dev'
          ua='Mozilla/5.0 (Linux; Android 16; CPH2305) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0 Mobile Safari/537.36'
          checks=(
            '/index.html|Your work no longer lives as scattered HTMLs'
            '/apps/index.html|NON-GAME APPS HOUSE'
            '/games-beyond/index.html|Games&Beyond'
            '/theory/index.html|JM Theory Multihub'
            '/lyrics/index.html|JM Lyrics'
            '/recent/index.html|The Estate'
            '/recent/|The Estate'
            '/theory/biohouse-nervous-signal-route/index.html|Attention, Suggestion'
            '/theory/biohouse-nervous-signal-route/|Attention, Suggestion'
            '/theory/biohouse-nervous-signal-route/v1.0.html|Nervous Signal Route v1.0'
            '/theory/trasta/index.html|Trust the trace'
            '/theory/trasta/|Trust the trace'
            '/theory/reality-route-ethos/index.html|Reality is not'
            '/games-beyond/recent-direction/index.html|More game'
          )
          passed=0
          for attempt in $(seq 1 60); do
            passed=1
            for check in "${checks[@]}"; do
              path="${check%%|*}"; marker="${check#*|}"
              body="$RUNNER_TEMP/body.html"
              code="$(curl --silent --show-error --location --max-time 25 -A "$ua" -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "$base$path?authoritative-proof=$GITHUB_RUN_ID-$attempt" || true)"
              if [ "$code" != '200' ] || ! grep -q "$marker" "$body" || grep -q 'Returning to the JM Web Estate' "$body"; then
                echo "MISS $code $path expected $marker"
                passed=0
              else
                echo "PASS $code $path"
              fi
            done
            if [ "$passed" = '1' ]; then break; fi
            sleep 3
          done
          test "$passed" = '1'

      - name: Seal authoritative Cloudflare route receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt={
            'schema':'JM.CloudflareAuthoritativeRouteReceipt/1.0',
            'verified_utc':datetime.now(timezone.utc).isoformat(),
            'state':'PASS_ANDROID_FULL_BODIES_EXACT_AND_DIRECTORY_ROUTES_NO_404_SHELL',
            'source_commit':os.environ.get('GITHUB_SHA'),
            'workflow_run':os.environ.get('GITHUB_RUN_ID'),
            'host':'https://jmisjustme-estate.pages.dev',
            'checks':14,
            'deployment_source':'governed public repository source, not stale live mirror',
            'deleted_repository_files':0,
            'root_estate_body_replaced':False,
            'private_chat_files_touched':False,
            'claim_boundary':'Delivery repaired; active and partial project bodies retain their existing completion boundaries.'
          }
          Path('registry/cloudflare-authoritative-route-receipt-v1.0.json').write_text(json.dumps(receipt,indent=2)+"\n",encoding='utf-8')
          PY
          git config user.name 'JM Cloudflare Authoritative Route Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/cloudflare-authoritative-route-receipt-v1.0.json
          git commit -m 'Seal authoritative Cloudflare Android route repair [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
