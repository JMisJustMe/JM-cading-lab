name: Deploy Authoritative Public JM Estate to Cloudflare

# Legacy specialist rail retained for manual recovery/proof only.
# Automatic production authority belongs to Deploy Estate Sovereign Integrated v1.
on:
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Assemble, prove, deploy and receipt the current public Estate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current authoritative source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prove governed commercial carrier and new release bodies
        shell: bash
        run: |
          set -euo pipefail
          test -s money-menu/index.html
          actual="$(sha256sum money-menu/index.html | awk '{print $1}')"
          expected='7d718cc18fbf558599fb92f4ddb298aea815c0c0252c5c45e58683c619623f7d'
          test "$actual" = "$expected"
          test -s earn-now/index.html
          test -s shims-reader/index.html
          test -s apps/showcase/index.html
          test -s games-beyond/showcase/index.html
          grep -Fq 'Things you can hire JM for today' earn-now/index.html
          grep -Fq 'Hire JM now' author-home-door.js
          grep -Fq 'SHIMS Reader' shims-reader/index.html
          grep -Fq 'JM Apps & Tools' apps/showcase/index.html
          grep -Fq 'JM Games' games-beyond/showcase/index.html
          echo "PASS governed release source floor"

      - name: Assemble current governed public Estate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate

          for file in \
            index.html estate-app.js estate-accessibility.js estate-head-public-consumer.js \
            estate.css estate-accessibility.css icon.svg manifest.webmanifest sw.js \
            author-home-door.js robots.txt sitemap.xml 404.html cading.html; do
            [ ! -f "$file" ] || cp "$file" cloudflare-estate/
          done

          for dir in apps author coding-estate earn-now estate fresh-app-lab games-beyond lyrics navigator recent recovery shims-reader theory; do
            [ ! -d "$dir" ] || cp -a "$dir" "cloudflare-estate/$dir"
          done

          mkdir -p cloudflare-estate/money-menu cloudflare-estate/registry
          cp money-menu/index.html money-menu/STATUS.md money-menu/PUBLICATION_RECEIPT.json cloudflare-estate/money-menu/

          for file in \
            estate-map.json estate-head-public-current.json theory-wing.json lyrics-house.json \
            money-menu-publication-receipt-v1.2.json money-menu-web-mesh-connection-v1.0.json \
            recent-chat-convergence-v1.0.json recent-chat-convergence-receipt-v1.0.json \
            recent-chat-convergence-estate-map-receipt-v1.0.json \
            recent-chat-convergence-live-door-receipt-v1.0.json \
            recent-chat-convergence-cloudflare-live-receipt-v1.0.json \
            recent-chat-convergence-final-receipt-v1.0.json \
            recent-chat-convergence-classification-receipt-v1.0.json \
            github-pages-route-repair-receipt-v1.0.json \
            cloudflare-authoritative-route-receipt-v1.2.json \
            cloudflare-authoritative-route-receipt-v1.3.json \
            public-release-current.json; do
            [ ! -f "registry/$file" ] || cp "registry/$file" "cloudflare-estate/registry/$file"
          done

          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache, must-revalidate
          /sw.js
            Cache-Control: no-store, no-cache, must-revalidate
            Service-Worker-Allowed: /
          /404.html
            Cache-Control: no-store, no-cache, must-revalidate
            Clear-Site-Data: "cache"
          /earn-now/*
            Cache-Control: no-store, no-cache, must-revalidate
          /money-menu/*
            Cache-Control: no-store, no-cache, must-revalidate
          /shims-reader/*
            Cache-Control: no-store, no-cache, must-revalidate
          /recent/*
            Cache-Control: no-store, no-cache, must-revalidate
          /theory/*
            Cache-Control: no-store, no-cache, must-revalidate
          /games-beyond/*
            Cache-Control: no-store, no-cache, must-revalidate
          /apps/*
            Cache-Control: no-store, no-cache, must-revalidate
          /lyrics/*
            Cache-Control: no-store, no-cache, must-revalidate
          /estate/authoritative/all-body-first-pass-v1.0/*
            Cache-Control: no-store, no-cache, must-revalidate
          EOF

          cat > cloudflare-estate/_redirects <<'EOF'
          /earn-now /earn-now/index.html 200
          /earn-now/ /earn-now/index.html 200
          /money-menu /money-menu/index.html 200
          /money-menu/ /money-menu/index.html 200
          /shims-reader /shims-reader/index.html 200
          /shims-reader/ /shims-reader/index.html 200
          /apps /apps/index.html 200
          /apps/ /apps/index.html 200
          /apps/showcase /apps/showcase/index.html 200
          /apps/showcase/ /apps/showcase/index.html 200
          /games-beyond /games-beyond/index.html 200
          /games-beyond/ /games-beyond/index.html 200
          /games-beyond/showcase /games-beyond/showcase/index.html 200
          /games-beyond/showcase/ /games-beyond/showcase/index.html 200
          /theory /theory/index.html 200
          /theory/ /theory/index.html 200
          /lyrics /lyrics/index.html 200
          /lyrics/ /lyrics/index.html 200
          /recent /recent/index.html 200
          /recent/ /recent/index.html 200
          /recovery /recovery/index.html 200
          /recovery/ /recovery/index.html 200
          /* /index.html 200
          EOF

      - name: Prove every named source door before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          checks = [
              ('index.html', 'Your work no longer lives as scattered HTMLs'),
              ('author-home-door.js', 'Hire JM now'),
              ('author-home-door.js', 'SHIMS Reader'),
              ('earn-now/index.html', 'Things you can hire JM for today'),
              ('earn-now/index.html', 'Published offer ≠ sale. One payment ≠ proven market.'),
              ('money-menu/index.html', 'JM Money Menu · Public Contact Carrier v1.2'),
              ('money-menu/index.html', '242 routes'),
              ('money-menu/index.html', 'Enquiry → brief → scope → receipt'),
              ('shims-reader/index.html', 'SHIMS Reader'),
              ('shims-reader/index.html', 'Build my taster'),
              ('apps/index.html', 'NON-GAME APPS HOUSE'),
              ('apps/showcase/index.html', 'JM Apps & Tools'),
              ('games-beyond/index.html', 'Games&Beyond'),
              ('games-beyond/showcase/index.html', 'JM Games'),
              ('theory/index.html', 'JM Theory Multihub'),
              ('lyrics/index.html', 'JM Lyrics'),
              ('recent/index.html', 'The Estate'),
              ('theory/biohouse-nervous-signal-route/index.html', 'Attention, Suggestion'),
              ('theory/trasta/index.html', 'Trust the trace'),
              ('theory/reality-route-ethos/index.html', 'Reality is not'),
              ('games-beyond/recent-direction/index.html', 'More game'),
              ('estate/authoritative/all-body-first-pass-v1.0/index.html', 'JM All-Body First Pass — Current Authority'),
              ('estate/authoritative/all-body-first-pass-v1.0/command-register/index.html', 'JM Command Register v1.0 — First Pass Finished'),
              ('sw.js', 'jm-web-estate-v1.4.6-money-menu-public-contact'),
              ('404.html', 'JM ESTATE ROUTE REPAIR'),
          ]

          root = Path('cloudflare-estate')
          failed = []
          for relative, marker in checks:
              path = root / relative
              if not path.is_file() or not path.stat().st_size:
                  failed.append(f'MISSING {relative}')
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if marker not in text:
                  failed.append(f'MARKER {relative}: {marker!r}')
                  continue
              if 'Returning to the JM Web Estate' in text:
                  failed.append(f'STALE_SHELL {relative}')
                  continue
              print(f'PASS {relative} :: {marker}')

          exact = root / 'estate/authoritative/all-body-first-pass-v1.0/command-register/index.html'
          if exact.is_file():
              raw = exact.read_bytes()
              exact_sha = hashlib.sha256(raw).hexdigest()
              if len(raw) != 2530896:
                  failed.append(f'EXACT_SIZE {len(raw)}')
              if exact_sha != 'abfffcc82f2aad630ce065702334366cd4b713a282add523a1d973b702871410':
                  failed.append(f'EXACT_SHA {exact_sha}')
              else:
                  print('PASS exact Command Register source SHA-256', exact_sha)

          if failed:
              raise SystemExit('PUBLIC SOURCE GATE FAILED\n' + '\n'.join(failed))
          PY
          python3 -m json.tool cloudflare-estate/registry/estate-map.json >/dev/null
          python3 -m json.tool cloudflare-estate/registry/estate-head-public-current.json >/dev/null

      - name: Deploy authoritative public source
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove current Cloudflare public contact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import time
          from urllib.request import Request, urlopen

          base = 'https://jmisjustme-estate.pages.dev'
          checks = [
              ('/', 'Your work no longer lives as scattered HTMLs'),
              ('/earn-now/', 'Things you can hire JM for today'),
              ('/money-menu/', 'JM Money Menu · Public Contact Carrier v1.2'),
              ('/shims-reader/', 'SHIMS Reader'),
              ('/apps/', 'NON-GAME APPS HOUSE'),
              ('/apps/showcase/', 'JM Apps & Tools'),
              ('/games-beyond/', 'Games&Beyond'),
              ('/games-beyond/showcase/', 'JM Games'),
              ('/theory/', 'JM Theory Multihub'),
              ('/lyrics/', 'JM Lyrics'),
              ('/recent/', 'The Estate'),
              ('/estate/authoritative/all-body-first-pass-v1.0/', 'JM All-Body First Pass — Current Authority'),
              ('/estate/authoritative/all-body-first-pass-v1.0/command-register/', 'JM Command Register v1.0 — First Pass Finished'),
          ]
          run = os.environ.get('GITHUB_RUN_ID', 'manual')
          pending = checks[:]
          for attempt in range(1, 61):
              next_pending = []
              for path, marker in pending:
                  url = f'{base}{path}?jm-release={run}-{attempt}'
                  try:
                      request = Request(url, headers={
                          'User-Agent': 'JM-Estate-Cloudflare-Proof/1.1',
                          'Cache-Control': 'no-cache',
                      })
                      with urlopen(request, timeout=25) as response:
                          body = response.read().decode('utf-8', 'replace')
                          code = response.status
                  except Exception as exc:
                      print('WAIT', path, type(exc).__name__)
                      next_pending.append((path, marker))
                      continue
                  if code == 200 and marker in body and 'Returning to the JM Web Estate' not in body:
                      print('LIVE PASS', path, marker)
                  else:
                      print('WAIT', path, code, marker)
                      next_pending.append((path, marker))
              if not next_pending:
                  pending = []
                  break
              pending = next_pending
              time.sleep(3)
          if pending:
              raise SystemExit('LIVE CONTACT FAILED: ' + ', '.join(path for path, _ in pending))

          exact_path = '/estate/authoritative/all-body-first-pass-v1.0/command-register/'
          expected_sha = 'abfffcc82f2aad630ce065702334366cd4b713a282add523a1d973b702871410'
          exact_ok = False
          for attempt in range(1, 31):
              url = f'{base}{exact_path}?jm-exact={run}-{attempt}'
              try:
                  req = Request(url, headers={
                      'User-Agent': 'JM-Estate-Exact-Carrier-Proof/1.0',
                      'Cache-Control': 'no-cache',
                  })
                  with urlopen(req, timeout=30) as response:
                      raw = response.read()
                      code = response.status
              except Exception as exc:
                  print('WAIT EXACT', type(exc).__name__)
                  time.sleep(3)
                  continue
              actual_sha = hashlib.sha256(raw).hexdigest()
              if code == 200 and len(raw) == 2530896 and actual_sha == expected_sha:
                  print('LIVE EXACT PASS', exact_path, len(raw), actual_sha)
                  exact_ok = True
                  break
              print('WAIT EXACT', code, len(raw), actual_sha)
              time.sleep(3)
          if not exact_ok:
              raise SystemExit('LIVE EXACT COMMAND REGISTER HASH CONTACT FAILED')
          PY

      - name: Seal current Cloudflare deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'schema': 'JM.CloudflareAuthoritativeRouteReceipt/1.3',
              'verified_utc': datetime.now(timezone.utc).isoformat(),
              'state': 'PASS_CURRENT_PUBLIC_RELEASE_SOURCE_LIVE_CONTACT_AND_EXACT_COMMAND_REGISTER',
              'source_commit': os.environ.get('GITHUB_SHA'),
              'workflow_run': os.environ.get('GITHUB_RUN_ID'),
              'host': 'https://jmisjustme-estate.pages.dev',
              'routes': [
                  '/', '/earn-now/', '/money-menu/', '/shims-reader/', '/apps/', '/apps/showcase/',
                  '/games-beyond/', '/games-beyond/showcase/', '/theory/', '/lyrics/', '/recent/',
                  '/estate/authoritative/all-body-first-pass-v1.0/',
                  '/estate/authoritative/all-body-first-pass-v1.0/command-register/'
              ],
              'release_extension': {
                  'earn_now': 'LIVE_PASS',
                  'shims_reader': 'LIVE_PASS',
                  'apps_showcase': 'LIVE_PASS',
                  'games_showcase': 'LIVE_PASS',
                  'root_earn_now_door_source': 'PRESENT',
                  'root_shims_door_source': 'PRESENT'
              },
              'exact_command_register': {
                  'route': '/estate/authoritative/all-body-first-pass-v1.0/command-register/',
                  'size_bytes': 2530896,
                  'sha256': 'abfffcc82f2aad630ce065702334366cd4b713a282add523a1d973b702871410',
                  'source_hash_proof': 'PASS',
                  'live_hash_proof': 'PASS'
              },
              'parent_authority_door_preserved': True,
              'deployment_source': 'current governed public repository source',
              'self_erasure': False,
              'silent_parallel_lane': False,
              'ding': False,
              'claim_boundary': 'Current public release source, Earn-Now, SHIMS, Apps showcase, Games showcase, named Estate routes and exact Command Register sibling bytes passed Cloudflare contact. Offer publication and live-route contact do not establish buyer contact, payment, market proof or JM Ding. Owner-side physical acceptance remains separate.'
          }
          path = Path('registry/cloudflare-authoritative-route-receipt-v1.3.json')
          path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          git config user.name 'JM Cloudflare Authoritative Route Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/cloudflare-authoritative-route-receipt-v1.3.json
          if git diff --cached --quiet; then
            echo 'Receipt already current.'
            exit 0
          fi
          git commit -m 'Seal current Cloudflare authoritative Estate deployment v1.3 [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1