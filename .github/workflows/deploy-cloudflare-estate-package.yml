name: Restore Canonical Theory Body

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-estate-package.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rollback:
    name: Find and restore exact pre-regression Theory body
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out Estate source
        uses: actions/checkout@v6

      - name: Find the exact preserved production deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jmisjustme-estate
          REGRESSION_CUTOFF: "2026-07-20T13:08:12Z"
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          project = os.environ['PROJECT_NAME']
          cutoff = datetime.fromisoformat(os.environ['REGRESSION_CUTOFF'].replace('Z', '+00:00'))

          endpoint = (
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/deployments?'
              + urlencode({'page': 1, 'per_page': 25})
          )
          req = Request(endpoint, headers={
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'JM-Estate-Exact-Body-Rollback/1.1',
          })
          with urlopen(req, timeout=30) as response:
              payload = json.loads(response.read().decode('utf-8', 'replace'))
          if not payload.get('success'):
              raise SystemExit(f"Cloudflare deployment listing failed: {payload}")

          candidates = []
          for deployment in payload.get('result', []):
              created = datetime.fromisoformat(deployment['created_on'].replace('Z', '+00:00'))
              stage = deployment.get('latest_stage') or {}
              if deployment.get('environment') == 'production' and stage.get('status') == 'success' and created < cutoff:
                  candidates.append((created, deployment))
          candidates.sort(key=lambda item: item[0], reverse=True)

          target = None
          for created, deployment in candidates:
              base = deployment.get('url') or ''
              if not base:
                  continue
              theory_url = urljoin(base.rstrip('/') + '/', 'theory/')
              try:
                  theory_req = Request(theory_url, headers={'User-Agent': 'JM-Estate-Exact-Body-Rollback/1.1'})
                  with urlopen(theory_req, timeout=30) as response:
                      body = response.read().decode('utf-8', 'replace')
              except Exception as exc:
                  print(f"Skipped {deployment['id']} ({theory_url}): {exc}")
                  continue
              title_match = 'Project Source Census Edition' in body
              content_match = 'Human Pattern Calibration' in body
              print(f"Checked {deployment['id']} from {deployment['created_on']}: title={title_match}, content={content_match}")
              if title_match and content_match:
                  target = deployment
                  break

          if target is None:
              raise SystemExit('No pre-regression production deployment in the latest 25 contains the exact Project Source Census Edition body.')

          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write(f"ROLLBACK_DEPLOYMENT_ID={target['id']}\n")
              f.write(f"ROLLBACK_DEPLOYMENT_CREATED={target['created_on']}\n")
              f.write(f"ROLLBACK_DEPLOYMENT_URL={target.get('url', '')}\n")
          print(f"Exact target selected: {target['id']} from {target['created_on']}")
          PY

      - name: Roll the canonical production project back
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jmisjustme-estate
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$endpoint" > "$RUNNER_TEMP/rollback.json"

          python3 <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'rollback.json').read_text())
          if not payload.get('success'):
              raise SystemExit(f"Cloudflare rollback failed: {payload}")
          print('Cloudflare accepted the production rollback.')
          PY

      - name: Prove the exact newer Theory body is canonical again
        shell: bash
        run: |
          set -euo pipefail
          proved=0
          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error --location \
              "https://jmisjustme-estate.pages.dev/theory/?exact-rollback-proof=${GITHUB_RUN_ID}-${attempt}" \
              > "$RUNNER_TEMP/live-theory.html" || true
            if grep -q "Project Source Census Edition" "$RUNNER_TEMP/live-theory.html" \
              && grep -q "Human Pattern Calibration" "$RUNNER_TEMP/live-theory.html"; then
              proved=1
              break
            fi
            sleep 2
          done
          test "$proved" -eq 1
          echo "Exact Project Source Census Edition is live on the canonical host."

      - name: Record exact rollback proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry
          cat > registry/cloudflare-theory-rollback-receipt.json <<EOF
          {
            "schema": "JM.CloudflareTheoryRollbackReceipt/1.1",
            "status": "SUCCESS",
            "project": "jmisjustme-estate",
            "canonical_host": "jmisjustme-estate.pages.dev",
            "restored_deployment_id": "${ROLLBACK_DEPLOYMENT_ID}",
            "restored_deployment_created_at": "${ROLLBACK_DEPLOYMENT_CREATED}",
            "restored_title_proof": "JM Theory Multihub — Project Source Census Edition",
            "content_proof": "Human Pattern Calibration",
            "workflow_run": "${GITHUB_RUN_ID}",
            "proved_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "regression": "Older repository v0.4 Theory body overwrote the newer canonical body.",
            "next_action": "Restore the live-preserving automatic deployment workflow before any further Estate push."
          }
          EOF
          git config user.name "JM Estate Recovery Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-theory-rollback-receipt.json
          git commit -m "Record exact Theory production rollback"
          git push
