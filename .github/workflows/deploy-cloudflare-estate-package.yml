name: Inspect Canonical Theory Rollback Candidates

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-estate-package.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Inspect valid Cloudflare deployment page
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jmisjustme-estate
          REGRESSION_CUTOFF: "2026-07-20T13:08:12Z"
        run: |
          set -u
          mkdir -p registry
          python3 <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          report = {
            'schema': 'JM.CloudflareRollbackDiagnostic/1.1',
            'status': 'DIAGNOSTIC_COMPLETE',
            'listing_success': False,
            'deployment_count': 0,
            'candidates': [],
            'exact_match_deployment_id': None,
            'errors': [],
          }
          try:
            account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; project=os.environ['PROJECT_NAME']
            endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/deployments?'+urlencode({'page':1,'per_page':25})
            req=Request(endpoint,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'JM-Estate-Rollback-Diagnostic/1.1'})
            with urlopen(req,timeout=30) as response:
              payload=json.loads(response.read().decode('utf-8','replace'))
            report['listing_success']=bool(payload.get('success'))
            report['deployment_count']=len(payload.get('result',[]))
            cutoff=datetime.fromisoformat(os.environ['REGRESSION_CUTOFF'].replace('Z','+00:00'))
            rows=[]
            for d in payload.get('result',[]):
              try: created=datetime.fromisoformat(d['created_on'].replace('Z','+00:00'))
              except Exception: continue
              stage=d.get('latest_stage') or {}
              if d.get('environment')=='production' and stage.get('status')=='success' and created<cutoff:
                rows.append((created,d))
            rows.sort(key=lambda x:x[0],reverse=True)
            for _,d in rows:
              item={'id':d.get('id'),'created_on':d.get('created_on'),'url':d.get('url'),'trigger_type':(d.get('deployment_trigger') or {}).get('type'),'fetch_status':'NOT_ATTEMPTED','title_match':False,'content_match':False}
              base=d.get('url') or ''
              if base:
                theory_url=urljoin(base.rstrip('/')+'/', 'theory/')
                try:
                  r=Request(theory_url,headers={'User-Agent':'JM-Estate-Rollback-Diagnostic/1.1'})
                  with urlopen(r,timeout=30) as response:
                    body=response.read().decode('utf-8','replace')
                  item['fetch_status']='SUCCESS'
                  item['title_match']='Project Source Census Edition' in body
                  item['content_match']='Human Pattern Calibration' in body
                  item['title_excerpt']=body[body.find('<title>'):body.find('</title>')+8] if '<title>' in body and '</title>' in body else ''
                  if item['title_match'] and item['content_match'] and report['exact_match_deployment_id'] is None:
                    report['exact_match_deployment_id']=d.get('id')
                except HTTPError as e:
                  item['fetch_status']=f'HTTP_{e.code}'
                except Exception as e:
                  item['fetch_status']=type(e).__name__
              report['candidates'].append(item)
          except HTTPError as e:
            body=''
            try: body=e.read().decode('utf-8','replace')
            except Exception: pass
            report['errors'].append({'stage':'list_http','status':e.code,'message':body[:1000]})
          except Exception as e:
            report['errors'].append({'stage':'unexpected','type':type(e).__name__,'message':str(e)[:1000]})
          Path('registry/cloudflare-theory-rollback-diagnostic.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY

      - name: Commit candidate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Estate Recovery Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-theory-rollback-diagnostic.json
          git diff --cached --quiet || git commit -m "Record valid Cloudflare rollback candidates"
          git push
