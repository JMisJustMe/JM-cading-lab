name: Diagnose Canonical Theory Rollback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-estate-package.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Estate source
        uses: actions/checkout@v6

      - name: Inspect Cloudflare production deployment history
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jmisjustme-estate
          REGRESSION_CUTOFF: "2026-07-20T13:08:12Z"
        run: |
          set -u
          mkdir -p registry
          python3 <<'PY'
          import json, os, traceback
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          out = {
              'schema': 'JM.CloudflareRollbackDiagnostic/1.0',
              'status': 'DIAGNOSTIC_COMPLETE',
              'project': os.environ.get('PROJECT_NAME'),
              'cutoff': os.environ.get('REGRESSION_CUTOFF'),
              'listing_success': False,
              'deployment_count': 0,
              'pre_cutoff_successful_production_count': 0,
              'candidates': [],
              'exact_match_deployment_id': None,
              'errors': [],
          }

          try:
              account = os.environ['CLOUDFLARE_ACCOUNT_ID']
              token = os.environ['CLOUDFLARE_API_TOKEN']
              project = os.environ['PROJECT_NAME']
              endpoint = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/deployments?per_page=100'
              req = Request(endpoint, headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'User-Agent': 'JM-Estate-Rollback-Diagnostic/1.0',
              })
              with urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8', 'replace'))
              out['listing_success'] = bool(payload.get('success'))
              out['deployment_count'] = len(payload.get('result', []))
              if not payload.get('success'):
                  out['errors'].append({'stage': 'list', 'message': str(payload.get('errors', 'unknown Cloudflare API error'))[:1000]})
              else:
                  cutoff = datetime.fromisoformat(os.environ['REGRESSION_CUTOFF'].replace('Z', '+00:00'))
                  rows = []
                  for deployment in payload.get('result', []):
                      try:
                          created = datetime.fromisoformat(deployment['created_on'].replace('Z', '+00:00'))
                      except Exception:
                          continue
                      stage = deployment.get('latest_stage') or {}
                      if deployment.get('environment') == 'production' and stage.get('status') == 'success' and created < cutoff:
                          rows.append((created, deployment))
                  rows.sort(key=lambda item: item[0], reverse=True)
                  out['pre_cutoff_successful_production_count'] = len(rows)

                  for created, deployment in rows[:20]:
                      item = {
                          'id': deployment.get('id'),
                          'created_on': deployment.get('created_on'),
                          'url': deployment.get('url'),
                          'trigger_type': (deployment.get('deployment_trigger') or {}).get('type'),
                          'title_match': False,
                          'content_match': False,
                          'fetch_status': 'NOT_ATTEMPTED',
                      }
                      base = deployment.get('url') or ''
                      if base:
                          theory_url = urljoin(base.rstrip('/') + '/', 'theory/')
                          try:
                              theory_req = Request(theory_url, headers={'User-Agent': 'JM-Estate-Rollback-Diagnostic/1.0'})
                              with urlopen(theory_req, timeout=30) as response:
                                  body = response.read().decode('utf-8', 'replace')
                              item['fetch_status'] = 'SUCCESS'
                              item['title_match'] = 'Project Source Census Edition' in body
                              item['content_match'] = 'Human Pattern Calibration' in body
                              if item['title_match'] and item['content_match'] and out['exact_match_deployment_id'] is None:
                                  out['exact_match_deployment_id'] = deployment.get('id')
                          except HTTPError as exc:
                              item['fetch_status'] = f'HTTP_{exc.code}'
                          except Exception as exc:
                              item['fetch_status'] = type(exc).__name__
                      out['candidates'].append(item)
          except HTTPError as exc:
              body = ''
              try:
                  body = exc.read().decode('utf-8', 'replace')
              except Exception:
                  pass
              out['errors'].append({'stage': 'list_http', 'status': exc.code, 'message': body[:1000]})
          except Exception as exc:
              out['errors'].append({'stage': 'unexpected', 'type': type(exc).__name__, 'message': str(exc)[:1000]})

          Path('registry/cloudflare-theory-rollback-diagnostic.json').write_text(json.dumps(out, indent=2), encoding='utf-8')
          print(json.dumps(out, indent=2))
          PY

      - name: Commit diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Estate Recovery Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-theory-rollback-diagnostic.json
          git diff --cached --quiet || git commit -m "Record Cloudflare Theory rollback diagnostic"
          git push
