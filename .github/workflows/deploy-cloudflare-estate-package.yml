name: Inspect Canonical Theory State

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-estate-package.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - name: Fetch and classify live canonical Theory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry
          curl --fail --silent --show-error --location \
            "https://jmisjustme-estate.pages.dev/theory/?state-proof=${GITHUB_RUN_ID}" \
            > "$RUNNER_TEMP/live-theory.html"

          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          body=Path(os.environ['RUNNER_TEMP'],'live-theory.html').read_text(encoding='utf-8',errors='replace')
          match=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
          title=re.sub(r'\s+',' ',match.group(1)).strip() if match else ''
          state={
            'schema':'JM.CloudflareLiveTheoryState/1.0',
            'status':'FETCHED',
            'canonical_host':'jmisjustme-estate.pages.dev',
            'title':title,
            'contains_human_pattern_calibration':'Human Pattern Calibration' in body,
            'contains_project_source_census_edition':'Project Source Census Edition' in body,
            'contains_v0_4_touch_repair':'v0.4 — Touch Repair' in body,
            'contains_recent_chats_projects':'Recent Chats / Projects' in body,
            'contains_scattered_intake':'Scattered Intake' in body,
            'byte_length':len(body.encode('utf-8')),
            'workflow_run':os.environ['GITHUB_RUN_ID'],
          }
          Path('registry/cloudflare-live-theory-state.json').write_text(json.dumps(state,indent=2),encoding='utf-8')
          print(json.dumps(state,indent=2))
          PY

      - name: Commit canonical state receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Estate Recovery Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-live-theory-state.json
          git diff --cached --quiet || git commit -m "Record current canonical Theory state"
          git push
