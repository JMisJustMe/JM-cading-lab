name: Restore Last Non-v0.4 Theory Body

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-estate-package.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Roll production back to verified non-v0.4 deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jmisjustme-estate
          TARGET_DEPLOYMENT_ID: f6336b93-6b9c-4090-a709-1f0a68d3fbe5
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${TARGET_DEPLOYMENT_ID}/rollback"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$endpoint" > "$RUNNER_TEMP/rollback.json"

          python3 <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path(os.environ['RUNNER_TEMP'],'rollback.json').read_text())
          if not payload.get('success'):
              raise SystemExit(f"Cloudflare rollback failed: {payload}")
          print('Cloudflare accepted rollback to f6336b93-6b9c-4090-a709-1f0a68d3fbe5.')
          PY

      - name: Prove canonical Theory is no longer v0.4
        shell: bash
        run: |
          set -euo pipefail
          proved=0
          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error --location \
              "https://jmisjustme-estate.pages.dev/theory/?non-v04-proof=${GITHUB_RUN_ID}-${attempt}" \
              > "$RUNNER_TEMP/live-theory.html" || true
            if grep -q "Human Pattern Calibration" "$RUNNER_TEMP/live-theory.html" \
              && grep -q "<title>JM Theory Multihub</title>" "$RUNNER_TEMP/live-theory.html" \
              && ! grep -q "v0.4 — Touch Repair" "$RUNNER_TEMP/live-theory.html"; then
              proved=1
              break
            fi
            sleep 2
          done
          test "$proved" -eq 1
          echo "Canonical Theory restored to the last non-v0.4 JM Theory Multihub body."

      - name: Record rollback success
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry
          cat > registry/cloudflare-theory-rollback-receipt.json <<EOF
          {
            "schema": "JM.CloudflareTheoryRollbackReceipt/1.2",
            "status": "SUCCESS",
            "project": "jmisjustme-estate",
            "canonical_host": "jmisjustme-estate.pages.dev",
            "restored_deployment_id": "f6336b93-6b9c-4090-a709-1f0a68d3fbe5",
            "restored_deployment_created_at": "2026-07-20T09:06:33.913028Z",
            "restored_title_proof": "JM Theory Multihub",
            "content_proof": "Human Pattern Calibration",
            "rejected_title": "JM Theory Multihub v0.4 — Touch Repair",
            "workflow_run": "${GITHUB_RUN_ID}",
            "proved_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "next_action": "Restore the live-preserving automatic deployment workflow."
          }
          EOF
          git config user.name "JM Estate Recovery Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-theory-rollback-receipt.json
          git commit -m "Record successful non-v0.4 Theory rollback"
          git push
