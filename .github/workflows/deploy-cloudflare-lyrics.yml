name: Deploy Working Lyrics House

on:
  push:
    branches:
      - main
    paths:
      - "lyrics/**"
      - ".github/workflows/deploy-cloudflare-lyrics.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-lyrics-working
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Preserve live Estate, interaction-test and deploy Lyrics House
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Estate source
        uses: actions/checkout@v6

      - name: Preserve the currently standing Estate
        shell: bash
        env:
          ESTATE_BASE: https://jmisjustme-estate.pages.dev/
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate
          python3 <<'PY'
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          import os, re

          base=os.environ['ESTATE_BASE']
          host=urlparse(base).netloc
          out=Path('cloudflare-estate')
          queue=deque([''])
          seen=set()
          seeds=['navigator/','apps/','theory/','author/','recovery/','404.html','manifest.webmanifest','robots.txt','sitemap.xml','sw.js','_headers','_redirects']
          queue.extend(seeds)

          def fetch(path, required=False):
              url=urljoin(base,path)
              try:
                  req=Request(url,headers={'User-Agent':'JM-Lyrics-Working-Deploy/1.0'})
                  with urlopen(req,timeout=25) as response:
                      return response.read(),response.headers.get_content_type()
              except Exception:
                  if required: raise
                  return b'', ''

          def target_for(path,ctype):
              clean=urlparse('/'+path).path.lstrip('/')
              if not clean: return out/'index.html'
              if clean.endswith('/'): return out/clean/'index.html'
              if ctype=='text/html' and '.' not in Path(clean).name: return out/clean/'index.html'
              return out/clean

          while queue and len(seen)<250:
              path=queue.popleft()
              key=urlparse('/'+path).path.lstrip('/')
              if key in seen: continue
              seen.add(key)
              data,ctype=fetch(key,required=(key==''))
              if not data: continue
              target=target_for(key,ctype)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              if ctype=='text/html':
                  text=data.decode('utf-8','replace')
                  for ref in re.findall(r'''(?:src|href)=["']([^"']+)["']''',text,re.I):
                      if ref.startswith(('data:','mailto:','tel:','#','javascript:')): continue
                      parsed=urlparse(urljoin(base,ref))
                      if parsed.netloc!=host: continue
                      candidate=parsed.path.lstrip('/')
                      if candidate not in seen: queue.append(candidate)
          PY

      - name: Overlay restored working Lyrics House
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate/lyrics
          cp -a lyrics cloudflare-estate/lyrics
          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /lyrics/*
            Cache-Control: no-store
          EOF
          cat > cloudflare-estate/_redirects <<'EOF'
          /* /index.html 200
          EOF

      - name: Prove page completion and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          file=cloudflare-estate/lyrics/index.html
          test -s "$file"
          grep -q "JM Lyrics & Music House — Whole-Estate Public Door" "$file"
          grep -q 'data-view="desk"' "$file"
          grep -q 'id="save"' "$file"
          grep -q 'id="export"' "$file"
          grep -q 'id="clear"' "$file"
          grep -q '</script>' "$file"
          grep -q '</html>' "$file"
          python3 <<'PY'
          from pathlib import Path
          import re
          text=Path('cloudflare-estate/lyrics/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,re.I|re.S)
          assert scripts, 'No executable script found'
          Path('/tmp/lyrics-runtime.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/lyrics-runtime.js

      - name: Click-test the real controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lyrics-smoke
          cd /tmp/lyrics-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent jsdom@24
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/cloudflare-estate/lyrics/index.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://jmisjustme-estate.pages.dev/lyrics/',beforeParse(window){window.scrollTo=()=>{};window.confirm=()=>true;}});
          const {document,localStorage,Event}=dom.window;
          const deskButton=document.querySelector('[data-view="desk"]');
          if(!deskButton) throw new Error('Desk button missing');
          deskButton.click();
          const desk=document.querySelector('[data-panel="desk"]');
          if(!desk.classList.contains('active')) throw new Error('Desk button did not activate its panel');
          const title=document.querySelector('#pieceTitle');
          const text=document.querySelector('#lyricText');
          title.value='Runtime smoke'; text.value='Buttons are connected.';
          title.dispatchEvent(new Event('input',{bubbles:true}));
          text.dispatchEvent(new Event('input',{bubbles:true}));
          document.querySelector('#save').click();
          const saved=JSON.parse(localStorage.getItem('jm-lyrics-public-desk-v1'));
          if(saved?.title!=='Runtime smoke'||saved?.text!=='Buttons are connected.') throw new Error('Save button did not write the draft');
          document.querySelector('[data-view="receipt"]').click();
          if(!document.querySelector('[data-panel="receipt"]').classList.contains('active')) throw new Error('Proof button did not activate its panel');
          console.log('LYRICS HOUSE INTERACTION PASS');
          JS

      - name: Deploy the existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the working body on the canonical host
        shell: bash
        run: |
          set -euo pipefail
          proved=0
          for attempt in $(seq 1 45); do
            curl --fail --silent --show-error --location \
              "https://jmisjustme-estate.pages.dev/lyrics/?working-proof=${GITHUB_RUN_ID}-${attempt}" \
              > "$RUNNER_TEMP/live-lyrics.html" || true
            if grep -q "JM Lyrics & Music House — Whole-Estate Public Door" "$RUNNER_TEMP/live-lyrics.html" \
              && grep -q 'data-view="desk"' "$RUNNER_TEMP/live-lyrics.html" \
              && grep -q 'id="save"' "$RUNNER_TEMP/live-lyrics.html" \
              && grep -q '</html>' "$RUNNER_TEMP/live-lyrics.html"; then
              proved=1
              break
            fi
            sleep 2
          done
          test "$proved" -eq 1
          echo "WORKING LYRICS HOUSE LIVE PROOF PASS"
