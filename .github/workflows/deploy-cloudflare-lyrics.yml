name: Deploy Catalogue-Aware Lyrics House

on:
  push:
    branches:
      - main
    paths:
      - "lyrics/**"
      - ".github/workflows/deploy-cloudflare-lyrics.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-lyrics-catalogue-aware
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Preserve live Estate, prove catalogue-aware Lyrics House, deploy and receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Estate source
        uses: actions/checkout@v6

      - name: Preserve the currently standing Estate
        shell: bash
        env:
          ESTATE_BASE: https://jmisjustme-estate.pages.dev/
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate
          python3 <<'PY'
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          import os, re

          base=os.environ['ESTATE_BASE']
          host=urlparse(base).netloc
          out=Path('cloudflare-estate')
          queue=deque([''])
          seen=set()
          queue.extend(['navigator/','apps/','theory/','author/','recovery/','404.html','manifest.webmanifest','robots.txt','sitemap.xml','sw.js','_headers','_redirects'])

          def fetch(path, required=False):
              url=urljoin(base,path)
              try:
                  req=Request(url,headers={'User-Agent':'JM-Lyrics-Catalogue-Deploy/1.1'})
                  with urlopen(req,timeout=25) as response:
                      return response.read(),response.headers.get_content_type()
              except Exception:
                  if required: raise
                  return b'', ''

          def target_for(path,ctype):
              clean=urlparse('/'+path).path.lstrip('/')
              if not clean: return out/'index.html'
              if clean.endswith('/'): return out/clean/'index.html'
              if ctype=='text/html' and '.' not in Path(clean).name: return out/clean/'index.html'
              return out/clean

          while queue and len(seen)<250:
              path=queue.popleft()
              key=urlparse('/'+path).path.lstrip('/')
              if key in seen: continue
              seen.add(key)
              data,ctype=fetch(key,required=(key==''))
              if not data: continue
              target=target_for(key,ctype)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              if ctype=='text/html':
                  text=data.decode('utf-8','replace')
                  for ref in re.findall(r'''(?:src|href)=["']([^"']+)["']''',text,re.I):
                      if ref.startswith(('data:','mailto:','tel:','#','javascript:')): continue
                      parsed=urlparse(urljoin(base,ref))
                      if parsed.netloc!=host: continue
                      candidate=parsed.path.lstrip('/')
                      if candidate not in seen: queue.append(candidate)
          PY

      - name: Overlay catalogue-aware Lyrics House
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate/lyrics
          cp -a lyrics cloudflare-estate/lyrics

          # Repair the one stale named-global expression in the catalogue-aware source
          # without altering lyric/catalogue content or title authority.
          python3 <<'PY'
          from pathlib import Path
          p=Path('cloudflare-estate/lyrics/index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace("save.onclick=", "document.querySelector('#save').onclick=")
          text=text.replace("clear.onclick=", "document.querySelector('#clear').onclick=")
          text=text.replace("export.onclick=", "document.querySelector('#export').onclick=")
          p.write_text(text,encoding='utf-8')
          PY

          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /lyrics/*
            Cache-Control: no-store
          EOF
          cat > cloudflare-estate/_redirects <<'EOF'
          /* /index.html 200
          EOF

      - name: Prove catalogue, completion and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          page=cloudflare-estate/lyrics/index.html
          data=cloudflare-estate/lyrics/catalogue-public.json
          test -s "$page"
          test -s "$data"
          grep -q "JM Lyrics & Music House — Catalogue-Aware" "$page"
          grep -q "The lyrics have their shape back." "$page"
          grep -q "Getting To Know Me / Getting To Know You" "$page"
          grep -q "Calmer Karma" "$page"
          grep -q "From Behind Bars To Behind Bars" "$page"
          grep -q 'data-go=desk' "$page"
          grep -q 'id=save' "$page"
          grep -q 'id=export' "$page"
          grep -q 'id=clear' "$page"
          grep -q '</script>' "$page"
          grep -q '</html>' "$page"

          python3 <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('cloudflare-estate/lyrics/catalogue-public.json').read_text(encoding='utf-8'))
          assert data['counts']=={
              'project_performance_bodies':8,
              'creative_work_authorities':37,
              'analyzer_bodies':309,
              'source_units':1065,
          }
          assert len(data['projects'])==8
          assert len(data['works'])==37
          assert all(w.get('title') for w in data['works'])
          assert data['projects'][0]['title']=='Getting To Know Me / Getting To Know You'
          assert data['projects'][0]['piece_count']==13
          assert next(p for p in data['projects'] if p['title']=='Calmer Karma')['piece_count']==19

          text=Path('cloudflare-estate/lyrics/index.html').read_text(encoding='utf-8')
          scripts=[s for s in re.findall(r'<script[^>]*>(.*?)</script>',text,re.I|re.S) if s.strip()]
          assert scripts, 'No executable inline script found'
          Path('/tmp/lyrics-runtime.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/lyrics-runtime.js

      - name: Click-test catalogue navigation and writing desk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lyrics-smoke
          cd /tmp/lyrics-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent jsdom@24
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/cloudflare-estate/lyrics/index.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://jmisjustme-estate.pages.dev/lyrics/',beforeParse(window){window.scrollTo=()=>{};window.confirm=()=>true;window.URL.createObjectURL=()=>"blob:jm-test";window.URL.revokeObjectURL=()=>{};}});
          const {document,localStorage,Event}=dom.window;

          const catalogue=document.querySelector('[data-go="cat"]');
          catalogue.click();
          if(!document.querySelector('[data-v="cat"]').classList.contains('on')) throw new Error('Catalogue navigation failed');
          if(!document.body.textContent.includes('Getting To Know Me / Getting To Know You')) throw new Error('GTKM catalogue body missing');
          if(!document.body.textContent.includes('From Behind Bars To Behind Bars')) throw new Error('Recovered work titles missing');

          document.querySelector('[data-go="desk"]').click();
          if(!document.querySelector('[data-v="desk"]').classList.contains('on')) throw new Error('Desk navigation failed');
          const title=document.querySelector('#title');
          const text=document.querySelector('#text');
          title.value='Runtime smoke';
          text.value='Buttons are connected.';
          title.dispatchEvent(new Event('input',{bubbles:true}));
          text.dispatchEvent(new Event('input',{bubbles:true}));
          document.querySelector('#save').click();
          const keys=Object.keys(localStorage);
          const key=keys.find(k=>k.startsWith('jm-lyrics-public-desk-v'));
          if(!key) throw new Error('Save button did not create local draft');
          const saved=JSON.parse(localStorage.getItem(key));
          if(saved?.title!=='Runtime smoke'||saved?.text!=='Buttons are connected.') throw new Error('Saved draft mismatch');
          console.log('CATALOGUE-AWARE LYRICS HOUSE INTERACTION PASS');
          JS

      - name: Deploy the existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove catalogue-aware Lyrics House on canonical host
        shell: bash
        run: |
          set -euo pipefail
          proved=0
          for attempt in $(seq 1 45); do
            curl --fail --silent --show-error --location \
              "https://jmisjustme-estate.pages.dev/lyrics/?catalogue-proof=${GITHUB_RUN_ID}-${attempt}" \
              > "$RUNNER_TEMP/live-lyrics.html" || true
            curl --fail --silent --show-error --location \
              "https://jmisjustme-estate.pages.dev/lyrics/catalogue-public.json?catalogue-proof=${GITHUB_RUN_ID}-${attempt}" \
              > "$RUNNER_TEMP/live-catalogue.json" || true
            if grep -q "The lyrics have their shape back." "$RUNNER_TEMP/live-lyrics.html" \
              && grep -q "Getting To Know Me / Getting To Know You" "$RUNNER_TEMP/live-lyrics.html" \
              && grep -q "From Behind Bars To Behind Bars" "$RUNNER_TEMP/live-lyrics.html" \
              && grep -q '"creative_work_authorities": 37' "$RUNNER_TEMP/live-catalogue.json" \
              && grep -q '"analyzer_bodies": 309' "$RUNNER_TEMP/live-catalogue.json"; then
              proved=1
              break
            fi
            sleep 2
          done
          test "$proved" -eq 1
          echo "CATALOGUE-AWARE LYRICS HOUSE LIVE PROOF PASS"

      - name: Write successful lyric catalogue deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry
          cat > registry/cloudflare-lyrics-catalogue-deploy-receipt.json <<EOF
          {
            "schema": "JM.CloudflareLyricsCatalogueDeployReceipt/1.0",
            "status": "SUCCESS",
            "project": "jmisjustme-estate",
            "canonical_route": "https://jmisjustme-estate.pages.dev/lyrics/",
            "source_commit": "${GITHUB_SHA}",
            "workflow_run": "${GITHUB_RUN_ID}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "proof": "CATALOGUE_AWARE_LYRICS_HOUSE_LIVE",
            "project_performance_bodies": 8,
            "creative_work_authorities": 37,
            "analyzer_bodies": 309,
            "source_units": 1065,
            "gtkm_piece_count": 13,
            "calmer_karma_piece_count": 19,
            "private_full_corpus_published": false,
            "manual_upload_required": false
          }
          EOF
          git config user.name "JM Lyrics Deployment Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-lyrics-catalogue-deploy-receipt.json
          git diff --cached --quiet || git commit -m "Record catalogue-aware Lyrics House deployment success"
          git pull --rebase origin main
          git push origin HEAD:main
