name: Deploy Pass 14 Closure-Synced Lyrics House

# Legacy specialist rail retained for manual recovery/proof only.
# Automatic production authority belongs to Deploy Estate Sovereign Integrated v1.
on:
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-lyrics-pass14-closure
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Preserve live Estate, prove Pass 14 Lyrics House, deploy and receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Estate source
        uses: actions/checkout@v6

      - name: Preserve the currently standing Estate
        shell: bash
        env:
          ESTATE_BASE: https://jmisjustme-estate.pages.dev/
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate
          python3 <<'PY'
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          import os, re
          base=os.environ['ESTATE_BASE']; host=urlparse(base).netloc; out=Path('cloudflare-estate')
          queue=deque(['','navigator/','apps/','theory/','author/','recovery/','404.html','manifest.webmanifest','robots.txt','sitemap.xml','sw.js','_headers','_redirects']); seen=set()
          def fetch(path, required=False):
              try:
                  req=Request(urljoin(base,path),headers={'User-Agent':'JM-Lyrics-Pass14-Deploy/1.0'})
                  with urlopen(req,timeout=25) as response: return response.read(),response.headers.get_content_type()
              except Exception:
                  if required: raise
                  return b'', ''
          def target_for(path,ctype):
              clean=urlparse('/'+path).path.lstrip('/')
              if not clean: return out/'index.html'
              if clean.endswith('/'): return out/clean/'index.html'
              if ctype=='text/html' and '.' not in Path(clean).name: return out/clean/'index.html'
              return out/clean
          while queue and len(seen)<250:
              path=queue.popleft(); key=urlparse('/'+path).path.lstrip('/')
              if key in seen: continue
              seen.add(key); data,ctype=fetch(key,required=(key==''))
              if not data: continue
              target=target_for(key,ctype); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
              if ctype=='text/html':
                  text=data.decode('utf-8','replace')
                  for ref in re.findall(r'''(?:src|href)=["']([^"']+)["']''',text,re.I):
                      if ref.startswith(('data:','mailto:','tel:','#','javascript:')): continue
                      parsed=urlparse(urljoin(base,ref))
                      if parsed.netloc!=host: continue
                      candidate=parsed.path.lstrip('/')
                      if candidate not in seen: queue.append(candidate)
          PY

      - name: Overlay Pass 14 closure-synced Lyrics House
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate/lyrics
          cp -a lyrics cloudflare-estate/lyrics
          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /lyrics/*
            Cache-Control: no-store
          EOF
          cat > cloudflare-estate/_redirects <<'EOF'
          /* /index.html 200
          EOF

      - name: Prove Pass 14 catalogue and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          page=cloudflare-estate/lyrics/index.html
          data=cloudflare-estate/lyrics/catalogue-public.json
          test -s "$page"
          test -s "$data"
          grep -q "Pass 14 Closure-Synced" "$page"
          grep -q "The roots are back under the works." "$page"
          grep -q "Getting To Know Me / Getting To Know You" "$page"
          grep -q "Calmer Karma" "$page"
          grep -q "48" "$page"
          grep -q "13 Instrumentals by Havoc" "$page"
          grep -q '</html>' "$page"
          python3 <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('cloudflare-estate/lyrics/catalogue-public.json').read_text(encoding='utf-8'))
          c=data['counts']
          assert c['project_performance_bodies']==8
          assert c['creative_work_authorities']==48
          assert c['analyzer_bodies_prior_canonical']==309
          assert c['canonical_source_units']==1065
          assert c['recovered_source_notes']==551
          assert c['pass14_delta_records']==298
          assert c['open_true_missing_slots']==1
          assert len(data['new_recovered_work_authorities'])==11
          assert data['open_hold']=='13 Instrumentals by Havoc — slot 13'
          assert data['private_full_note_text_published'] is False
          assert data['private_full_lyric_corpus_published'] is False
          text=Path('cloudflare-estate/lyrics/index.html').read_text(encoding='utf-8')
          assert '48</b>creative work authorities' in text
          assert '1</b>true missing expected slot' in text
          print('PASS 14 CLOSURE CATALOGUE QA PASS')
          PY

      - name: Deploy the existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove Pass 14 Lyrics House on canonical host
        shell: bash
        run: |
          set -euo pipefail
          proved=0
          for attempt in $(seq 1 45); do
            curl --fail --silent --show-error --location "https://jmisjustme-estate.pages.dev/lyrics/?pass14-proof=${GITHUB_RUN_ID}-${attempt}" > "$RUNNER_TEMP/live-lyrics.html" || true
            curl --fail --silent --show-error --location "https://jmisjustme-estate.pages.dev/lyrics/catalogue-public.json?pass14-proof=${GITHUB_RUN_ID}-${attempt}" > "$RUNNER_TEMP/live-catalogue.json" || true
            if grep -q "The roots are back under the works." "$RUNNER_TEMP/live-lyrics.html" \
              && grep -q '"creative_work_authorities": 48' "$RUNNER_TEMP/live-catalogue.json" \
              && grep -q '"open_true_missing_slots": 1' "$RUNNER_TEMP/live-catalogue.json"; then proved=1; break; fi
            sleep 2
          done
          test "$proved" -eq 1
          echo "PASS 14 CLOSURE-SYNCED LYRICS HOUSE LIVE PROOF PASS"

      - name: Write successful Pass 14 deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry
          cat > registry/cloudflare-lyrics-pass14-closure-deploy-receipt.json <<EOF
          {
            "schema": "JM.CloudflareLyricsPass14ClosureDeployReceipt/1.0",
            "status": "SUCCESS",
            "project": "jmisjustme-estate",
            "canonical_route": "https://jmisjustme-estate.pages.dev/lyrics/",
            "source_commit": "${GITHUB_SHA}",
            "workflow_run": "${GITHUB_RUN_ID}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "proof": "PASS14_CLOSURE_SYNCED_LYRICS_HOUSE_LIVE",
            "project_performance_bodies": 8,
            "creative_work_authorities": 48,
            "prior_analyzer_bodies": 309,
            "source_units": 1065,
            "recovered_source_notes": 551,
            "pass14_delta_records": 298,
            "true_missing_holds": 1,
            "private_full_corpus_published": false
          }
          EOF
          git config user.name "JM Lyrics Deployment Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-lyrics-pass14-closure-deploy-receipt.json
          git diff --cached --quiet || git commit -m "Record Pass 14 Lyrics House live proof"
          git pull --rebase origin main
          git push origin HEAD:main
