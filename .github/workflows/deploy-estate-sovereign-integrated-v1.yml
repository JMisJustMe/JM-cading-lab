          import hashlib, json, os, pathlib, time, urllib.request
          from datetime import datetime, timezone
          root='estate-publication/apps-tools-convergence/'
          files=[
              'index.html',
              'JM_CAPABILITY_ENVIRONMENT_v0_1.css',
              'JM_CAPABILITY_ENVIRONMENT_RUNTIME_v0_1.js',
              'JM_APPS_TOOLS_SHARED_PACKET_SPINE_v0_1.js',
              'evidence-governance/index.html',
              'creation-publication/index.html',
              'contact-practice/index.html',
              'route-ftr/index.html',
          ]
          base='https://jmisjustme-estate.pages.dev/'
          verified=[]
          # CP34: Cloudflare Pages normalizes /index.html to / (HTTP 308).
          # Python's default urllib user agent can receive 403 while the
          # exact public source bytes are intact. Follow the redirect with
          # a browser-compatible GET; original SHA-256 gates remain strict.
          for part in files:
              path=root+part
              expected=hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              observed=None
              for attempt in range(1,31):
                  url=base+path+'?jm-cp11-live='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept':'text/html,*/*','User-Agent':'Mozilla/5.0 (JM-Estate-Source-Readback/1.0)'})
                      with urllib.request.urlopen(request,timeout=20) as result:
                          if result.status==200:
                              observed=hashlib.sha256(result.read()).hexdigest()
                              if observed==expected:break
                  except Exception:pass
                  time.sleep(3)
              if observed!=expected:
                  raise SystemExit('CP11 LIVE SOURCE HOLD: '+path+' expected '+expected+' observed '+str(observed))
              verified.append({'path':'/'+path,'sha256':expected,'http':200,'exact_bytes':True})
              print('CP11 LIVE EXACT PASS '+path+' SHA256 '+expected)
          for attempt in range(1,31):
              try:
                  url=base+'apps/?jm-cp11-live='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (JM-Estate-Source-Readback/1.0)'})
                  with urllib.request.urlopen(request,timeout=20) as result:
                      live_apps=result.read().decode('utf-8')
                      if result.status==200 and 'data-cp11="four-original-workrooms"' in live_apps:break
              except Exception:pass
              time.sleep(3)
          else:
              raise SystemExit('CP11 LIVE APPS HOUSE ROUTE HOLD')
          receipt={
              'schema':'JM.AppsToolsWorkroomsLiveCarriageProof/1',
              'verified_utc':datetime.now(timezone.utc).isoformat(),
              'state':'LIVE_EXACT_SOURCE_PASS',
              'source_commit':os.environ['GITHUB_SHA'],
              'github_workflow_run':os.environ['GITHUB_RUN_ID'],
              'host':base.rstrip('/'),
              'files_verified':verified,
              'file_count':len(verified),
              'apps_house_entry_verified':True,
              'real_owner_device_proof':False,
              'owner_content_or_secrets_collected':False,
              'automatic_github_writeback_proof':False,
              'other_jm_apps_live_editability_proof':False,
              'boundary':'Proves public canonical delivery of eight exact source-derived static workroom assets and Apps House links; local browser persistence, owner device interaction, and private full bodies are separate.'
          }
          pathlib.Path(os.environ['RUNNER_TEMP'],'jm-apps-tools-cp11-live.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY

      - name: CP11 preserve verified live workroom source receipt in GitHub
        shell: bash
        run: |
          set -euo pipefail
          # CP35: prior live runtime checks leave generated, unstaged files.
          # Rebasing that deployment checkout fails even after the receipt
          # itself was committed. Use a disposable isolated Git worktree so
          # the live source checkout and any proofs are never stashed,
          # reset, overwritten or accidentally swept into the receipt.
          test -s "$RUNNER_TEMP/jm-apps-tools-cp11-live.json"
          git fetch origin main
          receipt_tree="$(mktemp -d "$RUNNER_TEMP/jm-cp11-receipt.XXXXXXXX")"
          trap 'git worktree remove --force "$receipt_tree" 2>/dev/null || true' EXIT
          git worktree add --detach "$receipt_tree" origin/main
          (
            cd "$receipt_tree"
            mkdir -p registry
            cp "$RUNNER_TEMP/jm-apps-tools-cp11-live.json" registry/apps-tools-cp11-live-carriage-receipt.json
            git config user.name 'JM Apps & Tools Live Proof Rail'
            git config user.email 'actions@users.noreply.github.com'
            git add registry/apps-tools-cp11-live-carriage-receipt.json
            if git diff --cached --quiet; then
              echo 'CP11 original live source receipt already current; no write needed.'
              exit 0
            fi
            git commit -m 'Record exact live source proof for four Apps & Tools workrooms [skip ci]'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = 1
          )
          echo 'CP11 exact live source receipt committed from isolated temporary worktree.'

      - uses: actions/upload-artifact@v4
        with:
          name: estate-sovereign-integrated-live-proof-v1
          path: |
            ESTATE_SOVEREIGN_INTEGRATION_LIVE_PROOF_v1.json
            JM_AGI_LAB_RUNTIME_CLOUDFLARE_PUBLIC_PROOF.json
            qa/jm-agi-lab-runtime-console-v1/browser-proof.json
            qa/jm-agi-lab-runtime-console-v1/01-armed-mobile.png
            qa/jm-agi-lab-runtime-console-v1/02-returned-mobile.png
            qa/jm-agi-lab-runtime-console-v1/03-returned-desktop.png
          if-no-files-found: error
          retention-days: 30
