name: Deploy Estate Sovereign Integrated v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-estate-sovereign-integrated-v1.yml"
      - "index.html"
      - "estate-*.js"
      - "estate*.css"
      - "ecostate-*.js"
      - "ecostate-*.css"
      - "author-home-door.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - "robots.txt"
      - "sitemap.xml"
      - "404.html"
      - "assets/ecostate-v3/**"
      - "access/**"
      - "apps/**"
      - "author/**"
      - "books/**"
      - "career/**"
      - "coding-estate/**"
      - "unified-browser/**"
      - "ailatheo/**"
      - "ailatheo-lineage/**"
      - "functions/api/ailatheo.js"
      - "functions/api/owner/vault.js"
      - "functions/api/estate-contact.js"
      - "tests/ailatheo-customer-entitlement.mjs"
      - "ai-federation/**"
      - "earn-now/**"
      - "estate/**"
      - "fresh-app-lab/**"
      - "games-beyond/**"
      - "mmzg-runtime-v0.6/**"
      - "lyrics/**"
      - "money-menu/**"
      - "market-lab/**"
      - "navigator/**"
      - "recent/**"
      - "recovery/**"
      - "shims-reader/**"
      - "theory/**"
      - "visual-story/**"
      - "registry/estate-map.json"
      - "registry/estate-head-public-current.json"
      - "registry/theory-wing.json"
      - "registry/lyrics-house.json"
      - "registry/public-release-current.json"
      - "governance/estate-integration/**"
      - "carrier-control/**"
      - "tools/jm_carrier_control.py"
      - "tools/jm_carrier_registry.py"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-sovereign-integrated-v1
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  deploy-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out current source authority
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct governed carrier bodies from source authority
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/jm_carrier_registry.py --registry carrier-control/registry.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('_carrier_outputs/JM-CARRIER-REGISTRY-RECEIPT.json').read_text())
          assert receipt['status']=='DING'
          nav=[x for x in receipt['results'] if x['id']=='navigator']
          assert len(nav)==1
          assert nav[0]['body_sha256']=='b41d03fdc5a4fd9545ed30beac5477e70a54ddf479bb580f4650333a41387569'
          assert nav[0]['direct_https']['runtime_reconstruction'] is False
          print('JM3232 NAVIGATOR CARRIER DING',nav[0]['body_sha256'])
          PY

      - name: Prove source authority and integration contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/estate-integration/verify_sovereign_integration_v1.py
          python3 governance/enforce_source_to_living.py check --root .
          python3 governance/verify_estate_classification.py --root .
          node --check navigator/estate-integration/bridge.js
          node --check estate-return-route.js
          node --check unified-browser/jm-ailatheo-consequence-return-v1.js
          node --check unified-browser/jm-games-beyond-return-v1.js
          node --check functions/api/estate-contact.js
          node --input-type=module --check < functions/api/owner/vault.js
          node --check estate-owner-vault.js
          # Native JM custody law: malformed EXISTING private records must not
          # be interpreted as empty or overwritten. Refuse a production upload.
          node tools/test-owner-vault-v0.1.mjs --require-custody-safe
          node --check unified-browser/jm-cloud-workspace-client.mjs
          node --check unified-browser/jm-ailatheo-cloud-contact.mjs
          node navigator/mcp-public-v1/test.mjs
          node tests/ailatheo-customer-entitlement.mjs
          python3 -m json.tool navigator/estate-integration/public-registry.json >/dev/null
          python3 -m json.tool navigator/stringline.json >/dev/null
          python3 -m json.tool registry/jm3232-navigator.json >/dev/null

      - name: Assemble one deterministic public Estate from current source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate/registry

          for file in \
            index.html estate-app.js estate-accessibility.js estate-head-public-consumer.js estate-return-route.js \
            estate.css estate-accessibility.css icon.svg manifest.webmanifest sw.js \
            author-home-door.js robots.txt sitemap.xml 404.html cading.html \
            ecostate-visual-v1.css ecostate-interaction-v1.js \
            ecostate-personality-v2.css ecostate-personality-v2.js \
            ecostate-authored-v3.css ecostate-authored-v3.js \
            ecostate-contact-v4.css ecostate-contact-v4.js \
            ecostate-gripcube-v5.css ecostate-gripcube-v5.js \
            ecostate-griprail-v6.css ecostate-griprail-v6.js; do
            [ ! -f "$file" ] || cp "$file" cloudflare-estate/
          done

          for dir in access apps author books career coding-estate unified-browser ailatheo ailatheo-lineage ai-federation earn-now estate fresh-app-lab games-beyond lyrics market-lab mmzg-runtime-v0.6 navigator recent recovery shims-reader theory visual-story; do
            [ ! -d "$dir" ] || cp -a "$dir" "cloudflare-estate/$dir"
          done

          # CP11: publish ONLY the four explicitly recovered, public-safe
          # executable Apps & Tools workroom shells into the ORIGINAL Estate.
          # Never copy the full estate-publication directory: it contains
          # private/source-side records and custody material.
          env_src='estate-publication/apps-tools-convergence'
          env_dst="cloudflare-estate/$env_src"
          mkdir -p "$env_dst"
          for file in index.html JM_CAPABILITY_ENVIRONMENT_v0_1.css JM_CAPABILITY_ENVIRONMENT_RUNTIME_v0_1.js JM_APPS_TOOLS_SHARED_PACKET_SPINE_v0_1.js; do
            test -s "$env_src/$file"
            cp "$env_src/$file" "$env_dst/$file"
            cmp "$env_src/$file" "$env_dst/$file"
          done
          for env in evidence-governance creation-publication contact-practice route-ftr; do
            test -s "$env_src/$env/index.html"
            mkdir -p "$env_dst/$env"
            cp "$env_src/$env/index.html" "$env_dst/$env/index.html"
            cmp "$env_src/$env/index.html" "$env_dst/$env/index.html"
          done
          if [ "$(find "$env_dst" -type f | wc -l | tr -d ' ')" != 8 ]; then
            echo 'CP11 allowlist violation: unexpected files in published workrooms' >&2
            exit 1
          fi
          # The rest of the source carriage remains in GitHub custody;
          # the canonical Cloudflare carrier serves only governed bodies.
          mkdir -p cloudflare-estate/assets
          cp -a assets/ecostate-v3 cloudflare-estate/assets/ecostate-v3
          rm -rf cloudflare-estate/navigator/source-authority
          rm -f cloudflare-estate/navigator/carrier-plan.json

          if [ -d money-menu ]; then
            mkdir -p cloudflare-estate/money-menu
            for file in index.html STATUS.md PUBLICATION_RECEIPT.json; do
              [ ! -f "money-menu/$file" ] || cp "money-menu/$file" "cloudflare-estate/money-menu/$file"
            done
            # This existing enquiry page is linked by the live Money Menu.
            # Publish only its customer-facing body, not operations/outreach files.
            if [ -f money-menu/launch/index.html ]; then
              mkdir -p cloudflare-estate/money-menu/launch
              cp money-menu/launch/index.html cloudflare-estate/money-menu/launch/index.html
            fi
          fi

          # Overlay one contextual return-route organ on public front doors only.
          # The source bodies remain sovereign; this is carrier navigation, not body replacement.
          python3 - <<'PY'
          from pathlib import Path
          marker='data-jm-context-return-route="v0.1"'
          tag='<script defer src="/estate-return-route.js" data-jm-context-return-route="v0.1"></script>'
          targets=[
              'index.html','access/index.html','career/index.html','recovery/index.html',
              'money-menu/index.html','games-beyond/index.html','author/index.html',
              'navigator/index.html','apps/index.html','books/index.html','theory/index.html',
              'lyrics/index.html','market-lab/index.html','visual-story/index.html','recent/index.html'
          ]
          for rel in targets:
              path=Path('cloudflare-estate')/rel
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</body>' not in text.lower():
                  raise SystemExit(f'Context-return target has no body close: {rel}')
              idx=text.lower().rfind('</body>')
              text=text[:idx]+tag+'\n'+text[idx:]
              path.write_text(text,encoding='utf-8')
          PY

          for file in \
            estate-map.json estate-head-public-current.json theory-wing.json lyrics-house.json \
            public-release-current.json jm3232-navigator.json \
            estate-classification-authority-v1.0.json estate-classification-integrity-receipt-v1.0.json \
            portal-engine-access-line-authority.json; do
            [ ! -f "registry/$file" ] || cp "registry/$file" "cloudflare-estate/registry/$file"
          done

          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache, must-revalidate
          /sw.js
            Cache-Control: no-store, no-cache, must-revalidate
            Service-Worker-Allowed: /
          /navigator/*
            Cache-Control: no-store, no-cache, must-revalidate
          /access/*
            Cache-Control: no-store, no-cache, must-revalidate
          /apps/*
            Cache-Control: no-store, no-cache, must-revalidate
          /books/*
            Cache-Control: no-store, no-cache, must-revalidate
          /career/*
            Cache-Control: no-store, no-cache, must-revalidate
          /unified-browser/*
            Cache-Control: no-store, no-cache, must-revalidate
          /ailatheo/*
            Cache-Control: no-store, no-cache, must-revalidate
          /api/ailatheo*
            Cache-Control: no-store, no-cache, must-revalidate
          /theory/*
            Cache-Control: no-store, no-cache, must-revalidate
          /visual-story/*
            Cache-Control: no-store, no-cache, must-revalidate
          /lyrics/*
            Cache-Control: no-store, no-cache, must-revalidate
          /recovery/*
            Cache-Control: no-store, no-cache, must-revalidate
          /games-beyond/*
            Cache-Control: no-store, no-cache, must-revalidate
          /market-lab/*
            Cache-Control: no-store, no-cache, must-revalidate
          EOF

          cat > cloudflare-estate/_redirects <<'EOF'
          /unified-browser /unified-browser/OPEN_FIRST_AILATHEO_UNIFIED_BROWSER_CIRCUIT_v0_1.html 200
          /unified-browser/ /unified-browser/OPEN_FIRST_AILATHEO_UNIFIED_BROWSER_CIRCUIT_v0_1.html 200
          /ailatheo /ailatheo/index.html 200
          /ailatheo/ /ailatheo/index.html 200
          /navigator /navigator/index.html 200
          /navigator/ /navigator/index.html 200
          /access /access/index.html 200
          /access/ /access/index.html 200
          /apps /apps/index.html 200
          /apps/ /apps/index.html 200
          /books /books/index.html 200
          /books/ /books/index.html 200
          /career /career/index.html 200
          /career/ /career/index.html 200
          /theory /theory/index.html 200
          /theory/ /theory/index.html 200
          /lyrics /lyrics/index.html 200
          /lyrics/ /lyrics/index.html 200
          /recovery /recovery/index.html 200
          /recovery/ /recovery/index.html 200
          /games-beyond /games-beyond/index.html 200
          /games-beyond/ /games-beyond/index.html 200
          /market-lab /market-lab/index.html 200
          /market-lab/ /market-lab/index.html 200
          /author /author/index.html 200
          /author/ /author/index.html 200
          /recent /recent/index.html 200
          /recent/ /recent/index.html 200
          /visual-story /visual-story/index.html 200
          /visual-story/ /visual-story/index.html 200
          /* /index.html 200
          EOF

      - name: Prove assembled Estate before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare-estate/index.html
          test -s cloudflare-estate/estate-return-route.js
          grep -Fq 'JM.EstateReturnRoute/0.1' cloudflare-estate/estate-return-route.js
          grep -Fq 'data-jm-context-return-route="v0.1"' cloudflare-estate/career/index.html
          grep -Fq 'data-jm-context-return-route="v0.1"' cloudflare-estate/recovery/index.html
          grep -Fq 'data-jm-context-return-route="v0.1"' cloudflare-estate/money-menu/index.html
          grep -Fq 'data-jm-context-return-route="v0.1"' cloudflare-estate/games-beyond/index.html
          grep -Fq 'data-jm-context-return-route="v0.1"' cloudflare-estate/author/index.html
          test -s cloudflare-estate/unified-browser/jm-games-beyond-return-v1.js
          grep -Fq 'JM.GamesBeyond.IndependentHouseProof/1' cloudflare-estate/unified-browser/jm-games-beyond-return-v1.js
          grep -Fq 'data-jm-games-return="federation"' cloudflare-estate/unified-browser/OPEN_FIRST_AILATHEO_LIVING_FEDERATION_v1_0.html
          grep -Fq 'data-jm-games-return="games-house"' cloudflare-estate/games-beyond/index.html
          test -s cloudflare-estate/unified-browser/jm-ailatheo-consequence-return-v1.js
          grep -Fq 'JM.AILatheo.ReceiverReturn/1' cloudflare-estate/unified-browser/jm-ailatheo-consequence-return-v1.js
          grep -Fq 'JM.AILatheo.NativeSixReceiverReadback/1' cloudflare-estate/unified-browser/jm-ailatheo-consequence-return-v1.js
          grep -Fq 'EXECUTE SIX JM NATIVE CODING RECEIVERS' cloudflare-estate/unified-browser/jm-ailatheo-consequence-return-v1.js
          grep -Fq 'data-jm-relay="federation"' cloudflare-estate/unified-browser/OPEN_FIRST_AILATHEO_LIVING_FEDERATION_v1_0.html
          grep -Fq 'data-jm-relay="workbench"' cloudflare-estate/unified-browser/OPEN_FIRST_AILATHEO_CREATION_WORKBENCH_v3_0_ALPHA.html
          test -s cloudflare-estate/unified-browser/OPEN_FIRST_AILATHEO_UNIFIED_BROWSER_CIRCUIT_v0_1.html
          grep -Fq "AILATHEO_VISIBLE_CIRCUIT_DING" cloudflare-estate/unified-browser/OPEN_FIRST_AILATHEO_UNIFIED_BROWSER_CIRCUIT_v0_1.html
          test -s cloudflare-estate/ailatheo/index.html
          grep -Fq "Build it." cloudflare-estate/ailatheo/index.html
          grep -Fq "Creator checkout only opens when the server confirms the entitlement rail is ready." cloudflare-estate/ailatheo/index.html
          test -s functions/api/ailatheo.js
          grep -Fq "JM.AILatheoCustomer/0.1" functions/api/ailatheo.js
          grep -Fq "localStorage.setItem" cloudflare-estate/unified-browser/OPEN_FIRST_AILATHEO_UNIFIED_BROWSER_CIRCUIT_v0_1.html
          test -s cloudflare-estate/navigator/index.html
          test -s cloudflare-estate/navigator/stringline.json
          test -s cloudflare-estate/navigator/estate-integration/index.html
          grep -Fq 'Edit registered source (GitHub)' cloudflare-estate/navigator/estate-integration/index.html
          grep -Fq 'sourceContacts:x.sourceContacts.map' cloudflare-estate/navigator/estate-integration/index.html
          grep -Fq 'Edit existing workroom source (GitHub)' cloudflare-estate/navigator/estate-integration/index.html
          grep -Fq 'APP_SOURCE_CONTACTS=' cloudflare-estate/apps/index.html
          grep -Fq 'Only explicitly recovered, exact-version public carrier files' cloudflare-estate/apps/index.html
          grep -Fq 'Edit this game in existing Games & Beyond' cloudflare-estate/navigator/estate-integration/index.html
          test -s cloudflare-estate/games-beyond/app.js
          grep -Fq 'openRequestedSourceEditor()' cloudflare-estate/games-beyond/app.js
          grep -Fq 'jm-edit' cloudflare-estate/games-beyond/app.js
          grep -Fq "if(new URLSearchParams(location.search).has('jm-edit'))return;" cloudflare-estate/games-beyond/catalogue-v0-6-core-loader.js
          test -s cloudflare-estate/games-beyond/payload-manifest.json
          for file in futarized-v1-2.html fight-clash-v0-4.html aiming-run-v0-1a.html drag-aim-loop-kernel-v0-9-9.html loopit-glyphplay-gameforge-boundary-rejoin-node.html playform-v0-1.html; do
            test -s "cloudflare-estate/games-beyond/bodies/$file"
          done
          grep -Fq "'Owner custody','JM Owner Vault" cloudflare-estate/navigator/estate-integration/index.html
          test -s cloudflare-estate/navigator/estate-integration/public-registry.json
          test -s cloudflare-estate/navigator/estate-integration/bridge.js
          test -s cloudflare-estate/access/index.html
          test -s cloudflare-estate/apps/index.html
          grep -Fq 'data-cp11="four-original-workrooms"' cloudflare-estate/apps/index.html
          test -s cloudflare-estate/estate-publication/apps-tools-convergence/JM_APPS_TOOLS_SHARED_PACKET_SPINE_v0_1.js
          grep -Fq 'PACKET_BUS_FORMAT_HOLD' cloudflare-estate/estate-publication/apps-tools-convergence/JM_APPS_TOOLS_SHARED_PACKET_SPINE_v0_1.js
          test -s cloudflare-estate/estate-publication/apps-tools-convergence/JM_CAPABILITY_ENVIRONMENT_RUNTIME_v0_1.js
          grep -Fq 'PROTECTED_EXISTING_STATE_HOLD' cloudflare-estate/estate-publication/apps-tools-convergence/JM_CAPABILITY_ENVIRONMENT_RUNTIME_v0_1.js
          for env in evidence-governance creation-publication contact-practice route-ftr; do
            test -s "cloudflare-estate/estate-publication/apps-tools-convergence/$env/index.html"
          done
          test -s cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/index.html
          test -s cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/styles.css
          test -s cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/runtime-core.mjs
          test -s cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/app.mjs
          echo '634b43d2a6e4117e7a35f4a2706fd2bced3951b2b8446647a4f4d0aec08c4147  cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/index.html' | sha256sum -c -
          echo 'dde8332ef7aa497495542af81356dd1023c181ca10da91f9bc59ff6535c2fa15  cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/styles.css' | sha256sum -c -
          echo 'fefb51860eb4520ea4fcd2b1ad09c6b149be6500da40ba9aba1e029d213e8d26  cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/runtime-core.mjs' | sha256sum -c -
          echo '7b3fc9049186f5c02319da19295ffbdfd072e36f394e245ae2f2dc2fd20452fb  cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/app.mjs' | sha256sum -c -
          grep -Fq 'Contact.<br>Change.<br>Return.' cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/index.html
          grep -Fq 'verifyReloadChallenge' cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/runtime-core.mjs
          grep -Fq '__JM_RUNTIME_DEBUG__' cloudflare-estate/apps/jm-agi-lab-runtime-console-v1/app.mjs
          test -s cloudflare-estate/books/index.html
          test -s cloudflare-estate/career/index.html
          test -s cloudflare-estate/theory/index.html
          test -s cloudflare-estate/theory/publications/jm-theory-estate-public-safe-v1/index.html
          test -s cloudflare-estate/theory/publications/jm-theory-estate-public-safe-v1/JM_THEORY_ESTATE_PUBLIC_SAFE_EDITION_v1_0.md
          echo '6af903409d97e853ae77519d672fac32fe9fb5384774a7f1c113c9c501a4b8b8  cloudflare-estate/theory/publications/jm-theory-estate-public-safe-v1/index.html' | sha256sum -c -
          echo '2f42acf027db5847e1cc4ebeebf2b23281381f3f07871da8358bffb88b3001ea  cloudflare-estate/theory/publications/jm-theory-estate-public-safe-v1/JM_THEORY_ESTATE_PUBLIC_SAFE_EDITION_v1_0.md' | sha256sum -c -
          grep -Fq 'LITERATURE CONTACT COMPLETE ≠ EMPIRICAL VALIDATION COMPLETE.' cloudflare-estate/theory/publications/jm-theory-estate-public-safe-v1/index.html
          grep -Fq 'BODY ≠ CARRIER. CARRIER ≠ NEW CREATION.' cloudflare-estate/theory/publications/jm-theory-estate-public-safe-v1/index.html
          test -s cloudflare-estate/visual-story/index.html
          test -s cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/index.html
          test -s cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/reader.css
          test -s cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/reader.js
          echo 'd62085ec9a6f3a81292bf8b8f3cd5d74dd764b131e81a6029483c9655ff1659c  cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/index.html' | sha256sum -c -
          echo 'd650efda89c91dcae6f7b8a41cc9d15fbb04a40ca6ab028baaea9a48b8a7b45c  cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/reader.css' | sha256sum -c -
          echo 'f77b6c4467e6ce0b9ebaba7ac1a10a16ec1fee5c79b819c17b1ec42a148a835f  cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/reader.js' | sha256sum -c -
          grep -Fq 'BACKGROUND<br>NOISE' cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/index.html
          grep -Fq 'Reader ≠ source authority.' cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/index.html
          grep -Fq 'DON’T CROWN IT' cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/reader.js
          grep -Fq 'FTR WILL RETURN' cloudflare-estate/visual-story/ftr-the-massive-push/issue-01/reader.js
          test -s cloudflare-estate/lyrics/index.html
          test -s cloudflare-estate/recovery/index.html
          test -s cloudflare-estate/games-beyond/index.html
          # Preserve the existing MMZG body exactly; the carrier must not synthesize or rewrite it.
          for file in index.html mmzg_runtime_core_v0_6.js manifest.webmanifest service_worker.js; do
            test -s "cloudflare-estate/mmzg-runtime-v0.6/$file"
            cmp -s "mmzg-runtime-v0.6/$file" "cloudflare-estate/mmzg-runtime-v0.6/$file" || { echo "MMZG source/body byte mismatch: $file"; exit 1; }
          done
          echo "MMZG v0.6 original 4/4 bodies preserved byte-for-byte in assembled carrier"
          test -s cloudflare-estate/market-lab/index.html
          test -s cloudflare-estate/ecostate-gripcube-v5.css
          test -s cloudflare-estate/ecostate-gripcube-v5.js
          test -s cloudflare-estate/ecostate-griprail-v6.css
          test -s cloudflare-estate/ecostate-griprail-v6.js

          grep -Fq 'ecostate-gripcube-v5.css' cloudflare-estate/index.html
          grep -Fq 'ecostate-gripcube-v5.js' cloudflare-estate/index.html
