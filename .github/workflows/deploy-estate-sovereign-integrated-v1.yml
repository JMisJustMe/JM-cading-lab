name: Deploy Estate Sovereign Integrated v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-estate-sovereign-integrated-v1.yml"
      - "index.html"
      - "estate-*.js"
      - "estate*.css"
      - "author-home-door.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - "robots.txt"
      - "sitemap.xml"
      - "404.html"
      - "apps/**"
      - "author/**"
      - "coding-estate/**"
      - "earn-now/**"
      - "estate/**"
      - "fresh-app-lab/**"
      - "games-beyond/**"
      - "lyrics/**"
      - "money-menu/**"
      - "navigator/**"
      - "recent/**"
      - "recovery/**"
      - "shims-reader/**"
      - "theory/**"
      - "registry/estate-map.json"
      - "registry/estate-head-public-current.json"
      - "registry/theory-wing.json"
      - "registry/lyrics-house.json"
      - "registry/public-release-current.json"
      - "governance/estate-integration/**"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-sovereign-integrated-v1
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current source authority
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove source authority and integration contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/estate-integration/verify_sovereign_integration_v1.py
          python3 governance/enforce_source_to_living.py check --root .
          python3 governance/verify_estate_classification.py --root .
          node --check navigator/estate-integration/bridge.js
          node navigator/mcp-public-v1/test.mjs
          python3 -m json.tool navigator/estate-integration/public-registry.json >/dev/null
          python3 -m json.tool navigator/stringline.json >/dev/null
          python3 -m json.tool registry/jm3232-navigator.json >/dev/null

      - name: Assemble one deterministic public Estate from current source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate/registry

          for file in \
            index.html estate-app.js estate-accessibility.js estate-head-public-consumer.js \
            estate.css estate-accessibility.css icon.svg manifest.webmanifest sw.js \
            author-home-door.js robots.txt sitemap.xml 404.html cading.html; do
            [ ! -f "$file" ] || cp "$file" cloudflare-estate/
          done

          for dir in apps author coding-estate earn-now estate fresh-app-lab games-beyond lyrics navigator recent recovery shims-reader theory; do
            [ ! -d "$dir" ] || cp -a "$dir" "cloudflare-estate/$dir"
          done

          if [ -d money-menu ]; then
            mkdir -p cloudflare-estate/money-menu
            for file in index.html STATUS.md PUBLICATION_RECEIPT.json; do
              [ ! -f "money-menu/$file" ] || cp "money-menu/$file" "cloudflare-estate/money-menu/$file"
            done
          fi

          for file in \
            estate-map.json estate-head-public-current.json theory-wing.json lyrics-house.json \
            public-release-current.json jm3232-navigator.json \
            estate-classification-authority-v1.0.json estate-classification-integrity-receipt-v1.0.json \
            portal-engine-access-line-authority.json; do
            [ ! -f "registry/$file" ] || cp "registry/$file" "cloudflare-estate/registry/$file"
          done

          cat > cloudflare-estate/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(self), geolocation=()
            Cache-Control: no-cache, must-revalidate
          /sw.js
            Cache-Control: no-store, no-cache, must-revalidate
            Service-Worker-Allowed: /
          /navigator/*
            Cache-Control: no-store, no-cache, must-revalidate
          /apps/*
            Cache-Control: no-store, no-cache, must-revalidate
          /theory/*
            Cache-Control: no-store, no-cache, must-revalidate
          /lyrics/*
            Cache-Control: no-store, no-cache, must-revalidate
          /recovery/*
            Cache-Control: no-store, no-cache, must-revalidate
          /games-beyond/*
            Cache-Control: no-store, no-cache, must-revalidate
          EOF

          cat > cloudflare-estate/_redirects <<'EOF'
          /navigator /navigator/index.html 200
          /navigator/ /navigator/index.html 200
          /apps /apps/index.html 200
          /apps/ /apps/index.html 200
          /theory /theory/index.html 200
          /theory/ /theory/index.html 200
          /lyrics /lyrics/index.html 200
          /lyrics/ /lyrics/index.html 200
          /recovery /recovery/index.html 200
          /recovery/ /recovery/index.html 200
          /games-beyond /games-beyond/index.html 200
          /games-beyond/ /games-beyond/index.html 200
          /author /author/index.html 200
          /author/ /author/index.html 200
          /recent /recent/index.html 200
          /recent/ /recent/index.html 200
          /* /index.html 200
          EOF

      - name: Prove assembled Estate before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare-estate/index.html
          test -s cloudflare-estate/navigator/index.html
          test -s cloudflare-estate/navigator/stringline.json
          test -s cloudflare-estate/navigator/estate-integration/index.html
          test -s cloudflare-estate/navigator/estate-integration/public-registry.json
          test -s cloudflare-estate/navigator/estate-integration/bridge.js
          test -s cloudflare-estate/apps/index.html
          test -s cloudflare-estate/theory/index.html
          test -s cloudflare-estate/lyrics/index.html
          test -s cloudflare-estate/recovery/index.html
          test -s cloudflare-estate/games-beyond/index.html

          grep -Fq 'JM3232 NAVIGATOR' cloudflare-estate/navigator/index.html
          grep -Fq 'estate-sovereign-integration' cloudflare-estate/navigator/stringline.json
          grep -Fq 'JM.Estate.PublicNervousSystem/1' cloudflare-estate/navigator/estate-integration/public-registry.json
          grep -Fq 'One Estate.' cloudflare-estate/navigator/estate-integration/index.html
          grep -Fq 'data-jm-estate-integration="v1"' cloudflare-estate/navigator/index.html
          grep -Fq 'data-jm-estate-integration="v1"' cloudflare-estate/apps/index.html
          grep -Fq 'data-jm-estate-integration="v1"' cloudflare-estate/lyrics/index.html
          grep -Fq 'data-jm-estate-integration="v1"' cloudflare-estate/recovery/index.html
          grep -Fq 'JM Theory Multihub v0.20.1' cloudflare-estate/theory/index.html
          ! grep -Fq 'JM Theory Multihub v0.4 — Touch Repair' cloudflare-estate/theory/index.html
          grep -Fq 'Games&Beyond' cloudflare-estate/games-beyond/index.html

          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cloudflare-estate/navigator/estate-integration/public-registry.json').read_text())
          assert r['schema']=='JM.Estate.PublicNervousSystem/1'
          assert r['canonical_root']=='https://jmisjustme-estate.pages.dev/'
          p=r['privacy_boundary']
          assert p['contains_private_owner_data'] is False
          assert p['contains_owner_write_endpoint'] is False
          assert p['contains_mutable_owner_state'] is False
          print('Assembled integration registry boundary PASS')
          PY

      - name: Deploy deterministic Estate to the existing canonical Cloudflare project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove canonical Estate source and shared nervous system
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base='https://jmisjustme-estate.pages.dev';
          const checks=[
            ['/', 'JMISJUSTME'],
            ['/navigator/', 'JM3232 NAVIGATOR'],
            ['/navigator/stringline.json', 'estate-sovereign-integration'],
            ['/navigator/estate-integration/', 'One Estate.'],
            ['/navigator/estate-integration/public-registry.json', 'JM.Estate.PublicNervousSystem/1'],
            ['/apps/', 'data-jm-estate-integration="v1"'],
            ['/theory/', 'JM Theory Multihub v0.20.1'],
            ['/lyrics/', 'data-jm-estate-integration="v1"'],
            ['/recovery/', 'data-jm-estate-integration="v1"'],
            ['/games-beyond/', 'Games&Beyond'],
          ];
          let pending=checks.slice();
          for(let attempt=1;attempt<=60 && pending.length;attempt++){
            const next=[];
            for(const [path,needle] of pending){
              try{
                const r=await fetch(base+path+'?sovereign-proof='+process.env.GITHUB_RUN_ID+'-'+attempt,{headers:{'cache-control':'no-cache','user-agent':'JM-Sovereign-Integrated-Deploy/1'}});
                const text=await r.text();
                if(r.ok&&text.includes(needle)){console.log('LIVE PASS',path,r.status,needle)}
                else {console.log('WAIT',path,r.status,'needle',text.includes(needle));next.push([path,needle])}
              }catch(e){console.log('WAIT',path,String(e?.message||e));next.push([path,needle])}
            }
            pending=next;
            if(pending.length) await new Promise(r=>setTimeout(r,3000));
          }
          if(pending.length) throw new Error('Canonical Estate live proof failed: '+pending.map(x=>x[0]).join(', '));
          NODE

      - name: Deploy the integrated five-tool Navigator public MCP after Estate proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund wrangler@4
          rm -rf "$RUNNER_TEMP/nav-public-mcp"
          mkdir -p "$RUNNER_TEMP/nav-public-mcp/privacy" "$RUNNER_TEMP/nav-public-mcp/support"
          cp navigator/mcp-public-v1/worker.mjs "$RUNNER_TEMP/nav-public-mcp/_worker.js"
          cp navigator/mcp-public-v1/index.html "$RUNNER_TEMP/nav-public-mcp/index.html"
          cp navigator/mcp-public-v1/privacy/index.html "$RUNNER_TEMP/nav-public-mcp/privacy/index.html"
          cp navigator/mcp-public-v1/support/index.html "$RUNNER_TEMP/nav-public-mcp/support/index.html"
          node --check "$RUNNER_TEMP/nav-public-mcp/_worker.js"
          npx wrangler pages deploy "$RUNNER_TEMP/nav-public-mcp" \
            --project-name=jm-inline-contact-probe \
            --branch=navigator-plugin-public \
            --commit-dirty=true

      - name: Prove live Navigator MCP consumes canonical Estate registry
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base='https://navigator-plugin-public.jm-inline-contact-probe.pages.dev';
          async function rpc(id,method,params={}){
            const r=await fetch(base+'/mcp',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id,method,params})});
            const j=await r.json(); return {r,j};
          }
          let passed=false, last='';
          for(let attempt=1;attempt<=50;attempt++){
            try{
              const h=await fetch(base+'/health?proof='+Date.now()); const hj=await h.json();
              let x=await rpc(1,'tools/list');
              if(!h.ok||hj.version!=='0.2.0-estate-integration.1'||x.j?.result?.tools?.length!==5) throw new Error('health/tool boundary not ready');
              x=await rpc(2,'tools/call',{name:'navigator_bridge_status',arguments:{}});
              const s=x.j?.result?.structuredContent;
              if(!x.r.ok||s?.estate_integration?.state!=='CONNECTED'||s?.estate_integration?.private_owner_write_published!==false) throw new Error('Estate registry not connected');
              const text=JSON.stringify({h:hj,s});
              for(const forbidden of ['receipt_chain_head','registered_bodies','stringmarks','navigator-live-contact.jm-inline-contact-probe.pages.dev']) if(text.includes(forbidden)) throw new Error('owner detail leak: '+forbidden);
              x=await rpc(3,'tools/call',{name:'navigator_create_stringreceipt',arguments:{}});
              if(x.r.ok||!x.j?.error) throw new Error('public write tool exposed');
              console.log('LIVE NAVIGATOR MCP PASS: five read-only tools, Estate registry CONNECTED, owner write rejected.');
              passed=true; break;
            }catch(e){last=String(e?.message||e); console.log('WAIT MCP',attempt,last); await new Promise(r=>setTimeout(r,3000));}
          }
          if(!passed) throw new Error('Navigator MCP live proof failed: '+last);
          NODE

      - name: Write live integration proof artifact
        shell: bash
        run: |
          set -euo pipefail
          node governance/estate-integration/probe_live_integration_v1.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: estate-sovereign-integrated-live-proof-v1
          path: ESTATE_SOVEREIGN_INTEGRATION_LIVE_PROOF_v1.json
          if-no-files-found: error
          retention-days: 30
