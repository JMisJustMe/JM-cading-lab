name: Deploy JM Web Estate to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jm-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JM Estate
        uses: actions/checkout@v4

      - name: Run JM Multi-Carrier Registry
        run: python tools/jm_carrier_registry.py --registry carrier-control/registry.json

      - name: Verify Estate carrier registry DING
        shell: python
        run: |
          import json
          from pathlib import Path
          receipt = json.loads(Path('_carrier_outputs/JM-CARRIER-REGISTRY-RECEIPT.json').read_text())
          if receipt['status'] != 'DING':
              raise SystemExit('JM carrier registry HOLD')
          if receipt['enabled_plans'] < 1:
              raise SystemExit('JM carrier registry HOLD: no enabled plans')
          for item in receipt['results']:
              if item['status'] != 'DING':
                  raise SystemExit(f"JM carrier HOLD: {item['id']}")
              direct = item.get('direct_https') or {}
              if direct and direct.get('runtime_reconstruction') is not False:
                  raise SystemExit(f"JM direct-launch HOLD: {item['id']} runtime reconstruction returned")
          print(f"JM CARRIER REGISTRY DING: {receipt['enabled_plans']} verified body plan(s)")

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy JM Web Estate
        id: deployment
        uses: actions/deploy-pages@v4

  prove-theory-factory:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 6
    steps:
      - name: Prove exact manufactured Theory carrier after Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          base='https://jmisjustme.github.io/JM-cading-lab'
          html='/theory/publications/jm-theory-estate-public-safe-v1/index.html'
          md='/theory/publications/jm-theory-estate-public-safe-v1/JM_THEORY_ESTATE_PUBLIC_SAFE_EDITION_v1_0.md'
          passed=0
          for attempt in $(seq 1 60); do
            curl -fsSL -H 'Cache-Control: no-cache' "$base$html?pages-factory-proof=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/theory.html" || true
            curl -fsSL -H 'Cache-Control: no-cache' "$base$md?pages-factory-proof=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/theory.md" || true
            hs="$(sha256sum "$RUNNER_TEMP/theory.html" 2>/dev/null | awk '{print $1}' || true)"
            ms="$(sha256sum "$RUNNER_TEMP/theory.md" 2>/dev/null | awk '{print $1}' || true)"
            hb="$(wc -c < "$RUNNER_TEMP/theory.html" 2>/dev/null | tr -d ' ' || true)"
            mb="$(wc -c < "$RUNNER_TEMP/theory.md" 2>/dev/null | tr -d ' ' || true)"
            if [ "$hs" = '6af903409d97e853ae77519d672fac32fe9fb5384774a7f1c113c9c501a4b8b8' ] \
              && [ "$ms" = '2f42acf027db5847e1cc4ebeebf2b23281381f3f07871da8358bffb88b3001ea' ] \
              && [ "$hb" = '10940' ] && [ "$mb" = '10632' ] \
              && grep -Fq 'LITERATURE CONTACT COMPLETE ≠ EMPIRICAL VALIDATION COMPLETE.' "$RUNNER_TEMP/theory.html" \
              && grep -Fq 'BODY ≠ CARRIER. CARRIER ≠ NEW CREATION.' "$RUNNER_TEMP/theory.html" \
              && grep -Fq 'Empirical validation transferred:** **NO' "$RUNNER_TEMP/theory.md"; then
              echo "THEORY FACTORY GITHUB PAGES EXACT LIVE PASS"
              passed=1
              break
            fi
            sleep 3
          done
          test "$passed" = '1'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt={
            "schema":"JM.TheoryEstate.GitHubPagesExactPublicProof/1",
            "state":"PASS_EXACT_PUBLIC_BYTES_AFTER_DEPLOY",
            "source_commit":os.environ.get("GITHUB_SHA"),
            "workflow_run":os.environ.get("GITHUB_RUN_ID"),
            "host":"https://jmisjustme.github.io/JM-cading-lab",
            "html":{"bytes":10940,"sha256":"6af903409d97e853ae77519d672fac32fe9fb5384774a7f1c113c9c501a4b8b8"},
            "markdown":{"bytes":10632,"sha256":"2f42acf027db5847e1cc4ebeebf2b23281381f3f07871da8358bffb88b3001ea"},
            "boundary":"Exact public carrier delivery only; no empirical, peer-review, replication, market or owner-device proof transfer."
          }
          Path("JM_THEORY_ESTATE_GITHUB_PAGES_EXACT_PUBLIC_PROOF.json").write_text(json.dumps(receipt,indent=2)+"\n",encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: JM_THEORY_ESTATE_GITHUB_PAGES_EXACT_PUBLIC_PROOF
          path: JM_THEORY_ESTATE_GITHUB_PAGES_EXACT_PUBLIC_PROOF.json
          if-no-files-found: error
