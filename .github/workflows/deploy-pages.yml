name: Deploy JM Web Estate to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "jm-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JM Estate
        uses: actions/checkout@v4

      - name: Run JM Multi-Carrier Control Organ
        run: python tools/jm_carrier_control.py --plan beatbody/carrier-plan.json

      - name: Verify direct-launch floor
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('_carrier_outputs/beatbody/JM-BEATBODY-STUDIO-v2.5.2-CARRIER-RECEIPT.json').read_text())
          if receipt['status'] != 'DING':
              raise SystemExit('BeatBody carrier HOLD: receipt is not DING')
          direct = Path('beatbody/index.html')
          got = hashlib.sha256(direct.read_bytes()).hexdigest()
          expected = 'f076ef88eb971022418ce0be483f7586c868c5daa698bdab0f3013f961c3f1ad'
          if got != expected:
              raise SystemExit(f'BeatBody direct-launch HOLD: {got} != {expected}')
          if receipt['outputs']['direct_https']['runtime_reconstruction'] is not False:
              raise SystemExit('BeatBody direct-launch HOLD: runtime reconstruction returned')
          if not Path('_carrier_outputs/beatbody/JM-BEATBODY-STUDIO-v2.5.2-portable.html').exists():
              raise SystemExit('BeatBody portable carrier HOLD')
          print('JM Multi-Carrier DING: direct HTTPS + PWA enhancement + portable carrier verified')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy JM Web Estate
        id: deployment
        uses: actions/deploy-pages@v4
