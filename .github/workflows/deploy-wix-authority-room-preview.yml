name: Deploy Wix Authority Room Preview

on:
  push:
    branches:
      - jm-proposal/wix-v2-authority-rebuild
    paths:
      - ".github/workflows/deploy-wix-authority-room-preview.yml"
      - "governance/wix-rebuilds/jm-estate-v2-authority-rebuild/JM_WIX_AUTHORITY_ROOM_v0_1.html"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: wix-authority-room-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Prove and deploy isolated phone-test preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BODY: governance/wix-rebuilds/jm-estate-v2-authority-rebuild/JM_WIX_AUTHORITY_ROOM_v0_1.html
      EXPECTED_SIZE: "21941"
      EXPECTED_SHA256: aeae292bf1ae8f4164cd7b2b1f16938f8c144c8415855c0c918a873b09a5a062
      PREVIEW_URL: https://wix-authority-room-preview.jmisjustme-estate.pages.dev

    steps:
      - name: Check out Wix proposal branch
        uses: actions/checkout@v6
        with:
          ref: jm-proposal/wix-v2-authority-rebuild
          fetch-depth: 0

      - name: Verify exact proved room body
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BODY"
          actual_size="$(wc -c < "$BODY" | tr -d ' ')"
          actual_sha="$(sha256sum "$BODY" | awk '{print $1}')"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA256"
          grep -Fq 'OPEN FIRST' "$BODY"
          grep -Fq 'OWNER / RETURN' "$BODY"
          grep -Fq 'No publication and no JM Ding' "$BODY"
          echo "PASS exact body size $actual_size"
          echo "PASS exact body SHA-256 $actual_sha"

      - name: Prepare isolated preview package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wix-authority-preview
          mkdir -p .wix-authority-preview
          cp "$BODY" .wix-authority-preview/index.html
          cat > .wix-authority-preview/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
            Cache-Control: no-store
            Referrer-Policy: no-referrer
          EOF

      - name: Deploy Cloudflare Pages preview branch
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .wix-authority-preview --project-name=jmisjustme-estate --branch=wix-authority-room-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify stable preview contact
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 20 "$PREVIEW_URL" -o /tmp/preview.html; then
              if grep -Fq 'JMISJUSTME Living Estate' /tmp/preview.html \
                && grep -Fq 'OPEN FIRST' /tmp/preview.html \
                && grep -Fq 'No publication and no JM Ding' /tmp/preview.html; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" = 1
          live_sha="$(sha256sum /tmp/preview.html | awk '{print $1}')"
          test "$live_sha" = "$EXPECTED_SHA256"
          headers="$(curl -fsSI --max-time 20 "$PREVIEW_URL")"
          printf '%s\n' "$headers" | grep -qi 'x-robots-tag: noindex, nofollow, noarchive'
          echo "PASS live preview SHA-256 $live_sha"
          echo "PASS preview noindex boundary"

      - name: Seal preview receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, os

          root = Path('governance/wix-rebuilds/jm-estate-v2-authority-rebuild')
          body = root / 'JM_WIX_AUTHORITY_ROOM_v0_1.html'
          raw = body.read_bytes()
          receipt = {
              'schema': 'JM.WixAuthorityRoomCloudflarePreviewReceipt/0.1',
              'recorded_utc': datetime.now(timezone.utc).isoformat(),
              'authority': 'Theodore Benjamin Scott / JM / JMISJUSTME',
              'source_commit': os.environ.get('GITHUB_SHA'),
              'wix_site_id': '7724b482-0a61-41bb-8d78-cb6587d6e3e7',
              'wix_rebuild_branch_id': 'ec3edba7-2e32-4a4b-8359-637e5fa2c789',
              'wix_branch_revision_checked': '1',
              'cloudflare_project': 'jmisjustme-estate',
              'cloudflare_branch': 'wix-authority-room-preview',
              'preview_url': os.environ['PREVIEW_URL'],
              'prototype_size_bytes': len(raw),
              'prototype_sha256': hashlib.sha256(raw).hexdigest(),
              'checks': {
                  'exact_source_body': 'PASS',
                  'cloudflare_preview_deployment': 'PASS',
                  'live_marker_contact': 'PASS',
                  'live_sha256_match': 'PASS',
                  'noindex_nofollow_header': 'PASS',
                  'production_branch_untouched': 'PASS',
                  'wix_live_branch_untouched': 'PASS'
              },
              'state': 'ISOLATED_LIVE_PHONE_PREVIEW_READY_FOR_JM_PHYSICAL_CONTACT',
              'production': False,
              'wix_published': False,
              'physical_device_tested': False,
              'ding': False,
              'boundary': 'This is a non-production Cloudflare Pages branch preview of the exact validated Wix authority-room prototype. It is not the published Wix site, not the Cloudflare production branch, and not JM physical acceptance or Ding.'
          }
          (root / 'JM_WIX_AUTHORITY_ROOM_CLOUDFLARE_PREVIEW_RECEIPT_v0_1.json').write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit preview receipt to proposal branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JM Wix Preview Proof Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add governance/wix-rebuilds/jm-estate-v2-authority-rebuild/JM_WIX_AUTHORITY_ROOM_CLOUDFLARE_PREVIEW_RECEIPT_v0_1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Seal Wix authority room Cloudflare preview receipt [skip ci]'
          git pull --rebase origin jm-proposal/wix-v2-authority-rebuild
          git push origin HEAD:jm-proposal/wix-v2-authority-rebuild
