name: Diagnose Theory Runtime Carriers Wave 01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-theory-runtime-carriers-wave01.yml"
      - "governance/diagnose_theory_runtime_carriers.py"
      - "governance/diagnose_theory_runtime_carriers_v2.py"
      - "governance/recover_theory_runtime_ancestors_wave01.py"
      - "governance/recover_theory_runtime_ancestors_wave01_v2.py"
      - "governance/diagnose_theory_fault_cluster_wave01.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out all Theory authority refs
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch every branch and tag for ancestor scan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - name: Run byte-level carrier diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile governance/diagnose_theory_runtime_carriers.py
          python3 -m py_compile governance/diagnose_theory_runtime_carriers_v2.py
          python3 -m py_compile governance/recover_theory_runtime_ancestors_wave01.py
          python3 -m py_compile governance/recover_theory_runtime_ancestors_wave01_v2.py
          python3 -m py_compile governance/diagnose_theory_fault_cluster_wave01.py
          python3 governance/diagnose_theory_runtime_carriers_v2.py
          python3 governance/recover_theory_runtime_ancestors_wave01_v2.py
          python3 governance/diagnose_theory_fault_cluster_wave01.py
          test -s registry/theory-runtime-carrier-diagnostic-wave01.json
          test -s registry/theory-runtime-ancestor-recovery-wave01.json
          test -s registry/theory-fault-cluster-diagnostic-wave01.json

      - name: Seal diagnostic receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JM Theory Runtime Diagnostic Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/theory-runtime-carrier-diagnostic-wave01.json
          git add registry/theory-runtime-ancestor-recovery-wave01.json
          git add registry/theory-fault-cluster-diagnostic-wave01.json
          if ! git diff --cached --quiet; then
            git commit -m 'Seal exact Theory fault-cluster diagnostic Wave 01 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
