name: JM Estate Librarian v0.4 — expand source and build APK

on:
  push:
    branches:
      - agent/estate-librarian-v0-4
    paths:
      - "tools/estate-librarian/bootstrap/**"
      - ".github/workflows/estate-librarian-v0-4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estate-librarian-v0-4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reassemble and verify the exact source package
        shell: bash
        run: |
          set -euo pipefail
          cat tools/estate-librarian/bootstrap/source.b64.part* \
            | tr -d '[:space:]' > /tmp/estate-librarian-source.b64
          base64 --decode /tmp/estate-librarian-source.b64 \
            > /tmp/JM_ESTATE_LIBRARIAN_v0_4_SOURCE_BOOTSTRAP.zip
          echo "63f501f5e48fb5834d9bd0e7eaf18a0a542b0385d3c6ab0758f92a49f5be87f6  /tmp/JM_ESTATE_LIBRARIAN_v0_4_SOURCE_BOOTSTRAP.zip" \
            | sha256sum -c -

      - name: Expand the readable project body
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/estate-librarian-expanded
          mkdir -p /tmp/estate-librarian-expanded
          unzip -q /tmp/JM_ESTATE_LIBRARIAN_v0_4_SOURCE_BOOTSTRAP.zip \
            -d /tmp/estate-librarian-expanded
          cp -a /tmp/estate-librarian-expanded/. tools/estate-librarian/
          test -f tools/estate-librarian/OPEN_FIRST_JM_ESTATE_LIBRARIAN_v0_4.html
          test -f tools/estate-librarian/android/app/src/main/java/com/jmestate/librarian/MainActivity.java
          test -f tools/estate-librarian/receipts/QA_RESULTS_v0_4.json
          python3 -m json.tool tools/estate-librarian/PACKAGE_MANIFEST.json >/dev/null
          python3 -m json.tool tools/estate-librarian/receipts/BUILD_RECEIPT_v0_4.json >/dev/null
          python3 -m json.tool tools/estate-librarian/receipts/QA_RESULTS_v0_4.json >/dev/null

      - name: Commit the expanded source body to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/estate-librarian
          if ! git diff --cached --quiet; then
            git commit -m "Expand JM Estate Librarian v0.4 source body"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: tools/estate-librarian/android
        run: gradle --no-daemon assembleDebug

      - name: Create APK receipt and source carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/estate-librarian-delivery
          cp tools/estate-librarian/android/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk
          sha256sum /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk \
            > /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256
          {
            echo "JM Estate Librarian v0.4 — GitHub Actions APK receipt"
            echo "Head SHA: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Build: PASS — debug APK compiled"
            echo "Physical Android install: PENDING user device proof"
          } > /tmp/estate-librarian-delivery/GITHUB_ACTIONS_APK_RECEIPT.txt
          cd tools/estate-librarian
          zip -qr /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4_GITHUB_SOURCE.zip . \
            -x "bootstrap/*" ".git/*" "android/.gradle/*" "android/app/build/*" "releases/*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM_ESTATE_LIBRARIAN_v0_4_APK
          path: |
            /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk
            /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256
            /tmp/estate-librarian-delivery/GITHUB_ACTIONS_APK_RECEIPT.txt
          if-no-files-found: error

      - name: Upload GitHub source artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM_ESTATE_LIBRARIAN_v0_4_SOURCE
          path: /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4_GITHUB_SOURCE.zip
          if-no-files-found: error

      - name: Publish the successful APK receipt to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${{ github.ref_name }}"
          mkdir -p tools/estate-librarian/receipts tools/estate-librarian/releases
          cp /tmp/estate-librarian-delivery/GITHUB_ACTIONS_APK_RECEIPT.txt \
            tools/estate-librarian/receipts/GITHUB_ACTIONS_APK_RECEIPT.txt
          cp /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256 \
            tools/estate-librarian/releases/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256
          git add \
            tools/estate-librarian/receipts/GITHUB_ACTIONS_APK_RECEIPT.txt \
            tools/estate-librarian/releases/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Record JM Estate Librarian v0.4 APK build receipt"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish runner status even if an earlier gate fails
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
          mkdir -p tools/estate-librarian/receipts tools/estate-librarian/releases
          {
            echo "JM Estate Librarian v0.4 — GitHub Actions runner status"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Job status before TraceBox receipt: ${{ job.status }}"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
          } > tools/estate-librarian/receipts/GITHUB_ACTIONS_RUNNER_STATUS.txt
          if [ -f /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256 ]; then
            cp /tmp/estate-librarian-delivery/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256 \
              tools/estate-librarian/releases/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256
          fi
          git add \
            tools/estate-librarian/receipts/GITHUB_ACTIONS_RUNNER_STATUS.txt \
            tools/estate-librarian/releases/JM_ESTATE_LIBRARIAN_v0_4.apk.sha256 2>/dev/null
          if ! git diff --cached --quiet; then
            git commit -m "Record JM Estate Librarian v0.4 Actions status"
            git push origin HEAD:${{ github.ref_name }}
          fi
