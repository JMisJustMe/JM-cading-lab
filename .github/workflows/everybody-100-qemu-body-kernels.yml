name: JM 100 QEMU Body Kernels

on:
  push:
    branches:
      - agent/everybody-full-stack-parity-v0-1
    paths:
      - 'coding-estate/everybody/body-registry*.json'
      - 'coding-estate/everybody/semantic-depth/**'
      - '.github/workflows/everybody-100-qemu-body-kernels.yml'
  pull_request:
    paths:
      - 'coding-estate/everybody/body-registry*.json'
      - 'coding-estate/everybody/semantic-depth/**'
      - '.github/workflows/everybody-100-qemu-body-kernels.yml'
  workflow_dispatch:

jobs:
  qemu-100:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QEMU and bootable-container carriers
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools dosfstools
      - name: Test semantic depth and 100 distinct kernel images
        run: python -m unittest discover -s coding-estate/everybody/semantic-depth/tests -v
      - name: Generate all 100 semantic-depth isolated runtimes
        run: |
          python coding-estate/everybody/semantic-depth/tools/semantic_depth_factory.py \
            --repo . --out dist/semantic-depth --deterministic
      - name: Build and boot all 100 separate kernels
        run: |
          python coding-estate/everybody/semantic-depth/tools/qemu_kernel_factory.py \
            --repo . --out dist/qemu-100
      - name: Verify all machine receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/qemu-100')
          m=json.loads((root/'QEMU_100_BODY_KERNEL_MANIFEST.json').read_text())
          assert m['body_count']==100
          assert m['unique_kernel_hashes']==100
          assert m['unique_compiler_namespaces']==100
          assert m['all_qemu_passed'] is True
          assert m['status']=='QEMU_100_BODY_KERNEL_CARRIER_PASS_NOT_NATIVE_TOOLCHAIN_CROWN'
          assert len(list(root.glob('*/kernel.elf')))==100
          assert len(list(root.glob('*/qemu.log')))==100
          assert len(list(root.glob('*/MACHINE_RECEIPT.json')))==100
          assert all(item['status']=='QEMU_BODY_KERNEL_CARRIER_PASS' for item in m['receipts'])
          print('JM_100_QEMU_BODY_KERNELS_GATE_PASS')
          PY
      - name: Build OneContainer above the 100 proven kernels
        run: |
          python coding-estate/everybody/semantic-depth/tools/onecontainer_factory.py \
            --qemu-root dist/qemu-100 --out dist/onecontainer
      - name: Verify 100 selections and 99 identity-preserving handoffs
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path('dist/onecontainer')
          m=json.loads((root/'ONECONTAINER_MANIFEST.json').read_text())
          assert m['body_count']==100
          assert m['unique_kernel_hashes']==100
          assert m['unique_namespaces']==100
          assert m['selection_count']==100
          assert m['handoff_count']==99
          assert m['all_selection_passed'] is True
          assert m['all_handoffs_preserve_identity'] is True
          registry=json.loads((root/'REGISTRY.json').read_text())
          for item in registry['bodies']:
            result=subprocess.run([sys.executable,str(root/'select.py'),'--root',str(root),'--body',item['body_id']],capture_output=True,text=True)
            assert result.returncode==0,(item['body_id'],result.stderr,result.stdout)
            selected=json.loads(result.stdout)
            assert selected['kernel_sha256']==item['kernel_sha256']
          print('JM_EVERYKERNEL_ONECONTAINER_SELECTION_HANDOFF_GATE_PASS')
          PY
      - name: Build one ISO and machine-boot all 100 GRUB entries
        run: |
          python coding-estate/everybody/semantic-depth/tools/bootable_onecontainer_factory.py \
            --onecontainer-root dist/onecontainer --out dist/bootable-onecontainer
      - name: Verify all 100 OneContainer ISO machine selections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/bootable-onecontainer')
          r=json.loads((root/'BOOTABLE_ONECONTAINER_RECEIPT.json').read_text())
          assert r['body_count']==100
          assert r['menu_entry_count']==100
          assert r['machine_selection_count']==100
          assert r['all_menu_entries_machine_booted'] is True
          assert r['all_kernel_hashes_verified'] is True
          assert r['all_kernels_multiboot_validated'] is True
          assert r['status']=='BOOTABLE_ONECONTAINER_ISO_ALL_100_MENU_MACHINE_SELECTIONS_PASS'
          assert len(r['machine_selections'])==100
          assert len(list((root/'selection-logs').glob('*.log')))==100
          assert (root/r['iso_path']).is_file()
          print('JM_BOOTABLE_ONECONTAINER_ALL_100_GRUB_MACHINE_SELECTIONS_PASS')
          PY
      - name: Freeze current constructible completion scope
        run: |
          python coding-estate/everybody/semantic-depth/tools/completion_freeze_factory.py \
            --semantic-root dist/semantic-depth \
            --qemu-root dist/qemu-100 \
            --container-root dist/onecontainer \
            --bootable-root dist/bootable-onecontainer \
            --out dist/current-scope-freeze
      - name: Verify freeze boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('dist/current-scope-freeze/CURRENT_SCOPE_FREEZE_RECEIPT.json').read_text())
          assert f['body_count']==100
          assert f['grub_machine_selection_count']==100
          assert f['all_current_constructible_gates_passed'] is True
          assert f['unique_semantic_signatures']==100
          assert f['unique_kernel_hashes']==100
          assert f['unique_compiler_namespaces']==100
          assert f['final_crown'] is False
          assert f['status']=='CURRENT_CONSTRUCTIBLE_SCOPE_FROZEN_EXTERNAL_AUTHORITY_GATES_OPEN'
          assert all(len(item['earned'])==11 for item in f['bodies'])
          assert all(len(item['open_external_or_authority_gates'])==6 for item in f['bodies'])
          print('JM_100_CURRENT_CONSTRUCTIBLE_SCOPE_FREEZE_PASS')
          PY
      - name: Seal machine, container and freeze artifacts
        run: |
          tar -czf JM_100_QEMU_BODY_KERNELS_v0.3.0.tar.gz -C dist qemu-100
          tar -czf JM_100_SEMANTIC_DEPTH_v0.2.1.tar.gz -C dist semantic-depth
          sha256sum JM_100_QEMU_BODY_KERNELS_v0.3.0.tar.gz | tee JM_100_QEMU_BODY_KERNELS_v0.3.0.sha256
          sha256sum JM_100_SEMANTIC_DEPTH_v0.2.1.tar.gz | tee JM_100_SEMANTIC_DEPTH_v0.2.1.sha256
          sha256sum dist/JM_EVERYKERNEL_ONECONTAINER_v0.4.0.tar | tee JM_EVERYKERNEL_ONECONTAINER_v0.4.0.sha256
          sha256sum dist/bootable-onecontainer/JM_EVERYKERNEL_ONECONTAINER_v0.5.1.iso | tee JM_EVERYKERNEL_ONECONTAINER_v0.5.1.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: JM_100_CURRENT_SCOPE_FREEZE_v1.2
          path: |
            JM_100_QEMU_BODY_KERNELS_v0.3.0.tar.gz
            JM_100_QEMU_BODY_KERNELS_v0.3.0.sha256
            JM_100_SEMANTIC_DEPTH_v0.2.1.tar.gz
            JM_100_SEMANTIC_DEPTH_v0.2.1.sha256
            dist/qemu-100/QEMU_100_BODY_KERNEL_MANIFEST.json
            dist/semantic-depth/SEMANTIC_DEPTH_MANIFEST.json
            dist/JM_EVERYKERNEL_ONECONTAINER_v0.4.0.tar
            JM_EVERYKERNEL_ONECONTAINER_v0.4.0.sha256
            dist/onecontainer/ONECONTAINER_MANIFEST.json
            dist/onecontainer/REGISTRY.json
            dist/onecontainer/HANDOFFS.json
            dist/bootable-onecontainer/JM_EVERYKERNEL_ONECONTAINER_v0.5.1.iso
            JM_EVERYKERNEL_ONECONTAINER_v0.5.1.iso.sha256
            dist/bootable-onecontainer/JM_ONECONTAINER_SELECTOR.img
            dist/bootable-onecontainer/BOOTABLE_ONECONTAINER_RECEIPT.json
            dist/bootable-onecontainer/selection-logs/*.log
            dist/current-scope-freeze/CURRENT_SCOPE_FREEZE_RECEIPT.json
            dist/current-scope-freeze/COMPLETION_BOUNDARY.md
