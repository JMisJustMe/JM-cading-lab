name: JM 100 Sovereign Android Lifecycle Endurance
run-name: "Crown32 Android lifecycle v0.8 @ ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/crown32-android-lifecycle-v0-8
    paths:
      - coding-estate/everybody/full-stack/ANDROID_V0_5_RUNTIME_SOURCE_LOCK.json
      - coding-estate/everybody/full-stack/ANDROID_V0_7_API24_RUNTIME_LOCK.json
      - coding-estate/everybody/full-stack/tools/android_runtime_source.py
      - coding-estate/everybody/full-stack/tools/android_emulator_boot.sh
      - coding-estate/everybody/full-stack/tools/android_emulator_runtime.py
      - coding-estate/everybody/full-stack/tools/android_api_floor_runtime.py
      - coding-estate/everybody/full-stack/tools/android_lifecycle_endurance.py
      - coding-estate/everybody/full-stack/tools/android_lifecycle_aggregate.py
      - coding-estate/everybody/full-stack/tests/test_android_lifecycle_endurance.py
      - .github/workflows/everybody-android-lifecycle-endurance.yml
  pull_request:
    paths:
      - coding-estate/everybody/full-stack/ANDROID_V0_5_RUNTIME_SOURCE_LOCK.json
      - coding-estate/everybody/full-stack/ANDROID_V0_7_API24_RUNTIME_LOCK.json
      - coding-estate/everybody/full-stack/tools/android_runtime_source.py
      - coding-estate/everybody/full-stack/tools/android_emulator_boot.sh
      - coding-estate/everybody/full-stack/tools/android_emulator_runtime.py
      - coding-estate/everybody/full-stack/tools/android_api_floor_runtime.py
      - coding-estate/everybody/full-stack/tools/android_lifecycle_endurance.py
      - coding-estate/everybody/full-stack/tools/android_lifecycle_aggregate.py
      - coding-estate/everybody/full-stack/tests/test_android_lifecycle_endurance.py
      - .github/workflows/everybody-android-lifecycle-endurance.yml

concurrency:
  group: jm-everybody-android-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  JM_RUNTIME_LOCK: coding-estate/everybody/full-stack/ANDROID_V0_5_RUNTIME_SOURCE_LOCK.json
  JM_API24_LOCK: coding-estate/everybody/full-stack/ANDROID_V0_7_API24_RUNTIME_LOCK.json
  JM_SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
  JM_EXPECTED_API: "35"

jobs:
  lifecycle-receipt-proof:
    name: Lifecycle route, memory and federation proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact lifecycle branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify inherited API 24 lock remains intact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("coding-estate/everybody/full-stack/ANDROID_V0_7_API24_RUNTIME_LOCK.json").read_text(encoding="utf-8"))
          assert lock["status"] == "ANDROID_API24_MINIMUM_FLOOR_FEDERATION_LOCKED"
          assert lock["runtime_api"] == 24
          assert lock["body_count"] == 100
          assert lock["runtime_fault_free_proofs"] == 100
          print("API 24 minimum-floor federation lock preserved beneath lifecycle endurance")
          PY
      - name: Prove lifecycle memory parser and 100-body federation contracts
        run: python coding-estate/everybody/full-stack/tests/test_android_lifecycle_endurance.py

  cading-lifecycle-smoke:
    name: Cading repeated lifecycle and recovery smoke
    needs: lifecycle-receipt-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      JM_AVD_NAME: jm_cading_lifecycle_api35
      JM_EMULATOR_LOG: build/cading-lifecycle-emulator.log
      JM_EMULATOR_PID: build/cading-lifecycle-emulator.pid
    steps:
      - name: Check out exact lifecycle branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install API 35 lifecycle emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "$JM_SYSTEM_IMAGE"
          test -x "$ANDROID_HOME/emulator/emulator"
          sdkmanager --list_installed | grep -F "$JM_SYSTEM_IMAGE"
      - name: Recover exact provenance-sealed v0.5 APK estate
        run: |
          python coding-estate/everybody/full-stack/tools/android_runtime_source.py \
            --lock "$JM_RUNTIME_LOCK" \
            --out build/runtime-source
      - name: Boot proven API 35 Android emulator route
        run: bash coding-estate/everybody/full-stack/tools/android_emulator_boot.sh
      - name: Prove Cading repeated lifecycle and recovery route
        run: |
          python coding-estate/everybody/full-stack/tools/android_lifecycle_endurance.py \
            --delivery build/runtime-source/delivery \
            --out build/lifecycle-smoke \
            --adb "$(command -v adb)" \
            --expected-api 35 \
            --body-id cading
      - name: Upload Cading lifecycle smoke receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JM_ANDROID_CADING_LIFECYCLE_SMOKE_v0.8
          path: |
            build/lifecycle-smoke/**
            build/runtime-source/SOURCE_RECOVERY_RECEIPT.json
            build/cading-lifecycle-emulator.log
            build/cading-lifecycle-emulator.pid
          if-no-files-found: warn

  android-lifecycle-shards:
    name: Android lifecycle shard ${{ matrix.shard }} of 5
    needs: cading-lifecycle-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      GH_TOKEN: ${{ github.token }}
      JM_AVD_NAME: jm_lifecycle_api35_${{ matrix.shard }}
      JM_EMULATOR_LOG: build/lifecycle-emulator-${{ matrix.shard }}.log
      JM_EMULATOR_PID: build/lifecycle-emulator-${{ matrix.shard }}.pid
    steps:
      - name: Check out exact lifecycle branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install API 35 lifecycle emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "$JM_SYSTEM_IMAGE"
          test -x "$ANDROID_HOME/emulator/emulator"
          sdkmanager --list_installed | grep -F "$JM_SYSTEM_IMAGE"
      - name: Recover exact provenance-sealed v0.5 APK estate
        run: |
          python coding-estate/everybody/full-stack/tools/android_runtime_source.py \
            --lock "$JM_RUNTIME_LOCK" \
            --out build/runtime-source
      - name: Boot proven API 35 Android emulator route
        run: bash coding-estate/everybody/full-stack/tools/android_emulator_boot.sh
      - name: Prove 20 repeated lifecycle and recovery routes
        run: |
          python coding-estate/everybody/full-stack/tools/android_lifecycle_endurance.py \
            --delivery build/runtime-source/delivery \
            --out build/lifecycle-shard-${{ matrix.shard }}-of-5 \
            --adb "$(command -v adb)" \
            --expected-api 35 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 5
      - name: Upload lifecycle body receipts and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JM_ANDROID_LIFECYCLE_SHARD_${{ matrix.shard }}_OF_5_v0.8
          path: |
            build/lifecycle-shard-${{ matrix.shard }}-of-5/**
            build/runtime-source/SOURCE_RECOVERY_RECEIPT.json
            build/lifecycle-emulator-${{ matrix.shard }}.log
            build/lifecycle-emulator-${{ matrix.shard }}.pid
          if-no-files-found: error

  android-lifecycle-federation:
    name: Seal 100-body Android lifecycle endurance federation
    needs: android-lifecycle-shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out lifecycle aggregator
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all five lifecycle shard estates
        uses: actions/download-artifact@v4
        with:
          pattern: JM_ANDROID_LIFECYCLE_SHARD_*_OF_5_v0.8
          path: build/lifecycle-shards
          merge-multiple: false
      - name: Verify and federate all 100 lifecycle receipts
        run: |
          python coding-estate/everybody/full-stack/tools/android_lifecycle_aggregate.py \
            --source build/lifecycle-shards \
            --out build/lifecycle-master \
            --expected-api 35 \
            --expected-bodies 100 \
            --expected-shards 5 \
            --launches-per-body 8 \
            --rotations-per-body 2 \
            --force-cycles-per-body 3
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("build/lifecycle-master/JM_ANDROID_100_LIFECYCLE_ENDURANCE_RECEIPT.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "ANDROID_100_LIFECYCLE_ENDURANCE_AND_RECOVERY_FEDERATION_PASS"
          assert receipt["runtime_apis"] == [35]
          assert receipt["body_count"] == 100
          assert receipt["install_proofs"] == 100
          assert receipt["launch_contact_proofs"] == 800
          assert receipt["rotation_contact_proofs"] == 200
          assert receipt["home_return_proofs"] == 100
          assert receipt["back_relaunch_proofs"] == 100
          assert receipt["process_kill_relaunch_proofs"] == 100
          assert receipt["data_clear_relaunch_proofs"] == 100
          assert receipt["force_stop_cycle_proofs"] == 300
          assert receipt["memory_receipts"] == 100
          assert receipt["runtime_fault_free_proofs"] == 100
          print("100 lifecycle endurance routes, 800 launches, 200 rotations and 300 force-stop cycles verified")
          PY
      - name: Seal lifecycle endurance receipt estate
        run: |
          tar -czf JM_ANDROID_100_LIFECYCLE_ENDURANCE_RECEIPTS_v0.8.tar.gz -C build lifecycle-master lifecycle-shards
          sha256sum JM_ANDROID_100_LIFECYCLE_ENDURANCE_RECEIPTS_v0.8.tar.gz | tee JM_ANDROID_100_LIFECYCLE_ENDURANCE_RECEIPTS_v0.8.sha256
      - name: Upload 100-body lifecycle endurance federation
        uses: actions/upload-artifact@v4
        with:
          name: JM_ANDROID_100_LIFECYCLE_ENDURANCE_FEDERATION_v0.8
          path: |
            JM_ANDROID_100_LIFECYCLE_ENDURANCE_RECEIPTS_v0.8.tar.gz
            JM_ANDROID_100_LIFECYCLE_ENDURANCE_RECEIPTS_v0.8.sha256
            build/lifecycle-master/JM_ANDROID_100_LIFECYCLE_ENDURANCE_RECEIPT.json
          if-no-files-found: error
          compression-level: 0
