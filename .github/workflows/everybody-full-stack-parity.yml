name: JM EveryBody Full-Stack Parity v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/crown32-sovereign-bodies-v1
    paths:
      - coding-estate/everybody/body-registry*.json
      - coding-estate/everybody/full-stack/**
      - .github/workflows/everybody-full-stack-parity.yml
  pull_request:
    paths:
      - coding-estate/everybody/body-registry*.json
      - coding-estate/everybody/full-stack/**
      - .github/workflows/everybody-full-stack-parity.yml

concurrency:
  group: jm-everybody-full-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-stack-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact body branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17 for Android carrier syntax proof
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run 100-body compiler SDK kernel-source federation proof
        run: python coding-estate/everybody/full-stack/tests/test_full_stack_factory.py

      - name: Run Crown32 backend expansion across all 100 bodies
        run: python coding-estate/everybody/full-stack/tests/test_crown32_backends.py

      - name: Run 3,200-gate per-body Crown32 contract proof
        run: python coding-estate/everybody/full-stack/tests/test_crown32_factory.py

      - name: Run 100-body SDK language-service debugger proof
        run: python coding-estate/everybody/full-stack/tests/test_body_tooling_factory.py

      - name: Run 100-body bytecode verifier and VM proof
        run: python coding-estate/everybody/full-stack/tests/test_body_vm_factory.py

      - name: Build and inspect 100 installable sovereign SDK plus VM wheels
        run: python coding-estate/everybody/full-stack/tests/test_body_sdk_packages.py

      - name: Run canonical 100-body Android Gradle carrier proof
        run: python coding-estate/everybody/full-stack/tests/test_android_gradle_factory_v0_3.py

      - name: Generate deliverable body packages
        run: |
          rm -rf build/everybody-full-stack-v0.1 build/everybody-android-gradle-v0.3
          python coding-estate/everybody/full-stack/tools/full_stack_factory.py \
            --repo-root . \
            --out build/everybody-full-stack-v0.1 \
            --clean
          python coding-estate/everybody/full-stack/tools/body_tooling_factory.py \
            --repo-root . \
            --out build/everybody-full-stack-v0.1 \
            --augment-existing
          python coding-estate/everybody/full-stack/tools/body_vm_factory.py \
            --repo-root . \
            --out build/everybody-full-stack-v0.1 \
            --augment-existing
          python coding-estate/everybody/full-stack/tools/crown32_factory.py \
            --repo-root . \
            --out build/everybody-full-stack-v0.1
          python coding-estate/everybody/full-stack/tools/android_gradle_factory_v0_3.py \
            --repo-root . \
            --out build/everybody-android-gradle-v0.3 \
            --clean

      - name: Verify exact body count and named bodies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          full = Path("build/everybody-full-stack-v0.1")
          android = Path("build/everybody-android-gradle-v0.3")
          federation = json.loads((full / "federation.json").read_text(encoding="utf-8"))
          crown32 = json.loads((full / "CROWN32_REGISTER.json").read_text(encoding="utf-8"))
          tooling = json.loads((full / "BODY_TOOLING_RECEIPT.json").read_text(encoding="utf-8"))
          vm = json.loads((full / "BODY_VM_RECEIPT.json").read_text(encoding="utf-8"))
          android_receipt = json.loads((android / "ANDROID_GRADLE_RECEIPT.json").read_text(encoding="utf-8"))
          assert federation["body_count"] == 100
          assert len(set(federation["body_ids"])) == 100
          assert crown32["first_engineering_batch"] == 100
          assert crown32["gate_count_per_body"] == 32
          assert crown32["total_gate_records"] == 3200
          assert tooling["body_count"] == 100
          assert tooling["service_records"] == 900
          assert vm["status"] == "BODY_NATIVE_BYTECODE_VERIFIER_VM_PASS"
          assert vm["body_count"] == 100
          assert vm["service_records"] == 800
          assert vm["command_records"] == 200
          assert android_receipt["body_count"] == 100
          assert android_receipt["unique_namespaces"] == 100
          assert android_receipt["schema"] == "jm.everybody.android-gradle-factory/0.3"
          assert android_receipt["sdk"] == {"compile": 35, "min": 24, "target": 35}
          assert android_receipt["build_tools"] == "35.0.0"
          for body_id in ("cading", "quadze", "recorp", "routeos", "jmlogic", "flowtalk", "kading", "kocodifying", "formeula", "cadenvm", "wakeforge", "finger-one", "finger-two"):
              assert body_id in federation["body_ids"], body_id
              package = next((full / "bodies" / body_id / "sdk").glob("jm_*"))
              for filename in ("language_server.py", "debugger.py", "bytecode.py", "vm.py", "vm_core.py"):
                  assert (package / filename).is_file(), (body_id, filename)
              assert (full / "bodies" / body_id / "tooling" / "contract.json").is_file(), body_id
              assert (full / "bodies" / body_id / "runtime" / "vm-contract.json").is_file(), body_id
              route_path = android / "bodies" / body_id / "android-gradle" / "jmgradle.route.json"
              assert route_path.is_file(), body_id
              route = json.loads(route_path.read_text(encoding="utf-8"))
              assert route["sdk"] == {"compile": 35, "min": 24, "target": 35}, body_id
          print("100 bodies, 3,200 Crown32 gates, 900 tooling services, 800 VM services, 500 SDK command routes and 100 API-35 Android carriers present")
          PY

      - name: Seal generated packages
        run: |
          tar -czf JM_EVERYBODY_FULL_STACK_FACTORY_v0.2.tar.gz -C build everybody-full-stack-v0.1
          tar -czf JM_EVERYBODY_ANDROID_GRADLE_CARRIERS_v0.3.tar.gz -C build everybody-android-gradle-v0.3
          sha256sum JM_EVERYBODY_FULL_STACK_FACTORY_v0.2.tar.gz | tee JM_EVERYBODY_FULL_STACK_FACTORY_v0.2.sha256
          sha256sum JM_EVERYBODY_ANDROID_GRADLE_CARRIERS_v0.3.tar.gz | tee JM_EVERYBODY_ANDROID_GRADLE_CARRIERS_v0.3.sha256

      - name: Upload generated full-stack packages and receipts
        uses: actions/upload-artifact@v4
        with:
          name: JM_EVERYBODY_FULL_STACK_VM_TOOLING_AND_ANDROID_GRADLE_v0.3
          path: |
            JM_EVERYBODY_FULL_STACK_FACTORY_v0.2.tar.gz
            JM_EVERYBODY_FULL_STACK_FACTORY_v0.2.sha256
            JM_EVERYBODY_ANDROID_GRADLE_CARRIERS_v0.3.tar.gz
            JM_EVERYBODY_ANDROID_GRADLE_CARRIERS_v0.3.sha256
            build/everybody-full-stack-v0.1/BUILD_RECEIPT.json
            build/everybody-full-stack-v0.1/federation.json
            build/everybody-full-stack-v0.1/BODY_TOOLING_RECEIPT.json
            build/everybody-full-stack-v0.1/BODY_VM_RECEIPT.json
            build/everybody-full-stack-v0.1/CROWN32_REGISTER.json
            build/everybody-full-stack-v0.1/CROWN32_RECEIPT.json
            build/everybody-android-gradle-v0.3/ANDROID_GRADLE_RECEIPT.json
          if-no-files-found: error
