name: Exact Identity Gate v0.1

on:
  push:
    branches:
      - universal-hosted-body-exact-identity-proof-v0.1
  pull_request:
    paths:
      - 'apps/jm-chatgpt-host-adapter-v0.1/EXACT_IDENTITY_*'
      - 'proof/exact-identity/generate_closure_package.py'
      - '.github/workflows/exact-identity-gate-v0.1.yml'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run exact-identity gate tests
        run: node apps/jm-chatgpt-host-adapter-v0.1/EXACT_IDENTITY_GATE_v0_1.test.mjs

  closure-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: python -m pip install --disable-pip-version-check python-docx reportlab
      - name: Generate polished DOCX and PDF
        run: python proof/exact-identity/generate_closure_package.py
      - name: Verify canonical two-file set
        run: |
          test -s proof/exact-identity/dist/JM_UNIVERSAL_HOSTED_BODY_Architecture_Proof_Gate_Closure_v1_0.docx
          test -s proof/exact-identity/dist/JM_UNIVERSAL_HOSTED_BODY_Architecture_Proof_Gate_Closure_v1_0.pdf
          test "$(find proof/exact-identity/dist -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum proof/exact-identity/dist/*
      - name: Upload canonical closure package
        uses: actions/upload-artifact@v4
        with:
          name: JM_UNIVERSAL_HOSTED_BODY_Architecture_Proof_Gate_Closure_v1_0
          path: proof/exact-identity/dist/*
          if-no-files-found: error
          retention-days: 90
