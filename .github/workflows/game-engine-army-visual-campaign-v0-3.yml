name: JM Game Engine Army Visual Campaign v0.3

on:
  push:
    branches:
      - agent/game-engine-army-glyphplay-sovereign-v0-1
    paths:
      - 'game-engine-army/**'
      - '.github/workflows/game-engine-army-visual-campaign-v0-3.yml'
  pull_request:
    paths:
      - 'game-engine-army/**'
      - '.github/workflows/game-engine-army-visual-campaign-v0-3.yml'
  workflow_dispatch:

jobs:
  build-test-capture-and-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify visible visual campaign source
        run: |
          set -euo pipefail
          SOURCE_DIR="game-engine-army/visual-campaign/v0.3"
          test -f "$SOURCE_DIR/README.md"
          test -f "$SOURCE_DIR/ADDON_REGISTRY.json"
          test -f "$SOURCE_DIR/CURRENT_SCOPE_BOUNDARY.md"
          test "$(find "$SOURCE_DIR/addons" -maxdepth 1 -name '*.js' | wc -l)" -eq 7
          test "$(find "$SOURCE_DIR/styles" -maxdepth 1 -name '*.css' | wc -l)" -eq 3
          test "$(find "$SOURCE_DIR/tools" -maxdepth 1 -name '*.py' | wc -l)" -eq 3
          find "$SOURCE_DIR" -type f ! -name 'JMVC_VISUAL_CAMPAIGN_v0.3_SOURCE.zip' -print0 | sort -z | xargs -0 sha256sum | tee /tmp/JMVC_VISUAL_CAMPAIGN_v0.3_SOURCE.sha256
          rm -rf /tmp/jmvc-source
          cp -a "$SOURCE_DIR" /tmp/jmvc-source

      - name: Run all existing engine semantic gates
        run: |
          set -e
          python game-engine-army/glyphplay/v0.1/tools/test_glyphplay_v0_1.py
          python game-engine-army/glyphplay/v0.1/tools/test_visual_overhaul_v0_2.py
          python game-engine-army/gameforge/v0.1/tools/test_gameforge_v0_1.py
          python game-engine-army/glyphforge/v0.1/tools/test_glyphforge_v0_1.py
          python game-engine-army/playform/v0.1/tools/test_playform_v0_1.py
          node game-engine-army/wave2/v0.2/tools/test_wave2.mjs

      - name: Syntax-check every visual add-on
        run: |
          set -e
          for file in /tmp/jmvc-source/addons/*.js; do
            echo "CHECK $file"
            node --check "$file"
          done
          python -m py_compile /tmp/jmvc-source/tools/*.py

      - name: Build authoritative base engines
        run: |
          set -e
          rm -rf /tmp/jmvc-base
          mkdir -p /tmp/jmvc-base/{glyphplay,gameforge,glyphforge,playform,wave2}
          python game-engine-army/glyphplay/v0.1/tools/build_glyphplay_v0_1.py \
            --source game-engine-army/glyphplay/v0.1 \
            --out /tmp/jmvc-base/glyphplay
          python game-engine-army/gameforge/v0.1/tools/build_gameforge_v0_1.py \
            --source game-engine-army/gameforge/v0.1 \
            --out /tmp/jmvc-base/gameforge
          python game-engine-army/glyphforge/v0.1/tools/build_glyphforge_v0_1.py \
            --source game-engine-army/glyphforge/v0.1 \
            --out /tmp/jmvc-base/glyphforge
          python game-engine-army/playform/v0.1/tools/build_playform_v0_1.py \
            --source game-engine-army/playform/v0.1 \
            --out /tmp/jmvc-base/playform
          python game-engine-army/wave2/v0.2/tools/build_wave2.py
          cp game-engine-army/wave2/v0.2/dist/*.html /tmp/jmvc-base/wave2/

      - name: Build nine visual packages, portable launcher and PWA
        run: |
          python /tmp/jmvc-source/tools/build_visual_campaign.py \
            --base-root /tmp/jmvc-base \
            --out dist/jm-game-engine-army-visual-v0.3

      - name: Run visual package and add-on gates
        run: |
          python /tmp/jmvc-source/tools/test_visual_campaign.py \
            --dist dist/jm-game-engine-army-visual-v0.3

      - name: Capture every engine at Android size and launcher at both sizes
        id: screenshot_smoke
        continue-on-error: true
        run: |
          python /tmp/jmvc-source/tools/screenshot_smoke.py \
            --dist dist/jm-game-engine-army-visual-v0.3 \
            --out dist/jm-game-engine-army-visual-v0.3/screenshots

      - name: Upload screenshot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JM_GAME_ENGINE_ARMY_VISUAL_CAMPAIGN_v0.3_SCREENSHOT_DIAGNOSTICS
          path: |
            dist/jm-game-engine-army-visual-v0.3/screenshots/
          retention-days: 14

      - name: Enforce screenshot quality floor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('dist/jm-game-engine-army-visual-v0.3/screenshots/SCREENSHOT_RECEIPT.json').read_text())
          assert receipt['captureCount']==11, receipt
          assert receipt['status']=='PASS' and receipt['failureCount']==0, json.dumps(receipt['failures'], indent=2)
          print('JM_VISUAL_CAMPAIGN_ALL_ELEVEN_SCREENSHOTS_PASS')
          PY

      - name: Prove deterministic rebuild
        run: |
          python /tmp/jmvc-source/tools/build_visual_campaign.py \
            --base-root /tmp/jmvc-base \
            --out /tmp/jmvc-rebuild
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('dist/jm-game-engine-army-visual-v0.3/VISUAL_CAMPAIGN_RECEIPT.json').read_text())
          b=json.loads(Path('/tmp/jmvc-rebuild/VISUAL_CAMPAIGN_RECEIPT.json').read_text())
          assert a['portableLauncher']==b['portableLauncher']
          assert [(x['id'],x['sha256']) for x in a['engines']]==[(x['id'],x['sha256']) for x in b['engines']]
          assert a['receiptSha256']==b['receiptSha256']
          print('JM_VISUAL_CAMPAIGN_DETERMINISTIC_REBUILD_PASS')
          PY

      - name: Build proof gallery, SBOM and current-scope freeze receipt
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import html
          import json
          import os
          from pathlib import Path

          root=Path('dist/jm-game-engine-army-visual-v0.3')
          campaign=json.loads((root/'VISUAL_CAMPAIGN_RECEIPT.json').read_text())
          addons=json.loads((root/'ADDON_REGISTRY.json').read_text())
          shots=json.loads((root/'screenshots/SCREENSHOT_RECEIPT.json').read_text())
          assert campaign['engineCount']==9
          assert campaign['addonCount']==22
          assert shots['captureCount']==11 and shots['failureCount']==0 and shots['status']=='PASS'

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cards=[]
          for shot in shots['captures']:
              title=f"{shot['engine']} · {shot['viewport']}"
              metrics=(
                  f"colour {shot['colorfulRatio']:.3f} · "
                  f"light {shot['luminousRatio']:.3f} · "
                  f"contrast {shot['lumaStdDev']:.2f}"
              )
              cards.append(
                  '<article><img loading="lazy" src="screenshots/'
                  + html.escape(shot['file'])
                  + '" alt="' + html.escape(title) + '"><h2>'
                  + html.escape(title) + '</h2><p>' + html.escape(metrics)
                  + '</p></article>'
              )
          gallery='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JM Game Engine Army Visual Proof Gallery v0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#05080f;color:#f5fbff;font-family:system-ui;padding:18px}h1{color:#ffd166}.meta{color:#a9bfd1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}article{border:1px solid #29435b;border-radius:18px;background:#0a1521;padding:10px;overflow:hidden}img{width:100%;height:360px;object-fit:contain;background:#02050a;border-radius:12px}h2{font-size:1rem;margin:.75rem 0 .3rem}p{color:#a9bfd1;margin:.2rem 0}</style></head><body><h1>JM Game Engine Army — Visual Proof Gallery v0.3</h1><p class="meta">Nine engine Android captures plus launcher desktop and Android captures. All frames passed the same central-field image-analysis floor.</p><main class="grid">''' + ''.join(cards) + '</main></body></html>'
          (root/'VISUAL_PROOF_GALLERY.html').write_text(gallery, encoding='utf-8')

          files=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'SHA256SUMS.txt','VISUAL_CAMPAIGN_SBOM.json'}):
              files.append({'path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,'sha256':digest(path)})
          sbom={
              'schema':'jm.game-engine-army.visual-sbom/0.3',
              'status':'VISIBLE_SOURCE_AND_DELIVERY_BOM_COMPLETE',
              'sourceHeadSha':os.environ['SOURCE_HEAD_SHA'],
              'componentCount':len(files),
              'components':files,
              'engineIds':[e['id'] for e in campaign['engines']],
              'addonIds':[a['id'] for a in addons['addons']],
          }
          (root/'VISUAL_CAMPAIGN_SBOM.json').write_text(json.dumps(sbom,indent=2)+'\n')

          freeze={
              'schema':'jm.game-engine-army.visual-current-scope-freeze/0.3',
              'status':'CURRENT_CONSTRUCTIBLE_VISUAL_SCOPE_FROZEN_EXTERNAL_DEVICE_AND_AUTHORING_GATES_OPEN',
              'sourceHeadSha':os.environ['SOURCE_HEAD_SHA'],
              'workflowRunId':os.environ['GITHUB_RUN_ID'],
              'workflowRunNumber':os.environ['GITHUB_RUN_NUMBER'],
              'engineCount':campaign['engineCount'],
              'addonCount':campaign['addonCount'],
              'screenshotCount':shots['captureCount'],
              'screenshotFailureCount':shots['failureCount'],
              'deterministicRebuild':True,
              'packageClassesToSeal':12,
              'directLauncherAccessory':campaign['portableLauncher'],
              'campaignReceiptSha256':digest(root/'VISUAL_CAMPAIGN_RECEIPT.json'),
              'screenshotReceiptSha256':digest(root/'screenshots/SCREENSHOT_RECEIPT.json'),
              'gallerySha256':digest(root/'VISUAL_PROOF_GALLERY.html'),
              'sbomSha256':digest(root/'VISUAL_CAMPAIGN_SBOM.json'),
              'earnedGates':[
                  'VISIBLE_SOURCE_VERIFIED',
                  'ALL_EXISTING_ENGINE_SEMANTIC_GATES_PASS',
                  'ALL_VISUAL_ADDONS_SYNTAX_PASS',
                  'NINE_AUTHORITATIVE_BASE_ENGINES_REBUILT',
                  'NINE_DISTINCT_VISUAL_PACKAGES_BUILT',
                  'ALL_ELEVEN_BROWSER_SCREENSHOTS_PASS',
                  'CENTRAL_FIELD_COLOUR_LUMINANCE_AND_CONTRAST_PASS',
                  'DETERMINISTIC_REBUILD_PASS',
                  'DIRECT_FILE_LAUNCHER_BUILT',
                  'PWA_BUILT',
                  'EDITABLE_ADDON_SDK_BUILT',
                  'ALL_PACKAGE_HASHES_AND_ZIP_INTEGRITY_VERIFIED',
              ],
              'openExternalGates':[
                  'REAL_ANDROID_AND_LAPTOP_USER_CONTACT',
                  'SUSTAINED_REAL_PROJECT_SAVE_EDIT_EXPORT_IMPORT_CYCLES',
                  'AUTHORED_CHARACTER_ART_SPRITES_AND_ANIMATION_DIRECTION',
                  'RECORDED_MUSIC_VOICE_AND_COMMERCIAL_SOUND_DESIGN',
                  'GPU_WEBGL_MATERIALS_POST_PROCESSING_AND_DEVICE_PROFILING',
                  'NATIVE_ANDROID_WINDOWS_MACOS_OR_LINUX_BINARIES',
                  'BODY_NATIVE_SELF_HOSTING_OR_ROLE_EQUIVALENT',
                  'FINAL_INDIVIDUAL_ENGINE_CROWNS',
              ],
              'claimBoundary':campaign['claimBoundary'],
          }
          (root/'CURRENT_SCOPE_FREEZE_RECEIPT.json').write_text(json.dumps(freeze,indent=2)+'\n')
          (root/'CURRENT_SCOPE_FREEZE.md').write_text(
              '# JM Game Engine Army Visual Campaign v0.3 — Current-Scope Freeze\n\n'
              '**Status:** current constructible browser-visual and packaging scope frozen.\n\n'
              'Earned: nine engine packages, twenty-two add-ons, eleven browser captures, deterministic rebuild, direct-file launcher, PWA, editable SDK and twelve package classes.\n\n'
              'Still open: real-device use, sustained projects, authored art/audio, GPU/native delivery, self-hosting equivalents and final crowns.\n'
          )
          print(json.dumps(freeze,indent=2))
          PY

      - name: Validate freeze receipts and proof inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/jm-game-engine-army-visual-v0.3')
          freeze=json.loads((root/'CURRENT_SCOPE_FREEZE_RECEIPT.json').read_text())
          sbom=json.loads((root/'VISUAL_CAMPAIGN_SBOM.json').read_text())
          shots=json.loads((root/'screenshots/SCREENSHOT_RECEIPT.json').read_text())
          gallery=(root/'VISUAL_PROOF_GALLERY.html').read_text(encoding='utf-8')
          assert freeze['status']=='CURRENT_CONSTRUCTIBLE_VISUAL_SCOPE_FROZEN_EXTERNAL_DEVICE_AND_AUTHORING_GATES_OPEN'
          assert freeze['engineCount']==9 and freeze['addonCount']==22
          assert freeze['screenshotCount']==11 and freeze['screenshotFailureCount']==0
          assert freeze['deterministicRebuild'] is True and freeze['packageClassesToSeal']==12
          assert len(freeze['earnedGates'])==12 and len(freeze['openExternalGates'])==8
          assert sbom['engineIds'] and len(sbom['engineIds'])==9
          assert sbom['addonIds'] and len(sbom['addonIds'])==22
          assert gallery.lower().startswith('<!doctype html>')
          assert gallery.count('<article>')==11
          assert all(shot['file'] in gallery for shot in shots['captures'])
          print('JM_VISUAL_CURRENT_SCOPE_FREEZE_RECEIPTS_PASS')
          PY

      - name: Seal complete, PWA, SDK and nine engine packages
        run: |
          set -euo pipefail
          REPO="$PWD"
          ROOT="$REPO/dist/jm-game-engine-army-visual-v0.3"
          SEALED="$REPO/dist/sealed"
          rm -rf "$SEALED"
          mkdir -p "$SEALED"
          (cd "$ROOT" && zip -qr "$SEALED/JM_GAME_ENGINE_ARMY_VISUAL_CAMPAIGN_v0.3_COMPLETE.zip" .)
          (cd "$ROOT/pwa" && zip -qr "$SEALED/JM_GAME_ENGINE_ARMY_VISUAL_CAMPAIGN_v0.3_PWA.zip" .)
          (cd "$ROOT/editable-source" && zip -qr "$SEALED/JM_GAME_ENGINE_ARMY_VISUAL_ADDON_SDK_v0.3.zip" .)
          cp "$ROOT/OPEN_FIRST_JM_GAME_ENGINE_ARMY_VISUAL_CAMPAIGN_v0_3.html" "$SEALED/"
          for dir in "$ROOT"/packages/*; do
            name=$(basename "$dir" | tr '[:lower:]-' '[:upper:]_')
            (cd "$dir" && zip -qr "$SEALED/${name}_VISUAL_PACKAGE_v0.3.zip" .)
          done
          test "$(find "$SEALED" -maxdepth 1 -name '*_VISUAL_PACKAGE_v0.3.zip' | wc -l)" -eq 9
          test "$(find "$SEALED" -maxdepth 1 -name '*.zip' | wc -l)" -eq 12
          find "$SEALED" -maxdepth 1 -name '*.zip' -print0 | sort -z | xargs -0 -n1 unzip -tq
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          sealed=Path('dist/sealed')
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          files=[]
          for path in sorted(p for p in sealed.iterdir() if p.is_file() and p.name not in {'SEALED_DELIVERY_RECEIPT.json','SHA256SUMS.txt'}):
              files.append({'file':path.name,'bytes':path.stat().st_size,'sha256':sha(path),'kind':'package' if path.suffix=='.zip' else 'direct-launcher'})
          receipt={
              'schema':'jm.game-engine-army.visual-sealed-delivery/0.3',
              'status':'TWELVE_PACKAGE_CLASSES_AND_DIRECT_LAUNCHER_SEALED',
              'packageClassCount':sum(1 for item in files if item['kind']=='package'),
              'directLauncherCount':sum(1 for item in files if item['kind']=='direct-launcher'),
              'files':files,
          }
          assert receipt['packageClassCount']==12 and receipt['directLauncherCount']==1
          (sealed/'SEALED_DELIVERY_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          (cd "$SEALED" && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt)
          (cd "$SEALED" && sha256sum -c SHA256SUMS.txt)

      - name: Upload complete visual campaign
        uses: actions/upload-artifact@v4
        with:
          name: JM_GAME_ENGINE_ARMY_VISUAL_CAMPAIGN_v0.3_COMPLETE
          path: |
            dist/sealed/
            dist/jm-game-engine-army-visual-v0.3/VISUAL_CAMPAIGN_RECEIPT.json
            dist/jm-game-engine-army-visual-v0.3/ADDON_REGISTRY.json
            dist/jm-game-engine-army-visual-v0.3/SHA256SUMS.txt
            dist/jm-game-engine-army-visual-v0.3/VISUAL_PROOF_GALLERY.html
            dist/jm-game-engine-army-visual-v0.3/VISUAL_CAMPAIGN_SBOM.json
            dist/jm-game-engine-army-visual-v0.3/CURRENT_SCOPE_FREEZE_RECEIPT.json
            dist/jm-game-engine-army-visual-v0.3/CURRENT_SCOPE_FREEZE.md
            dist/jm-game-engine-army-visual-v0.3/screenshots/
          retention-days: 90
