name: Games&Beyond Full House Composition Proof

on:
  push:
    branches:
      - main
    paths:
      - 'games-beyond/**'
      - 'GAMES_BEYOND_PAYLOAD_v0_3.lzma.b64.txt'
      - '.github/workflows/games-beyond-full-house-v0-3.yml'
  pull_request:
    paths:
      - 'games-beyond/**'
      - 'GAMES_BEYOND_PAYLOAD_v0_3.lzma.b64.txt'
      - '.github/workflows/games-beyond-full-house-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-house-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify payload, built-in annex and 22/24 composition
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib

          root = pathlib.Path('games-beyond')
          manifest = json.loads((root / 'payload-manifest.json').read_text(encoding='utf-8'))
          payload_path = root / manifest['partPattern']
          if not payload_path.exists():
              raise SystemExit(f'MISSING_PAYLOAD: {payload_path}')

          b64 = ''.join(payload_path.read_text(encoding='utf-8').split())
          if len(b64) != manifest['base64Chars']:
              raise SystemExit(f'BASE64_LENGTH: {len(b64)} != {manifest["base64Chars"]}')

          compressed = base64.b64decode(b64, validate=True)
          if len(compressed) != manifest['compressedBytes']:
              raise SystemExit(f'COMPRESSED_SIZE: {len(compressed)} != {manifest["compressedBytes"]}')

          compressed_hash = hashlib.sha256(compressed).hexdigest()
          if compressed_hash != manifest['compressedSha256']:
              raise SystemExit(f'COMPRESSED_SHA: {compressed_hash}')

          raw = lzma.decompress(compressed, format=lzma.FORMAT_ALONE)
          if len(raw) != manifest['rawBytes']:
              raise SystemExit(f'RAW_SIZE: {len(raw)} != {manifest["rawBytes"]}')

          raw_hash = hashlib.sha256(raw).hexdigest()
          if raw_hash != manifest['rawSha256']:
              raise SystemExit(f'RAW_SHA: {raw_hash}')

          house = json.loads(raw.decode('utf-8'))
          payload_bodies = house.get('bodies', [])
          payload_ids = [body.get('id') for body in payload_bodies]

          payload_count = manifest['payloadBodyCount']
          built_in_count = manifest['builtInBodyCount']
          body_count = manifest['bodyCount']
          full_target = manifest['fullTargetCount']
          built_in_ids = manifest['bodyIdsBuiltIn']
          extras = manifest['extraBodies']
          full_imports = manifest['fullImportAdds']

          if payload_count != 15:
              raise SystemExit(f'PAYLOAD_BOUNDARY_CHANGED: {payload_count}')
          if len(payload_bodies) != payload_count:
              raise SystemExit(f'PAYLOAD_BODY_COUNT: {len(payload_bodies)} != {payload_count}')
          if payload_ids != built_in_ids[:payload_count]:
              raise SystemExit(f'PAYLOAD_ORDER_OR_IDS: {payload_ids}')

          bad_payload = []
          for body in payload_bodies:
              html = body.get('html', '')
              if not html or ('<html' not in html.lower() and '<!doctype' not in html.lower()):
                  bad_payload.append(body.get('id'))
          if bad_payload:
              raise SystemExit(f'INVALID_PAYLOAD_HTML_BODIES: {bad_payload}')

          extra_ids = [body['id'] for body in extras]
          if payload_ids + extra_ids != built_in_ids:
              raise SystemExit('BUILT_IN_COMPOSITION_ORDER_MISMATCH')
          if len(built_in_ids) != built_in_count or body_count != built_in_count:
              raise SystemExit(f'BUILT_IN_COUNT: ids={len(built_in_ids)} manifest={built_in_count} bodyCount={body_count}')

          missing_extra = []
          invalid_extra = []
          for body in extras:
              path = root / body['path']
              if path.is_dir():
                  path = path / 'index.html'
              if not path.exists():
                  missing_extra.append(str(path))
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if '<html' not in text.lower() and '<!doctype' not in text.lower():
                  invalid_extra.append(str(path))
          if missing_extra:
              raise SystemExit(f'MISSING_BUILT_IN_ANNEX: {missing_extra}')
          if invalid_extra:
              raise SystemExit(f'INVALID_BUILT_IN_ANNEX_HTML: {invalid_extra}')

          import_ids = [body['id'] for body in full_imports]
          if len(set(built_in_ids + import_ids)) != len(built_in_ids) + len(import_ids):
              raise SystemExit('DUPLICATE_FULL_HOUSE_IDS')
          if built_in_count + len(full_imports) != full_target:
              raise SystemExit(f'FULL_TARGET: {built_in_count} + {len(full_imports)} != {full_target}')

          print(json.dumps({
              'result': 'PACKAGE_AND_COMPOSITION_DING',
              'payloadBodyCount': payload_count,
              'builtInBodyCount': built_in_count,
              'fullTargetCount': full_target,
              'payloadIds': payload_ids,
              'annexIds': extra_ids,
              'fullImportIds': import_ids,
              'compressedSha256': compressed_hash,
              'rawSha256': raw_hash
          }, indent=2))

      - name: Verify public shell routes
        shell: python
        run: |
          import pathlib
          root = pathlib.Path('games-beyond')
          index = (root / 'index.html').read_text(encoding='utf-8')
          app = (root / 'app.js').read_text(encoding='utf-8')
          worker = (root / 'sw.js').read_text(encoding='utf-8')
          required = [
              'HOUSE', 'ROOMS', 'EDIT', 'PROOF',
              'PLAY BODY', 'SAVE REVISION', 'UNDO',
              'RESTORE SOURCE', 'EXPORT FULL HOUSE'
          ]
          missing = [item for item in required if item not in index and item not in app]
          if missing:
              raise SystemExit(f'MISSING_ROUTES: {missing}')
          if 'games-beyond-v0-2' in worker:
              raise SystemExit('STALE_V0_2_CACHE')
          print('PUBLIC_SHELL_DING')
