name: Games&Beyond QA

on:
  push:
    branches:
      - games-beyond-house-v0-1a
      - main
    paths:
      - 'games-beyond/**'
      - '.github/workflows/games-beyond-qa.yml'
  pull_request:
    paths:
      - 'games-beyond/**'
      - '.github/workflows/games-beyond-qa.yml'
  # Existing owner-controlled manual execution on default main.
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games-beyond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Boot and registry gate
        run: npx playwright test --project=mobile-chromium --grep '@boot'
      - name: CP22 real whole-catalogue and missing-door browser contracts
        run: npx playwright test tests/catalogue-cp22.spec.mjs tests/crewbound-live-door-cp23.spec.mjs tests/futarized-public-recovery-cp23.spec.mjs --project=mobile-chromium --project=desktop-chromium
      - name: Mounted room opens
        run: npx playwright test --project=mobile-chromium --grep '@room-open'
      - name: Mounted room Ding contact
        run: npx playwright test --project=mobile-chromium --grep '@room-ding'
      - name: Body-native Edit route
        run: npx playwright test --project=mobile-chromium --grep '@room-route'
      - name: Room close route
        run: npx playwright test --project=mobile-chromium --grep '@room-close'
      - name: Workbench, export and receipt gate
        run: npx playwright test --project=mobile-chromium --grep '@workbench'
      - name: Responsive gate
        run: npx playwright test --project=desktop-chromium --grep '@responsive'
      - name: CREWBOUND 3+2+1 CP01 browser gameplay acceptance
        run: npx playwright test tests/crewbound-321.spec.mjs --reporter=line
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: games-beyond-playwright-evidence
          path: |
            games-beyond/test-results
            games-beyond/playwright-report
          if-no-files-found: ignore
