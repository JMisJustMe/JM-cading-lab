name: GlyphPlay Sovereign Rebuild v0.1

on:
  push:
    branches:
      - agent/game-engine-army-glyphplay-sovereign-v0-1
    paths:
      - 'game-engine-army/glyphplay/v0.1/**'
      - '.github/workflows/glyphplay-sovereign-rebuild-v0-1.yml'
  pull_request:
    paths:
      - 'game-engine-army/glyphplay/v0.1/**'
      - '.github/workflows/glyphplay-sovereign-rebuild-v0-1.yml'
  workflow_dispatch:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run GlyphPlay source and semantic gates
        run: python game-engine-army/glyphplay/v0.1/tools/test_glyphplay_v0_1.py
      - name: Build HTTP and single-file deliveries
        run: |
          python game-engine-army/glyphplay/v0.1/tools/build_glyphplay_v0_1.py \
            --source game-engine-army/glyphplay/v0.1 \
            --out dist/glyphplay-sovereign-v0.1
      - name: Verify deterministic delivery receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/glyphplay-sovereign-v0.1')
          receipt=json.loads((root/'BUILD_RECEIPT.json').read_text())
          assert receipt['status']=='GLYPHPLAY_SOVEREIGN_REBUILD_STATIC_BUILD_PASS_BROWSER_CONTACT_OPEN'
          assert receipt['source_part_count']==4
          assert len(receipt['body_trials'])==7
          assert receipt['donor_count']==7
          assert len(receipt['javascript_sha256'])==64
          assert len(receipt['single_file_sha256'])==64
          assert (root/receipt['single_file']).is_file()
          assert (root/'index.html').is_file()
          assert (root/'app.js').is_file()
          print('GLYPHPLAY_SOVEREIGN_REBUILD_V0_1_BUILD_GATE_PASS')
          PY
      - name: Test HTTP source delivery
        run: |
          cd dist/glyphplay-sovereign-v0.1
          python -m http.server 8765 >/tmp/glyphplay-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/index.html | grep -q 'GlyphPlay Sovereign Rebuild v0.1'
          curl --fail --silent http://127.0.0.1:8765/app.part1.txt | grep -q 'BODY_PROFILES'
          curl --fail --silent http://127.0.0.1:8765/style.css | grep -q '2.5D\|canvasWrap'
      - name: Seal Zionfolder
        run: |
          cd dist
          zip -qr GLYPHPLAY_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.zip glyphplay-sovereign-v0.1
          sha256sum GLYPHPLAY_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.zip | tee GLYPHPLAY_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GLYPHPLAY_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER
          path: |
            dist/GLYPHPLAY_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.zip
            dist/GLYPHPLAY_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.sha256
            dist/glyphplay-sovereign-v0.1/BUILD_RECEIPT.json
            dist/glyphplay-sovereign-v0.1/OPEN_FIRST_GLYPHPLAY_SOVEREIGN_REBUILD_v0_1.html
