name: JM AGI v1.4.3 Windows Dynamic Integration

on:
  pull_request:
    paths:
      - 'lab/jm-agi-dynamic/v1.4.3/**'
      - '.github/workflows/jm-agi-v143-dynamic-integration.yml'

jobs:
  exact-r3-windows-edge:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh
        working-directory: lab/jm-agi-dynamic/v1.4.3

    steps:
      - uses: actions/checkout@v4

      - name: Windows and Edge pre-contact
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          $candidates = @(@(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:LOCALAPPDATA\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ })
          if ($candidates.Count -lt 1) { throw 'Microsoft Edge not found on windows-latest.' }
          $edgePath = [string]$candidates[0]
          Write-Host "Edge: $edgePath"
          & $edgePath --version

      - name: Install Playwright control layer (system Edge only)
        run: |
          npm install --no-save playwright-core

      - name: Dynamic integrate exact v1.4.3 across real Edge process death
        run: |
          node .\dynamic_integration.mjs
      - name: Inspect and clean isolated Edge profile
        if: always()
        run: |
          $profile = (Resolve-Path .\JM_AGI_EDGE_TEST_PROFILE -ErrorAction SilentlyContinue)
          if ($profile) {
            $needle = [Regex]::Escape($profile.Path)
            $dedicated = @(Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and ($_.CommandLine -match $needle) })
            Write-Host "Remaining dedicated Edge processes: $($dedicated.Count)"
            foreach ($p in $dedicated) {
              Write-Host "Cleanup PID $($p.ProcessId)"
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }
          if (Test-Path .\JM_AGI_PROCESS_WITNESS_LAST.json) {
            Write-Host '--- witness receipt ---'
            Get-Content .\JM_AGI_PROCESS_WITNESS_LAST.json -Raw
          }
