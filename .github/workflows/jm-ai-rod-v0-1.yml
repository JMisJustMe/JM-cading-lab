name: JM AI ROD v0.1 bounded proof
on:
  pull_request:
    paths:
      - 'scripts/jm_relational_opportunity.py'
      - 'proof/rod/**'
      - '.github/workflows/jm-ai-rod-v0-1.yml'
  workflow_dispatch:
jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/jm_relational_opportunity.py
      - name: ROD deterministic fixtures
        run: python scripts/jm_relational_opportunity.py --self-test
      - name: ROD unseen contact 001
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/unseen-contact-001.json | tee /tmp/rod-unseen.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rod-unseen.json'))
          got={x['body']:x['decision'] for x in p['results']}
          expected={
            'Interactors Interacting':'CARRY',
            'Authority / Permission Gate':'CARRY',
            'Device Continuity Verification':'HOLD',
            'HOSF':'REJECT',
            'Trace-only Restatement':'COOL',
            'Learning-bearing Adaptation':'HOLD',
          }
          assert p['claim_ceiling']=='TRACE', p['claim_ceiling']
          assert got==expected, (got,expected)
          print('JM ROD unseen contact 001 PASS:', got)
          PY
      - name: ROD check-in re-entry 002
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/reentry-checkin-002.json | tee /tmp/rod-reentry.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rod-reentry.json'))
          got={x['body']:x['decision'] for x in p['results']}
          assert p['opportunity_inlet']=='CHECK_IN', p['opportunity_inlet']
          assert p['claim_ceiling']=='REENTRY_CHANGE', p['claim_ceiling']
          assert got['Learning-bearing adaptation']=='CARRY', got
          assert got['Check-in alone proves fit']=='REJECT', got
          h=p['relation_history']
          assert len(h)==1, h
          assert h[0]['prior_decision']=='HOLD' and h[0]['current_decision']=='CARRY' and h[0]['changed'], h
          print('JM ROD check-in re-entry 002 PASS:', got, h)
          PY
      - name: ROD unlabelled anomaly 003
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/unlabelled-anomaly-003.json | tee /tmp/rod-anomaly.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rod-anomaly.json'))
          got={x['body']:x['decision'] for x in p['results']}
          assert p['opportunity_inlet']=='ANOMALY', p['opportunity_inlet']
          assert p['claim_ceiling']=='TRACE', p['claim_ceiling']
          assert got=={
            'Contact Field':'CARRY',
            'Anomaly means adaptation':'HOLD',
            'Unrelated Support Route':'REJECT',
          }, got
          print('JM ROD unlabelled anomaly 003 PASS:', got)
          PY
      - name: ROD bounded registry discovery 004
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/registry-discovery-004.json --registry registry/rod-bodies-v0-1.json | tee /tmp/rod-registry.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rod-registry.json'))
          got={x['body']:x['decision'] for x in p['results']}
          assert p['candidate_discovery']=='BOUNDED_REGISTRY', p['candidate_discovery']
          assert p['opportunity_inlet']=='ANOMALY', p['opportunity_inlet']
          assert p['claim_ceiling']=='TRACE', p['claim_ceiling']
          assert got=={
            'Interactors Interacting':'CARRY',
            'Contact Field':'CARRY',
            'TraceBox':'CARRY',
          }, got
          print('JM ROD bounded registry discovery 004 PASS:', got)
          PY
      - name: ROD cross-process persistent re-entry 005
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/persistent-ledger-005a.json --write-ledger /tmp/rod-ledger.json | tee /tmp/rod-005a.json
          python scripts/jm_relational_opportunity.py --input proof/rod/persistent-ledger-005b.json --ledger /tmp/rod-ledger.json --write-ledger /tmp/rod-ledger2.json | tee /tmp/rod-005b.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/rod-005a.json'))
          b=json.load(open('/tmp/rod-005b.json'))
          ledger=json.load(open('/tmp/rod-ledger2.json'))
          assert a['results'][0]['decision']=='HOLD', a
          assert b['results'][0]['decision']=='CARRY', b
          h=b['relation_history']
          assert len(h)==1 and h[0]['prior_decision']=='HOLD' and h[0]['current_decision']=='CARRY' and h[0]['changed'], h
          assert ledger['current_status']['Learning-bearing adaptation']=='CARRY', ledger
          assert ledger['events'][-1]['law']=='STATUS MAY CHANGE; HISTORY MUST NOT', ledger
          print('JM ROD cross-process persistent re-entry 005 PASS: HOLD -> CARRY with append-only history')
          PY
      - name: ROD raw-contact bounded route 006
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/raw-contact-006.json --registry registry/rod-bodies-v0-1.json | tee /tmp/rod-raw.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rod-raw.json'))
          got={x['body']:x['decision'] for x in p['results']}
          assert p['grounding_mode']=='BOUNDED_LEXICON', p['grounding_mode']
          assert p['opportunity_inlet']=='ANOMALY', p['opportunity_inlet']
          assert p['candidate_discovery']=='BOUNDED_REGISTRY', p['candidate_discovery']
          assert p['claim_ceiling']=='TRACE', p['claim_ceiling']
          assert got=={'Contact Field':'CARRY','Interactors Interacting':'CARRY','TraceBox':'CARRY'}, got
          print('JM ROD raw-contact bounded route 006 PASS:', p['grounded_signals'], got)
          PY
      - name: ROD registry-aware grounding 007
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/registry-aware-grounding-007.json --registry registry/rod-bodies-v0-1.json | tee /tmp/rod-007.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rod-007.json'))
          got={x['body']:x['decision'] for x in p['results']}
          assert p['grounding_mode']=='REGISTRY_AWARE_LEXICON', p
          assert p['candidate_discovery']=='BOUNDED_REGISTRY', p
          assert got=={'Cause Must Pass':'CARRY'}, got
          print('JM ROD registry-aware grounding 007 PASS:',p['grounded_signals'],got)
          PY
      - name: ROD productive quiet and return 008
        run: |
          python scripts/jm_relational_opportunity.py --input proof/rod/quiet-return-008a.json --write-ledger /tmp/rod-quiet.json | tee /tmp/rod-008a.json
          python scripts/jm_relational_opportunity.py --input proof/rod/quiet-return-008b.json --registry registry/rod-bodies-v0-1.json --ledger /tmp/rod-quiet.json --write-ledger /tmp/rod-return.json | tee /tmp/rod-008b.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/rod-008a.json')); b=json.load(open('/tmp/rod-008b.json')); l=json.load(open('/tmp/rod-return.json'))
          assert a['results'][0]['decision']=='COOL', a
          assert a['relation_history'][0]['prior_decision']=='CARRY' and a['relation_history'][0]['current_decision']=='COOL', a
          assert b['results'][0]['body']=='HOSF' and b['results'][0]['decision']=='CARRY', b
          assert b['relation_history'][0]['prior_decision']=='COOL' and b['relation_history'][0]['current_decision']=='CARRY', b
          assert l['current_status']['HOSF']=='CARRY', l
          print('JM ROD productive quiet/return 008 PASS: CARRY -> COOL -> CARRY with history retained')
          PY
