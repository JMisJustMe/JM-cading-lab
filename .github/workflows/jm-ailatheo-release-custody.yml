name: JM AILatheo Owner Signing Custody
on:
  pull_request:
    paths:
      - 'tools/Initialize-JMAILatheoReleaseSigning.ps1'
      - 'apps/jm-android-forge/OPEN_AILATHEO_SIGNING_SETUP.cmd'
      - 'apps/jm-android-forge/OPEN_FIRST.md'
      - '.github/workflows/jm-ailatheo-release-custody.yml'
  push:
    branches: [jm-ailatheo-dedicated-signing-setup-20261019]
    paths:
      - 'tools/Initialize-JMAILatheoReleaseSigning.ps1'
      - 'apps/jm-android-forge/OPEN_AILATHEO_SIGNING_SETUP.cmd'
      - 'apps/jm-android-forge/OPEN_FIRST.md'
      - '.github/workflows/jm-ailatheo-release-custody.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  owner-signer-preparation:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate new PowerShell entry
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/Initialize-JMAILatheoReleaseSigning.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Windows PowerShell 5.1 actual owner entrypoint — keytool stderr and signer recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $env:RUNNER_TEMP 'JM-WINPS51-ORIGINAL-SIGNER'
          $backupPath = Join-Path $env:RUNNER_TEMP 'JM-WINPS51-INDEPENDENT-BACKUP'
          $env:JM_ANDROID_SIGNING_TEST_PASSPHRASE = 'JM-WINPS51-' + [guid]::NewGuid().ToString('N')
          $script = Join-Path (Get-Location) 'tools/Initialize-JMAILatheoReleaseSigning.ps1'
          try {
            $params = @(
              '-NoProfile','-ExecutionPolicy','Bypass','-File',$script,
              '-CiTest','-SigningDirectory',$keyPath,'-BackupDirectory',$backupPath
            )
            # This is the same powershell.exe v5.1 interpreter invoked by the downloaded CMD.
            & powershell.exe @params
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_POWERSHELL_51_KEYTOOL_GENERATION_FAILED' }
            $identity = Join-Path $keyPath 'AILatheo-release.p12'
            $backup = Join-Path $backupPath 'AILatheo-release.p12'
            if (-not (Test-Path $identity) -or -not (Test-Path $backup)) {
              throw 'WINDOWS_POWERSHELL_51_IDENTITY_MISSING'
            }
            $first = (Get-FileHash $identity -Algorithm SHA256).Hash
            if ((Get-FileHash $backup -Algorithm SHA256).Hash -ne $first) {
              throw 'WINDOWS_POWERSHELL_51_BACKUP_MISMATCH'
            }
            & powershell.exe @params
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_POWERSHELL_51_EXISTING_KEY_REENTRY_FAILED' }
            if ((Get-FileHash $identity -Algorithm SHA256).Hash -ne $first) {
              throw 'WINDOWS_POWERSHELL_51_IDENTITY_ROTATED'
            }
            $env:JM_ANDROID_SIGNING_TEST_PASSPHRASE = 'WRONG-WINPS51-' + [guid]::NewGuid().ToString('N')
            & powershell.exe @params 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { throw 'WINDOWS_POWERSHELL_51_WRONG_PASSWORD_NOT_REJECTED' }
            if ((Get-FileHash $identity -Algorithm SHA256).Hash -ne $first) {
              throw 'WINDOWS_POWERSHELL_51_WRONG_PASSWORD_CHANGED_KEY'
            }
            $global:LASTEXITCODE = 0
            Write-Host 'JM_WINPS51_ACTUAL_LAPTOP_SIGNING_PATH_PASS: generated one key, same-key rerun, exact backup, wrong-password HOLD'
          }
          finally {
            Remove-Item Env:\JM_ANDROID_SIGNING_TEST_PASSPHRASE -ErrorAction SilentlyContinue
            Remove-Item $keyPath,$backupPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise isolated, non-release signer custody
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyRoot = Join-Path $env:RUNNER_TEMP 'JM-TEST-AILATHEO-SIGNER'
          $backupRoot = Join-Path $env:RUNNER_TEMP 'JM-TEST-AILATHEO-BACKUP'
          $env:JM_ANDROID_SIGNING_TEST_PASSPHRASE = 'JM-CI-TEMP-' + [guid]::NewGuid().ToString('N')
          try {
            $arguments = @{
              CiTest = $true
              SigningDirectory = $keyRoot
              BackupDirectory = $backupRoot
            }
            & 'tools/Initialize-JMAILatheoReleaseSigning.ps1' @arguments
            $key = Join-Path $keyRoot 'AILatheo-release.p12'
            $backup = Join-Path $backupRoot 'AILatheo-release.p12'
            $receipt = Join-Path $keyRoot 'AILatheo-signing-public-receipt.json'
            if (-not (Test-Path $key) -or -not (Test-Path $backup)) {
              throw 'SIGNING_IDENTITY_NOT_CREATED'
            }
            $initialHash = (Get-FileHash $key -Algorithm SHA256).Hash
            $initialPublic = (Get-Content $receipt -Raw | ConvertFrom-Json).certificate_sha256
            & 'tools/Initialize-JMAILatheoReleaseSigning.ps1' @arguments
            $nextHash = (Get-FileHash $key -Algorithm SHA256).Hash
            $nextPublic = (Get-Content $receipt -Raw | ConvertFrom-Json).certificate_sha256
            if ($initialHash -ne $nextHash -or $initialPublic -ne $nextPublic) {
              throw 'SIGNER_CHANGED_ON_REENTRY'
            }
            if ((Get-FileHash $backup -Algorithm SHA256).Hash -ne $initialHash) {
              throw 'BACKUP_SHA256_MISMATCH'
            }
            $receiptBody = Get-Content $receipt -Raw | ConvertFrom-Json
            if (-not $receiptBody.existing_keystore_preserved -or
                $receiptBody.scope -ne 'DISPOSABLE_CI_TEST_ONLY') {
              throw 'SIGNING_IDENTITY_RECOVERY_CLAIM_INVALID'
            }
            $env:JM_ANDROID_SIGNING_TEST_PASSPHRASE = 'JM-WRONG-' + [guid]::NewGuid().ToString('N')
            $held = $false
            try { & 'tools/Initialize-JMAILatheoReleaseSigning.ps1' @arguments }
            catch { $held = $true }
            if (-not $held -or (Get-FileHash $key -Algorithm SHA256).Hash -ne $initialHash) {
              throw 'WRONG_PASSWORD_DID_NOT_HOLD_EXISTING_KEY'
            }
            # The expected negative keytool result leaves LASTEXITCODE=1: consume it only after asserting HOLD + byte identity.
            $global:LASTEXITCODE = 0
            Write-Host 'JM_AILATHEO_OWNER_SIGNER_PREPARATION_PASS: new key, stable rerun, exact backup, public certificate, wrong-password HOLD'
          }
          finally {
            Remove-Item Env:\JM_ANDROID_SIGNING_TEST_PASSPHRASE -ErrorAction SilentlyContinue
            Remove-Item $keyRoot,$backupRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
