name: AILatheo Unified Circuit v0.1
on:
  pull_request:
    paths:
      - 'scripts/jm_ailatheo_unified_circuit.py'
      - 'scripts/jm_relational_opportunity.py'
      - 'registry/rod-bodies-v0-1.json'
      - 'registry/ailatheo-federation-v0-1.json'
      - 'scripts/jm_teo_os_recovered_runtime.py'
      - 'scripts/jm_intelligence_federation_cross_contact.py'
      - 'scripts/jm_ai_lab_v2_mount_proof.py'
      - 'ai-federation/jm-ai-lab-v2.0/**'
      - 'unified-browser/**'
      - 'ailatheo-lineage/**'
      - 'scripts/jm_ai_lab_exact_cross_contact.js'
      - 'scripts/jm_federation_persistence_reentry.py'
      - 'proof/ailatheo/**'
      - '.github/workflows/jm-ailatheo-unified-circuit-v0-1.yml'
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python -m py_compile scripts/jm_relational_opportunity.py scripts/jm_ailatheo_unified_circuit.py scripts/jm_teo_os_recovered_runtime.py scripts/jm_intelligence_federation_cross_contact.py scripts/jm_federation_persistence_reentry.py
      - name: ROD regression
        run: python scripts/jm_relational_opportunity.py --self-test
      - name: Teo OS recovered-spec runtime re-proof
        run: python scripts/jm_teo_os_recovered_runtime.py --json

      - name: Exact JM AI Lab v2.0 mount proof
        run: |
          python scripts/jm_ai_lab_v2_mount_proof.py
          node --check /tmp/jm_ai_lab_v2_inline.js

      - name: Exact AI Lab cross-contact
        run: node scripts/jm_ai_lab_exact_cross_contact.js

      - name: Federation persistence and re-entry
        run: python scripts/jm_federation_persistence_reentry.py

      - name: Unified Browser inline JavaScript syntax
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('unified-browser/OPEN_FIRST_AILATHEO_UNIFIED_BROWSER_CIRCUIT_v0_1.html').read_text()
          js='\\n'.join(re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I))
          pathlib.Path('/tmp/unified-browser.js').write_text(js)
          assert 'AILATHEO_VISIBLE_CIRCUIT_DING' in js
          assert 'localStorage.setItem' in js
          PY
          node --check /tmp/unified-browser.js

      - name: Intelligence federation cross-contact
        run: python scripts/jm_intelligence_federation_cross_contact.py

      - name: Adaptive ECOSTATE inherited execution self-test
        run: python3 scripts/jm_build_execution.py --self-test

      - name: AILatheo circuit self-test
        run: python scripts/jm_ailatheo_unified_circuit.py --self-test
      - name: Fresh circuit proof
        run: |
          python scripts/jm_ailatheo_unified_circuit.py --input proof/ailatheo/light-circuit-001.json > /tmp/receipt.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/receipt.json'))
          assert x["coding_spine"]["executed"] == 14
          assert x["coding_spine"]["complete"] is True
          assert any(r["body"]=="RouteCode" for r in x["coding_spine"]["receipts"])
          assert x["rod"]["claim_ceiling"]=="REENTRY_CHANGE"
          assert x["ding"]=="AILATHEO_UNIFIED_CIRCUIT_DING"
          fed=json.load(open('registry/ailatheo-federation-v0-1.json'))
          members={m['id']:m for m in fed['members']}
          assert members['rod']['class']=='INNER_ORGAN'
          assert members['teo-os']['status']=='RECOVERED_SPEC_RUNTIME_REPROVED_AND_CROSS_CONTACTED'
          assert set(fed['execution_policy']['active'])=={'jm-adaptive-ecostate-agent','ailatheo','rod','teo-os','jm-ai-lab'}
          assert 'teo-os' in fed['execution_policy']['cross_contact_proven']
          assert members['ehilatheo']['status']=='RECOVERED_ROLE_GITHUB_STAGED_CONCEPT'
          assert members['ai-latheo-search']['status']=='RESOLVED_AS_AILATHEO_EXTERNAL_DOOR_OFFICE'
          assert members['ai-latheo-search']['relation']=='AILATHEO_OFFICE_NOT_SEPARATE_AI'
          assert members['jm-ai-lab']['status']=='EXACT_V2_BODY_MOUNTED_AND_CROSS_CONTACTED'
          assert members['jm-ai-lab']['evidence']['completion_gates']=='31/31 PASS'
          print("AILatheo fresh circuit + federation-boundary proof PASS")
          PY
