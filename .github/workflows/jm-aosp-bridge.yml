name: JM AOSP Bridge

on:
  push:
    branches:
      - jm-aosp-bridge-v0.1
      - jm-aosp-source-contact-v0.2
      - jm-aosp-targeted-source-v0.3
      - jm-aosp-build-boot-source-v0.4
    paths:
      - 'os/aosp-bridge/**'
      - 'coding-estate/everybody/role-qualified-61/native/os-coding.mjs'
      - 'coding-estate/everybody/role-qualified-61/native/onebody-ir.mjs'
      - 'coding-estate/everybody/role-qualified-61/native/theoc.mjs'
      - '.github/workflows/jm-aosp-bridge.yml'
  pull_request:
    paths:
      - 'os/aosp-bridge/**'
      - 'coding-estate/everybody/role-qualified-61/native/os-coding.mjs'
      - 'coding-estate/everybody/role-qualified-61/native/onebody-ir.mjs'
      - 'coding-estate/everybody/role-qualified-61/native/theoc.mjs'

permissions:
  contents: read

jobs:
  bridge-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove JM -> AOSP bridge gating
        run: node os/aosp-bridge/selftest.mjs

  upstream-source-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bridge-selftest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contact and pin official AOSP manifest
        run: node os/aosp-bridge/source-contact.mjs
      - name: Preserve source-contact receipt
        uses: actions/upload-artifact@v4
        with:
          name: jm-aosp-source-contact-receipt
          path: jm-aosp-receipts/JM_AOSP_SOURCE_CONTACT_RECEIPT_v0_2.json

  targeted-source-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: upstream-source-contact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull selected Android 17 AOSP source organs
        run: node os/aosp-bridge/targeted-source-contact.mjs
      - name: Preserve targeted-source receipt
        uses: actions/upload-artifact@v4
        with:
          name: jm-aosp-targeted-source-contact-receipt
          path: jm-aosp-receipts/JM_AOSP_TARGETED_SOURCE_CONTACT_RECEIPT_v0_3.json

  build-boot-source-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: upstream-source-contact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull Android 17 build and boot anatomy
        run: node os/aosp-bridge/build-boot-source-contact.mjs
      - name: Preserve build-boot source receipt
        uses: actions/upload-artifact@v4
        with:
          name: jm-aosp-build-boot-source-contact-receipt
          path: jm-aosp-receipts/JM_AOSP_BUILD_BOOT_SOURCE_CONTACT_RECEIPT_v0_4.json
