name: JM APP COMMONS CP03 · cross-surface native proof
on:
  pull_request:
    paths:
      - 'app-commons-cp03/**'
      - '.github/workflows/jm-app-commons-cp03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Portable core, MCP, strict JSON conformance
        working-directory: app-commons-cp03
        run: |
          set -euo pipefail
          node test-core.mjs
          node extended-test.mjs
          node portable-boundary-test.mjs
          node test-strict-cp03.mjs
          mkdir -p /tmp/jm-appcommons-java
          javac -encoding UTF-8 -d /tmp/jm-appcommons-java android/app/src/main/java/com/jmisjustme/foldultra/JMOriginalStructures.java android/app/src/main/java/com/jmisjustme/foldultra/JMAppCommonsCapsule.java JMAppCommonsCapsuleProof.java JMAppCommonsExtendedProof.java
          java -cp /tmp/jm-appcommons-java com.jmisjustme.foldultra.JMAppCommonsCapsuleProof fixture-valid-capsule.json fixture-tampered.json
          java -cp /tmp/jm-appcommons-java com.jmisjustme.foldultra.JMAppCommonsExtendedProof extended-fixtures
          python3 android/tools/verify_native_source.py
  native-build:
    needs: portable-test
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Actual Android compile
        working-directory: app-commons-cp03/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed, separate app; zero permissions
        run: |
          set -euo pipefail
          APK=app-commons-cp03/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p app-commons-cp03/out
          cp "$APK" app-commons-cp03/out/JM_APP_COMMONS_CP03_DEBUG.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > app-commons-cp03/out/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > app-commons-cp03/out/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > app-commons-cp03/out/permissions.txt
          grep -Fq "package: name='com.jmisjustme.appcommons'" app-commons-cp03/out/badging.txt
          if grep -E 'uses-permission:|uses-permission-sdk-23:' app-commons-cp03/out/permissions.txt; then echo 'HOLD · unwanted permission'; exit 1; fi
          sha256sum "$APK" > app-commons-cp03/out/checksum.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JM_APP_COMMONS_CP03_NATIVE_DEBUG_PROOF
          path: app-commons-cp03/out/
          retention-days: 14
  android-emulator:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JM_APP_COMMONS_CP03_NATIVE_DEBUG_PROOF
          path: cp03-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual native Android touch, checkpoint and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 700
          script: |
            adb install cp03-apk/JM_APP_COMMONS_CP03_DEBUG.apk
            python3 app-commons-cp03/android/tools/smoke_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM_APP_COMMONS_CP03_NATIVE_TOUCH_PROOF
          path: android-smoke-proof/
          if-no-files-found: warn
          retention-days: 14
