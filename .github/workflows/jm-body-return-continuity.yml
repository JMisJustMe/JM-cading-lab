name: JM Body Return — Original Source Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'fresh-app-lab/body-return-v0.1/**'
      - 'tests/jm_body_return_cp02_continuity.py'
      - '.github/workflows/jm-body-return-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'fresh-app-lab/body-return-v0.1/**'
      - 'tests/jm_body_return_cp02_continuity.py'
      - '.github/workflows/jm-body-return-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-body-return-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing portable Playwright browser test dependencies
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Original Body Return local state, safe dose, adulthood and exact completion receipts
        run: python tests/jm_body_return_cp02_continuity.py
