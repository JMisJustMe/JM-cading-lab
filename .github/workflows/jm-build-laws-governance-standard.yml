name: JM Build Laws Preferences Governance Standard

on:
  push:
    branches: [main]
    paths:
      - 'JM_ESTATE/GOVERNANCE/JM_BUILD_LAWS_PREFERENCES_GOVERNANCE_STANDARD_v1.0.md'
      - 'JM_ESTATE/GOVERNANCE/JM_BUILD_LAWS_PREFERENCES_GOVERNANCE_v1.0.json'
      - 'JM_ESTATE/GOVERNANCE/validate_build_laws_governance.py'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - 'JM_ESTATE/GOVERNANCE/JM_ESTATE_PRODUCTION_INHERITANCE_STANDARD_v1.0.md'
      - 'coding-estate/JM_CODING_ESTATE_RUNNING_STANDARD_v1_0.md'
      - 'services/jm-ecostate-build-mesh-mcp-v0_5/**'
      - '.github/workflows/jm-build-laws-governance-standard.yml'
  pull_request:
    paths:
      - 'JM_ESTATE/GOVERNANCE/JM_BUILD_LAWS_PREFERENCES_GOVERNANCE_STANDARD_v1.0.md'
      - 'JM_ESTATE/GOVERNANCE/JM_BUILD_LAWS_PREFERENCES_GOVERNANCE_v1.0.json'
      - 'JM_ESTATE/GOVERNANCE/validate_build_laws_governance.py'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - 'JM_ESTATE/GOVERNANCE/JM_ESTATE_PRODUCTION_INHERITANCE_STANDARD_v1.0.md'
      - 'coding-estate/JM_CODING_ESTATE_RUNNING_STANDARD_v1_0.md'
      - 'services/jm-ecostate-build-mesh-mcp-v0_5/**'
      - '.github/workflows/jm-build-laws-governance-standard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-law-standard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Estate
        uses: actions/checkout@v4
      - name: Validate build laws preferences governance
        run: python3 JM_ESTATE/GOVERNANCE/validate_build_laws_governance.py
      - name: Validate current 64 Coding Estate
        run: python3 coding-estate/validate_current_64_standard.py
      - name: Validate Build Mesh sovereign agent contract
        run: python3 services/jm-ecostate-build-mesh-mcp-v0_5/validate_agent_contract.py
