name: JM Build Mesh Artifact Static Proof

on:
  push:
    branches:
      - build-mesh-artifact-spine-v0-7-2
    paths:
      - ".github/workflows/jm-build-mesh-artifact-static-proof.yml"
      - "services/jm-ecostate-build-mesh-mcp-v0_5/**"

permissions:
  contents: read

jobs:
  static-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import and pressure test
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          root = pathlib.Path("services/jm-ecostate-build-mesh-mcp-v0_5")
          sys.path.insert(0, str(root))
          spec = importlib.util.spec_from_file_location("jm_build_mesh_server", root / "server.py")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)

          assert server.VERSION == "0.7.2"
          names = [t["name"] for t in server.TOOLS]
          assert "plan_artifact_route" in names
          assert len(server.ARTIFACT_SURFACE_PROFILES) == 6
          assert len(server.CAPABILITY_PROFILES) >= 30

          exact = server.resolve_profile("JM ECOSTATE — Build Mesh")
          assert exact["id"] == "ecostate-build-mesh-v102", exact
          versioned = server.resolve_profile("JM ECOSTATE Build Mesh v1.0.4")
          assert versioned["id"] == "ecostate-build-mesh-v102", versioned
          assert server.resolve_profile("totally unrelated weak target phrase") is None

          cases = {
              "book":["docx","pdf","epub","web"],
              "comic":["pdf","cbz","web-reader"],
              "theory":["md","pdf","html"],
              "app":["web","package"],
              "apk":["apk","direct-download-link"],
              "download":["manifest","sha256","direct-download-link"],
          }
          for kind, expected in cases.items():
              out = server.plan_artifact_route({"target":"Secrets of Silence","artifact_type":kind})
              assert out["artifact_type"] == kind
              assert out["surface_profile"]["selected_outputs"] == expected
              assert out["phase"] == "PLAN_ONLY"
              assert out["mutation_performed"] is False
              assert out["delivery_contract"]["direct_route_required"] is True

          gate = server.prepare_operation_gate({
              "target":"JM ECOSTATE — Build Mesh",
              "objective":"artifact-general production routing",
          })
          assert gate["target_profile_id"] == "ecostate-build-mesh-v102", gate
          print("JM_BUILD_MESH_ARTIFACT_STATIC_PROOF_PASS")
          PY
