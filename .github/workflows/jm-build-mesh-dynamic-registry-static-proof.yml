name: JM Build Mesh Dynamic Registry Static Proof

on:
  push:
    branches:
      - build-mesh-dynamic-registry-v0-7-3
    paths:
      - ".github/workflows/jm-build-mesh-dynamic-registry-static-proof.yml"
      - "services/jm-ecostate-build-mesh-mcp-v0_5/**"
  pull_request:
    branches:
      - build-mesh-native-mcp-v0-5
    paths:
      - ".github/workflows/jm-build-mesh-dynamic-registry-static-proof.yml"
      - "services/jm-ecostate-build-mesh-mcp-v0_5/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-registry-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove external registry loading and dynamic hashing
        run: python3 services/jm-ecostate-build-mesh-mcp-v0_5/proof_dynamic_registry.py
      - name: Prove actual remote pinned public-source contact (CI host only)
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          root = pathlib.Path("services/jm-ecostate-build-mesh-mcp-v0_5")
          sys.path.insert(0, str(root))
          spec = importlib.util.spec_from_file_location("jm_build_mesh_server", root / "server.py")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          receipt = server.get_game_reentry_hints({})
          assert receipt["state"] == "PINNED_PUBLIC_SOURCE_CONTACT", receipt
          assert receipt["record_count"] == 7, receipt
          assert receipt["git_blob_sha"] == server.GAME_REENTRY_BLOB_SHA, receipt
          assert receipt["mutation_performed"] is False
          assert receipt["current_head_authority"] == "NOT_ASSERTED"
          print("CI_EXTERNAL_PINNED_GITHUB_CONTACT_PASS_7_OF_7")
          PY
