name: JM Build Mesh Native MCP Hosted Proof

on:
  push:
    branches:
      - build-mesh-native-mcp-v0-5
    paths:
      - ".github/workflows/jm-build-mesh-native-mcp-proof.yml"
      - "services/jm-ecostate-build-mesh-mcp-v0_5/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/jm-build-mesh-native-mcp-proof.yml"
      - "services/jm-ecostate-build-mesh-mcp-v0_5/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate portable sovereign agent contract
        shell: bash
        run: python3 services/jm-ecostate-build-mesh-mcp-v0_5/validate_agent_contract.py

      - name: Cross-host MCP proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib, datetime, os

          BASE = "https://jm-ecostate-build-mesh-mcp.onrender.com"
          MCP = BASE + "/mcp"
          EXPECTED = [
              "search_builds",
              "recover_build",
              "resolve_current_head",
              "proof_state",
              "trace_lineage",
              "continue_build_plan",
              "build_mesh_status",
              "batch_recover_builds",
              "find_capability_donors",
              "compare_builds",
              "build_capability_mesh",
              "detect_propagation_gaps",
              "plan_capability_inheritance",
              "build_sync_contract",
              "prepare_operation_gate",
          ]

          def get(path):
              req = urllib.request.Request(BASE + path, method="GET")
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  return r.status, json.loads(raw.decode("utf-8")) if raw else None

          def rpc(i, method, params=None):
              payload = {"jsonrpc":"2.0","id":i,"method":method,"params":params or {}}
              req = urllib.request.Request(
                  MCP,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type":"application/json","Accept":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = json.loads(r.read().decode("utf-8"))
              if "error" in body:
                  raise AssertionError(f"RPC error for {method}: {body['error']}")
              return body["result"]

          def call(i, name, arguments=None):
              result = rpc(i, "tools/call", {"name":name,"arguments":arguments or {}})
              if result.get("isError"):
                  raise AssertionError(f"Tool {name} returned isError: {result}")
              return result.get("structuredContent") or {}

          ready_status, ready = get("/ready")
          assert ready_status == 200 and ready.get("ready") is True

          init = rpc(1, "initialize", {
              "protocolVersion":"2025-06-18",
              "capabilities":{},
              "clientInfo":{"name":"JM Build Mesh Hosted Proof","version":"0.7.1"},
          })
          assert init["serverInfo"]["name"] == "JM ECOSTATE Build Mesh Native MCP"
          assert init["serverInfo"]["version"] == "0.7.1", init

          listed = rpc(2, "tools/list", {})
          names = [t["name"] for t in listed["tools"]]
          assert names == EXPECTED, names

          status = call(3, "build_mesh_status", {"probe_navigator":True})
          nav = status["navigator_contact"]
          assert nav.get("ok") is True and nav.get("state") == "PASS", nav
          assert status["capability_profiles"] >= 29, status
          assert status["navigator_cache_ttl_seconds"] >= 60, status
          assert status["current_registry_schema"] == "JM.CareerCurrentProjectRegistry/0.4", status
          assert status["current_registry_sha256"] == "fde60cf0274d5380115d938fc099d652af44f0747f354686b99562836a8e905b", status

          llm2 = call(4, "resolve_current_head", {"name":"JM LLM #2"})
          assert llm2["state"] == "CURRENT_DECLARED"
          assert "v2.0" in (llm2.get("current_head") or "")

          unknown = call(5, "resolve_current_head", {"name":"ZZZ totally nonexistent build qqq"})
          assert unknown["state"] == "ABSENCE_NOT_PROVEN", unknown

          lineage = call(6, "trace_lineage", {"name":"RouteOS","limit":4})
          assert lineage["state"] == "PUBLIC_LINEAGE_CONTACT", lineage
          assert len(lineage.get("matches") or []) >= 1

          batch = call(7, "batch_recover_builds", {
              "names":["JM LLM #2","JM AGI Lab v1.4.4","SHIFT//FIELD"]
          })
          assert batch["count"] == 3
          assert batch["results"][0]["navigator_contact"] == "SKIPPED_LOCAL_AUTHORITY_FOUND"

          donors = call(8, "find_capability_donors", {
              "target":"SHIFT//FIELD",
              "objective":"mobile combat camera input and game runtime",
              "limit":8
          })
          donor_names = [d["name"] for d in donors["donors"]]
          assert any("KICSHIFT" in n or "GameCore" in n or "FOURFOLD" in n for n in donor_names), donor_names

          gaps = call(9, "detect_propagation_gaps", {
              "target":"SHIFT//FIELD",
              "objective":"camera combat input",
              "limit":8
          })
          assert gaps["target"]["id"] == "shiftfield"
          assert any(
              any(c in ("camera frame authority","combat input","one-thumb combat") for c in g["candidate_capabilities"])
              for g in gaps["gaps"]
          ), gaps

          inheritance = call(10, "plan_capability_inheritance", {
              "target":"SHIFT//FIELD",
              "objective":"inherit proven combat camera and input donors without rebuilding",
              "max_donors":5
          })
          assert inheritance["mutation_performed"] is False
          assert len(inheritance["donor_plan"]) >= 1

          mesh = call(11, "build_capability_mesh", {
              "builds":["SHIFT//FIELD","KICSHIFT","JM Target Bridge","JM GripCube"],
              "max_nodes":8
          })
          assert len(mesh["nodes"]) >= 4

          comparison = call(12, "compare_builds", {
              "builds":["JM LLM Core","JM LLM #2","JM AGI Lab"]
          })
          assert len(comparison["builds"]) == 3

          search1 = call(13, "search_builds", {"query":"RouteOS","limit":5})
          search2 = call(14, "search_builds", {"query":"RouteOS","limit":5})
          assert search2["navigator"].get("cache") == "HIT", search2["navigator"]

          opportunity = call(15, "resolve_current_head", {"name":"JM Opportunity Front Door"})
          assert opportunity["state"] == "CURRENT_CANDIDATE", opportunity
          assert "v0.8" in (opportunity.get("current_head") or ""), opportunity
          assert "v0.5.1" in opportunity["primary_evidence"]["boundary"], opportunity

          sync = call(16, "build_sync_contract", {"name":"JM Opportunity Front Door"})
          assert sync["hosted_snapshot"]["current_registry_schema"] == "JM.CareerCurrentProjectRegistry/0.4", sync
          assert sync["hosted_snapshot"]["current_registry_sha256"] == "fde60cf0274d5380115d938fc099d652af44f0747f354686b99562836a8e905b", sync
          assert "local" in sync["privacy_rule"].lower(), sync
          assert sync["mutation_performed"] is False

          op_args = {
              "target":"SHIFT//FIELD",
              "objective":"inherit proven combat camera/input donors without rebuilding",
              "action_type":"inherit",
              "intended_change":"add bounded camera authority and combat-input inheritance",
              "donors":["KICSHIFT v1.1","JM Target Bridge"],
          }
          op1 = call(17, "prepare_operation_gate", op_args)
          op2 = call(18, "prepare_operation_gate", op_args)
          assert op1["operation_id"] == op2["operation_id"], (op1,op2)
          assert op1["phase"] == "PLAN_ONLY"
          assert op1["mutation_performed"] is False
          assert "performs no mutation" in op1["host_execution_rule"].lower()

          receipt = {
              "schema":"JM.BuildMesh.HostedMCPProof/0.7.1",
              "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit":os.environ.get("GITHUB_SHA"),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
              "endpoint":MCP,
              "ready":"PASS",
              "initialize":"PASS",
              "tool_count":len(names),
              "tools":names,
              "navigator_donor_contact":"PASS",
              "navigator_cache_second_call":"HIT",
              "capability_profiles":status["capability_profiles"],
              "current_registry_schema":status["current_registry_schema"],
              "current_registry_sha256":status["current_registry_sha256"],
              "opportunity_current_head":opportunity["current_head"],
              "sovereign_sync_contract":"PASS",
              "operation_gate":"PASS_PLAN_ONLY",
              "operation_id":op1["operation_id"],
              "batch_recovery":"PASS",
              "donor_recovery":"PASS",
              "propagation_gap_detection":"PASS",
              "inheritance_planning":"PASS_NON_MUTATING",
              "capability_mesh":"PASS",
              "build_comparison":"PASS",
              "unknown_state":unknown["state"],
              "routeos_lineage_state":lineage["state"],
              "claim_boundary":"Proves hosted v0.7.1 read-only capability-mesh reasoning, sovereign-sync contract generation, deterministic PLAN_ONLY operation gating, batching/caching and Build Mesh→Navigator contact. Raw private Library evidence remains local to the host; no write/mutation authority is claimed.",
          }
          raw = json.dumps(receipt, ensure_ascii=False, indent=2).encode("utf-8")
          receipt["sha256_without_sha_field"] = hashlib.sha256(raw).hexdigest()
          with open("JM_BUILD_MESH_HOSTED_MCP_PROOF_v0_7_1.json","w",encoding="utf-8") as f:
              json.dump(receipt,f,ensure_ascii=False,indent=2)
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Upload proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: JM_BUILD_MESH_HOSTED_MCP_PROOF_v0_7_1
          path: JM_BUILD_MESH_HOSTED_MCP_PROOF_v0_7_1.json
          if-no-files-found: error
