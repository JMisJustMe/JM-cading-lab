name: JM Build Mesh Native MCP Hosted Proof

on:
  push:
    branches:
      - build-mesh-native-mcp-v0-5
    paths:
      - ".github/workflows/jm-build-mesh-native-mcp-proof.yml"
      - "services/jm-ecostate-build-mesh-mcp-v0_5/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Static exact-target and artifact-router proof
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          root = pathlib.Path("services/jm-ecostate-build-mesh-mcp-v0_5")
          sys.path.insert(0, str(root))
          spec = importlib.util.spec_from_file_location("jm_build_mesh_server", root / "server.py")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)

          assert server.VERSION == "0.8.5"
          exact = server.resolve_profile("JM ECOSTATE — Build Mesh")
          assert exact and exact["id"] == "ecostate-build-mesh-v102", exact
          versioned = server.resolve_profile("JM ECOSTATE Build Mesh v1.0.10")
          assert versioned and versioned["id"] == "ecostate-build-mesh-v102", versioned
          assert server.resolve_profile("totally unrelated weak target phrase") is None

          # Regression: fuzzy discovery may still surface candidates, but named
          # authority/profile resolution must fail closed for unseated identities.
          false_crown_queries = [
              "Source to Body — The Complete Body Foundry",
              "JM Living Notebook / Estate Operating Tool",
              "JM GAME NATIVE CORE + Apps & Tools Plus",
          ]
          for query in false_crown_queries:
              assert server.current_identity_matches(query, 10) == [], query
              assert server.resolve_profile(query) is None, query
              assert server.current_matches(query, 10), "Discovery should remain available: " + query
          llm_authority = server.resolve_current_head({"name":"JM LLM Core"})
          assert llm_authority["state"] == "CURRENT_DECLARED", llm_authority
          assert llm_authority["current_head"] == "JM LLM Core v1.14 — Symbiosis Cycle 014", llm_authority
          assert llm_authority.get("competing_candidates") == [], llm_authority
          print("STATIC_AUTHORITY_TIER_PRECEDENCE_PASS")
          print("STATIC_AUTHORITY_IDENTITY_REGRESSION_PASS")

          book = server.plan_artifact_route({
              "target":"Secrets of Silence",
              "artifact_type":"book",
              "outputs":["pdf","epub","web"],
          })
          assert book["artifact_type"] == "book"
          assert book["surface_profile"]["selected_outputs"] == ["pdf","epub","web"]
          assert book["delivery_contract"]["direct_route_required"] is True
          assert book["mutation_performed"] is False

          comic = server.plan_artifact_route({
              "target":"FTR — The Massive Push",
              "artifact_type":"comic",
              "outputs":["pdf","cbz","web-reader"],
              "objective":"recover exact comic authority before descendant production",
          })
          assert comic["artifact_type"] == "comic"
          assert comic["surface_profile"]["selected_outputs"] == ["pdf","cbz","web-reader"]
          assert comic["hosted_authority_state"] == "CURRENT_DECLARED", comic
          assert comic["target_profile_id"] == "ftr-massive-push-v1", comic

          theory = server.plan_artifact_route({"target":"JM Theory Estate","artifact_type":"theory","outputs":["md","pdf","html"]})
          assert theory["target_profile_id"] == "theory-second-order", theory
          assert theory["hosted_authority_state"] == "CURRENT_DECLARED", theory
          app = server.plan_artifact_route({"target":"JM LEGAL — Matter Router v0.8.2 + Pre-External Pilot Gate v1.1","artifact_type":"app","outputs":["web","package"]})
          assert app["target_profile_id"] == "legal-v11", app
          assert app["hosted_authority_state"] == "CURRENT_DECLARED", app
          apk = server.plan_artifact_route({"target":"JM Living Estate","artifact_type":"apk","outputs":["apk","direct-download-link"]})
          assert apk["target_profile_id"] == "living-estate-apk", apk
          assert apk["hosted_authority_state"] == "CURRENT_DECLARED", apk
          downloadable = server.plan_artifact_route({"target":"JM LLM #2","artifact_type":"download","outputs":["manifest","sha256","direct-download-link"]})
          assert downloadable["target_profile_id"] == "llm2-v2", downloadable
          assert downloadable["hosted_authority_state"] == "CURRENT_DECLARED", downloadable

          keeper = server.estate_keeper_contract({"scope":"private Library delta maintenance","last_checkpoint":"PASS_84","changed_count":0,"unresolved_count":0})
          assert keeper["schema"] == "JM.BuildMesh.EstateKeeperContract/0.7.6", keeper
          assert keeper["no_census_default"] is True and keeper["destructive_default"] == "HOLD" and keeper["mutation_performed"] is False

          mesh = server.build_capability_mesh({"builds":["32_Cb","JM32-1DA"],"max_nodes":4})
          declared = [edge for edge in mesh["edges"] if edge.get("relation") == "DECLARED_RELATION" and edge.get("declared_relation") == "ANCESTRAL_DONOR_TO_RUNTIME_ROUTE_EXPANSION"]
          assert len(declared) == 1 and declared[0]["merge"] is False and declared[0]["proof_transfer"] is False
          adapter = server.resolve_profile("JM32-1DA Cross-Device Runtime Adapter")
          assert adapter and adapter["id"] == "jm32-1da-cross-device-adapter-v02", adapter

          llm = server.resolve_profile("JM LLM Core")
          assert llm and llm["id"] == "llm-core-v1", llm
          assert llm["name"] == "JM LLM Core v1.14 — Symbiosis Cycle 014", llm
          for capability in [
              "bounded modular arithmetic","bounded ordinary mathematical induction","bounded propositional truth tables",
              "bounded predicate-quantifier formalization","bounded elementary combinatorics","bounded finite discrete probability",
              "bounded matrix algebra","bounded exact-rational 2x2 spectral work","bounded exact-rational 2x2 singular value decomposition",
              "exact rational 2x2 singular values","exact rational 2x2 U Sigma V^T","exact 2x2 SVD reconstruction verification",
              "2x2 spectral norm","2x2 condition number from SVD","2x2 rank from SVD","bounded exact-rational triangular 3x3 spectral work",
              "3x3 characteristic polynomial","triangular 3x3 eigenvalues","explicit 3x3 eigenpair verification","concurrent capability convergence",
              "bounded exact-rational 2x2 Moore-Penrose pseudoinverse","rank-0 2x2 pseudoinverse","rank-1 2x2 pseudoinverse","rank-2 2x2 pseudoinverse","exact four-Penrose-identity verification",
              "bounded exact-rational 2x2 minimum-norm least squares","rank-1 inconsistent minimum-norm least-squares solution","exact normal-equation verification","exact minimum-norm row-space certification",
              "bounded exact-rational 2x2 column-space orthogonal projection","exact 2x2 column-space projector Q=A A+","exact projection p=Qb","exact residual decomposition r=b-p","exact residual orthogonality A^T r=0","exact projector symmetry and idempotence","exact projection candidate verification","bounded exact-rational unnormalised two-vector Gram-Schmidt in R2","exact classical ordered Gram-Schmidt u1/u2","dependent two-vector Gram-Schmidt handling","exact Gram-Schmidt candidate verification","bounded exact-rational unnormalised three-vector Gram-Schmidt in R2","exact classical ordered three-vector Gram-Schmidt u1/u2/u3","dependent-middle three-vector Gram-Schmidt handling","fully-dependent three-vector Gram-Schmidt handling","exact three-vector Gram-Schmidt candidate verification","cross-cycle capability retention"
          ]:
              assert capability in llm["capabilities"], (capability,llm)
          assert "singular value decomposition" not in llm["open_frontiers"], llm
          assert "arbitrary/rectangular/3x3+ SVD" in llm["open_frontiers"], llm
          assert "general non-triangular 3x3 eigensolvers" in llm["open_frontiers"], llm
          assert "4x4+ eigensolvers" in llm["open_frontiers"], llm
          assert "bounded exact-rational 2x2 Moore-Penrose pseudoinverse" in llm["capabilities"], llm
          assert "rectangular/3x3+ pseudoinverse" in llm["open_frontiers"], llm
          assert "numerical-tolerance pseudoinverse" in llm["open_frontiers"], llm
          assert "rectangular/3x3+ least squares" in llm["open_frontiers"], llm
          assert "numerical-tolerance least squares" in llm["open_frontiers"], llm
          assert "weighted least squares" in llm["open_frontiers"], llm
          assert "rectangular/3x3+ orthogonal projection" in llm["open_frontiers"], llm
          assert "numerical-tolerance projection" in llm["open_frontiers"], llm
          assert "weighted projection" in llm["open_frontiers"], llm
          assert "oblique projection" in llm["open_frontiers"], llm
          assert "normalized/orthonormal Gram-Schmidt" in llm["open_frontiers"], llm
          assert "R3+ Gram-Schmidt" in llm["open_frontiers"], llm
          assert "four-vector+ Gram-Schmidt" in llm["open_frontiers"], llm
          assert "QR factorization" in llm["open_frontiers"], llm
          return_mesh = server.build_capability_mesh({"builds":["JM LLM Core","JM ECOSTATE Build Mesh"],"max_nodes":4})
          returned = [edge for edge in return_mesh["edges"] if edge.get("relation") == "DECLARED_RELATION" and edge.get("declared_relation") == "SYMBIOSIS_CAPABILITY_RETURN_TO_ECOSTATE"]
          assert len(returned) == 1, return_mesh
          assert returned[0]["from"] == "llm-core-v1" and returned[0]["to"] == "ecostate-build-mesh-v102", returned[0]
          assert returned[0]["merge"] is False and returned[0]["proof_transfer"] is False, returned[0]
          print("STATIC_LLM_V1_14_CYCLE014_RETURN_PASS")

          print("STATIC_ARTIFACT_FACTORY_FEED_BATCH_01_PASS")
          PY

      - name: Dynamic registry exact-byte proof
        shell: bash
        run: python3 services/jm-ecostate-build-mesh-mcp-v0_5/proof_dynamic_registry.py

      - name: Cross-host MCP proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib, datetime, os, time

          BASE = "https://jm-ecostate-build-mesh-mcp.onrender.com"
          MCP = BASE + "/mcp"
          EXPECTED = [
              "search_builds",
              "recover_build",
              "resolve_current_head",
              "proof_state",
              "trace_lineage",
              "continue_build_plan",
              "build_mesh_status",
              "batch_recover_builds",
              "find_capability_donors",
              "compare_builds",
              "build_capability_mesh",
              "detect_propagation_gaps",
              "plan_capability_inheritance",
              "build_sync_contract",
              "estate_keeper_contract",
              "plan_artifact_route",
              "prepare_operation_gate",
          ]

          def get(path):
              req = urllib.request.Request(BASE + path, method="GET")
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  return r.status, json.loads(raw.decode("utf-8")) if raw else None

          def rpc(i, method, params=None):
              payload = {"jsonrpc":"2.0","id":i,"method":method,"params":params or {}}
              req = urllib.request.Request(
                  MCP,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type":"application/json","Accept":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = json.loads(r.read().decode("utf-8"))
              if "error" in body:
                  raise AssertionError(f"RPC error for {method}: {body['error']}")
              return body["result"]

          def call(i, name, arguments=None):
              result = rpc(i, "tools/call", {"name":name,"arguments":arguments or {}})
              if result.get("isError"):
                  raise AssertionError(f"Tool {name} returned isError: {result}")
              return result.get("structuredContent") or {}

          registry_raw = open("services/jm-ecostate-build-mesh-mcp-v0_5/current_registry.json","rb").read()
          expected_registry_sha256 = hashlib.sha256(registry_raw).hexdigest()
          init = None
          last_ready = None
          last_registry_sha256 = None
          for attempt in range(60):
              try:
                  ready_status, last_ready = get("/ready")
                  if ready_status == 200 and last_ready.get("ready") is True:
                      probe = rpc(900 + attempt, "initialize", {
                          "protocolVersion":"2025-06-18",
                          "capabilities":{},
                          "clientInfo":{"name":"JM Build Mesh Hosted Proof Poll","version":"0.8.5"},
                      })
                      if probe["serverInfo"].get("version") == "0.8.5":
                          candidate_status = call(1900 + attempt, "build_mesh_status", {"probe_navigator":False})
                          last_registry_sha256 = candidate_status.get("current_registry_sha256")
                          if last_registry_sha256 == expected_registry_sha256:
                              init = probe
                              break
              except Exception:
                  pass
              time.sleep(10)

          assert init is not None, (
              f"Hosted v0.8.5 with registry {expected_registry_sha256} did not become live in time; "
              f"last_ready={last_ready}; last_registry_sha256={last_registry_sha256}"
          )
          assert init["serverInfo"]["name"] == "JM ECOSTATE Build Mesh Native MCP"

          listed = rpc(2, "tools/list", {})
          names = [t["name"] for t in listed["tools"]]
          assert names == EXPECTED, names

          status = call(3, "build_mesh_status", {"probe_navigator":True})
          nav = status["navigator_contact"]
          assert nav.get("ok") is True and nav.get("state") == "PASS", nav
          assert status["capability_profiles"] == 34, status
          assert status["current_project_records"] == 22, status
          assert status["artifact_surface_profiles"] == 6, status
          assert status["current_registry_schema"] == "JM.CareerCurrentProjectRegistry/0.21", status
          assert status["current_registry_sha256"] == expected_registry_sha256, status
          assert status["current_registry_source"] == "current_registry.json", status
          assert status["current_registry_hash_mode"] == "SHA256_EXACT_LOADED_BYTES", status
          assert status["current_registry_reload_policy"] == "PROCESS_START", status

          false_crown_results = {}
          false_crown_queries = [
              "Source to Body — The Complete Body Foundry",
              "JM Living Notebook / Estate Operating Tool",
              "JM GAME NATIVE CORE + Apps & Tools Plus",
          ]
          for idx, query in enumerate(false_crown_queries):
              head = call(30 + idx * 2, "resolve_current_head", {"name":query})
              recovered = call(31 + idx * 2, "recover_build", {"name":query,"limit":5})
              assert head["state"] == "SNAPSHOT_ONLY", head
              assert head["current_head"] is None, head
              assert recovered["resolution_state"] == "SNAPSHOT_ONLY", recovered
              assert recovered["best_current_match"] is None, recovered
              assert recovered["resolution_basis"] == "NAVIGATOR_SNAPSHOT", recovered
              false_crown_results[query] = {
                  "resolve_state":head["state"],
                  "recover_state":recovered["resolution_state"],
                  "resolution_basis":recovered["resolution_basis"],
              }

          assert status["estate_keeper_contract_schema"] == "JM.BuildMesh.EstateKeeperContract/0.7.6", status
          keeper = call(11, "estate_keeper_contract", {
              "scope":"private Library delta maintenance",
              "last_checkpoint":"PASS_84",
              "changed_count":0,
              "unresolved_count":0,
          })
          assert keeper["schema"] == "JM.BuildMesh.EstateKeeperContract/0.7.6", keeper
          assert keeper["no_census_default"] is True, keeper
          assert keeper["destructive_default"] == "HOLD", keeper
          assert keeper["mutation_performed"] is False, keeper

          build_mesh = call(4, "detect_propagation_gaps", {
              "target":"JM ECOSTATE — Build Mesh",
              "objective":"artifact-general production routing",
              "limit":4,
          })
          assert build_mesh["target"]["id"] == "ecostate-build-mesh-v102", build_mesh
          assert build_mesh["target"]["name"] == "JM ECOSTATE — Build Mesh", build_mesh

          book = call(5, "plan_artifact_route", {
              "target":"Secrets of Silence",
              "artifact_type":"book",
              "outputs":["pdf","epub","web"],
              "objective":"publication descendants with direct verified routes",
          })
          assert book["artifact_type"] == "book", book
          assert book["target_profile_id"] == "secrets-v13", book
          assert book["surface_profile"]["selected_outputs"] == ["pdf","epub","web"], book
          assert book["delivery_contract"]["direct_route_required"] is True
          assert book["mutation_performed"] is False
          assert book["hosted_authority_state"] == "CURRENT_DECLARED", book

          comic = call(6, "plan_artifact_route", {
              "target":"FTR — The Massive Push",
              "artifact_type":"comic",
              "outputs":["pdf","cbz","web-reader"],
              "objective":"recover exact comic authority before descendant production",
          })
          assert comic["artifact_type"] == "comic", comic
          assert comic["surface_profile"]["selected_outputs"] == ["pdf","cbz","web-reader"], comic
          assert comic["hosted_authority_state"] == "CURRENT_DECLARED", comic
          assert comic["target_profile_id"] == "ftr-massive-push-v1", comic

          theory = call(7, "plan_artifact_route", {
              "target":"JM Theory Estate",
              "artifact_type":"theory",
              "outputs":["md","pdf","html"],
              "objective":"public-safe theory descendants with claim jurisdiction preserved",
          })
          assert theory["target_profile_id"] == "theory-second-order", theory
          assert theory["hosted_authority_state"] == "CURRENT_DECLARED", theory

          app = call(8, "plan_artifact_route", {
              "target":"JM LEGAL — Matter Router v0.8.2 + Pre-External Pilot Gate v1.1",
              "artifact_type":"app",
              "outputs":["web","package"],
              "objective":"route current Matter Router without inflating QA into client proof",
          })
          assert app["target_profile_id"] == "legal-v11", app
          assert app["hosted_authority_state"] == "CURRENT_DECLARED", app

          apk = call(9, "plan_artifact_route", {
              "target":"JM Living Estate",
              "artifact_type":"apk",
              "outputs":["apk","direct-download-link"],
              "objective":"Android package route with install/device proof kept separate",
          })
          assert apk["artifact_type"] == "apk", apk
          assert apk["target_profile_id"] == "living-estate-apk", apk
          assert apk["hosted_authority_state"] == "CURRENT_DECLARED", apk
          assert apk["surface_profile"]["selected_outputs"] == ["apk","direct-download-link"], apk

          downloadable = call(10, "plan_artifact_route", {
              "target":"JM LLM #2",
              "artifact_type":"download",
              "outputs":["manifest","sha256","direct-download-link"],
              "objective":"bind package identity to a direct delivery route without transferring execution proof",
          })
          assert downloadable["target_profile_id"] == "llm2-v2", downloadable
          assert downloadable["hosted_authority_state"] == "CURRENT_DECLARED", downloadable
          assert downloadable["surface_profile"]["selected_outputs"] == ["manifest","sha256","direct-download-link"], downloadable

          mesh = call(13, "build_capability_mesh", {
              "builds":["32_Cb","JM32-1DA"],
              "max_nodes":4,
          })
          declared = [
              edge for edge in mesh["edges"]
              if edge.get("relation") == "DECLARED_RELATION"
              and edge.get("declared_relation") == "ANCESTRAL_DONOR_TO_RUNTIME_ROUTE_EXPANSION"
          ]
          assert len(declared) == 1, mesh
          relation_edge = declared[0]
          assert relation_edge["from"] == "32cb-v21" and relation_edge["to"] == "jm32-1da-v221", relation_edge
          assert relation_edge["merge"] is False and relation_edge["proof_transfer"] is False, relation_edge

          adapter_mesh = call(14, "build_capability_mesh", {
              "builds":["JM32-1DA","JM32-1DA Cross-Device Runtime Adapter"],
              "max_nodes":4,
          })
          adapter_edges = [
              edge for edge in adapter_mesh["edges"]
              if edge.get("relation") == "DECLARED_RELATION"
              and edge.get("declared_relation") == "HAS_SEPARATE_CROSS_DEVICE_ADAPTER"
          ]
          assert len(adapter_edges) == 1, adapter_mesh
          adapter_edge = adapter_edges[0]
          assert adapter_edge["from"] == "jm32-1da-v221" and adapter_edge["to"] == "jm32-1da-cross-device-adapter-v02", adapter_edge
          assert adapter_edge["merge"] is False and adapter_edge["proof_transfer"] is False, adapter_edge

          llm_head = call(15, "resolve_current_head", {"name":"JM LLM Core"})
          assert llm_head["state"] == "CURRENT_DECLARED", llm_head
          assert "v1.14" in llm_head["current_head"] and "Cycle 014" in llm_head["current_head"], llm_head
          llm_proof = call(16, "proof_state", {"name":"JM LLM Core"})
          assert "96934/96934 PASS" in llm_proof["proof"], llm_proof
          llm_cycle014_return = call(17, "build_capability_mesh", {
              "builds":["JM LLM Core","JM ECOSTATE Build Mesh"],
              "max_nodes":4,
          })
          returned = [
              edge for edge in llm_cycle014_return["edges"]
              if edge.get("relation") == "DECLARED_RELATION"
              and edge.get("declared_relation") == "SYMBIOSIS_CAPABILITY_RETURN_TO_ECOSTATE"
          ]
          assert len(returned) == 1, llm_cycle014_return
          return_edge = returned[0]
          assert return_edge["from"] == "llm-core-v1" and return_edge["to"] == "ecostate-build-mesh-v102", return_edge
          assert return_edge["merge"] is False and return_edge["proof_transfer"] is False, return_edge

          op_args = {
              "target":"JM ECOSTATE — Build Mesh",
              "objective":"host-execute artifact-general production while preserving public MCP read-only authority",
              "action_type":"artifact-build",
              "intended_change":"execute a surface-specific artifact plan through an authorized host then read back the consequence",
          }
          op1 = call(11, "prepare_operation_gate", op_args)
          op2 = call(12, "prepare_operation_gate", op_args)
          assert op1["operation_id"] == op2["operation_id"], (op1, op2)
          assert op1["target_profile_id"] == "ecostate-build-mesh-v102", op1
          assert op1["phase"] == "PLAN_ONLY" and op1["mutation_performed"] is False

          receipt = {
              "schema":"JM.BuildMesh.HostedMCPProof/0.8.5-r21-cycle014",
              "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit":os.environ.get("GITHUB_SHA"),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
              "endpoint":MCP,
              "ready":"PASS",
              "initialize":"PASS",
              "tool_count":len(names),
              "tools":names,
              "navigator_donor_contact":"PASS",
              "capability_profiles":status["capability_profiles"],
              "artifact_surface_profiles":status["artifact_surface_profiles"],
              "current_registry_schema":status["current_registry_schema"],
              "current_registry_sha256":status["current_registry_sha256"],
              "current_registry_source":status["current_registry_source"],
              "current_registry_loaded_bytes":status["current_registry_loaded_bytes"],
              "current_registry_hash_mode":status["current_registry_hash_mode"],
              "exact_target_identity":"PASS",
              "authority_identity_regression":"PASS",
              "false_crown_cases":false_crown_results,
              "build_mesh_profile_id":build_mesh["target"]["id"],
              "artifact_router":"PASS_PLAN_ONLY",
              "factory_feed_batch_01":{
                  "book":{"target":"Secrets of Silence","route_id":book["route_id"],"authority_state":book["hosted_authority_state"],"profile":book["target_profile_id"]},
                  "comic":{"target":"FTR — The Massive Push","route_id":comic["route_id"],"authority_state":comic["hosted_authority_state"],"profile":comic["target_profile_id"],"authority_gate":"ROUTE_READY_AT_HOSTED_AUTHORITY"},
                  "theory":{"target":"JM Theory Estate","route_id":theory["route_id"],"authority_state":theory["hosted_authority_state"],"profile":theory["target_profile_id"]},
                  "app":{"target":"JM LEGAL — Matter Router v0.8.2 + Pre-External Pilot Gate v1.1","route_id":app["route_id"],"authority_state":app["hosted_authority_state"],"profile":app["target_profile_id"]},
                  "apk":{"target":"JM Living Estate","route_id":apk["route_id"],"authority_state":apk["hosted_authority_state"],"profile":apk["target_profile_id"]},
                  "download":{"target":"JM LLM #2","route_id":downloadable["route_id"],"authority_state":downloadable["hosted_authority_state"],"profile":downloadable["target_profile_id"]},
              },
              "llm_cycle014_return":{
                  "state":"PASS",
                  "body":"JM LLM Core v1.14 — Symbiosis Cycle 014",
                  "canonical_parent":"JM LLM Core v1.13 — Symbiosis Cycle 013",
                  "parent_recontact":"89198/89198 PASS",
                  "child_release":"96934/96934 PASS",
                  "release_smoke":"12/12 PASS",
                  "heldout_router":"2400/2400 PASS",
                  "exact_three_vector_gram_schmidt_r2":"1800/1800 PASS (600 rank2-first-two-independent / 600 middle-dependent-third-independent / 600 fully-dependent)",
                  "candidate_verification":"800/800 PASS",
                  "frontier_safety":"300/300 PASS",
                  "cycle013_surface_preservation":"2400/2400 PASS (2312 bypass / 88 lawful HOLD intercept)",
                  "same_condition_before_after":"24/24 PASS",
                  "canonical_release_sha256":"241c282cbb7c75b7314d627906a2062e5d1b1b462358a7fdb308ba3df97b56f2",
                  "library_version_house":"v1.14 Symbiosis Cycle 014",
                  "library_root_current_release":"00_CURRENT_RELEASE_v1_14.zip",
                  "predecessor_release":"00_CURRENT_RELEASE_v1_13_PREDECESSOR.zip",
                  "declared_relation":return_edge["declared_relation"],
                  "merge":return_edge["merge"],
                  "proof_transfer":return_edge["proof_transfer"],
              },
              "jm32_cross_device_adapter_relation":{
