name: JM CP15 real public five-organ GET-only contact
on:
  pull_request:
    paths:
      - 'agent-runtime/host-adapters/jm-operated-host/public-organs-contact.mjs'
      - 'agent-runtime/host-adapters/jm-operated-host/public-organs-contact.test.mjs'
      - '.github/workflows/jm-cloud-contact-cp15-public-five-organs.yml'
      - 'docs/JM_CLOUD_CONTACT_CP15_PUBLIC_ORGAN_CONTACT.md'
      - 'agent-runtime/host-adapters/jm-operated-host/independent-host-admission.mjs'
      - 'agent-runtime/host-adapters/jm-operated-host/independent-host-admission.test.mjs'
      - 'agent-runtime/host-adapters/jm-operated-host/independent-host-integration-v051.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-and-integration:
    name: Full inheritance, original host and actual PostgreSQL recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cp09_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JM_CP10_CI_TEST_DATABASES: YES_DISPOSABLE_ONLY
      JM_CP09_CI_TEST_DATABASES: YES_ONLY_DISPOSABLE
    steps:
      - name: Check out exactly the consolidated draft source, without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover authentic unchanged original donor by exact commit
        uses: actions/checkout@v4
        with:
          repository: JMisJustMe/jm-cloud-contact-server-first-cloud
          ref: 0921217d95285bcb21cda7a995d02f7ec0725810
          path: .jm-converged-donor
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL 16 client and original donor runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          test "$(git -C .jm-converged-donor rev-parse HEAD)" = 0921217d95285bcb21cda7a995d02f7ec0725810
          npm install --prefix .jm-converged-donor --omit=dev --ignore-scripts --no-audit --no-fund
      - name: One complete inherited regression suite, no duplicated reruns
        run: |
          set -euo pipefail
          node --test agent-runtime/host-adapters/jm-operated-host/*.test.mjs
      - name: Real PostgreSQL cold recovery, coordinated original-server recovery, and pinned signer across restart
        run: |
          set -euo pipefail
          node agent-runtime/host-adapters/jm-operated-host/market-postgres-integration.mjs "$RUNNER_TEMP/JM_CONVERGED_CP09_TEST.json"
          # Two independent existing integration harnesses use distinct *public disposable* passwords.
          # Rotate only the ephemeral CI postgres service between them, never a real database.
          PGPASSWORD=cp09_test_only psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'cp10_disposable_only'"
          node agent-runtime/host-adapters/jm-operated-host/coordinated-integration-v051.mjs "$GITHUB_WORKSPACE/.jm-converged-donor" "$RUNNER_TEMP/JM_CONVERGED_CP10_TEST.json"
          node agent-runtime/host-adapters/jm-operated-host/independent-host-integration-v051.mjs "$GITHUB_WORKSPACE/.jm-converged-donor" "$RUNNER_TEMP/JM_CONVERGED_CP12_TEST.json"
      - name: Emit bounded, non-sensitive proof only
        run: |
          node -e "const fs=require('fs'),p=process.env.RUNNER_TEMP+'/JM_CONVERGED_CP12_TEST.json',v=JSON.parse(fs.readFileSync(p));if(!v.ok||v.passed<9||v.failed!==0||!v.checks.some(x=>x.name==='original_receipt_signer_identity_survives_second_process_start'))process.exit(1);console.log(JSON.stringify({ok:true,scope:'INHERITED_TRUE_SOURCE_RESTART_KEY_IDENTITY_PROOF',checks:v.passed}))"
  live-five-organs:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout draft code only; no deploy
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce original CP14 and CP15 guard tests
        run: |
          node --test agent-runtime/host-adapters/jm-operated-host/public-readiness-contact.test.mjs
          node --test agent-runtime/host-adapters/jm-operated-host/public-organs-contact.test.mjs
      - name: Probe real pinned HTTPS public functional organ endpoints; no auth, POST or private data
        run: |
          node agent-runtime/host-adapters/jm-operated-host/public-organs-contact.mjs | tee "$RUNNER_TEMP/JM_CP15_SAFE_RECEIPT.json"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1]));if(!r.ok||r.pathsChecked!==10||Object.keys(r.organs).length!==5)process.exit(1)" "$RUNNER_TEMP/JM_CP15_SAFE_RECEIPT.json"
      - name: Save only sanitized public response evidence
        uses: actions/upload-artifact@v4
        with:
          name: JM_CP15_PUBLIC_FIVE_ORGAN_CONTACT_RECEIPT
          path: ${{ runner.temp }}/JM_CP15_SAFE_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
