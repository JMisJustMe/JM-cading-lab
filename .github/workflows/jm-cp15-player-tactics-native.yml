name: JM CP15 Original JourMaze player route deck and native Fold APK
on:
  pull_request:
    paths:
      - 'coding-estate/integration/codegornization-cp15/**'
      - '.github/workflows/jm-cp15-player-tactics-native.yml'
      - 'registry/build-routes/JM_CP15_JOURMAZE_PLAYER_NATIVE_BUILD_ROUTE_MANIFEST_v0.1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recover exact native ancestors and official engine templates
        run: |
          node coding-estate/everybody/role-qualified-61/kocodifying/kocodifying-source-aware-smoke.mjs
          node coding-estate/everybody/role-qualified-61/jmlogic/jmlogic-source-aware-smoke.mjs
          node coding-estate/integration/codegornization-cp15/prepare-native.mjs
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.2-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -o /tmp/templates.tpz
          echo 'ea50e5183f057d42b22120d0d0340205b98f51f8ff13c33c70fd4ac9077d2019  /tmp/templates.tpz' | sha256sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          unzip -p /tmp/templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.5.2.stable/android_debug.apk"
      - name: Actual native regression and input lifecycle
        working-directory: coding-estate/integration/codegornization-cp11
        run: |
          mkdir -p evidence
          Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --editor --import --quit > evidence/import.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/inherited_on_cp03.gd > evidence/inherited.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cp02_on_cp03.gd > evidence/cp02.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cold_on_cp03.gd > evidence/cold.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/native_input_test.gd > evidence/input.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_native_test.gd > evidence/director.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/director_cold_test.gd > evidence/director-cold.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cp08_tactics_test.gd > evidence/cp08-tactics.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cp09_living_rivals_test.gd > evidence/cp09-living.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cp10_ko_contact_test.gd > evidence/cp10-ko-native.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cp11_ko_live_test.gd > evidence/cp11-live-native.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cp11_converged_native_test.gd > evidence/cp11-converged-native.log 2>&1
          node verify-converged-return.mjs > evidence/cp11-converged-ko-reverse.log 2>&1
          timeout 60s Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --script res://tests/cp15_route_native_test.gd > evidence/cp15-player-native.log 2>&1
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('evidence/cp11-converged-native.log').read_text()
          m=re.search(r'CP11 CONVERGED SUMMARY (\d+)/(\d+)',text)
          assert m and int(m[1])==int(m[2]) and int(m[1])>=20,'CONVERGENCE_NATIVE_ASSERTION_HOLD'
          print('Independent native source-to-live-return checks:',m[0])
          PY
          # Headless Godot tests may return 0 despite scripting errors after assertions.
          # A native PASS is not earned until the raw execution log is error-free.
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' evidence/cp11-live-native.log evidence/cp11-converged-native.log evidence/cp15-player-native.log; then
            echo "::error::CP11 native script error despite assertions"
            exit 1
          fi
          grep -q 'CP11 KO LIVE SUMMARY 21/21' evidence/cp11-live-native.log
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('evidence/cp15-player-native.log')
          t=p.read_text()
          match=re.search(r'CP15 PLAYER SUMMARY (\d+)/(\d+)',t)
          assert match and int(match[1])==int(match[2]) and int(match[2])>=20, 'CP15_PLAYER_NATIVE_HOLD'
          assert not re.search(r'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load',t), 'CP15_NATIVE_SCRIPT_HOLD'
          result=pathlib.Path('evidence/cp15-player-native.json')
          assert result.exists() and result.stat().st_size>50, 'CP15_NO_REAL_NATIVE_RECEIPT'
          print('CP15 grounded native gameplay:',match[0])
          PY
      - name: Configure exact native Android export
        run: |
          mkdir -p "$HOME/.config/godot" /tmp/cp03-custody
          keytool -genkeypair -keystore /tmp/cp03-custody/debug.keystore -alias androiddebugkey -storepass android -keypass android -dname 'CN=JM CP15 Native Test,O=JM ECOSTATE,C=GB' -keyalg RSA -keysize 2048 -validity 10000
          python3 - <<'PY'
          import pathlib,os,json
          cfg=pathlib.Path.home()/'.config/godot/editor_settings-4.5.tres'
          settings={'export/android/android_sdk_path':os.environ['ANDROID_HOME'],'export/android/java_sdk_path':os.environ['JAVA_HOME'],'export/android/debug_keystore':'/tmp/cp03-custody/debug.keystore','export/android/debug_keystore_user':'androiddebugkey','export/android/debug_keystore_pass':'android'}
          cfg.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'+'\n'.join(k+' = '+json.dumps(v) for k,v in settings.items())+'\n')
          PY
      - name: Build actual signed ARM64 Godot APK
        working-directory: coding-estate/integration/codegornization-cp11
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/cp03-custody/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          Godot_v4.5.2-stable_linux.x86_64 --headless --path godot --export-debug 'Android Fold CP15' "$PWD/JM_SLINGFALL_CP15_ROUTE_DECK_FOLD_TEST.apk" > evidence/export.log 2>&1
          python3 - <<'PY'
          import pathlib,os,subprocess,zipfile,json,hashlib,struct
          apk=pathlib.Path('JM_SLINGFALL_CP11_KO_LIVE_NATIVE_FOLD_TEST.apk')
          assert apk.is_file()
          tools=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1].parent
          r=subprocess.run([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],check=True,capture_output=True,text=True)
          pathlib.Path('evidence/signature.txt').write_text(r.stdout)
          r=subprocess.run([str(tools/'aapt'),'dump','badging',str(apk)],check=True,capture_output=True,text=True)
          pathlib.Path('evidence/badging.txt').write_text(r.stdout)
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            assert 'lib/arm64-v8a/libgodot_android.so' in z.namelist()
            assert not any(n.endswith('.html') for n in z.namelist())
            alignment=[]
            for name in z.namelist():
              if name.startswith('lib/arm64-v8a/') and name.endswith('.so'):
                b=z.read(name);assert b[:4]==b'\x7fELF' and b[4]==2
                off=struct.unpack_from('<Q',b,32)[0];size,count=struct.unpack_from('<HH',b,54)
                for i in range(count):
                  ph=struct.unpack_from('<IIQQQQQQ',b,off+i*size)
                  if ph[0]==1:
                    assert ph[7]>=16384 and ph[2]%16384==ph[3]%16384,(name,ph[7])
                    alignment.append({'library':name,'segment':i,'alignment':ph[7],'congruent16K':True})
            pathlib.Path('evidence/native-16k-alignment.json').write_text(json.dumps(alignment,indent=2))
          r=subprocess.run([str(tools/'zipalign'),'-c','-P','16','-v','4',str(apk)],check=True,capture_output=True,text=True)
          pathlib.Path('evidence/zipalign.txt').write_text(r.stdout)
          pathlib.Path('evidence/android-package.json').write_text(json.dumps({'status':'PROVEN','scope':'actual signed native Godot ARM64 APK construction, signature, ELF16K and ZIP alignment verification; install/launch/physical owner-device NOT TESTED','bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run':os.environ['GITHUB_RUN_ID']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jm-cp15-jourmaze-native-tactics-fold-apk-and-evidence
          path: |
            coding-estate/integration/codegornization-cp11/JM_SLINGFALL_CP11_KO_LIVE_NATIVE_FOLD_TEST.apk
            coding-estate/integration/codegornization-cp11/evidence/
            coding-estate/integration/codegornization-cp15/evidence/
          retention-days: 30
