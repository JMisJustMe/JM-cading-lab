name: Build JM Estate Compass clean Android host

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-compass-clean/**'
      - '.github/workflows/jm-estate-compass-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned release APK
        run: gradle --no-daemon -p android-compass-clean :app:assembleRelease
      - name: Align APK and collect official signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            android-compass-clean/app/build/outputs/apk/release/app-release-unsigned.apk \
            artifact/JM_ESTATE_COMPASS_v1_2_STANDARD_UNSIGNED_ALIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifact/apksigner.jar
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jm-estate-compass-v1-2-standard-unsigned
          path: artifact/
          if-no-files-found: error
          retention-days: 7
