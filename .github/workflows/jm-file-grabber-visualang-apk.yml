name: Build JM File Grabber Visualang APK
on:
  push:
    branches: ["build/file-grabber-visualang-v0-3"]
    paths:
      - "android/JMFileGrabberVisualang-v0.3/**"
      - ".github/workflows/jm-file-grabber-visualang-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android/JMFileGrabberVisualang-v0.3
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp android/JMFileGrabberVisualang-v0.3/app/build/outputs/apk/debug/app-debug.apk dist/JM_FILE_GRABBER_VISUALANG_v0_3_DEBUG.apk
          sha256sum dist/JM_FILE_GRABBER_VISUALANG_v0_3_DEBUG.apk | tee dist/JM_FILE_GRABBER_VISUALANG_v0_3_DEBUG.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM_FILE_GRABBER_VISUALANG_v0_3_DEBUG_APK
          path: dist/*
          if-no-files-found: error
