name: Build JM File Grabber Visualang v0.4 Magic Return APK
on:
  pull_request:
    branches: ["main"]
    paths:
      - "android/JMFileGrabberVisualang-v0.4/**"
      - ".github/workflows/jm-file-grabber-visualang-v04-magic-return-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore and verify exact magic-return sources
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          root = Path('.')
          java_b64 = (root / 'source/MainActivity.java.gz.b64').read_text().strip()
          html_b64 = ''.join(
              (root / f'source/index.part{i:02d}.b64').read_text().strip()
              for i in range(5)
          )

          java = gzip.decompress(base64.b64decode(java_b64, validate=True))
          html = gzip.decompress(base64.b64decode(html_b64, validate=True))

          expected_java = 'a2c4d0cc0c39b9fb691ba2bccc3c3585e9be04caaa66ad336a3372382a898dd6'
          expected_html = 'f578278ee50fbce6b38d28f2fa4db69202a2a2b9e9af4eb0cfbac78c00d8ff47'
          actual_java = hashlib.sha256(java).hexdigest()
          actual_html = hashlib.sha256(html).hexdigest()
          print('MainActivity.java', len(java), actual_java)
          print('index.html', len(html), actual_html)
          if actual_java != expected_java or actual_html != expected_html:
              raise SystemExit('Exact-source SHA-256 verification failed')

          (root / 'app/src/main/java/com/jmisjustme/filegrabbervisualang/MainActivity.java').write_bytes(java)
          (root / 'app/src/main/assets/index.html').write_bytes(html)
          PY
      - name: Build debug APK
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp android/JMFileGrabberVisualang-v0.4/app/build/outputs/apk/debug/app-debug.apk dist/JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG.apk
          sha256sum dist/JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG.apk | tee dist/JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG_APK
          path: dist/*
          if-no-files-found: error
          retention-days: 90
