name: Build JM File Grabber Visualang v0.4 Magic Return APK
on:
  pull_request:
    branches: ["main"]
    paths:
      - "android/JMFileGrabberVisualang-v0.4/**"
      - ".github/workflows/jm-file-grabber-visualang-v04-magic-return-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore and verify exact magic-return sources
        id: restore
        continue-on-error: true
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: |
          mkdir -p ../../../dist
          python3 - <<'PY'
          import base64, gzip, hashlib, json, traceback
          from pathlib import Path

          root = Path('.')
          diag = {'cwd': str(root.resolve()), 'parts': {}}
          try:
              java_path = root / 'source/MainActivity.java.gz.b64'
              java_text = java_path.read_text()
              diag['parts'][java_path.name] = {
                  'characters': len(java_text),
                  'sha256_text': hashlib.sha256(java_text.encode()).hexdigest(),
              }
              index_texts = []
              for i in range(5):
                  p = root / f'source/index.part{i:02d}.b64'
                  text = p.read_text()
                  diag['parts'][p.name] = {
                      'characters': len(text),
                      'sha256_text': hashlib.sha256(text.encode()).hexdigest(),
                  }
                  index_texts.append(text.strip())

              java = gzip.decompress(base64.b64decode(java_text.strip(), validate=True))
              html = gzip.decompress(base64.b64decode(''.join(index_texts), validate=True))
              actual_java = hashlib.sha256(java).hexdigest()
              actual_html = hashlib.sha256(html).hexdigest()
              diag.update({
                  'restored': True,
                  'java_bytes': len(java),
                  'html_bytes': len(html),
                  'java_sha256': actual_java,
                  'html_sha256': actual_html,
              })
              if actual_java != 'a2c4d0cc0c39b9fb691ba2bccc3c3585e9be04caaa66ad336a3372382a898dd6':
                  raise RuntimeError('MainActivity authoritative SHA-256 mismatch')
              if actual_html != 'f578278ee50fbce6b38d28f2fa4db69202a2a2b9e9af4eb0cfbac78c00d8ff47':
                  raise RuntimeError('Visualang HTML authoritative SHA-256 mismatch')
              (root / 'app/src/main/java/com/jmisjustme/filegrabbervisualang/MainActivity.java').write_bytes(java)
              (root / 'app/src/main/assets/index.html').write_bytes(html)
          except Exception as exc:
              diag.update({
                  'restored': False,
                  'exception_type': type(exc).__name__,
                  'exception': str(exc),
                  'traceback': traceback.format_exc(),
              })
              Path('../../../dist/restore_diagnostic.json').write_text(json.dumps(diag, indent=2))
              raise
          else:
              Path('../../../dist/restore_diagnostic.json').write_text(json.dumps(diag, indent=2))
              print(json.dumps(diag, indent=2))
          PY
      - name: Upload exact-source diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JM_FILE_GRABBER_VISUALANG_v0_4_RESTORE_DIAGNOSTIC
          path: dist/restore_diagnostic.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce restore gate
        if: steps.restore.outcome == 'failure'
        run: exit 1
      - name: Build debug APK
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp android/JMFileGrabberVisualang-v0.4/app/build/outputs/apk/debug/app-debug.apk dist/JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG.apk
          sha256sum dist/JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG.apk | tee dist/JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG_APK
          path: dist/JM_FILE_GRABBER_VISUALANG_v0_4_MAGIC_RETURN_DEBUG.*
          if-no-files-found: error
          retention-days: 90
