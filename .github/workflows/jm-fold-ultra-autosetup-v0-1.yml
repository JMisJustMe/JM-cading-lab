name: JM Fold Ultra v0.9 Complete Prelaunch Build
on:
  pull_request:
    paths:
      - 'agent-runtime/host-adapters/android/fold-ultra-autosetup/**'
      - '.github/workflows/jm-fold-ultra-autosetup-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify bounded prelaunch contracts
        run: python3 agent-runtime/host-adapters/android/fold-ultra-autosetup/tools/verify_prelaunch.py
      - name: Offline USB bridge unit tests
        run: python3 -m unittest discover -s agent-runtime/host-adapters/android/fold-ultra-autosetup/tools -p 'test_*.py' -v
      - name: Compile Fold prelaunch
        shell: bash
        working-directory: agent-runtime/host-adapters/android/fold-ultra-autosetup
        run: gradle --no-daemon :app:assembleDebug
      - name: Build and audit isolated Home Lab QA APK
        shell: bash
        working-directory: agent-runtime/host-adapters/android/fold-ultra-autosetup
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleHomeLabQa
          APK=app/build/outputs/apk/homeLabQa/app-homeLabQa.apk
          test -s "$APK"
          mkdir -p /tmp/jm-home-lab-qa
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" > /tmp/jm-home-lab-qa/BADGING.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/jm-home-lab-qa/SIGNATURE.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/jm-home-lab-qa/MERGED_MANIFEST.txt
          "$TOOLS/aapt" dump permissions "$APK" > /tmp/jm-home-lab-qa/PERMISSIONS.txt
          grep -Fq "package: name='com.jmisjustme.foldultra.homelabqa'" /tmp/jm-home-lab-qa/BADGING.txt
          grep -Fq "application-label:'JM Home Lab QA'" /tmp/jm-home-lab-qa/BADGING.txt
          grep -Fq 'com.jmisjustme.foldultra.launcher.LauncherLabActivity' /tmp/jm-home-lab-qa/MERGED_MANIFEST.txt
          if grep -Fq 'android.intent.category.HOME' /tmp/jm-home-lab-qa/MERGED_MANIFEST.txt; then
            echo 'QA PREVIEW MUST NOT DECLARE ANDROID HOME ROLE'; exit 1
          fi
          if grep -Eq 'uses-permission:|uses-permission-sdk-23:' /tmp/jm-home-lab-qa/PERMISSIONS.txt; then
            echo 'QA PREVIEW MUST NOT ADD REQUESTED PERMISSIONS'; exit 1
          fi
          unzip -t "$APK" > /tmp/jm-home-lab-qa/ZIP_INTEGRITY.txt
          cp "$APK" /tmp/jm-home-lab-qa/JM_HOME_LAB_QA_SIDE_BY_SIDE.apk
          sha256sum /tmp/jm-home-lab-qa/JM_HOME_LAB_QA_SIDE_BY_SIDE.apk > /tmp/jm-home-lab-qa/SHA256.txt
          printf 'Build + side-by-side package + app label + no HOME + no runtime permissions + signing + ZIP PASS. Physical devices NOT YET installed.\n' > /tmp/jm-home-lab-qa/RECEIPT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JM_HOME_LAB_QA_SIDE_BY_SIDE_CARRIER
          path: /tmp/jm-home-lab-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Audit signed Android carrier
        shell: bash
        run: |
          set -euo pipefail
          R=agent-runtime/host-adapters/android/fold-ultra-autosetup
          APK="$R/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p /tmp/jm-fold-prelaunch
          cp "$APK" /tmp/jm-fold-prelaunch/JM_FOLD_ULTRA_CREATIONS_v1_3_DEBUG.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/jm-fold-prelaunch/BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/jm-fold-prelaunch/SIGNATURE.txt
          unzip -t "$APK" > /tmp/jm-fold-prelaunch/ZIP_INTEGRITY.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > /tmp/jm-fold-prelaunch/PERMISSIONS.txt
          grep -Fq "package: name='com.jmisjustme.foldultra'" /tmp/jm-fold-prelaunch/BADGING.txt
          grep -Fq "versionName='1.3.0'" /tmp/jm-fold-prelaunch/BADGING.txt
          grep -Fq "android.intent.action.SEND" "$R/app/src/main/AndroidManifest.xml"
          if grep -E 'uses-permission:|uses-permission-sdk-23:' /tmp/jm-fold-prelaunch/PERMISSIONS.txt; then
            echo 'UNEXPECTED PERMISSION: HOLD'
            exit 1
          fi
          sha256sum /tmp/jm-fold-prelaunch/*.apk > /tmp/jm-fold-prelaunch/SHA256.txt
          cp "$R/tools/jm_fold_usb_bridge.py" /tmp/jm-fold-prelaunch/JM_FOLD_USB_LAPTOP_BRIDGE_v0_9.py
          cp "$R/README.md" /tmp/jm-fold-prelaunch/JM_FOLD_ULTRA_v0_9_README.md
          sha256sum /tmp/jm-fold-prelaunch/*.py /tmp/jm-fold-prelaunch/*.md > /tmp/jm-fold-prelaunch/LAPTOP_TOOLS_SHA256.txt
          printf 'APK compilation + signing + permissions PASS. Physical Fold UI/device DING OPEN.\n' > /tmp/jm-fold-prelaunch/RECEIPT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JM_FOLD_ULTRA_CREATIONS_v1_3_CARRIER
          path: /tmp/jm-fold-prelaunch/
          if-no-files-found: error
          retention-days: 14

  generic-android-smoke:
    name: Generic Android emulator — not a Fold DING
    needs: native-carrier
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact compiled APK
        uses: actions/download-artifact@v4
        with:
          name: JM_FOLD_ULTRA_CREATIONS_v1_3_CARRIER
          path: emulator-input
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-start narrow / wide on generic Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # This full-body lane needs native Android controls, not Google APIs.
          # The prior Google APIs Pixel 6 image repeatedly raised Pixel Launcher
          # ANRs (run 40273267502), obscuring authentic native Continue touches.
          # Keep the independent CP04 Share lane on google_apis for coverage.
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 700
          script: sh agent-runtime/host-adapters/android/fold-ultra-autosetup/tools/run_emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM_FOLD_ULTRA_v1_3_GENERIC_ANDROID_SCREEN_PROOF
          path: emulator-proof/
          if-no-files-found: warn
          retention-days: 14

  companion-inbox-android:
    name: CP04 independent Share-to-JM-draft Android proof — not physical Fold
    needs: native-carrier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact signed native debug carrier
        uses: actions/download-artifact@v4
        with:
          name: JM_FOLD_ULTRA_CREATIONS_v1_3_CARRIER
          path: emulator-input
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android Share to existing JM SessionDeck draft
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 700
          script: python3 agent-runtime/host-adapters/android/fold-ultra-autosetup/tools/probe_companion_inbox.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM_FOLD_CP04_NATIVE_INBOX_SCREEN_AND_RECEIPT
          path: emulator-proof/
          if-no-files-found: warn
          retention-days: 14

  workroom-android:
    name: CP05 native Workroom controls and SQLite lifecycle
    needs: native-carrier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JM_FOLD_ULTRA_CREATIONS_v1_3_CARRIER
          path: emulator-input
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 700
          script: python3 agent-runtime/host-adapters/android/fold-ultra-autosetup/tools/probe_workroom.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM_WORKROOM_CP05_ANDROID_PROOF
          path: emulator-proof/
          retention-days: 14

  home-lab-android:
    name: CP01 native Home Lab owner-tap / layout QA — generic Android only
    needs: native-carrier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JM_FOLD_ULTRA_CREATIONS_v1_3_CARRIER
          path: emulator-input
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Home Lab taps on disposable Android (not owner Fold)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 700
          script: python3 agent-runtime/host-adapters/android/fold-ultra-autosetup/tools/probe_home_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM_HOME_LAB_CP01_NATIVE_EMULATOR_EVIDENCE
          path: emulator-proof/
          retention-days: 14

  homeqa-isolated-carrier:
    name: Isolated Home Lab QA identity and signer audit
    needs: native-carrier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile isolated sidecar and verify package boundaries
        shell: bash
        run: |
          set -euo pipefail
          R=agent-runtime/host-adapters/android/fold-ultra-autosetup
          (cd "$R" && gradle --no-daemon :app:assembleHomeqa)
          APK="$R/app/build/outputs/apk/homeqa/app-homeqa.apk"
          mkdir -p /tmp/jm-homeqa
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/jm-homeqa/BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/jm-homeqa/MERGED_MANIFEST.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > /tmp/jm-homeqa/PERMISSIONS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/jm-homeqa/SIGNATURE.txt
          unzip -t "$APK" > /tmp/jm-homeqa/ZIP_INTEGRITY.txt
          grep -Fq "package: name='com.jmisjustme.foldultra.homeqa'" /tmp/jm-homeqa/BADGING.txt
          grep -Fq "application-label:'JM Home Lab QA'" /tmp/jm-homeqa/BADGING.txt
          grep -Fq "com.jmisjustme.foldultra.MainActivity" /tmp/jm-homeqa/MERGED_MANIFEST.txt
          grep -Fq "android.intent.category.LAUNCHER" /tmp/jm-homeqa/MERGED_MANIFEST.txt
          if grep -E 'android.intent.action.SEND|jmfoldultra|android.intent.category.HOME' /tmp/jm-homeqa/MERGED_MANIFEST.txt; then
            echo 'Original-intent collision: QA package held'
            exit 1
          fi
          if grep -E 'uses-permission:|uses-permission-sdk-23:' /tmp/jm-homeqa/PERMISSIONS.txt; then
            echo 'QA package unexpectedly requests permissions'
            exit 1
          fi
          cp "$APK" /tmp/jm-homeqa/JM_HOME_LAB_CP03_ISOLATED_QA.apk
          sha256sum /tmp/jm-homeqa/*.apk > /tmp/jm-homeqa/SHA256.txt
          printf 'Isolated QA package only; no original update, phone installation or Home role performed.\n' > /tmp/jm-homeqa/RECEIPT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JM_HOME_LAB_CP03_ISOLATED_QA_CARRIER
          path: /tmp/jm-homeqa/
          if-no-files-found: error
          retention-days: 14

  creations-android:
    name: CP06 native OPENBOX catalogue and explicit navigation — generic Android only
    needs: native-carrier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JM_FOLD_ULTRA_CREATIONS_v1_3_CARRIER
          path: emulator-input
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 700
          script: python3 agent-runtime/host-adapters/android/fold-ultra-autosetup/tools/probe_creations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM_FOLD_ULTRA_CP06_CREATIONS_ANDROID_PROOF
          path: emulator-proof/
          if-no-files-found: warn
          retention-days: 14
