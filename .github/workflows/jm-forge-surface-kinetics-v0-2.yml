name: JM Forge 3D Surface Kinetics

on:
  push:
    branches:
      - integration/jm-forge-surface-kinetics-v0-2-20261010
  pull_request:
    paths:
      - "target-bridge/form-forge-routeos-v0-2/**"
      - "games-beyond/routeos/runtime/index.html"
      - "tests/jm-kinetics-v0-2-contract.mjs"
      - "tests/jm-formforge-routeos-contact.spec.mjs"
jobs:
  native-geometry-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: First-party 3D collision and source syntax
        run: |
          node --check target-bridge/form-forge-routeos-v0-2/JM_FORGE_SURFACE_KINETICS_v0_2.js
          node --check target-bridge/form-forge-routeos-v0-2/JM_FORGE_ROUTEOS_SURFACE_KINETICS_HOST_v0_2.js
          node tests/jm-kinetics-v0-2-contract.mjs
      - name: Install Chromium contact
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Serve original RouteOS and existing Forge recipient
        run: |
          python3 -m http.server 4177 >/tmp/jm-surface-kinetics.log 2>&1 &
          for i in {1..25}; do curl -fsS http://127.0.0.1:4177/games-beyond/routeos/runtime/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/jm-surface-kinetics.log
          exit 1
      - name: Prove original five-face game and 3D surface impact in native RouteOS
        run: node tests/jm-formforge-routeos-contact.spec.mjs
