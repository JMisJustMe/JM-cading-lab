name: JM Inline Contact Cloudflare Probe

on:
  push:
    branches:
      - jm-chatgpt-host-adapter-v0.1
    paths:
      - 'apps/jm-chatgpt-host-adapter-v0.1/src/worker.mjs'
      - 'apps/jm-chatgpt-host-adapter-v0.1/package.json'
      - '.github/workflows/jm-inline-contact-cloudflare-probe.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/jm-chatgpt-host-adapter-v0.1/src/worker.mjs'
      - 'apps/jm-chatgpt-host-adapter-v0.1/package.json'
      - '.github/workflows/jm-inline-contact-cloudflare-probe.yml'
  workflow_dispatch:

jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/jm-chatgpt-host-adapter-v0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MCP and Pages build dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund wrangler@4 esbuild

      - name: Syntax check Worker
        run: node --check src/worker.mjs

      - name: Bundle MCP handler as Pages Advanced Mode worker
        run: |
          set -euo pipefail
          rm -rf pages-probe
          mkdir -p pages-probe
          npx esbuild src/worker.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=pages-probe/_worker.js
          cat > pages-probe/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>JM Inline Contact Probe</title><style>body{font-family:system-ui;background:#090a0f;color:#fff;padding:2rem}code{word-break:break-all}</style><h1>JM Inline Contact Probe</h1><p>Public transport probe only. MCP endpoint: <code>/mcp</code></p>
          HTML
          test -s pages-probe/_worker.js

      - name: Ensure isolated Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          OUT=$(npx wrangler pages project create jm-inline-contact-probe --production-branch=main 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$CODE" -ne 0 ] && ! printf '%s\n' "$OUT" | grep -Eqi 'already exists|project.*exists'; then
            exit "$CODE"
          fi

      - name: Deploy isolated Pages preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler pages deploy pages-probe --project-name=jm-inline-contact-probe --branch=inline-contact 2>&1)
          printf '%s\n' "$OUT"
          CLEAN=$(printf '%s\n' "$OUT" | sed -r 's/\x1B\[[0-9;]*[mK]//g')
          URL=$(printf '%s\n' "$CLEAN" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | tail -n 1 || true)
          if [ -z "$URL" ]; then
            echo 'No Cloudflare Pages preview URL recovered.' >&2
            exit 1
          fi
          printf 'preview_url=%s\n' "$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke-test public HTTPS MCP host
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          HEALTH=''
          for ATTEMPT in $(seq 1 30); do
            if HEALTH=$(curl --fail --silent --show-error "$PREVIEW_URL/health" 2>/dev/null); then break; fi
            sleep 2
          done
          test -n "$HEALTH"
          printf '%s\n' "$HEALTH"
          node -e 'const fs=require("fs"); const base=process.env.PREVIEW_URL; const health=JSON.parse(process.argv[1]); fs.writeFileSync("PUBLIC_PROBE_DEPLOYMENT.json", JSON.stringify({pass:true,transport:"cloudflare-pages-advanced-mode",probeOnly:true,privateDonorBytesIncluded:false,previewUrl:base,mcpUrl:base+"/mcp",health,chatgptContactProvenHere:false},null,2)+"\n")' "$HEALTH"

      - name: Upload public probe deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: jm-inline-contact-public-probe
          path: apps/jm-chatgpt-host-adapter-v0.1/PUBLIC_PROBE_DEPLOYMENT.json
          if-no-files-found: error
