name: JM v0.6 Pretrained Semantic Full-Book Contact
on:
  pull_request:
    paths:
      - '.agents/skills/jm-ecostate-route/jm_knowledge_semantic_v06.py'
      - '.agents/skills/jm-ecostate-route/tests/test_knowledge_semantic_v06.py'
      - '.github/workflows/jm-knowledge-semantic-v06.yml'
  workflow_dispatch:
jobs:
  original-book-neural-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only ONNX semantic runtime
        run: python -m pip install --disable-pip-version-check 'fastembed==0.9.0'
      - name: Validate native compilation and synthetic source integrity controls
        run: |
          python -m py_compile .agents/skills/jm-ecostate-route/jm_knowledge_semantic_v06.py
          python -m unittest discover -s .agents/skills/jm-ecostate-route/tests -p 'test_knowledge_semantic_v06.py' -v
          python -m unittest discover -s .agents/skills/jm-ecostate-route/tests -p 'test_knowledge_robustness_v05.py' -v
      - name: Fetch 1890 and 1854 complete public-domain book editions into temporary runner
        run: |
          mkdir -p /tmp/jm-v06-books
          curl --fail --location --retry 3 --max-time 120 --silent --show-error \
            'https://www.gutenberg.org/cache/epub/57628/pg57628.txt' \
            -o /tmp/jm-v06-books/James_Principles_Vol1.txt
          curl --fail --location --retry 3 --max-time 120 --silent --show-error \
            'https://www.gutenberg.org/cache/epub/205/pg205.txt' \
            -o /tmp/jm-v06-books/Thoreau_Walden.txt
      - name: Run actual neural pretrained embedding retrieval with exact JM book citations
        env:
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python .agents/skills/jm-ecostate-route/jm_knowledge_semantic_v06.py \
            --book /tmp/jm-v06-books/James_Principles_Vol1.txt \
            --book /tmp/jm-v06-books/Thoreau_Walden.txt \
            --gold .agents/skills/jm-ecostate-route/tests/fixtures/knowledge_v05_adversarial_gold.json \
            --cache /tmp/jm-v06-neural-cache \
            --out /tmp/jm-v06-report.json \
            > /tmp/jm-v06-stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/jm-v06-report.json')
          r=json.loads(p.read_text(encoding='utf8'))
          assert r==json.loads(Path('/tmp/jm-v06-stdout.json').read_text(encoding='utf8'))
          assert r['state']=='HELD'
          assert r['cases']==16
          assert r['model_sha256'] and len(r['model_sha256'])==64
          assert r['paragraphs']>100
          assert r['model_generations']==0
          assert r['retrieval_model_pretrained'] is True
          assert r['generative_llm_comparison']=='NOT_PERFORMED'
          assert r['gold_during_retrieval'] is False
          assert all(not row['semantic_book'] or row['semantic_exact_citation'] for row in r['rows'])
          print('REAL_PRETRAINED_SEMANTIC_FULL_BOOK_AB', {k:r[k] for k in
                ('cases','baseline_correct','semantic_correct','gains','regressions',
                 'paragraphs','elapsed_ms_total','model','model_sha256')})
          for row in r['rows']:
              print('CASE',row['id'],row['category'],
                    'baseline',row['baseline_reason'],
                    'neural',row['semantic_reason'],
                    'score',row['semantic_score'],
                    'book',row['semantic_book'], 'change',row['change'])
          PY
      - name: Print artifact integrity only; no books or downloaded model weights uploaded
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/jm-v06-report.json')
          print('EVALUATION_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
