name: JM M001 Mandatory Production Admission
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'agent-runtime/host-adapters/storage-admission/**'
      - 'registry/storage-admission/**'
      - 'scripts/jm_build_closure.py'
      - 'scripts/jm_package_advanced_generator.py'
      - 'scripts/test_jm_m001_production_admission.py'
      - '.github/workflows/jm-m001-production-admission.yml'
      - '.github/workflows/package-jm-advanced-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mandatory-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove CP21 build-entry adversarial enforcement
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_BUILD_ENTRY_CP21_TESTS.py
      - name: Hold changed cold-only and high-byte carriers until proven
        shell: bash
        env:
          JM_M001_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          python3 agent-runtime/host-adapters/storage-admission/JM_M001_BUILD_ENTRY_CP21_INTEGRATION.py \
            --repo . --base "$JM_M001_BASE_SHA"
      - name: Preserve original gate and closure regression
        run: |
          python3 agent-runtime/host-adapters/storage-admission/JM_M001_Carrier_Admission_Gate_v0_1.py --self-test
          python3 scripts/jm_build_closure.py --self-test
      - name: Execute production admission on public JM package bytes
        run: python3 scripts/test_jm_m001_production_admission.py -v
      - name: Prove CP22 postprocessed lineage and media receipt retention
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_POSTPROCESS_RETENTION_CP22_TESTS.py
      - name: Prove CP23 Magnifying Glass / media / M001 donor bridge
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_REAL_EVIDENCE_BRIDGE_CP23_TESTS.py
      - name: Prove CP24 operational trace retirement review versus protected originals
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_PROCESS_CAPTURE_FAMILY_CP24_TESTS.py
      - name: Prove CP25 exact delta reconstruction
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_EXACT_DELTA_RESTORE_CP25_TESTS.py
      - name: Prove CP26 eight distinct edition exact restoration and fail-closed roles
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_EDITIONS_RESTORE_CP26_TESTS.py
      - name: Prove CP27 13 exact Slingfall installers and separate delivery roles
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_APK_LINEAGE_RESTORE_CP27_TESTS.py
      - name: Prove CP28 four exact independent TIWIN source editions
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_PURPOSE_CHAIN_RESTORE_CP28_TESTS.py
      - name: Prove CP31 fail-closed pre-retirement assessment without native delete
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_PRE_RETIREMENT_EXECUTION_CP31_TESTS.py
      - name: Prove CP30 SUIT guarded export with no repeated 10MB carriage
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_SUIT_EXPORT_CP30_TESTS.py
      - name: Prove CP29 seven original visual releases from protected cold anchors
        run: python3 agent-runtime/host-adapters/storage-admission/JM_M001_VISUAL_LINEAGE_RESTORE_CP29_TESTS.py
