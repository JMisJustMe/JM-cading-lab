name: JM Mission 002 isolated Render persistence return contact
on:
  push:
    branches:
      - audit/mission-002-plugin-contact-20261023-v01
    paths:
      - .github/workflows/jm-m002-render-persistence-return.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-render-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated GitHub canary and hosted persistence readback
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib, urllib.request, time, sys
          p=pathlib.Path('mission-002/plugin-contact/jm-m002-canary-20261023-v01.json')
          b=p.read_bytes()
          local=json.loads(b)
          assert local['schema']=='JM.Mission002.PluginContactCanary/1'
          assert local['id']=='jm-m002-canary-20261023-v01'
          assert local['production_mutation'] is False
          assert local['no_secrets'] is True
          url='https://jm-cloud-contact-server-v05.onrender.com/market/v1/persistence'
          raw=None
          errors=[]
          for attempt in range(1,13):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'JM-M002-ReadOnly-Contact/1','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      assert response.status==200, f'HTTP {response.status}'
                      raw=response.read(32768)
                  break
              except Exception as exc:
                  errors.append(type(exc).__name__+':'+str(exc)[:160])
                  time.sleep(10)
          if raw is None:
              print('HOLD_PUBLIC_HTTP_UNREACHABLE; errors='+str(errors[-3:]))
              sys.exit(2)
          d=json.loads(raw)
          c=d.get('continuity') or {}
          checks={
              'api_ok':d.get('ok') is True,
              'database_configured':d.get('databaseConfigured') is True,
              'postgres_mode':d.get('mode')=='postgres',
              'durable':d.get('durable') is True,
              'ready':d.get('ready') is True,
              'recovered_prior':c.get('recoveredPriorWitness') is True,
              'witness_nonzero':int(c.get('witnessCount') or 0)>1,
              'witness_distinct':bool(c.get('currentWitnessId')) and bool(c.get('priorWitnessId')) and c.get('currentWitnessId')!=c.get('priorWitnessId'),
          }
          receipt={
              'schema':'JM.Mission002.LiveHTTPContact/1',
              'scope':'public-read-only-server-persistence',
              'github_source_sha256':hashlib.sha256(b).hexdigest(),
              'server_response_sha256':hashlib.sha256(raw).hexdigest(),
              'witnessCount':c.get('witnessCount'),
              'currentWitnessId':c.get('currentWitnessId'),
              'priorWitnessId':c.get('priorWitnessId'),
              'lastLoadAt':d.get('lastLoadAt'),
              'checks':checks,
              'hold':'This public response is the running server reporting database state; it is not an independent SQL row read nor Contact 001 canary propagation.',
          }
          print(json.dumps(receipt,sort_keys=True))
          assert all(checks.values()), 'HOLD: one or more bounded public readback checks failed'
          print('DING_BOUNDED: GITHUB_BRANCH_SOURCE -> LIVE_RENDER_PUBLIC_STATE_RETURN verified; NO DATABASE SQL DING; NO DEVICE DING.')
          PY
