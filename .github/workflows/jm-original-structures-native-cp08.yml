name: JM Original Structures CP08 — Native Independent App
on:
  push:
    branches: [jm/original-structures-native-cp08]
  pull_request:
    paths:
      - 'apps/jm-original-structures-native/**'
      - '.github/workflows/jm-original-structures-native-cp08.yml'
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: apps/jm-original-structures-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Protected source identity and no-network contract
        run: |
          set -euo pipefail
          echo '9404f44492bad6c0c6ca25b7b6b86927a9ffc43a22565a1fa2dd99dc5c05e522  app/src/main/assets/index.html' | sha256sum -c -
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          python3 -m py_compile tools/native_smoke.py
      - name: Compile independent first-party Android app
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Inspect exact APK source and permission surface
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python3 - <<'PY'
          import zipfile,hashlib
          p='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
            src=z.read('assets/index.html')
            assert hashlib.sha256(src).hexdigest()=='9404f44492bad6c0c6ca25b7b6b86927a9ffc43a22565a1fa2dd99dc5c05e522'
            assert 'classes.dex' in z.namelist()
          print('PASS original CP07.3 exact source embedded in native APK')
          PY
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" > /tmp/jm-native-badging.txt
          grep "package: name='me.jmisjustme.originalstructures'" /tmp/jm-native-badging.txt
          ! grep -q 'android.permission.INTERNET' /tmp/jm-native-badging.txt
          sha256sum "$APK" > /tmp/JM_CP08_APK_SHA256.txt
          cat /tmp/JM_CP08_APK_SHA256.txt
      - name: Include checksum with APK
        run: cp /tmp/JM_CP08_APK_SHA256.txt app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: JM_ORIGINAL_STRUCTURES_CP08_NATIVE_DEBUG_APK
          path: |
            apps/jm-original-structures-native/app/build/outputs/apk/debug/app-debug.apk
            apps/jm-original-structures-native/app/build/outputs/apk/debug/JM_CP08_APK_SHA256.txt
          retention-days: 30
  emulator:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: JM_ORIGINAL_STRUCTURES_CP08_NATIVE_DEBUG_APK, path: emulator-input}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real native Save -> AtomicFile -> cold Verify on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 700
          script: |
            adb install emulator-input/app-debug.apk
            python3 apps/jm-original-structures-native/tools/native_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM_ORIGINAL_STRUCTURES_CP08_NATIVE_EMULATOR_PROOF
          path: native-proof/
          if-no-files-found: warn
          retention-days: 30