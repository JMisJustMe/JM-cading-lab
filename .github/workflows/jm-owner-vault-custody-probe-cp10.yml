name: JM Owner Vault — Corrupt Custody Diagnostic CP10
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'functions/api/owner/vault.js'
      - 'tools/probe-owner-vault-corruption-cp10.mjs'
      - '.github/workflows/jm-owner-vault-custody-probe-cp10.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/owner/vault.js'
      - 'tools/probe-owner-vault-corruption-cp10.mjs'
      - '.github/workflows/jm-owner-vault-custody-probe-cp10.yml'
permissions:
  contents: read
jobs:
  custody-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe actual handler against in-memory malformed private metadata
        run: node tools/probe-owner-vault-corruption-cp10.mjs
      - name: Run strict custody gate (explicit RED until repaired)
        id: custody
        continue-on-error: true
        run: node tools/probe-owner-vault-corruption-cp10.mjs --require-safe
      - name: Mark strict-gate HOLD explicitly, without changing owner storage
        if: always()
        env:
          CUSTODY_GATE_OUTCOME: ${{ steps.custody.outcome }}
        run: |
          if [ "$CUSTODY_GATE_OUTCOME" != 'success' ]; then
            echo "::warning::JM Owner Vault CP10 private custody remains HOLD. See issue 591; a successful diagnostic job does NOT mean safe owner storage."
          fi
          echo "STRICT_PRIVATE_CUSTODY_GATE=$CUSTODY_GATE_OUTCOME"
          echo "REAL_OWNER_PRIVATE_STORAGE=NOT_ACCESSED"
          echo "PRODUCTION_API_SOURCE=UNCHANGED_BY_THIS_WORKFLOW"
