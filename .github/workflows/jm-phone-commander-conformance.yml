name: JM Phone Commander — bounded host adapter conformance
on:
  pull_request:
    paths:
      - 'agent-runtime/host-adapters/android/phone-commander/**'
      - '.github/workflows/jm-phone-commander-conformance.yml'
  push:
    paths:
      - 'agent-runtime/host-adapters/android/phone-commander/**'
      - '.github/workflows/jm-phone-commander-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-adapter-off-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and local synthetic fixture tests
        run: |
          python -m py_compile agent-runtime/host-adapters/android/phone-commander/jm_phone_commander.py
          python -m unittest discover -s agent-runtime/host-adapters/android/phone-commander -p 'test_phone_commander.py' -v
      - name: Proof separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('agent-runtime/host-adapters/android/phone-commander/JM_PHONE_COMMANDER_ADAPTER_v0_1.json').read_text())
          assert d['authority_class']=='HOST_ADAPTER_NOT_SOURCE_AUTHORITY'
          assert d['proof']['phone_runtime']=='OPEN'
          assert d['proof']['remote_issue_roundtrip']=='OPEN'
          assert d['proof']['physical_owner_edit']=='OPEN'
          print('PASS: FUNCTION fixture only; physical phone and external host gates OPEN')
          PY