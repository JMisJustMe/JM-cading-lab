name: JM Phone Commander — bounded host adapter conformance
on:
  pull_request:
    paths:
      - 'agent-runtime/host-adapters/android/phone-commander/**'
      - '.github/workflows/jm-phone-commander-conformance.yml'
  push:
    paths:
      - 'agent-runtime/host-adapters/android/phone-commander/**'
      - '.github/workflows/jm-phone-commander-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-adapter-off-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and local synthetic fixture tests
        run: |
          python -m py_compile agent-runtime/host-adapters/android/phone-commander/jm_phone_commander.py
          python -m unittest discover -s agent-runtime/host-adapters/android/phone-commander -p 'test_phone_commander.py' -v
      - name: Verify opt-in re-entry launcher with actual portable core
        run: |
          sh -n agent-runtime/host-adapters/android/phone-commander/jmphone-reenter.sh
          JM_WORKSPACE="$GITHUB_WORKSPACE" sh agent-runtime/host-adapters/android/phone-commander/jmphone-reenter.sh status > /tmp/jm-phone-offdevice-status.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/jm-phone-offdevice-status.json'))
          assert d['state']=='PASS'
          assert d['consequence']['workspace_present'] is True
          assert d['consequence']['platform']!='Android', 'CI runner is not physical owner phone'
          print('PASS: portable process re-entry (off-device); NOT Android boot proof')
          PY
      - name: Proof separation — historical phone receipts are references not CI simulations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('agent-runtime/host-adapters/android/phone-commander/JM_PHONE_COMMANDER_ADAPTER_v0_1.json').read_text())
          assert d['authority_class']=='HOST_ADAPTER_NOT_SOURCE_AUTHORITY'
          proof=d['proof']
          assert 'github.com/JMisJustMe/JM-ai-studio-surface/issues/1' in proof['mailbox_issue']
          assert 'github.com/JMisJustMe/JM-ai-studio-surface/issues/7' in proof['physical_owner_edit']
          assert 'HOST_CONTACT' in proof['proof_level']
          assert proof['boot_recovery']=='OPEN'
          assert proof['codex_contact']=='OPEN'
          print('PASS: off-device test and evidence record only; Android reboot/Work/Codex remain separate gates')
          PY
