name: JM PUKA CP26 — Native Input Proof
on:
  pull_request:
    paths:
      - 'games-beyond/puka/**'
      - 'games-beyond/tests/puka-input-cp26.spec.mjs'
      - '.github/workflows/jm-puka-input-cp26.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-play-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games-beyond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Original PUKA keyboard/controller gameplay — mobile and desktop browser
        run: npx playwright test tests/puka-input-cp26.spec.mjs --project=mobile-chromium --project=desktop-chromium
      - name: Original PUKA native-physics and state regression
        run: node puka/puka-core.test.js
      - name: Report failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jm-puka-cp26-browser-evidence
          path: |
            games-beyond/test-results/
            games-beyond/playwright-report/
          if-no-files-found: ignore
