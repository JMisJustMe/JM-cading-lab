name: JM REA v0.6 Independent Source & Game Application Contact
on:
  pull_request:
    paths:
      - 'agent-runtime/host-adapters/rea-evidence-contact-v0_1/**'
      - '.github/workflows/jm-rea-application-v0_6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-jm-app:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real REA inspection of original JM GameCoding and GameCore source
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=rea-agents@6.1.0 -- rea analyze-javascript-application "$GITHUB_WORKSPACE/coding-estate/sovereign-ten/direct" --json > "$RUNNER_TEMP/rea-jm-game.json"
          export REA_RAW="$RUNNER_TEMP/rea-jm-game.json"
          export REA_BUNDLE="$RUNNER_TEMP/rea-jm-game-bundle.json"
          python3 - <<'PY'
          import json,os,pathlib
          record=json.loads(pathlib.Path(os.environ['REA_RAW']).read_text())
          assert record['evidence_id'].startswith('ev_')
          assert record['provider']['id']
          graph=record['normalized_result']['semantic_graph']
          assert graph['application_graph_id']==record['normalized_result']['graph']['graph_id']
          game_nodes=[n for n in graph['nodes'] if n.get('identity',{}).get('module_path')=='game-native.mjs' and n.get('kind')=='function']
          labels={n.get('label') for n in game_nodes}
          assert len(game_nodes)>=8, 'REAL_REA_GAME_FUNCTIONS_ABSENT'
          for name in ['trigger','simulateFrame','dispatch']:
              assert name in labels, 'REAL_REA_GAME_FUNCTION_ANCHOR_MISSING:'+name
          print('REAL_REA_JM_GAME_FUNCTION_CONTACT: PASS')
          print('REAL_REA_JM_GAME_FUNCTION_COUNT:',len(game_nodes))
          print('REAL_REA_JM_GAME_ANCHORS:',','.join(sorted(['trigger','simulateFrame','dispatch'])))
          bundle={
            'artifacts':[{'digest':record['subject']['digest'],'format':record['subject']['format'],'architecture':record['subject']['architecture']}],
            'providers':[record['provider']],
            'environments':[record['environment']] if record['environment'] else [],
            'scenarios':[],'captures':[],'unknowns':[],'records':[record]
          }
          with pathlib.Path(os.environ['REA_BUNDLE']).open('x',encoding='utf8') as f:json.dump(bundle,f)
          PY
          npm exec --yes --package=rea-agents@6.1.0 -- rea evidence-import "$REA_BUNDLE" > "$RUNNER_TEMP/rea-validation.txt"
          echo 'REAL_REA_JM_GAME_EVIDENCE_VALIDATOR: PASS'
      - name: Original JM vs independent source parser and application consequences
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {verifyFullSourceAndApplication} from './agent-runtime/host-adapters/rea-evidence-contact-v0_1/jm_rea_application_verify_v0_6.mjs';
          const proof=verifyFullSourceAndApplication();
          assert.equal(proof.route_source.cases,120);
          assert.equal(proof.route_source.ast_and_ir_matches,120);
          assert.equal(proof.route_source.consequence_matches,120);
          assert.equal(proof.game_sessions.matched,96);
          assert.equal(proof.game_sessions.matching_steps,672);
          assert.equal(proof.mismatches.length,0);
          assert.equal(proof.proof.promotable,false);
          assert.ok(proof.application_source.every(p=>p.ast&&p.lower));
          const sources=['coding-estate/sovereign-ten/direct/game-native.mjs',
            'coding-estate/sovereign-ten/direct/route-proof-native.mjs',
            'coding-estate/sovereign-ten/direct/native-corpus.mjs'];
          const hashes=Object.fromEntries(sources.map(p=>[p,crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
          console.log('INDEPENDENT_JM_SOURCE_AND_GAME_APPLICATION: PASS');
          console.log('JM_REA_V06_ROUTE_COUNTS:',JSON.stringify(proof.route_source));
          console.log('JM_REA_V06_GAME_COUNTS:',JSON.stringify(proof.game_sessions));
          console.log('JM_REA_V06_ORIGINAL_SOURCE_SHA256:',JSON.stringify(hashes));
          console.log('JM_REA_V06_SCOPE:',proof.scope);
          JS
      - name: Negative boundary and source parser unit checks
        run: node --test agent-runtime/host-adapters/rea-evidence-contact-v0_1/test_jm_rea_application_v0_6.mjs

      - name: v0.8 automatic JM relation projection from REAL REA 6.1 Evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import {projectGenuineREA} from './agent-runtime/host-adapters/rea-evidence-contact-v0_1/jm_rea_auto_relation_ir_v0_8.mjs';
          const original=fs.readFileSync('./coding-estate/sovereign-ten/direct/game-native.mjs');
          const sha=crypto.createHash('sha256').update(original).digest('hex');
          const record=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/rea-jm-game.json','utf8'));
          const projected=projectGenuineREA(record,{module:'game-native.mjs',
            roots:['trigger','simulateFrame','dispatch'],sourceSha256:sha,depth:2});
          assert.equal(projected.analysis_engine,'REA_RECORD_SOURCE_GRAPH');
          assert.ok(projected.selected_census.nodes>=3);
          assert.ok(projected.input_census.relations>100);
          const nodes=record.normalized_result.semantic_graph.nodes;
          const relations=record.normalized_result.semantic_graph.relations;
          const rootNodes=nodes.filter(n=>n.kind==='function'&&n.identity?.module_path==='game-native.mjs'&&
            ['trigger','simulateFrame','dispatch'].includes(n.label));
          const rootIds=new Set(rootNodes.map(n=>n.node_id));
          const attached=relations.filter(x=>rootIds.has(x.source_node_id)||rootIds.has(x.target_node_id));
          const counts={};for(const edge of attached)counts[edge.relation]=(counts[edge.relation]??0)+1;
          console.log('REA_V08_SELECTED_ROOT_RELATION_DIAGNOSTIC:',JSON.stringify({root_count:rootNodes.length,
            attached_count:attached.length,types:counts}));
          assert.equal(projected.gate.promotable,false);
          console.log('REAL_REA_TO_JM_AUTO_RELATION_PROJECTION: PASS');
          console.log('REAL_REA_TO_JM_PROJECTION_COUNTS:',JSON.stringify(projected.selected_census));
          console.log('REAL_REA_TO_JM_STATIC_UNKNOWNS:',projected.input_census.unknowns);
          console.log('REAL_REA_TO_JM_BOUNDARY:',projected.boundary);
          JS

      - name: Validate genuine REA 6.1 against an inline-object game-runtime shape (NO private game source)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jm-rea-object-shape"
          cat > "$RUNNER_TEMP/jm-rea-object-shape/combound_inline_000.js" <<'SYNTH'
          // Synthetic behavioral interface only; not COMBOUND source.
          const Runtime = {
            beginDrag(state, start) {
              state.drag = {start, power: 0};
              return state.drag;
            },
            moveDrag(state, point) {
              if (!state.drag) return null;
              state.drag.power = Math.min(1, Math.hypot(point.x, point.y) / 160);
              return state.drag;
            },
            releaseDrag(state, point) {
              if (!state.drag) return false;
              this.moveDrag(state, point);
              if (state.drag.power < 0.08) return false;
              return this.commitShot(state);
            },
            commitShot(state) {
              state.shots = (state.shots || 0) + 1;
              this.registerCrewUse(state);
              return state.shots;
            },
            registerCrewUse(state) {
              state.crewUses = (state.crewUses || 0) + 1;
            }
          };
          const sandboxState = {};
          Runtime.beginDrag(sandboxState, {x: 0, y: 0});
          Runtime.releaseDrag(sandboxState, {x: 95, y: 30});
          SYNTH
          npm exec --yes --package=rea-agents@6.1.0 -- rea analyze-javascript-application "$RUNNER_TEMP/jm-rea-object-shape" --json > "$RUNNER_TEMP/rea-synthetic-game-shape.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import {projectGenuineREA} from './agent-runtime/host-adapters/rea-evidence-contact-v0_1/jm_rea_auto_relation_ir_v0_8.mjs';
          const record = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/rea-synthetic-game-shape.json', 'utf8'));
          const graph = record.normalized_result.semantic_graph;
          const methodNames = ['beginDrag','moveDrag','releaseDrag','commitShot','registerCrewUse'];
          const methodNodes = graph.nodes.filter(n => n.kind === 'function' && n.identity?.module_path === 'combound_inline_000.js' && methodNames.includes(n.label));
          console.log('SYNTHETIC_REA_METHOD_DISCOVERY:', JSON.stringify({found: methodNodes.map(n=>n.label), total: methodNodes.length}));
          assert.equal(new Set(methodNodes.map(n=>n.label)).size, methodNames.length, 'REA_METHOD_LABEL_GRAMMAR_HOLD');
          const input = fs.readFileSync(process.env.RUNNER_TEMP+'/jm-rea-object-shape/combound_inline_000.js');
          const sourceSha = crypto.createHash('sha256').update(input).digest('hex');
          const projection = projectGenuineREA(record,{module:'combound_inline_000.js', roots:['releaseDrag','commitShot'],sourceSha256:sourceSha});
          assert.equal(projection.gate.promotable, false);
          assert.ok(projection.selected_census.nodes>=2);
          console.log('SYNTHETIC_REAL_REA_OBJECT_SHAPE_PROJECTION_PASS:',JSON.stringify(projection.selected_census));
          console.log('REA_SYNTHETIC_ORIGIN_ONLY_NOT_PRIVATE_COMBOUND');
          JS

      - name: v0.8 bounded REA auto-projection negative tests
        run: node --test agent-runtime/host-adapters/rea-evidence-contact-v0_1/test_jm_rea_auto_relation_ir_v0_8.mjs
