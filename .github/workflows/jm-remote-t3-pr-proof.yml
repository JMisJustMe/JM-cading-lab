name: JM Remote Physical Host T3 Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'proof/remote-t3/**'

permissions:
  contents: read

jobs:
  t3-remote-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical T3 pack
        shell: bash
        run: |
          cat proof/remote-t3/chunk1.b64 proof/remote-t3/chunk2.b64 proof/remote-t3/chunk3.b64 proof/remote-t3/chunk4.b64 | tr -d '\n\r ' > /tmp/t3.b64
          test "$(wc -c < /tmp/t3.b64)" -eq 19740
          base64 -d /tmp/t3.b64 > /tmp/JM_GAME_ENGINE_REMOTE_PHYSICAL_HOST_T3_GATE_PACK_v1_0.zip
          echo "c8e1acb6e1720ddbaa5e34379e9f220ba65bf85d891aacacb4b6dcd7727e21f2  /tmp/JM_GAME_ENGINE_REMOTE_PHYSICAL_HOST_T3_GATE_PACK_v1_0.zip" | sha256sum -c -
          mkdir -p /tmp/jm-t3
          unzip -q /tmp/JM_GAME_ENGINE_REMOTE_PHYSICAL_HOST_T3_GATE_PACK_v1_0.zip -d /tmp/jm-t3

      - name: Execute Host B verifier
        shell: bash
        run: |
          cd /tmp/jm-t3
          python3 HOST_B_VERIFY.py savepacks --source SOURCE_HOST.json --receipt REMOTE_HOST_T3_RECEIPT.json
          cat REMOTE_HOST_T3_RECEIPT.json

      - name: Upload remote-host receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JM_REMOTE_PHYSICAL_HOST_T3_RECEIPT
          path: /tmp/jm-t3/REMOTE_HOST_T3_RECEIPT.json
