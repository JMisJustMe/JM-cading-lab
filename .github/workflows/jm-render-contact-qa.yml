name: JM Renderer Contact Boundary QA
on:
  push:
    branches: [jm-render-contact-cp2-20261019]
    paths:
      - 'games-beyond/jm-render-contact/**'
      - '.github/workflows/jm-render-contact-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games-beyond/jm-render-contact/**'
      - '.github/workflows/jm-render-contact-qa.yml'
  workflow_dispatch:
jobs:
  boundary-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JM renderer provider contact, safety and fallback
        run: node games-beyond/jm-render-contact/JM_RENDER_CONTACT_v0_1.test.mjs
      - name: Verify real static geometry batching (mock WebGL1-capable backend)
        run: node games-beyond/jm-render-contact/JM_STATIC_BATCH_v0_2.test.mjs
      - name: Verify WRESTLEFORM receiver first open and dual experience (mock only)
        run: node games-beyond/jm-render-contact/JM_WRESTLEFORM_v0_3_1_RECEIVER.test.mjs
      - name: Verify WRESTLEFORM v0.3.2 actual final arena consolidation and gameplay survival
        run: node games-beyond/jm-render-contact/JM_WRESTLEFORM_v0_3_2_STATIC_BATCH.test.mjs
