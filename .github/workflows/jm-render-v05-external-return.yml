name: JM Render v0.5 External Return Probe

on:
  push:
    branches:
      - "custody/render-live-probe-20260918"
    paths:
      - ".github/workflows/jm-render-v05-external-return.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - name: Contact live Render v0.5 public surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://jm-cloud-contact-server-v05.onrender.com"
          for NAME in health ready meta receipt-key; do
            curl --fail --silent --show-error --location --max-time 60 "$BASE/$NAME" -o "$NAME.json"
          done
          sha256sum health.json ready.json meta.json receipt-key.json > SHA256SUMS.txt
          wc -c health.json ready.json meta.json receipt-key.json > BYTE_COUNTS.txt

      - name: Upload minimal live-return receipt
        uses: actions/upload-artifact@v4
        with:
          name: jm-render-v05-external-return-${{ github.sha }}
          path: |
            health.json
            ready.json
            meta.json
            receipt-key.json
            SHA256SUMS.txt
            BYTE_COUNTS.txt
          retention-days: 7
          if-no-files-found: error
