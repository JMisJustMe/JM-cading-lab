name: JM RouteCore ATA PIO v0.13 Contact

on:
  push:
    branches:
      - routecore-ata-pio-v0-13-contact
    paths:
      - ".github/workflows/jm-routecore-ata-pio-v0-13.yml"
      - "routecore/ata-pio-v0-13/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ata-pio-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install x86 build and emulator tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 nasm binutils gcc

      - name: Audit transport, reconstruct exact release, and fresh-build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p routecore-ata/pieces

          check_piece() {
            local label="$1" path="$2" expected="$3"
            tr -d '\r\n\t ' < "$path" > "routecore-ata/pieces/$label"
            echo "$expected  routecore-ata/pieces/$label" | sha256sum -c -
          }

          check_piece 00a routecore/ata-pio-v0-13/fix/00a.b64 40cedefd86fee512975cd9a474dfbcb1158c60dcd9279a2629ef515bc2dde6e3
          check_piece 00b routecore/ata-pio-v0-13/fix/00b.b64 2b8d98c6d83b92030c362691de098d1e84d401842313e7b938741189a689c109
          check_piece 00c routecore/ata-pio-v0-13/fix/00c.b64 d496e03cff56993eaf6b43274b7a5f87285cf20f60015c8fcc3b4793dd3762ef
          check_piece 01  routecore/ata-pio-v0-13/package/part01.b64 8f67a481669e7b318d95fb5ffa7adf979455284d1daa6005cd4196d8adb59f81
          check_piece 02a1 routecore/ata-pio-v0-13/fix/02a1.b64 c691001c43be82c9946e39351b93b246f15771072e5873247b5a920a73a6b51b
          check_piece 02a2 routecore/ata-pio-v0-13/fix/02a2.b64 8aaf2ea4bd507d788f3a49dbf147b72b86d8ebd28260e0b9830179332cb326b7
          check_piece 02b routecore/ata-pio-v0-13/fix/02b.b64 caad037e7adb9dd78f3dcf4f98af4791da4b0d0fc9e409f24b3230ddd0ca9bda
          check_piece 02c routecore/ata-pio-v0-13/fix/02c.b64 03734fce7a853ee943cebf6a143f9508f25c75a24dbc57c74150d2083c0dee40
          check_piece 03a routecore/ata-pio-v0-13/fix/03a.b64 cf20a5243d6c549754f2ca9052420833e773e329b08cd1ad0146433fe3392b66
          check_piece 03b routecore/ata-pio-v0-13/fix/03b.b64 dc292926b605dacba198b4f0ccb201d5b42d7abc2a5684228e8f1c4e5c014c6f
          check_piece 03c routecore/ata-pio-v0-13/fix/03c.b64 acf96fdc659ea359d0d432a34d96a75e8648f99913f49a71b14f6cf22df2a25f
          check_piece 04 routecore/ata-pio-v0-13/package/part04.b64 496aa4c9fa5afbf7055399d84178b43301afae28f94f485b957a2cccaef120e8
          check_piece 05 routecore/ata-pio-v0-13/package/part05.b64 73043cca8284d8f8e94c832d776667ed45f27388754640a5e799a75033278bf7

          cat             routecore-ata/pieces/00a routecore-ata/pieces/00b routecore-ata/pieces/00c             routecore-ata/pieces/01             routecore-ata/pieces/02a1 routecore-ata/pieces/02a2 routecore-ata/pieces/02b routecore-ata/pieces/02c             routecore-ata/pieces/03a routecore-ata/pieces/03b routecore-ata/pieces/03c             routecore-ata/pieces/04 routecore-ata/pieces/05             > routecore-ata/release.b64

          echo "613232f9c88cdcdd833941011c2183a48353c40831e75e749c841ae726b2d59a  routecore-ata/release.b64" | sha256sum -c -
          base64 -d routecore-ata/release.b64 > routecore-ata/JM_ROUTECORE_NATIVE64_ATA_PIO_v0_13.zip
          echo "2ee8e512520030359083e9bf60585f404001adac226d7621e167a5a259116c55  routecore-ata/JM_ROUTECORE_NATIVE64_ATA_PIO_v0_13.zip" | sha256sum -c -

          unzip -q routecore-ata/JM_ROUTECORE_NATIVE64_ATA_PIO_v0_13.zip -d routecore-ata/work
          cd routecore-ata/work
          python3 build.py
          python3 - <<'PY'
          import json
          p=json.load(open('JM_ROUTECORE_NATIVE64_ATA_PIO_v0_13_PROOF.json'))
          assert p['passed'] == 216, p
          assert p['status'] == 'PASS', p
          print('CONSTRUCTION PASS', p['passed'], '/', p['total'])
          PY
          echo "8db9cc0b5efc552866554a7d5939ae978164bde95dbccf6610a8ba4c31a90ddd  build/jm_routecore_native64_ata_v0_13.img" | sha256sum -c -
          echo "c98637383055d4f315e9d7986020ea4dcee831877f5c2850e1f5ab08e553652b  build/jm_routecore_native64_v0_13.elf" | sha256sum -c -

      - name: Two-boot ATA persistence court
        shell: bash
        run: |
          set -euo pipefail
          cd routecore-ata/work
          chmod +x RUN_PERSISTENCE_LINUX.sh
          ./RUN_PERSISTENCE_LINUX.sh
          echo "=== BOOT 1 SERIAL ==="
          cat runtime/boot1.log
          echo "=== BOOT 2 SERIAL ==="
          cat runtime/boot2.log
          echo "=== FINAL RAW DISK COURT ==="
          python3 INSPECT_ATA_DISK.py runtime/jm_routecore_native64_ata_v0_13.runtime.img --expect-payload
          sha256sum runtime/jm_routecore_native64_ata_v0_13.runtime.img

      - name: Upload contact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jm-routecore-ata-v0-13-contact
          path: |
            routecore-ata/
          if-no-files-found: warn
