name: JM T-Boys Five Path CP03 — canonical native contact
on:
  push:
    branches:
      - feat/jm-tboys-fivepath-cp03-native-contact-20261027
    paths:
      - 'games/tboys-five-path/cp03/**'
      - '.github/workflows/jm-tboys-fivepath-cp03.yml'
  workflow_dispatch:
jobs:
  canonical-game-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sovereign source self-tests
        run: node coding-estate/sovereign-ten/direct/native-selftest.mjs
      - name: Prove T-Boys receiving consequences
        run: node games/tboys-five-path/cp03/tboys_canonical_native_contact.mjs > games/tboys-five-path/cp03/native_receipt.json
      - name: Upload bounded receipt
        uses: actions/upload-artifact@v4
        with:
          name: jm-tboys-cp03-canonical-native
          path: games/tboys-five-path/cp03/native_receipt.json
