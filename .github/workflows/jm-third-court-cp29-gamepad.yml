name: JM THIRD COURT CP29 — Native Controller Real Game
on:
  pull_request:
    paths:
      - 'family-gifts/third-court-preview/cp11-ball-contact-candidate.html'
      - 'games-beyond/tests/jm-third-court-cp29.spec.mjs'
      - '.github/workflows/jm-third-court-cp29-gamepad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-court-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games-beyond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing JM Games testing tools
        run: npm install --no-audit --no-fund
      - name: Chromium browser with mobile and desktop contexts
        run: npx playwright install --with-deps chromium
      - name: Real THIRD COURT basketball controller and interruption proof
        run: npx playwright test tests/jm-third-court-cp29.spec.mjs --project=mobile-chromium --project=desktop-chromium
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jm-thirdcourt-cp29-original-game-errors
          path: games-beyond/test-results/
          if-no-files-found: ignore
