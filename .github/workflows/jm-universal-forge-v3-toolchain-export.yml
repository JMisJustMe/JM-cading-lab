name: JM Universal Forge v3 Official Toolchain Export

on:
  pull_request:
    paths:
      - '.github/workflows/jm-universal-forge-v3-toolchain-export.yml'
      - 'proof/universal-forge-v3-sovereign-production/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-official-build-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install exact Android 36 lane
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Warm full AGP 8.13.2 release and lint lane
        run: |
          mkdir -p warm/app/src/main/java/com/jm/warm warm/app/src/main/res/values
          cat > warm/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='JMForgeV3ToolchainWarm'; include ':app'
          EOF
          cat > warm/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.13.2' apply false }
          EOF
          cat > warm/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > warm/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.jm.warm'
            compileSdk 36
            buildToolsVersion '36.0.0'
            defaultConfig { applicationId 'com.jm.warm'; minSdk 23; targetSdk 36; versionCode 1; versionName '1' }
            buildTypes { release { minifyEnabled false; shrinkResources false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > warm/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > warm/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > warm/app/src/main/java/com/jm/warm/MainActivity.java <<'EOF'
          package com.jm.warm; public class MainActivity extends android.app.Activity { public void onCreate(android.os.Bundle b){super.onCreate(b);} }
          EOF
          gradle --no-daemon -p warm :app:assembleDebug :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Fetch official bundletool carrier
        run: |
          set -euo pipefail
          URL="$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest | jq -r '.assets[] | select(.name | test("bundletool-all.*\\.jar$")) | .browser_download_url' | head -1)"
          test -n "$URL" && test "$URL" != "null"
          curl -fL "$URL" -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" version > "$RUNNER_TEMP/bundletool-version.txt"

      - name: Seal and split full official build room
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/jm-v3-build-room"
          mkdir -p "$KIT/android-sdk/platforms" "$KIT/android-sdk/build-tools" "$KIT/android-sdk/licenses" "$KIT/gradle-home"
          cp -a "$ANDROID_HOME/platforms/android-36" "$KIT/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/36.0.0" "$KIT/android-sdk/build-tools/"
          cp -a "$ANDROID_HOME/platform-tools" "$KIT/android-sdk/"
          cp -a "$ANDROID_HOME/licenses/." "$KIT/android-sdk/licenses/"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(dirname "$(dirname "$GRADLE_BIN")")"
          cp -a "$GRADLE_ROOT" "$KIT/gradle-8.13"
          cp -a "$HOME/.gradle/caches" "$KIT/gradle-home/"
          cp -a "$HOME/.gradle/native" "$KIT/gradle-home/" 2>/dev/null || true
          cp -a "$HOME/.gradle/notifications" "$KIT/gradle-home/" 2>/dev/null || true
          cp "$RUNNER_TEMP/bundletool.jar" "$KIT/bundletool.jar"
          cp "$RUNNER_TEMP/bundletool-version.txt" "$KIT/bundletool-version.txt"
          cat > "$KIT/BUILD_ROOM_RECEIPT.txt" <<EOF
          JM Universal Forge v3 Full Official Build Room
          Java: $(java -version 2>&1 | head -1)
          Gradle: $(gradle --version | awk '/Gradle /{print $2; exit}')
          Android platform: 36
          Android build-tools: 36.0.0
          AGP: 8.13.2
          Debug lane warmed: YES
          Release lane warmed: YES
          Release lint warmed: YES
          AAB lane warmed: YES
          Bundletool: $(cat "$RUNNER_TEMP/bundletool-version.txt")
          Source included: NO
          Private key included: NO
          Purpose: offline production compilation and validation of the exact owner-held v3 source body
          EOF
          FULL="$RUNNER_TEMP/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.tar.gz"
          (cd "$RUNNER_TEMP" && tar -czf "$FULL" jm-v3-build-room)
          sha256sum "$FULL" > "$RUNNER_TEMP/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM_SHA256.txt"
          split -b 200M -d -a 2 "$FULL" "$RUNNER_TEMP/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-"
          test -f "$RUNNER_TEMP/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-00"
          test -f "$RUNNER_TEMP/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-01"
          test -f "$RUNNER_TEMP/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-02"
          sha256sum "$RUNNER_TEMP"/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-* > "$RUNNER_TEMP/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM_PARTS_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: JM_UNIVERSAL_FORGE_v3_FULL_BUILD_ROOM_PART_00
          path: ${{ runner.temp }}/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-00
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: JM_UNIVERSAL_FORGE_v3_FULL_BUILD_ROOM_PART_01
          path: ${{ runner.temp }}/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-01
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: JM_UNIVERSAL_FORGE_v3_FULL_BUILD_ROOM_PART_02
          path: ${{ runner.temp }}/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM.part-02
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: JM_UNIVERSAL_FORGE_v3_FULL_BUILD_ROOM_MANIFEST
          path: |
            ${{ runner.temp }}/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM_SHA256.txt
            ${{ runner.temp }}/JM_UNIVERSAL_FORGE_v3_FULL_OFFICIAL_BUILD_ROOM_PARTS_SHA256.txt
          if-no-files-found: error
          retention-days: 7
