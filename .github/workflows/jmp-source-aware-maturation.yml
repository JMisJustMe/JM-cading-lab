name: JMP source-aware maturation

on:
  pull_request:
    paths:
      - "coding-estate/everybody/role-qualified-61/jmp/**"
      - ".github/workflows/jmp-source-aware-maturation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jmp-source-aware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Re-run Sovereign Batch Two native conformance
        run: node coding-estate/sovereign-batch-two/direct/native-selftest.mjs

      - name: Run JMP source-aware smoke proof
        run: node coding-estate/everybody/role-qualified-61/jmp/jmp-source-aware-smoke.mjs

      - name: Enforce source-truth and guarded-transition boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('coding-estate/everybody/role-qualified-61/jmp/JMP_SOURCE_AWARE_MATURATION_CONTRACT_v1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['body'] == 'J’MP'
          assert d['source_truth_tier'] == 'RECONSTRUCTED_EXECUTABLE_DESCENDANT'
          assert d['historicalRecoveryClaim'] is False
          assert d['current_native_donor']['git_blob_sha1'] == 'ca9da0ef949fc34d9ebcd0b1f1d2553321a6ee10'
          assert d['semantic_boundary']['keeper'] == 'JUMP SELECTION != STATE ERASURE'
          assert 'DECLARED GUARD STILL GOVERNS' in d['semantic_boundary']['guard_law']
          assert 'WITHOUT FORGING AN ANCESTOR' in d['keeper']
          print('JMP source-truth boundary PASS')
          PY
