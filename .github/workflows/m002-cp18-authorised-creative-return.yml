name: JM Mission 002 CP18 Authorised Creative Return
on:
  pull_request:
    paths:
      - 'coding-estate/integration/m002-cp17-multi-media-producer.mjs'
      - 'coding-estate/integration/m002-cp18-authorised-creative-return.mjs'
      - 'coding-estate/integration/m002-cp16-trusted-host.mjs'
      - 'tests/mission002-cp18-authorised-creative-return.mjs'
      - '.github/workflows/m002-cp18-authorised-creative-return.yml'
  push:
    branches:
      - 'integration/m002-cp18-authorised-creative-return-20261023'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verified-source-to-creative-return:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and original CP17 preservation
        run: |
          node --check coding-estate/integration/m002-cp17-multi-media-producer.mjs
          node --check coding-estate/integration/m002-cp18-authorised-creative-return.mjs
          node --check tests/mission002-cp18-authorised-creative-return.mjs
      - name: Independent CP16 original execution (baseline)
        run: node tests/mission002-cp16-source-check.mjs
      - name: CP18 actual localhost Python/native -> CP17 book/music/cartoon returned editions
        run: node tests/mission002-cp18-authorised-creative-return.mjs
