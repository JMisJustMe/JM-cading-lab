name: Materialize Authority Hold Engine v0.2 Chunks

on:
  push:
    paths:
      - 'JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.part-*'
      - 'JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.READY'
      - '.github/workflows/materialize-authority-hold-v0.2-chunks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble tested Zionfolder payload
        run: |
          cat JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.part-* > /tmp/authority-hold-v0.2.zip.b64
          base64 --decode /tmp/authority-hold-v0.2.zip.b64 > /tmp/authority-hold-v0.2.zip
          test "$(sha256sum /tmp/authority-hold-v0.2.zip | cut -d' ' -f1)" = "$(cat JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.READY)"
          TARGET='JM_ESTATE/GOVERNANCE/AUTHORITY_HOLD_ENGINE_v0.2'
          mkdir -p "$TARGET"
          unzip -oq /tmp/authority-hold-v0.2.zip -d "$TARGET"
      - name: Validate materialized body
        working-directory: JM_ESTATE/GOVERNANCE/AUTHORITY_HOLD_ENGINE_v0.2
        run: |
          node --check core.mjs
          node --check app.mjs
          node --check sw.js
          node --test core.test.mjs
          python3 surface_check.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          sha256sum -c SHA256SUMS.txt
      - name: Commit materialized body and clear transport files
        run: |
          rm -f JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.zip.b64
          rm -f JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.part-*
          rm -f JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.READY
          git config user.name 'JM Estate Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A JM_ESTATE/GOVERNANCE/AUTHORITY_HOLD_ENGINE_v0.2 JM_ESTATE/PAYLOADS
          git commit -m 'materialize Authority Hold Engine v0.2'
          git push
