name: Materialize Authority Hold Engine v0.2

on:
  push:
    paths:
      - 'JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.zip.b64'
      - '.github/workflows/materialize-authority-hold-v0.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check payload
        id: payload
        run: |
          if [ -f JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.zip.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode tested Zionfolder body
        if: steps.payload.outputs.present == 'true'
        run: |
          TARGET='JM_ESTATE/GOVERNANCE/AUTHORITY_HOLD_ENGINE_v0.2'
          mkdir -p "$TARGET"
          base64 --decode JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.zip.b64 > /tmp/authority-hold-v0.2.zip
          unzip -oq /tmp/authority-hold-v0.2.zip -d "$TARGET"
          rm JM_ESTATE/PAYLOADS/AUTHORITY_HOLD_ENGINE_v0.2.zip.b64
      - name: Validate materialized body
        if: steps.payload.outputs.present == 'true'
        working-directory: JM_ESTATE/GOVERNANCE/AUTHORITY_HOLD_ENGINE_v0.2
        run: |
          node --check core.mjs
          node --check app.mjs
          node --check sw.js
          node --test core.test.mjs
          python3 surface_check.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          sha256sum -c SHA256SUMS.txt
      - name: Commit materialized body
        if: steps.payload.outputs.present == 'true'
        run: |
          git config user.name 'JM Estate Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add JM_ESTATE/GOVERNANCE/AUTHORITY_HOLD_ENGINE_v0.2 JM_ESTATE/PAYLOADS
          if git diff --cached --quiet; then
            echo 'No materialization changes.'
          else
            git commit -m 'materialize Authority Hold Engine v0.2'
            git push
          fi
