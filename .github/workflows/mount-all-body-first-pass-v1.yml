name: Propose Exact JM Command Register v1.0

on:
  push:
    branches:
      - jm-proposal/exact-command-register-v1-0
    paths:
      - ".github/workflows/mount-all-body-first-pass-v1.yml"
      - "governance/mount-payloads/all-body-first-pass-v1.0/exact-fix-*.b64"
      - "governance/mount-requests/exact-command-register-v1-0.json"
  workflow_dispatch:

concurrency:
  group: jm-exact-command-register-proposal-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconstruct:
    name: Reconstruct and prove exact proposal carrier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out proposal branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and prove exact carrier
        shell: bash
        run: |
          set -euo pipefail
          payload='governance/mount-payloads/all-body-first-pass-v1.0'
          target='estate/authoritative/all-body-first-pass-v1.0'
          mkdir -p "$target"

          cat \
            "$payload"/repair.part00a \
            "$payload"/repair.part00b \
            "$payload"/repair.part00c \
            "$payload"/repair.part00d \
            "$payload"/exact-fix-p01-0.b64 \
            "$payload"/exact-fix-p01-1.b64 \
            "$payload"/exact-fix-p01-2.b64 \
            "$payload"/exact-fix-p01-3.b64 \
            "$payload"/exact-fix-p01-4.b64 \
            "$payload"/tiny.p01.1 \
            "$payload"/tiny.p01.2 \
            "$payload"/tiny.p01.3 \
            "$payload"/repair.part01cd \
            "$payload"/command-register.html.gz.b64.part02 \
            "$payload"/exact-fix-p03-0.b64 \
            "$payload"/exact-fix-p03-1.b64 \
            "$payload"/exact-fix-p03-2.b64 \
            "$payload"/exact-fix-p03-3.b64 \
            "$payload"/exact-fix-p03-4.b64 \
            "$payload"/tiny.p03.1 \
            "$payload"/tiny.p03.2 \
            "$payload"/tiny.p03.3 \
            "$payload"/repair.part03cd \
            "$payload"/command-register.html.gz.b64.part04 \
            "$payload"/command-register.html.gz.b64.part05 \
            "$payload"/command-register.html.gz.b64.part06a \
            "$payload"/command-register.html.gz.b64.part06b \
            "$payload"/command-register.html.gz.b64.part06c \
            "$payload"/command-register.html.gz.b64.part06d \
            "$payload"/command-register.html.gz.b64.part07a \
            "$payload"/command-register.html.gz.b64.part07b \
            "$payload"/command-register.html.gz.b64.part07c \
            "$payload"/command-register.html.gz.b64.part07d \
            "$payload"/command-register.html.gz.b64.part08 \
            > /tmp/jm-command-register.b64

          test "$(wc -c < /tmp/jm-command-register.b64)" -eq 154868
          base64 --decode /tmp/jm-command-register.b64 > /tmp/jm-command-register.html.gz

          expected_gzip='d1e547e1bfbb2c14a3319a09a54aeda80114ef4925415923987008febf8c6438'
          actual_gzip="$(sha256sum /tmp/jm-command-register.html.gz | awk '{print $1}')"
          test "$actual_gzip" = "$expected_gzip"
          test "$(wc -c < /tmp/jm-command-register.html.gz)" -eq 116149

          gzip --decompress --stdout /tmp/jm-command-register.html.gz > "$target/index.html"

          expected_html='abfffcc82f2aad630ce065702334366cd4b713a282add523a1d973b702871410'
          actual_html="$(sha256sum "$target/index.html" | awk '{print $1}')"
          test "$actual_html" = "$expected_html"
          test "$(wc -c < "$target/index.html")" -eq 2530896
          grep -Fq 'JM Command Register v1.0 — First Pass Finished' "$target/index.html"
          grep -Fq '1,074' "$target/index.html"
          grep -Fq 'FULL FIRST-PASS FINISHED' "$target/index.html"

          echo "PASS exact compressed carrier $actual_gzip"
          echo "PASS exact command register $actual_html"

      - name: Seal proposal receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('estate/authoritative/all-body-first-pass-v1.0/GITHUB_MOUNT_RECEIPT_v1_0.json')
          receipt = {
              'schema': 'JM.AllBodyFirstPassGitHubMountReceipt/1.0',
              'recorded_utc': datetime.now(timezone.utc).isoformat(),
              'source_event_commit': os.environ['GITHUB_SHA'],
              'state': 'PROPOSAL_EXACT_COMMAND_REGISTER_RECONSTRUCTED_AWAITING_JM_REVIEW',
              'authority': 'Theodore Benjamin Scott / JM / JMISJUSTME',
              'command_register_size_bytes': 2530896,
              'command_register_sha256': 'abfffcc82f2aad630ce065702334366cd4b713a282add523a1d973b702871410',
              'compressed_carrier_size_bytes': 116149,
              'compressed_carrier_sha256': 'd1e547e1bfbb2c14a3319a09a54aeda80114ef4925415923987008febf8c6438',
              'main_changed': False,
              'deployment_requested': False,
              'self_erasure': False,
              'silent_parallel_lane': False,
              'ding': False,
              'boundary': 'Exact bytes are reconstructed and proved on a proposal branch only. This is not a main mount, deployment, physical acceptance or JM Ding.'
          }
          path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit proved proposal result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JM Exact Carrier Proposal Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            estate/authoritative/all-body-first-pass-v1.0/index.html \
            estate/authoritative/all-body-first-pass-v1.0/GITHUB_MOUNT_RECEIPT_v1_0.json

          if git diff --cached --quiet; then
            echo 'No proposal result change required.'
            exit 0
          fi

          git commit -m 'Propose exact JM Command Register v1.0 carrier [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
