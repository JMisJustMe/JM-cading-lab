name: Mount Author Home Door Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mount-author-home-door-once.yml'

permissions:
  contents: write

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Estate
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Connect visible Author door
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          script = '<script defer src="./author-home-door.js"></script>'
          anchor = '<script type="module" src="./estate-app.js"></script>'

          if script not in html:
              if anchor not in html:
                  raise SystemExit('Estate app script anchor was not found; refusing a blind rewrite.')
              html = html.replace(anchor, anchor + script, 1)
              index.write_text(html, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("const CACHE='jm-web-estate-v1.3.0';", "const CACHE='jm-web-estate-v1.3.1';")
          if "'./author-home-door.js'" not in sw_text:
              sw_text = sw_text.replace("'./estate-app.js',", "'./estate-app.js','./author-home-door.js',", 1)
          sw.write_text(sw_text, encoding='utf-8')

          workflow = Path('.github/workflows/mount-author-home-door-once.yml')
          workflow.unlink()

      - name: Commit mounted door and receipt
        run: |
          git config user.name "JM Estate Mount"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js author-home-door.js .github/workflows/mount-author-home-door-once.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Mount visible Author door on Estate homepage"
          git push origin main
