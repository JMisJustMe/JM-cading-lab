name: Mount Author Press Kit Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mount-author-press-kit-once.yml'

permissions:
  contents: write

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Estate
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Connect press kit and offline routes
        shell: python
        run: |
          from pathlib import Path

          author = Path('author/index.html')
          html = author.read_text(encoding='utf-8')
          nav_anchor = '<a class="navlink" href="#estate-doors">Estate doors</a>'
          nav_link = '<a class="navlink" href="./press-kit/">Press kit</a>'
          if nav_link not in html:
              if nav_anchor not in html:
                  raise SystemExit('Author navigation anchor not found; refusing blind rewrite.')
              html = html.replace(nav_anchor, nav_anchor + nav_link, 1)

          registry_anchor = '<a class="filelink" href="./author-public.json">Public author registry</a>'
          press_link = '<a class="filelink" href="./press-kit/">Press / Book / Collaboration Pack</a>'
          if press_link not in html:
              if registry_anchor not in html:
                  raise SystemExit('Author Estate-door anchor not found; refusing blind rewrite.')
              html = html.replace(registry_anchor, press_link + registry_anchor, 1)
          author.write_text(html, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          import re
          text = re.sub(r"const CACHE='jm-web-estate-[^']+';", "const CACHE='jm-web-estate-v1.4.5-author-press-kit';", text, count=1)
          routes = [
              "'./author/press-kit/'",
              "'./author/press-kit/index.html'",
              "'./author/press-kit/press-kit.txt'",
              "'./author/press-kit/press-kit-public.json'"
          ]
          anchor = "'./author/author-public.json',"
          if anchor not in text:
              raise SystemExit('Service-worker Author cache anchor not found.')
          missing = [route for route in routes if route not in text]
          if missing:
              text = text.replace(anchor, anchor + '\n  ' + ',\n  '.join(missing) + ',', 1)
          sw.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/mount-author-press-kit-once.yml')
          workflow.unlink()

      - name: Commit completed mount
        run: |
          git config user.name "JM Estate Mount"
          git config user.email "actions@users.noreply.github.com"
          git add author/index.html sw.js .github/workflows/mount-author-press-kit-once.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Mount Author press kit into public body"
          git push origin main
