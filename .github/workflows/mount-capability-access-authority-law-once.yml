name: Mount Capability Access Authority Law Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mount-capability-access-authority-law-once.yml"

permissions:
  contents: write

concurrency:
  group: mount-capability-access-authority-law-once
  cancel-in-progress: false

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing authoritative Estate
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Graft the law into existing authority and Estate map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          crown = "Capability does not grant coronation. Access does not grant architectural authority. No new public lane may be created before the existing lane is recalled, declared and deliberately continued—or deliberately preserved as separate by JM."
          keeper = "Technical capability is a tool held under owner authority. It is never authority over the owner’s architecture."

          authority_path = Path('registry/estate-classification-authority-v1.0.json')
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          authority['effective_date'] = '2026-07-22'
          authority['status'] = 'GOVERNING_SECOND_WAVE_WITH_RECENT_CONVERGENCE_AND_OWNER_AUTHORITY_LAW'
          laws = authority.setdefault('laws', [])
          for law in [
              crown,
              "Owner authority precedes tool capability.",
              "Connection to a platform is not continuation of the owner’s previous creation on that platform.",
              "No coronation before owner-side physical contact."
          ]:
              if law not in laws:
                  laws.append(law)

          body = {
              'id': 'capability-access-architectural-authority-law',
              'name': 'JM Capability, Access & Architectural Authority Law',
              'primary_seat': 'Registers & Governance / Owner Authority / External Persistent Systems',
              'governing_identity': 'permanent owner-authority gate governing persistent writes, deployments, branches, public routes and standing external lanes',
              'trigger_case': 'GitHub × Cloudflare lineage bypass and recovery',
              'full_body': 'governance/capability-access-authority-law-v1.0.md',
              'public_route': '/governance/capability-access-authority-law/',
              'registry': 'registry/capability-access-authority-law-v1.0.json',
              'receipt': 'registry/capability-access-authority-law-receipt-v1.0.json',
              'crown_law': crown,
              'mandatory_pre_write_declaration': [
                  'existing_authoritative_body',
                  'existing_deployment_lineage',
                  'proposed_action',
                  'owner_authority',
                  'non_overwrite_boundary',
                  'physical_proof_condition'
              ],
              'prohibited_reductions': [
                  'technical access treated as architectural permission',
                  'automated route proof treated as owner coronation',
                  'new adjacent lane silently presented as continuation',
                  'lack of deceptive intent used to erase the practical bypass'
              ],
              'ruling': 'PERMANENT_GOVERNING_OWNER_AUTHORITY_GATE',
              'severity': 'CROWN_GOVERNANCE_LAW'
          }
          bodies = authority.setdefault('bodies', [])
          current = next((item for item in bodies if item.get('id') == body['id']), None)
          if current:
              current.update(body)
          else:
              bodies.append(body)

          authority['owner_authority_gate'] = {
              'version': 'v1.0',
              'state': 'PERMANENT_GOVERNING_LAW_MOUNTED',
              'crown_law': crown,
              'keeper': keeper,
              'full_body': body['full_body'],
              'public_route': body['public_route'],
              'registry': body['registry'],
              'receipt': body['receipt'],
              'applies_to': [
                  'GitHub', 'GitHub Pages', 'Cloudflare', 'connected storage',
                  'deployment platforms', 'databases', 'automation systems',
                  'any tool capable of creating a standing external lane'
              ]
          }
          authority_path.write_text(json.dumps(authority, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          map_path = Path('registry/estate-map.json')
          estate = json.loads(map_path.read_text(encoding='utf-8'))
          routes = estate.setdefault('live_github_routes', [])
          route = {
              'body': 'JM Capability, Access & Architectural Authority Law',
              'path': 'governance/capability-access-authority-law/index.html',
              'state': 'PERMANENT_GOVERNING_OWNER_AUTHORITY_GATE'
          }
          found = next((item for item in routes if item.get('path') == route['path']), None)
          if found:
              found.update(route)
          else:
              routes.append(route)

          departments = estate.setdefault('registered_departments', [])
          department = {
              'body': 'Capability, Access & Architectural Authority Law',
              'state': 'PERMANENT_GOVERNING_OWNER_AUTHORITY_GATE',
              'route': 'governance/capability-access-authority-law/',
              'registry': 'registry/capability-access-authority-law-v1.0.json',
              'receipt': 'registry/capability-access-authority-law-receipt-v1.0.json',
              'boundary': 'Capability is held under JM owner authority and never supplies architectural authority by itself.'
          }
          current_department = next((item for item in departments if item.get('body') == department['body']), None)
          if current_department:
              current_department.update(department)
          else:
              departments.append(department)

          estate['owner_authority_gate'] = {
              'version': 'v1.0',
              'state': 'MOUNTED_IN_EXISTING_CLASSIFICATION_AUTHORITY_AND_ESTATE_MAP',
              'crown_law': crown,
              'public_route': 'governance/capability-access-authority-law/',
              'registry': 'registry/capability-access-authority-law-v1.0.json'
          }
          map_path.write_text(json.dumps(estate, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          receipt_path = Path('registry/capability-access-authority-law-receipt-v1.0.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['central_authority_mount'] = {
              'state': 'PASS_CONNECTED_TO_EXISTING_AUTHORITY_NOT_LEFT_AS_NEARBY_LANE',
              'classification_authority': str(authority_path),
              'estate_map': str(map_path),
              'mounted_utc': datetime.now(timezone.utc).isoformat(),
              'temporary_mount_workflow_retired': True
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python3 -m json.tool registry/estate-classification-authority-v1.0.json >/dev/null
          python3 -m json.tool registry/estate-map.json >/dev/null
          python3 -m json.tool registry/capability-access-authority-law-receipt-v1.0.json >/dev/null

      - name: Retire the temporary mount mechanism and commit the graft
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Owner Authority Mount"
          git config user.email "actions@users.noreply.github.com"
          git add registry/estate-classification-authority-v1.0.json registry/estate-map.json registry/capability-access-authority-law-receipt-v1.0.json
          git rm .github/workflows/mount-capability-access-authority-law-once.yml
          git commit -m "Seat Capability Access Authority Law in existing Estate governance [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
