# Manual diagnostic fallback only. The combined Estate Head workflow owns automatic publication.
name: Diagnose Estate Head public House mount

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-houses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run House mount and validation without competing automatic trigger
        run: |
          python3 scripts/mount_estate_head_house_consumers.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('registry/estate-head-public-current.json').read_text())
          assert contract['deployment_state']=='PUBLIC_HOUSE_CONSUMPTION_LIVE_IN_REPOSITORY'
          assert len(contract['public_house_consumers'])==9
          for page in contract['public_house_consumers']:
              assert 'data-jm-estate-head-consumer' in Path(page).read_text(), page
          print('Nine public House consumers: PASS')
          PY
          node --check estate-head-public-consumer.js
