# One automatic authority route: root projection plus every sovereign public House.
name: Mount Estate Head across public estate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - registry/estate-head-public-current.json
      - scripts/mount_estate_head_public.py
      - scripts/mount_estate_head_house_consumers.py
      - .github/workflows/mount-estate-head-public-current-v021.yml

permissions:
  contents: write

concurrency:
  group: estate-head-public-authority
  cancel-in-progress: false

jobs:
  mount:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mount root projection and all public Houses
        run: |
          python3 scripts/mount_estate_head_public.py
          python3 scripts/mount_estate_head_house_consumers.py

      - name: Validate complete public authority chain
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('registry/estate-head-public-current.json').read_text())
          estate=json.loads(Path('registry/estate-map.json').read_text())
          root_receipt=json.loads(Path('registry/estate-head-public-consumption-receipt.json').read_text())
          house_receipt=json.loads(Path('registry/estate-head-house-consumption-receipt.json').read_text())
          assert contract['deployment_state']=='PUBLIC_HOUSE_CONSUMPTION_LIVE_IN_REPOSITORY'
          assert contract['current_public_subset_version']=='v0.2.1'
          assert len(contract['public_house_consumers'])==9
          assert house_receipt['public_house_consumers']==contract['public_house_consumers']
          assert root_receipt['authority_snapshot']['body_count']==contract['body_count']
          assert estate['estate_head_public_authority']['version']==contract['current_public_subset_version']
          assert estate['estate_head_public_authority']['boundary']==contract['boundary']
          assert 'estate-head-public-current.json' in Path('estate-app.js').read_text()
          assert 'JM_EST_HEAD_PUBLIC_AUTHORITY_V021' in Path('estate-app.js').read_text()
          assert 'estate-head-public-current.json' in Path('sw.js').read_text()
          assert './apps/' in Path('estate-app.js').read_text()
          for page in contract['public_house_consumers']:
              assert 'data-jm-estate-head-consumer' in Path(page).read_text(), page
          print('Estate Head root + nine sovereign public Houses: PASS')
          PY
          node --check estate-app.js
          node --check estate-head-public-consumer.js

      - name: Commit and safely rebase complete authority mount
        run: |
          if git diff --quiet; then
            echo 'Complete Estate Head public mount already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/estate-head-public-current.json registry/estate-map.json registry/estate-head-public-consumption-receipt.json registry/estate-head-house-consumption-receipt.json estate-app.js estate-head-public-consumer.js index.html sw.js docs/JM_ESTATE_HEAD_PUBLIC_CONSUMPTION_RECEIPT.md docs/JM_ESTATE_HEAD_HOUSE_CONSUMPTION_RECEIPT.md apps/index.html games-beyond/index.html games-beyond/routeos/index.html theory/index.html lyrics/index.html recovery/index.html author/index.html coding-estate/everybody/00_OPEN_FIRST.html cading.html
          git commit -m 'Mount Estate Head across root and every public House'
          for attempt in $(seq 1 30); do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during attempt ${attempt}; rebasing without overwriting concurrent work."
            sleep 1
          done
          echo 'Could not publish without overwriting concurrent work.'
          exit 1
