name: JM Natural Operational Language Creator Surface v1.1

on:
  push:
    branches:
      - agent/natural-operational-language-bounce-v1-1-mobile-state-clarity
    paths:
      - 'coding-estate/natural-operational-language/v1.1/**'
      - '.github/workflows/natural-operational-language-bounce-v1-1.yml'
  pull_request:
    paths:
      - 'coding-estate/natural-operational-language/v1.1/**'
      - '.github/workflows/natural-operational-language-bounce-v1-1.yml'

jobs:
  mobile-state-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full creator-surface regression
        run: |
          node coding-estate/natural-operational-language/test-bounce-spine.mjs
          node coding-estate/natural-operational-language/test-estate-route-adapter.mjs
          node coding-estate/natural-operational-language/v0.2/test-v0.2.mjs
          node coding-estate/natural-operational-language/v0.3/test-v0.3.mjs
          node coding-estate/natural-operational-language/v0.4/test-v0.4.mjs
          node coding-estate/natural-operational-language/v0.5/test-v0.5.mjs
          node coding-estate/natural-operational-language/v0.6/test-v0.6.mjs
          node coding-estate/natural-operational-language/v0.7/test-v0.7.mjs
          node coding-estate/natural-operational-language/v0.8/test-v0.8.mjs
          python3 coding-estate/natural-operational-language/v0.9/test_v0_9.py
          node coding-estate/natural-operational-language/v1.0/test-v1.0.mjs
      - name: State distinction source gate
        run: |
          FILE=coding-estate/natural-operational-language/v1.1/00_OPEN_FIRST.html
          grep -q 'FOCUS ≠ SELECTED' "$FILE"
          grep -q 'selected-action' "$FILE"
          grep -q 'selected-relation' "$FILE"
          grep -q 'plain-relation' "$FILE"
          grep -q 'aria-pressed' "$FILE"
          grep -q 'min-height:48px' "$FILE"
      - name: Build compact direct-open body
        run: node coding-estate/natural-operational-language/v1.1/build-standalone.mjs
      - name: Pea-before-galaxy carrier gate
        run: |
          FILE=coding-estate/natural-operational-language/v1.1/dist/00_OPEN_FIRST_STANDALONE.html
          test -s "$FILE"
          test -s coding-estate/natural-operational-language/v1.1/dist/STANDALONE_BUILD_RECEIPT.json
          test "$(wc -c < "$FILE")" -lt 2000000
          grep -q '<script type="importmap">' "$FILE"
          grep -q 'FOCUS ≠ SELECTED' "$FILE"
          ! grep -q "from './" "$FILE"
          ! grep -q "from '../" "$FILE"
      - name: Real direct-open mobile-state smoke
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          FILE="$PWD/coding-estate/natural-operational-language/v1.1/dist/00_OPEN_FIRST_STANDALONE.html"
          timeout 30 "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=4000 --window-size=412,915 --dump-dom "file://$FILE" > /tmp/jm-nol-v11-dom.html
          grep -q 'word state legend' /tmp/jm-nol-v11-dom.html
          grep -q 'data-state="plain-relation"' /tmp/jm-nol-v11-dom.html
          grep -q 'aria-label="and, plain relation word' /tmp/jm-nol-v11-dom.html
          grep -q 'No operational words selected.' /tmp/jm-nol-v11-dom.html
          grep -q '>open<' /tmp/jm-nol-v11-dom.html
          grep -q '>and<' /tmp/jm-nol-v11-dom.html
      - name: Prove canonical registry remains 100
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='coding-estate/integration/';
          const manifest=JSON.parse(fs.readFileSync(root+'REGISTRY.json','utf8'));
          const bodies=manifest.parts.flatMap(part=>JSON.parse(fs.readFileSync(root+part,'utf8')).bodies);
          if(manifest.count!==100 || bodies.length!==100) throw new Error(`REGISTRY_DRIFT:${manifest.count}/${bodies.length}`);
          console.log(JSON.stringify({status:'PASS',count:bodies.length}));
          NODE
      - name: Upload v1.1 creator surface
        uses: actions/upload-artifact@v4
        with:
          name: JM_NATURAL_OPERATIONAL_LANGUAGE_CREATOR_SURFACE_v1.1
          path: |
            coding-estate/natural-operational-language/v1.1/dist/00_OPEN_FIRST_STANDALONE.html
            coding-estate/natural-operational-language/v1.1/dist/STANDALONE_BUILD_RECEIPT.json
          if-no-files-found: error
