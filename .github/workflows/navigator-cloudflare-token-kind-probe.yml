name: Navigator Cloudflare token kind probe

on:
  push:
    branches:
      - agent/navigator-live-contact-stage-v0-1
    paths:
      - ".github/workflows/navigator-cloudflare-token-kind-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Verify token kind without exposing credential
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe user-token and account-token verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cf-token-kind"
          user_status="$(curl -sS -o "$RUNNER_TEMP/cf-token-kind/user.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json')"
          account_status="$(curl -sS -o "$RUNNER_TEMP/cf-token-kind/account.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json')"
          USER_STATUS="$user_status" ACCOUNT_STATUS="$account_status" DIR="$RUNNER_TEMP/cf-token-kind" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['DIR'])
          def read(name):
              try: return json.loads((root / name).read_text(encoding='utf-8'))
              except Exception: return {}
          u, a = read('user.json'), read('account.json')
          def compact(payload, status):
              result = payload.get('result') or {}
              return {
                  'http_status': int(status),
                  'success': payload.get('success') is True,
                  'status': result.get('status'),
                  'errors': [
                      {'code': e.get('code'), 'message': e.get('message')}
                      for e in (payload.get('errors') or []) if isinstance(e, dict)
                  ],
              }
          user = compact(u, os.environ['USER_STATUS'])
          account = compact(a, os.environ['ACCOUNT_STATUS'])
          if user['success'] and not account['success']:
              kind = 'USER_API_TOKEN'
          elif account['success'] and not user['success']:
              kind = 'ACCOUNT_API_TOKEN'
          elif user['success'] and account['success']:
              kind = 'BOTH_VERIFY_ENDPOINTS_ACCEPTED'
          else:
              kind = 'UNRESOLVED'
          print(json.dumps({'token_kind': kind, 'user_verify': user, 'account_verify': account, 'secret_exposed': False, 'mutation_performed': False}, indent=2))
          PY

      - name: Assert zero mutation
        run: echo 'Token-kind probe called verify endpoints only; token value was masked by Actions and no Cloudflare resource was changed.'
