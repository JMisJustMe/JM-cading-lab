name: Observe Estate Head v0.2.1 Cloudflare Deployment

on:
  workflow_run:
    workflows:
      - "Deploy Estate Head v0.2.1 to Cloudflare"
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record exact Estate Head deployment outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          jobs=json.loads(Path(os.environ['RUNNER_TEMP'],'jobs.json').read_text())
          steps=[]
          for job in jobs.get('jobs',[]):
              for step in job.get('steps',[]):
                  steps.append({'job':job.get('name'),'name':step.get('name'),'conclusion':step.get('conclusion')})
          receipt={
              'schema':'JM.CloudflareEstateHeadOutcome/0.2.1',
              'status':os.environ['STATUS'],
              'conclusion':os.environ['CONCLUSION'],
              'run_id':os.environ['RUN_ID'],
              'head_sha':os.environ['HEAD_SHA'],
              'run_url':os.environ['RUN_URL'],
              'updated_at':os.environ['UPDATED_AT'],
              'recorded_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'steps':steps,
          }
          Path('registry').mkdir(exist_ok=True)
          Path('registry/cloudflare-estate-head-outcome.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit observed outcome
        run: |
          set -euo pipefail
          git config user.name "JM Estate Head Deployment Observer"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-estate-head-outcome.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Estate Head v0.2.1 Cloudflare outcome"
          git pull --rebase origin main
          git push origin HEAD:main
