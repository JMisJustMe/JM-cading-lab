name: Record Cloudflare Navigator Deployment Outcome

on:
  workflow_run:
    workflows:
      - "Deploy Live-Preserving Cloudflare Estate"
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  record:
    name: Preserve deployment conclusion and inspect proof steps
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Check out current Estate head
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Inspect the completed deployment run and write receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS: ${{ github.event.workflow_run.status }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p registry
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json"

          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'jobs.json').read_text())
          jobs = payload.get('jobs', [])
          target = next((j for j in jobs if 'mount Navigator and Apps' in j.get('name', '')), None)
          if target is None:
              target = jobs[0] if jobs else {'steps': []}

          raw_steps = {s.get('name', ''): s.get('conclusion') for s in target.get('steps', [])}
          proof_specs = {
              'assemble': ('Assemble the canonical Estate body',),
              'overlay': ('Overlay sovereign public rooms',),
              'verify': ('Verify the assembled deployment body',),
              'deploy': ('Deploy the existing Cloudflare Pages project',),
              'live_proof': (
                  'Prove Navigator, Apps and preserved Theory on the canonical host',
                  'Prove Navigator, Apps and repaired Theory on the canonical host',
              ),
          }

          def resolve(names):
              for name in names:
                  if name in raw_steps:
                      return {'name': name, 'conclusion': raw_steps[name]}
              return {'name': names[0], 'conclusion': 'missing'}

          resolved = {key: resolve(names) for key, names in proof_specs.items()}
          proven = all(item['conclusion'] == 'success' for item in resolved.values())
          recorded = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          receipt_step = raw_steps.get('Write successful five-room deployment receipt', 'missing')

          outcome = {
              'schema': 'JM.CloudflareNavigatorWorkflowOutcome/1.2',
              'workflow': 'Deploy Live-Preserving Cloudflare Estate',
              'status': os.environ['STATUS'],
              'conclusion': os.environ['CONCLUSION'],
              'deployment_proven': proven,
              'proof_steps': resolved,
              'receipt_step': receipt_step,
              'run_id': os.environ['RUN_ID'],
              'run_number': os.environ['RUN_NUMBER'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'head_sha': os.environ['HEAD_SHA'],
              'head_branch': os.environ['HEAD_BRANCH'],
              'event': os.environ['EVENT_NAME'],
              'run_url': os.environ['RUN_URL'],
              'updated_at': os.environ['UPDATED_AT'],
              'recorded_at_utc': recorded,
              'boundary': 'Proof organs are matched by governed aliases, so harmless wording changes cannot turn a successful deployment into a false missing result.'
          }
          Path('registry/cloudflare-navigator-workflow-outcome.json').write_text(json.dumps(outcome, indent=2) + '\n')

          if proven:
              receipt = {
                  'schema': 'JM.CloudflareAutoDeployReceipt/1.4',
                  'status': 'SUCCESS',
                  'project': 'jmisjustme-estate',
                  'canonical_host': 'jmisjustme-estate.pages.dev',
                  'source_commit': os.environ['HEAD_SHA'],
                  'workflow_run': os.environ['RUN_ID'],
                  'proved_at_utc': os.environ['UPDATED_AT'],
                  'rooms': ['navigator', 'apps', 'theory', 'lyrics', 'recovery'],
                  'navigator_route': 'https://jmisjustme-estate.pages.dev/navigator/',
                  'navigator_proof': 'EXECUTABLE_BROWSER_EXPERIENCE_SHELL_AND_LOCAL_FIRST_STRINGLINE',
                  'stringline_proof': 'Many bodies. One living line. None erased.',
                  'apps_registry_count': 40,
                  'apps_boundary': 'PUBLIC_SAFE_CATALOGUE_PRIVATE_PAYLOADS_OWNER_SIDE',
                  'theory_policy': 'PRESERVE_PRE_REGRESSION_F6336B93_BODY',
                  'theory_mobile_reader_clearance': 'PROVEN',
                  'deployment_step': 'SUCCESS',
                  'canonical_live_proof_step': 'SUCCESS',
                  'workflow_conclusion': os.environ['CONCLUSION'],
                  'receipt_step': receipt_step,
                  'receipt_reconciliation': 'Written by the independent Stringline observer from inspected step evidence.',
                  'manual_upload_required': False,
                  'boundary': 'This proves JM3232 Navigator v0.1.1 and JM Stringline are live as a browser-experience shell. It does not claim a custom rendering engine, platform-level chat embedding, universal parser completion or APK.'
              }
              Path('registry/cloudflare-auto-deploy-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Commit receipts without flattening parallel work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Stringline Deployment Observer"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-navigator-workflow-outcome.json registry/cloudflare-auto-deploy-receipt.json
          git diff --cached --quiet && exit 0
          git commit -m "Record and reconcile Cloudflare Navigator deployment outcome"
          git pull --rebase origin main
          git push origin HEAD:main
