name: Record Cloudflare Navigator Deployment Outcome

on:
  workflow_run:
    workflows:
      - "Deploy Live-Preserving Cloudflare Estate"
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  record:
    name: Preserve deployment conclusion and inspect proof steps
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Check out current Estate head
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Inspect the completed deployment run and write outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS: ${{ github.event.workflow_run.status }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p registry
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json"

          python3 <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'jobs.json').read_text())
          jobs = payload.get('jobs', [])
          target = next((j for j in jobs if 'mount Navigator and Apps' in j.get('name', '')), None)
          if target is None:
              target = jobs[0] if jobs else {'steps': []}

          raw_steps = {s.get('name', ''): s.get('conclusion') for s in target.get('steps', [])}
          proof_specs = {
              'assemble': ('Assemble the canonical Estate body',),
              'overlay': ('Overlay sovereign public rooms',),
              'verify': ('Verify the assembled deployment body',),
              'deploy': ('Deploy the existing Cloudflare Pages project',),
              'live_proof': (
                  'Prove Navigator, Apps and preserved Theory on the canonical host',
                  'Prove Navigator, Apps and repaired Theory on the canonical host',
              ),
          }

          def resolve(names):
              for name in names:
                  if name in raw_steps:
                      return {'name': name, 'conclusion': raw_steps[name]}
              return {'name': names[0], 'conclusion': 'missing'}

          resolved = {key: resolve(names) for key, names in proof_specs.items()}
          proven = all(item['conclusion'] == 'success' for item in resolved.values())
          recorded = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          receipt_step = raw_steps.get('Write successful five-room deployment receipt', 'missing')

          outcome = {
              'schema': 'JM.CloudflareNavigatorWorkflowOutcome/1.3',
              'workflow': 'Deploy Live-Preserving Cloudflare Estate',
              'status': os.environ['STATUS'],
              'conclusion': os.environ['CONCLUSION'],
              'deployment_proven': proven,
              'proof_steps': resolved,
              'receipt_step': receipt_step,
              'run_id': os.environ['RUN_ID'],
              'run_number': os.environ['RUN_NUMBER'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'head_sha': os.environ['HEAD_SHA'],
              'head_branch': os.environ['HEAD_BRANCH'],
              'event': os.environ['EVENT_NAME'],
              'run_url': os.environ['RUN_URL'],
              'updated_at': os.environ['UPDATED_AT'],
              'recorded_at_utc': recorded,
              'boundary': 'Observer records inspected step evidence and validates the deployment-owned receipt; it does not overwrite deployment truth.'
          }
          Path('registry/cloudflare-navigator-workflow-outcome.json').write_text(json.dumps(outcome, indent=2) + '\n')

          if proven:
              receipt_path = Path('registry/cloudflare-auto-deploy-receipt.json')
              if not receipt_path.exists():
                  raise SystemExit('Successful deployment receipt is missing; observer will not manufacture a replacement.')
              receipt = json.loads(receipt_path.read_text())
              apps_text = Path('apps/index.html').read_text(encoding='utf-8')
              match = re.search(r'const APPS=(\[.*?\]);\s*const APP_STAT_COUNTS=', apps_text, re.S)
              if not match:
                  raise SystemExit('Current Apps registry cannot be parsed for receipt validation.')
              current_count = len(json.loads(match.group(1)))
              checks = {
                  'status': receipt.get('status') == 'SUCCESS',
                  'schema': receipt.get('schema') == 'JM.CloudflareAutoDeployReceipt/1.5',
                  'source_commit': receipt.get('source_commit') == os.environ['HEAD_SHA'],
                  'workflow_run': str(receipt.get('workflow_run')) == str(os.environ['RUN_ID']),
                  'apps_registry_count': receipt.get('apps_registry_count') == current_count,
                  'manual_upload_required': receipt.get('manual_upload_required') is False,
              }
              failed = [name for name, ok in checks.items() if not ok]
              if failed:
                  raise SystemExit(f'Deployment-owned receipt validation failed: {failed}; observer will not overwrite it.')
              print(f'Deployment-owned receipt validated: {current_count} Apps rooms; observer preserved it unchanged.')
          PY

      - name: Commit outcome without flattening deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Stringline Deployment Observer"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-navigator-workflow-outcome.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Cloudflare deployment outcome without receipt overwrite"
          git pull --rebase origin main
          git push origin HEAD:main
