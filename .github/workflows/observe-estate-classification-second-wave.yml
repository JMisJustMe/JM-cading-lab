name: Observe Estate Classification Second Wave

on:
  workflow_run:
    workflows:
      - "Apply Estate Classification Second Wave"
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Inspect second-wave workflow and write outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS: ${{ github.event.workflow_run.status }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p registry
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json"
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload=json.loads(Path(os.environ['RUNNER_TEMP'],'jobs.json').read_text())
          jobs=payload.get('jobs',[])
          steps=[]
          for job in jobs:
              for step in job.get('steps',[]):
                  steps.append({'job':job.get('name'),'name':step.get('name'),'conclusion':step.get('conclusion')})
          receipt={
              'schema':'JM.EstateClassificationSecondWaveOutcome/1.0',
              'workflow':'Apply Estate Classification Second Wave',
              'status':os.environ['STATUS'],
              'conclusion':os.environ['CONCLUSION'],
              'run_id':os.environ['RUN_ID'],
              'head_sha':os.environ['HEAD_SHA'],
              'run_url':os.environ['RUN_URL'],
              'updated_at':os.environ['UPDATED_AT'],
              'recorded_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'steps':steps,
          }
          Path('registry/estate-classification-second-wave-outcome.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit outcome without flattening parallel work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Estate Classification Observer"
          git config user.email "actions@users.noreply.github.com"
          git add registry/estate-classification-second-wave-outcome.json
          git diff --cached --quiet && exit 0
          git commit -m "Record estate classification second-wave outcome"
          git pull --rebase origin main
          git push origin HEAD:main
