name: Observe Estate Classification Integrity v1.2

on:
  workflow_run:
    workflows:
      - "Audit Estate Classification Integrity v1.2"
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record gate outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p registry
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          payload=json.loads(Path(os.environ['RUNNER_TEMP'],'jobs.json').read_text())
          steps=[]
          for job in payload.get('jobs',[]):
              for step in job.get('steps',[]):
                  steps.append({'job':job.get('name'),'name':step.get('name'),'conclusion':step.get('conclusion')})
          receipt={
            'schema':'JM.EstateClassificationGateOutcome/1.2',
            'status':os.environ['STATUS'],
            'conclusion':os.environ['CONCLUSION'],
            'run_id':os.environ['RUN_ID'],
            'head_sha':os.environ['HEAD_SHA'],
            'run_url':os.environ['RUN_URL'],
            'updated_at':os.environ['UPDATED_AT'],
            'recorded_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'steps':steps,
          }
          Path('registry/estate-classification-gate-outcome-v1.2.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit gate outcome
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Estate Classification Gate Observer"
          git config user.email "actions@users.noreply.github.com"
          git add registry/estate-classification-gate-outcome-v1.2.json
          git diff --cached --quiet && exit 0
          git commit -m "Record full estate classification gate outcome"
          git pull --rebase origin main
          git push origin HEAD:main
