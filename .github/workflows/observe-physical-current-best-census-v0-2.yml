name: Observe Physical Current-Best Census v0.2

on:
  workflow_run:
    workflows:
      - "Audit Physical Current-Best Census v0.2"
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Record census gate outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          jobs=json.loads(Path(os.environ['RUNNER_TEMP'],'jobs.json').read_text())
          census=json.loads(Path('registry/estate-physical-current-best-census-v0.2.json').read_text())
          scope=census.get('first_scope',[])
          packages=[item for item in scope if item.get('status')=='PHYSICAL_PACKAGE_CONFIRMED']
          partial_statuses={
              'SOURCE_ANCHOR_BODY_CONFIRMED_CONTINUATION_SEARCH_ACTIVE',
              'DIRECT_HTML_BODY_CONFIRMED_ZIP_AND_DONOR_SEARCH_ACTIVE',
              'DIRECT_HTML_AND_DONOR_CHAIN_CONFIRMED_ZIP_SEARCH_ACTIVE',
          }
          partial=[item for item in scope if item.get('status') in partial_statuses]
          held=[item for item in scope if item.get('status')!='PHYSICAL_PACKAGE_CONFIRMED']
          steps=[]
          for job in jobs.get('jobs',[]):
              for step in job.get('steps',[]):
                  steps.append({'job':job.get('name'),'name':step.get('name'),'conclusion':step.get('conclusion')})
          passed=os.environ['CONCLUSION']=='success'
          receipt={
              'schema':'JM.PhysicalCurrentBestCensusOutcome/0.2.3',
              'status':os.environ['STATUS'],
              'conclusion':os.environ['CONCLUSION'],
              'classification':f"CENSUS_GATE_PASS_{len(packages)}_PACKAGES_{len(partial)}_PARTIAL_BODIES" if passed else 'CENSUS_GATE_FAILED',
              'run_id':os.environ['RUN_ID'],
              'head_sha':os.environ['HEAD_SHA'],
              'run_url':os.environ['RUN_URL'],
              'updated_at':os.environ['UPDATED_AT'],
              'recorded_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'batch':'operating-houses-01',
              'targets':len(scope),
              'physical_packages_confirmed':len(packages),
              'partial_physical_bodies_confirmed':len(partial),
              'package_or_continuation_searches_held':len(held),
              'package_confirmed':[item.get('name') for item in packages],
              'partial_confirmed':[item.get('name') for item in partial],
              'held':[item.get('name') for item in held],
              'next_gate':'Locate JMStudios B0.8.3 and the Zionfolder v1.1.1 ZIP archive',
              'steps':steps,
              'boundary':'A partial physical body or donor-chain confirmation does not equal a full package or continuation crown. Fresh phone contact remains a separate Ding where stated.'
          }
          Path('registry/physical-current-best-census-v0.2-outcome.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit observed census outcome
        run: |
          set -euo pipefail
          git config user.name "JM Physical Census Observer"
          git config user.email "actions@users.noreply.github.com"
          git add registry/physical-current-best-census-v0.2-outcome.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Physical Current-Best Census v0.2 outcome"
          for attempt in $(seq 1 20); do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1
