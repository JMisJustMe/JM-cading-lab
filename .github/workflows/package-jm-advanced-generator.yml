name: Package JM Advanced Game Generator

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "games-beyond/generation-packs/unity/JMAdvancedGenerator/**"
      - "games-beyond/generation-packs/JM_ADVANCED_GAME_GENERATOR_DUAL_TRACK_v0_1.md"
      - "games-beyond/generation-packs/WESTERN_SNIPER_ADVANCED_REGENERATION_PACK_v0_1.md"
      - "games-beyond/generation-packs/TBOYS_4T_CLASH_ADVANCED_GENERATION_PACK_v0_1.md"
      - "games-beyond/generation-packs/JM_ADVANCED_GENERATOR_PLAYABLE_SOURCE_RECEIPT_v0_2.md"
      - ".github/workflows/package-jm-advanced-generator.yml"
      - "scripts/jm_package_advanced_generator.py"
      - "agent-runtime/host-adapters/storage-admission/**"
      - "registry/storage-admission/**"

permissions:
  contents: write

concurrency:
  group: "jm-advanced-generator-package"
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Estate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build one-download JM Unity proof pack
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          PACK="JM_ADVANCED_GAME_GENERATOR_PLAYABLE_PROOF_PACK_v0_2"
          STAGE="$RUNNER_TEMP/$PACK"
          OUT="games-beyond/downloads"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/GENERATION_CONTRACTS" "$OUT"

          cp -R games-beyond/generation-packs/unity/JMAdvancedGenerator/Assets "$STAGE/"
          cp games-beyond/generation-packs/unity/JMAdvancedGenerator/README_OPEN_FIRST.md "$STAGE/OPEN_FIRST.md"
          cp games-beyond/generation-packs/JM_ADVANCED_GENERATOR_PLAYABLE_SOURCE_RECEIPT_v0_2.md "$STAGE/BUILD_RECEIPT.md"
          cp games-beyond/generation-packs/JM_ADVANCED_GAME_GENERATOR_DUAL_TRACK_v0_1.md "$STAGE/GENERATION_CONTRACTS/"
          cp games-beyond/generation-packs/WESTERN_SNIPER_ADVANCED_REGENERATION_PACK_v0_1.md "$STAGE/GENERATION_CONTRACTS/"
          cp games-beyond/generation-packs/TBOYS_4T_CLASH_ADVANCED_GENERATION_PACK_v0_1.md "$STAGE/GENERATION_CONTRACTS/"

          python3 scripts/jm_package_advanced_generator.py \
            --stage "$STAGE" --archive "$OUT/$PACK.zip"

      - name: Upload verifiable package artifact
        if: steps.admission.outputs.additional_carrier == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JM_ADVANCED_GAME_GENERATOR_PLAYABLE_PROOF_PACK_v0_2
          path: |
            games-beyond/downloads/JM_ADVANCED_GAME_GENERATOR_PLAYABLE_PROOF_PACK_v0_2.zip
            games-beyond/downloads/JM_ADVANCED_GAME_GENERATOR_PLAYABLE_PROOF_PACK_v0_2.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit package when changed
        if: steps.admission.outputs.additional_carrier == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JM Estate Packager"
          git config user.email "actions@users.noreply.github.com"
          git add games-beyond/downloads/JM_ADVANCED_GAME_GENERATOR_PLAYABLE_PROOF_PACK_v0_2.zip
          git add games-beyond/downloads/JM_ADVANCED_GAME_GENERATOR_PLAYABLE_PROOF_PACK_v0_2.sha256
          git add games-beyond/downloads/JM_ADVANCED_GAME_GENERATOR_PLAYABLE_PROOF_PACK_v0_2.run.json
          if git diff --cached --quiet; then
            echo "Package already current."
            exit 0
          fi
          git commit -m "Package JM advanced generator playable proof v0.2 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
