name: PLAYFORM Sovereign Rebuild v0.1

on:
  push:
    branches:
      - agent/game-engine-army-glyphplay-sovereign-v0-1
    paths:
      - 'game-engine-army/playform/v0.1/**'
      - 'game-engine-army/ENGINE_REGISTRY_v0.1.json'
      - '.github/workflows/playform-sovereign-rebuild-v0-1.yml'
  pull_request:
    paths:
      - 'game-engine-army/playform/v0.1/**'
      - 'game-engine-army/ENGINE_REGISTRY_v0.1.json'
      - '.github/workflows/playform-sovereign-rebuild-v0-1.yml'
  workflow_dispatch:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PLAYFORM source, loop and repeatability gates
        run: python game-engine-army/playform/v0.1/tools/test_playform_v0_1.py
      - name: Build HTTP and single-file PLAYFORM deliveries
        run: |
          python game-engine-army/playform/v0.1/tools/build_playform_v0_1.py \
            --source game-engine-army/playform/v0.1 \
            --out dist/playform-sovereign-v0.1
      - name: Verify deterministic delivery receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/playform-sovereign-v0.1');r=json.loads((root/'BUILD_RECEIPT.json').read_text())
          assert r['status']=='PLAYFORM_SOVEREIGN_REBUILD_STATIC_BUILD_PASS_BROWSER_CONTACT_OPEN'
          assert r['source_part_count']==3
          assert r['component_count']==8
          assert r['coding_body_count']==6
          assert r['donor_count']==1
          assert len(r['javascript_sha256'])==64 and len(r['single_file_sha256'])==64
          assert (root/r['single_file']).is_file()
          print('PLAYFORM_SOVEREIGN_REBUILD_V0_1_BUILD_GATE_PASS')
          PY
      - name: Test HTTP source delivery
        run: |
          cd dist/playform-sovereign-v0.1
          python -m http.server 8768 >/tmp/playform-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8768/index.html | grep -q 'PLAYFORM Sovereign Rebuild v0.1'
          curl --fail --silent http://127.0.0.1:8768/app.part1.txt | grep -q 'function splitLoop'
          curl --fail --silent http://127.0.0.1:8768/app.part2.txt | grep -q 'state.runtime.cycles'
      - name: Seal PLAYFORM Zionfolder
        run: |
          cd dist
          zip -qr PLAYFORM_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.zip playform-sovereign-v0.1
          sha256sum PLAYFORM_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.zip | tee PLAYFORM_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PLAYFORM_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER
          path: |
            dist/PLAYFORM_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.zip
            dist/PLAYFORM_SOVEREIGN_REBUILD_v0.1_ZIONFOLDER.sha256
            dist/playform-sovereign-v0.1/BUILD_RECEIPT.json
            dist/playform-sovereign-v0.1/OPEN_FIRST_PLAYFORM_SOVEREIGN_REBUILD_v0_1.html
