name: Prove AILatheo v3 Creation Workbench
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified-browser/ailatheo-creation-runtime.mjs'
      - 'unified-browser/OPEN_FIRST_AILATHEO_CREATION_WORKBENCH_v3_0_ALPHA.html'
      - 'tests/ailatheo-v3-*.mjs'
      - 'tests/ailatheo-customer-entitlement.mjs'
      - 'functions/api/ailatheo.js'
      - 'ailatheo/**'
      - 'coding-estate/**'
      - 'navigator/estate-integration/*.mjs'
      - 'navigator/estate-integration/index.html'
      - 'tests/estate-native-operator*.mjs'
      - '.github/workflows/prove-ailatheo-v3.yml'
  pull_request:
    paths:
      - 'unified-browser/ailatheo-creation-runtime.mjs'
      - 'unified-browser/OPEN_FIRST_AILATHEO_CREATION_WORKBENCH_v3_0_ALPHA.html'
      - 'tests/ailatheo-v3-*.mjs'
      - 'tests/ailatheo-customer-entitlement.mjs'
      - 'functions/api/ailatheo.js'
      - 'ailatheo/**'
      - 'coding-estate/**'
      - 'navigator/estate-integration/*.mjs'
      - 'navigator/estate-integration/index.html'
      - 'tests/estate-native-operator*.mjs'
      - '.github/workflows/prove-ailatheo-v3.yml'
permissions: {contents: read}
jobs:
  native-route:
    # Keep the existing pinned Playwright build on its supported Ubuntu host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/ailatheo-v3-estate-route.mjs
      - run: node tests/ailatheo-v3-native-execution.mjs
      - run: node tests/estate-native-operator.mjs
      - run: node tests/estate-native-operator-world.mjs
      - run: node tests/estate-native-operator-spaces.mjs
      - run: node tests/mission002-source-aware-creation.mjs
      - run: node tests/mission002-sovereign-compiler-contact.mjs
      - run: node tests/mission002-shared-two-current-creation.mjs
      - name: Verify exact shared contact kernel and recipient eligibility
        run: node tests/mission002-cp9-multi-recipient.mjs
      - run: node tests/ailatheo-v3-workbench-contract.mjs
      - run: node tests/ailatheo-v3-standard-workbench.mjs
      - run: node tests/ailatheo-v3-gripcube-ui.mjs
      - run: node tests/ailatheo-v3-creator-preview.mjs
      - run: node tests/ailatheo-customer-entitlement.mjs
      - name: Prove Workbench browser JavaScript syntax
        run: |
          python - <<'PY'
          import re,pathlib
          p=pathlib.Path('unified-browser/OPEN_FIRST_AILATHEO_CREATION_WORKBENCH_v3_0_ALPHA.html')
          s=p.read_text()
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S))
          if not js.strip():
              raise SystemExit('WORKBENCH_INLINE_JS_MISSING')
          pathlib.Path('/tmp/ailatheo-v3-workbench.js').write_text(js)
          PY
          node --check /tmp/ailatheo-v3-workbench.js
      - name: Install Playwright for rendered Workbench QA
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Boot local Workbench
        run: |
          python3 -m http.server 4177 >/tmp/ailatheo-v3-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4177/unified-browser/OPEN_FIRST_AILATHEO_CREATION_WORKBENCH_v3_0_ALPHA.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ailatheo-v3-http.log
          exit 1
      - name: Render and contact JM Estate native operator
        env:
          BASE_URL: http://127.0.0.1:4177
        run: node tests/estate-native-operator-render.spec.mjs
      - name: Render native-chain resultant worlds
        env:
          BASE_URL: http://127.0.0.1:4177
        run: node tests/estate-native-operator-world-render.spec.mjs
      - name: Prove connected spaces and retained world state
        env:
          BASE_URL: http://127.0.0.1:4177
        run: node tests/estate-native-operator-spaces-render.spec.mjs
      - name: Render and contact GripCube Workbench
        env:
          BASE_URL: http://127.0.0.1:4177
        run: node tests/ailatheo-v3-gripcube-render.spec.mjs
      - name: Prove Creator Preview first contact
        env:
          BASE_URL: http://127.0.0.1:4177
        run: node tests/ailatheo-v3-creator-preview-render.spec.mjs
      - name: Preserve source-derived game/comic and OneBody results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jm-m002-foundational-game-comic
          path: qa/m002-foundations/
          if-no-files-found: warn
      - name: Upload Workbench visual receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ailatheo-v3-gripcube-render
          path: |
            qa/ailatheo-v3-gripcube/
            qa/ailatheo-v3-creator-preview/
            qa/estate-native-operator-*.png
          if-no-files-found: ignore
