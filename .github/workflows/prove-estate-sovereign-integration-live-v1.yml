name: Prove Estate Sovereign Integration Live v1

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/estate-integration/probe_live_integration_v1.mjs"
      - ".github/workflows/prove-estate-sovereign-integration-live-v1.yml"
      - ".github/workflows/deploy-estate-sovereign-integrated-v1.yml"
  push:
    branches: [main]
    paths:
      - "governance/estate-integration/probe_live_integration_v1.mjs"
      - ".github/workflows/prove-estate-sovereign-integration-live-v1.yml"
      - ".github/workflows/deploy-estate-sovereign-integrated-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pre-merge diagnostic of currently standing live system
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set +e
          node governance/estate-integration/probe_live_integration_v1.mjs
          rc=$?
          echo "Pre-merge live diagnostic exit=$rc; post-merge deployment is the strict gate."
          exit 0
      - name: Strict post-merge live proof
        if: ${{ github.event_name != 'pull_request' }}
        run: node governance/estate-integration/probe_live_integration_v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estate-sovereign-integration-live-proof-v1
          path: ESTATE_SOVEREIGN_INTEGRATION_LIVE_PROOF_v1.json
          if-no-files-found: error
          retention-days: 30
