name: Prove JM Owner Vault live readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prove-owner-vault-live.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jm-owner-vault-live-readiness-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove deployed function sees binding and secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for bound Owner Vault deployment
        id: probe
        shell: bash
        run: |
          set -u
          BASE='https://jmisjustme-estate.pages.dev'
          ok=0
          # The PR proves current public readiness without anticipating deployment.
          # After merging, REQUIRE_CP05 waits for the actual live editor policy.
          export REQUIRE_CP05='${{ github.event_name == 'pull_request' && '0' || '1' }}'
          http='000'
          status='{}'
          sw=''
          client_ok=0
          expected_cache="$(python3 - <<'PY'
          import re, sys
          from pathlib import Path
          source=Path('sw.js').read_text(encoding='utf-8')
          match=re.search(r"const CACHE=['\"]([^'\"]+)['\"];", source)
          if not match:
              sys.exit('Could not resolve current CACHE marker from sw.js')
          print(match.group(1))
          PY
          )"
          for attempt in $(seq 1 60); do
            http="$(curl --silent --show-error --location --max-time 20 -o "$RUNNER_TEMP/owner-vault-status.json" -w '%{http_code}' "$BASE/api/owner/vault?mode=status&proof=${GITHUB_RUN_ID}-${attempt}" || true)"
            status="$(cat "$RUNNER_TEMP/owner-vault-status.json" 2>/dev/null || printf '{}')"
            sw="$(curl --silent --show-error --location --max-time 20 "$BASE/sw.js?proof=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$http" = '200' ] \
              && STATUS_JSON="$status" python3 - <<'PY'
          import json, os, sys
          try:
              data=json.loads(os.environ['STATUS_JSON'])
          except Exception:
              sys.exit(1)
          baseline = data.get('ready') is True and data.get('storage_bound') is True and data.get('owner_key_configured') is True
          editor = data.get('editor_policy') == 'PRIVATE_VERSIONED_SOURCE_READBACK_WITH_ANCESTOR_CUSTODY'
          sys.exit(0 if baseline and (os.environ.get('REQUIRE_CP05') != '1' or editor) else 1)
          PY
            then
              if printf '%s' "$sw" | grep -Fq "$expected_cache"; then
                client_ok=1
                if [ "$REQUIRE_CP05" = '1' ]; then
                  client_ok=0
                  client_http="$(curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/jm-owner-room-live-client.js" -w '%{http_code}' "$BASE/estate-app.js?jm-owner-editor-proof=${GITHUB_RUN_ID}-${attempt}" || true)"
                  if [ "$client_http" = '200' ] \
                     && grep -Fq 'Save private revision &amp; verify readback' "$RUNNER_TEMP/jm-owner-room-live-client.js" \
                     && grep -Fq 'No duplicate save issued.' "$RUNNER_TEMP/jm-owner-room-live-client.js"; then
                    client_ok=1
                  fi
                fi
                if [ "$client_ok" = '1' ]; then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          printf '%s' "$status" > "$RUNNER_TEMP/owner-vault-final-status.json"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "http=$http" >> "$GITHUB_OUTPUT"
          echo "cache=$expected_cache" >> "$GITHUB_OUTPUT"
          echo "client=$client_ok" >> "$GITHUB_OUTPUT"
          echo "Expected cache marker: $expected_cache"
          echo "Final live status: $status"

      - name: Write live-readiness receipt
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          OK: ${{ steps.probe.outputs.ok }}
          HTTP: ${{ steps.probe.outputs.http }}
          CACHE_MARKER: ${{ steps.probe.outputs.cache }}
          CLIENT_EDITOR: ${{ steps.probe.outputs.client }}
        run: |
          set -euo pipefail
          mkdir -p registry
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          status_path = Path(os.environ['RUNNER_TEMP']) / 'owner-vault-final-status.json'
          try:
              status = json.loads(status_path.read_text(encoding='utf-8'))
          except Exception:
              status = {}
          passed = os.environ.get('OK') == '1'
          receipt = {
              'schema': 'JM.OwnerVaultLiveReadinessReceipt/0.1',
              'verified_utc': datetime.now(timezone.utc).isoformat(),
              'state': 'LIVE_READINESS_PASS' if passed else 'LIVE_READINESS_NOT_YET',
              'host': 'https://jmisjustme-estate.pages.dev',
              'http_status': os.environ.get('HTTP'),
              'status_response': status,
              'cache_marker': os.environ.get('CACHE_MARKER'),
              'public_editor_policy': status.get('editor_policy'),
              'cp05_public_editor_policy_verified': passed and status.get('editor_policy') == 'PRIVATE_VERSIONED_SOURCE_READBACK_WITH_ANCESTOR_CUSTODY',
              'cp06_deployed_owner_editor_source_verified': passed and os.environ.get('CLIENT_EDITOR') == '1',
              'source_commit': os.environ.get('GITHUB_SHA'),
              'workflow_run': os.environ.get('GITHUB_RUN_ID'),
              'authenticated_write_read_delete_proof': False,
              'owner_secret_value_recorded': False,
              'ding': False,
              'claim_boundary': 'On mainline this receipt proves the deployed public-safe Owner Vault API policy AND deployed Owner Room JavaScript source markers for editing/recovery. It does NOT prove owner-key authentication, a real private save, physical owner-device reload, cross-device persistence, or a fully published JM creation.'
          }
          Path('registry/owner-vault-live-readiness-receipt-v0.1.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'JM Owner Vault Live Proof Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/owner-vault-live-readiness-receipt-v0.1.json
          git diff --cached --quiet || git commit -m 'Record Owner Vault live readiness proof [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && break
            sleep 2
          done

      - name: Enforce readiness result
        shell: bash
        run: test '${{ steps.probe.outputs.ok }}' = '1'
