name: Public Route Repair Wave 01

# Legacy specialist rail retained for manual recovery/proof only.
# Automatic production authority belongs to Deploy Estate Sovereign Integrated v1.
on:
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  repair-prove-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current Estate authority
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and prove source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile governance/public_route_repair_wave_01.py
          python3 governance/public_route_repair_wave_01.py
          node --check estate-head-public-consumer.js
          node --check theory/source-body-integrity-v12.js
          grep -Fq 'data-public-route-wave="01"' apps/index.html
          grep -Fq 'data-public-route-wave="01"' theory/index.html
          grep -Fq '242-route v1.1 data authority · live public contact v1.2' apps/index.html
          grep -Fq 'v0.20.1 integrity layer · v0.19 reconciled shell' theory/index.html

      - name: Seat candidate source authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JM Public Route Repair Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/index.html apps/PUBLIC_ROUTE_STATUS_v1_1.md
          git add theory/index.html theory/PUBLIC_ROUTE_STATUS_v0_20_1.md
          git add registry/estate-head-public-current.json registry/estate-map.json
          git add registry/public-route-repair-wave-01-source-receipt.json
          if ! git diff --cached --quiet; then
            git commit -m 'Seat Apps and Theory public authority Wave 01 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "REPAIR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assemble governed public body
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-estate
          mkdir -p cloudflare-estate
          for file in index.html estate-app.js estate-accessibility.js estate-head-public-consumer.js estate.css estate-accessibility.css icon.svg manifest.webmanifest sw.js author-home-door.js robots.txt sitemap.xml 404.html cading.html; do
            if [ -f "$file" ]; then cp "$file" cloudflare-estate/; fi
          done
          for dir in apps author coding-estate estate fresh-app-lab games-beyond lyrics navigator recent recovery theory money-menu; do
            if [ -d "$dir" ]; then cp -a "$dir" "cloudflare-estate/$dir"; fi
          done
          cp -a registry cloudflare-estate/registry
          printf '%s\n' \
            '/apps /apps/index.html 200' \
            '/apps/ /apps/index.html 200' \
            '/theory /theory/index.html 200' \
            '/theory/ /theory/index.html 200' \
            '/money-menu /money-menu/index.html 200' \
            '/money-menu/ /money-menu/index.html 200' \
            > cloudflare-estate/_redirects
          printf '%s\n' \
            '/*' \
            '  X-Content-Type-Options: nosniff' \
            '  Cache-Control: no-store, no-cache, must-revalidate' \
            > cloudflare-estate/_headers
          test -s cloudflare-estate/apps/index.html
          test -s cloudflare-estate/theory/index.html
          test -s cloudflare-estate/registry/estate-head-public-current.json

      - name: Deploy Wave 01 candidate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-estate --project-name=jmisjustme-estate --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove candidate live contact
        shell: bash
        run: |
          set -euo pipefail
          base='https://jmisjustme-estate.pages.dev'
          passed=0
          for attempt in $(seq 1 60); do
            curl -fsSL "$base/apps/?wave01=$GITHUB_RUN_ID-$attempt" > "$RUNNER_TEMP/apps.html" || true
            curl -fsSL "$base/theory/?wave01=$GITHUB_RUN_ID-$attempt" > "$RUNNER_TEMP/theory.html" || true
            if grep -Fq 'data-public-route-wave="01"' "$RUNNER_TEMP/apps.html" && grep -Fq 'data-public-route-wave="01"' "$RUNNER_TEMP/theory.html"; then
              passed=1
              break
            fi
            sleep 3
          done
          test "$passed" = 1
          cmp -s apps/index.html "$RUNNER_TEMP/apps.html"
          cmp -s theory/index.html "$RUNNER_TEMP/theory.html"
          echo 'WAVE 01 CANDIDATE LIVE SOURCE PARITY PASS'
