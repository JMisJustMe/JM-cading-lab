name: PUKA Canonical Door Continuity Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/puka-v0-15a-canonical-continuity-crown-readiness
    paths:
      - ".github/workflows/puka-canonical-continuity-proof.yml"
      - "games-beyond/tests/puka-canonical-continuity.spec.mjs"
      - "games-beyond/puka/manifest.webmanifest"
      - "games-beyond/puka/sw.js"
      - "games-beyond/puka/puka-ui.js"
      - "games-beyond/puka/puka-core.js"

permissions:
  contents: write

concurrency:
  group: puka-canonical-continuity-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout current Estate descendant
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove continuity source invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s games-beyond/tests/puka-canonical-continuity.spec.mjs
          grep -Fq '"id":"./00_OPEN_FIRST.html"' games-beyond/puka/manifest.webmanifest
          grep -Fq '"start_url":"./00_OPEN_FIRST.html"' games-beyond/puka/manifest.webmanifest
          grep -Fq '"scope":"./"' games-beyond/puka/manifest.webmanifest
          grep -Fq "const CACHE='jm-puka-v14a'" games-beyond/puka/sw.js
          grep -Fq "'jm-puka-v12a'" games-beyond/puka/puka-ui.js
          grep -Fq "keys.filter(k=>k!==CACHE&&k.startsWith('jm-puka-'))" games-beyond/puka/sw.js
          node --check games-beyond/puka/puka-ui.js
          node --check games-beyond/puka/puka-core.js
          echo 'PUKA CANONICAL CONTINUITY SOURCE DING PASS'

      - name: Set up browser proof environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Games&Beyond proof dependencies
        working-directory: games-beyond
        run: npm install

      - name: Install Chromium
        working-directory: games-beyond
        run: npx playwright install --with-deps chromium

      - name: Prove same-door state return across cache-carrier replacement
        working-directory: games-beyond
        run: npx playwright test tests/puka-canonical-continuity.spec.mjs --project=desktop-chromium

      - name: Upload continuity before-after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puka-canonical-continuity-proof-${{ github.run_id }}
          path: |
            games-beyond/test-results
            games-beyond/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Prove live canonical door and continuity assets
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from urllib.request import Request,urlopen
          base='https://jmisjustme-estate.pages.dev/games-beyond/puka/'
          checks=[
            ('','PUKA'),
            ('00_OPEN_FIRST.html','puka-human-game-v02.js'),
            ('manifest.webmanifest','"id":"./00_OPEN_FIRST.html"'),
            ('manifest.webmanifest','"start_url":"./00_OPEN_FIRST.html"'),
            ('sw.js',"const CACHE='jm-puka-v14a'"),
            ('puka-ui.js',"'jm-puka-v12a'"),
          ]
          pending=checks[:]
          for attempt in range(1,31):
            nxt=[]
            for rel,marker in pending:
              try:
                req=Request(base+rel+f'?jm-puka-continuity={attempt}',headers={'User-Agent':'JM-PUKA-Continuity-Proof/1.0','Cache-Control':'no-cache'})
                with urlopen(req,timeout=15) as r:
                  body=r.read().decode('utf-8','replace'); code=r.status
              except Exception as exc:
                print('WAIT',rel or '/',type(exc).__name__); nxt.append((rel,marker)); continue
              if code==200 and marker in body: print('LIVE PASS',rel or '/',marker)
              else: print('WAIT',rel or '/',code,marker); nxt.append((rel,marker))
            if not nxt: pending=[]; break
            pending=nxt; time.sleep(2)
          if pending: raise SystemExit('PUKA CANONICAL CONTINUITY LIVE CONTACT FAILED: '+', '.join(rel or '/' for rel,_ in pending))
          PY

      - name: Seal canonical continuity receipt
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          receipt={
            'schema':'JM.PUKA.CanonicalContinuityProof/1.0',
            'verified_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ['GITHUB_SHA'],
            'workflow_run':os.environ['GITHUB_RUN_ID'],
            'canonical_door':'https://jmisjustme-estate.pages.dev/games-beyond/puka/',
            'pwa_id':'./00_OPEN_FIRST.html',
            'start_url':'./00_OPEN_FIRST.html',
            'scope':'./',
            'state_lineage':'jm-puka-v12a',
            'current_cache_carrier':'jm-puka-v14a',
            'source_invariants':'PASS',
            'browser_state_return':'PASS — exact hand label, player cards and pot survived same-door reload after legacy PUKA cache-carrier replacement',
            'cache_retirement':'PASS — earlier jm-puka-* carrier removed while current carrier mounted',
            'state_cache_separation':'PASS — cache version did not become a second localStorage state key',
            'pwa_identity_continuity':'PASS — explicit id preserves the previously implicit start-url identity',
            'public_contact':'PASS',
            'cold_ding':False,
            'crowned':False,
            'claim_boundary':'Browser proof establishes same-origin PUKA state continuity through the current service-worker cache replacement mechanism and stable PWA identity. It does not prove survival after user-cleared site data, private-browsing teardown, browser storage eviction, cross-origin door changes, uninstall/reinstall behaviour on every Android/browser combination, or owner-side Cold Ding.'
          }
          path=Path('registry/puka-canonical-continuity-receipt.json')
          path.write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "JM PUKA Continuity Proof Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/puka-canonical-continuity-receipt.json
          git commit -m "Seal PUKA canonical door continuity proof [skip ci]"
          git push origin HEAD:main
