name: PUKA Source + Live Contact Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/puka-live-proof.yml"
      - "games-beyond/puka/**"

permissions:
  contents: write

concurrency:
  group: puka-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout current JM Estate
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prove PUKA source body — Code Ding gate
        shell: bash
        run: |
          set -euo pipefail
          test -s games-beyond/puka/00_OPEN_FIRST.html
          test -s games-beyond/puka/index.html
          test -s games-beyond/puka/puka-core.js
          test -s games-beyond/puka/puka-ui.js
          test -s games-beyond/puka/puka.css
          test -s games-beyond/puka/manifest.webmanifest
          test -s games-beyond/puka/sw.js
          test -s games-beyond/puka/registry.json
          grep -Fq 'Earn your place at the table.' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'Observation stays separate from interpretation.' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'PUKA v0.2A' games-beyond/puka/index.html
          grep -Fq 'jm-puka-v02a' games-beyond/puka/puka-ui.js
          grep -Fq 'singular live direct door every time' games-beyond/puka/registry.json
          node --check games-beyond/puka/puka-core.js
          node --check games-beyond/puka/puka-ui.js
          node games-beyond/puka/puka-core.test.js

      - name: Prove PUKA production contact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time
          from urllib.request import Request, urlopen

          base = 'https://jmisjustme-estate.pages.dev/games-beyond/puka/'
          checks = [
              ('', 'PUKA v0.2A'),
              ('00_OPEN_FIRST.html', 'PUKA v0.2A'),
              ('puka-core.js', 'PUKA CORE v0.2A'),
              ('puka-ui.js', 'jm-puka-v02a'),
              ('puka.css', 'data-hand-state'),
              ('manifest.webmanifest', 'Poker Learning Court'),
              ('registry.json', 'singular live direct door every time'),
          ]
          run = os.environ.get('GITHUB_RUN_ID', 'manual')
          pending = checks[:]
          for attempt in range(1, 31):
              next_pending = []
              for rel, marker in pending:
                  url = f'{base}{rel}?jm-puka-proof={run}-{attempt}'
                  try:
                      req = Request(url, headers={'User-Agent':'JM-PUKA-Proof/0.2A','Cache-Control':'no-cache'})
                      with urlopen(req, timeout=15) as response:
                          body = response.read().decode('utf-8', 'replace')
                          code = response.status
                  except Exception as exc:
                      print('WAIT', rel or '/', type(exc).__name__)
                      next_pending.append((rel, marker))
                      continue
                  if code == 200 and marker in body:
                      print('LIVE PASS', rel or '/', marker)
                  else:
                      print('WAIT', rel or '/', code, marker)
                      next_pending.append((rel, marker))
              if not next_pending:
                  pending = []
                  break
              pending = next_pending
              time.sleep(2)
          if pending:
              raise SystemExit('PUKA LIVE CONTACT FAILED: ' + ', '.join(rel or '/' for rel, _ in pending))
          PY

      - name: Seal PUKA proof receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
            'schema':'JM.PUKA.ProofReceipt/0.2A',
            'verified_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ.get('GITHUB_SHA'),
            'workflow_run':os.environ.get('GITHUB_RUN_ID'),
            'host':'https://jmisjustme-estate.pages.dev',
            'single_link':'https://jmisjustme-estate.pages.dev/games-beyond/puka/',
            'source_code_ding':'PASS',
            'public_contact':'PASS',
            'contacted':['/games-beyond/puka/','00_OPEN_FIRST.html','puka-core.js','puka-ui.js','puka.css','manifest.webmanifest','registry.json'],
            'cold_ding':False,
            'crowned':False,
            'claim_boundary':'Source/core tests and public HTTP contact passed. Owner-side physical phone play, lifecycle persistence across a second real hand, landscape contact, installed Android behaviour and Cold Ding remain separate.'
          }
          Path('games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name 'JM PUKA Proof Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json
          git commit -m 'Seal PUKA v0.2A source and public contact proof [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
