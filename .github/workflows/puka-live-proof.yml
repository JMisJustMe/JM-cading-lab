name: PUKA Source + Browser + Visual Viewport + Live Contact Proof

on:
  workflow_dispatch:
  push:
    branches: [main, puka-v11-estate-conformance]
    paths:
      - ".github/workflows/puka-live-proof.yml"
      - "games-beyond/puka/**"
      - "games-beyond/tests/puka-estate-conformance.spec.mjs"
      - "games-beyond/playwright.config.mjs"
      - "games-beyond/package.json"
      - "games-beyond/package-lock.json"

permissions:
  contents: write

concurrency:
  group: puka-proof-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current PUKA descendant
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove PUKA source body — Code Ding gate
        shell: bash
        run: |
          set -euo pipefail
          must_file(){ test -s "$1" || { echo "PUKA DING FAIL missing file: $1"; exit 1; }; echo "FILE PASS $1"; }
          must_have(){ grep -Fq "$2" "$1" || { echo "PUKA DING FAIL marker [$2] missing from $1"; exit 1; }; echo "MARKER PASS $1 :: $2"; }
          for f in 00_OPEN_FIRST.html index.html puka-core.js puka-ui.js puka.css puka-art.css puka-v05.css puka-v05-room.css puka-v06.css puka-v07.css puka-v08.css puka-v08-academy.css puka-v09.css puka-v10.css puka-v11.css puka-cards-v05.js puka-character-v06.js puka-world-v07.js puka-table-theatre-v09.js puka-living-table-v10.js puka-core.test.js puka-layout.test.js puka-theatre.test.js puka-living-table.test.js puka-estate-conformance.test.js manifest.webmanifest sw.js registry.json BUILD_RECEIPT.md; do must_file "games-beyond/puka/$f"; done
          must_file games-beyond/tests/puka-estate-conformance.spec.mjs
          for f in puka-card-back.svg royal-felt-medallion.svg royal-room-backdrop.svg portrait-academy-backdrop.svg puka-chip-stack.svg felt-grain.svg court-lower-v07.svg court-middle-v07.svg court-high-v07.svg court-heir-v07.svg court-throne-v07.svg puka-table-inlay-v08.svg puka-treasury-v08.svg puka-academy-banner-v08.svg puka-dealer-medallion-v09.svg puka-board-runway-v09.svg puka-chip-column-v10.svg; do must_file "games-beyond/puka/assets/$f"; done
          must_have games-beyond/puka/00_OPEN_FIRST.html 'PUKA v0.11A'
          must_have games-beyond/puka/index.html 'PUKA v0.11A'
          must_have games-beyond/puka/00_OPEN_FIRST.html 'puka-v11.css'
          must_have games-beyond/puka/00_OPEN_FIRST.html 'puka-living-table-v10.js'
          must_have games-beyond/puka/sw.js 'jm-puka-v11a'
          must_have games-beyond/puka/puka-v11.css 'button,summary{min-height:44px}'
          must_have games-beyond/puka/puka-v10.css 'puka-chip-column-v10.svg'
          must_have games-beyond/puka/puka-living-table-v10.js 'root.dataset.boardCount'
          must_have games-beyond/puka/puka-living-table-v10.js "pot.querySelector('b')"
          node --check games-beyond/puka/puka-core.js
          node --check games-beyond/puka/puka-ui.js
          node --check games-beyond/puka/puka-cards-v05.js
          node --check games-beyond/puka/puka-character-v06.js
          node --check games-beyond/puka/puka-world-v07.js
          node --check games-beyond/puka/puka-table-theatre-v09.js
          node --check games-beyond/puka/puka-living-table-v10.js
          node games-beyond/puka/puka-core.test.js
          node games-beyond/puka/puka-layout.test.js
          node games-beyond/puka/puka-theatre.test.js
          node games-beyond/puka/puka-living-table.test.js
          node games-beyond/puka/puka-estate-conformance.test.js

      - name: Set up browser acceptance environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Games&Beyond browser proof dependencies
        working-directory: games-beyond
        run: npm install

      - name: Install Chromium for PUKA browser Ding
        working-directory: games-beyond
        run: npx playwright install --with-deps chromium

      - name: Prove PUKA real-context estate and visual viewport acceptance
        working-directory: games-beyond
        run: npx playwright test tests/puka-estate-conformance.spec.mjs --project=desktop-chromium

      - name: Upload PUKA real-viewport proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puka-v011-real-viewport-proof-${{ github.run_id }}
          path: |
            games-beyond/test-results
            games-beyond/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Prove PUKA production contact
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          base='https://jmisjustme-estate.pages.dev/games-beyond/puka/'
          checks=[
            ('','PUKA v0.11A'),
            ('00_OPEN_FIRST.html','puka-v11.css'),
            ('puka-v11.css','estate conformance layer'),
            ('puka-v10.css','puka-chip-column-v10.svg'),
            ('puka-living-table-v10.js','root.dataset.boardCount'),
            ('assets/puka-chip-column-v10.svg','PUKA physical chip column'),
            ('puka-v09.css','puka-board-runway-v09.svg'),
            ('puka-table-theatre-v09.js','root.dataset.dealerSeat'),
            ('assets/puka-dealer-medallion-v09.svg','PUKA dealer medallion'),
            ('assets/puka-board-runway-v09.svg','PUKA community card runway'),
            ('puka-v08.css','puka-table-inlay-v08.svg'),
            ('puka-v08-academy.css','puka-academy-banner-v08.svg'),
            ('puka-v07.css','court-throne-v07.svg'),
            ('puka-world-v07.js',"'King':{tier:'throne'"),
            ('puka-core.js','PUKA CORE v0.2A'),
            ('puka-ui.js','orientation: portrait'),
          ]
          run=os.environ.get('GITHUB_RUN_ID','manual'); pending=checks[:]
          for attempt in range(1,31):
            nxt=[]
            for rel,marker in pending:
              try:
                req=Request(f'{base}{rel}?jm-puka-proof={run}-{attempt}',headers={'User-Agent':'JM-PUKA-Proof/0.11A','Cache-Control':'no-cache'})
                with urlopen(req,timeout=15) as r: body=r.read().decode('utf-8','replace'); code=r.status
              except Exception as exc:
                print('WAIT',rel or '/',type(exc).__name__); nxt.append((rel,marker)); continue
              if code==200 and marker in body: print('LIVE PASS',rel or '/',marker)
              else: print('WAIT',rel or '/',code,marker); nxt.append((rel,marker))
            if not nxt: pending=[]; break
            pending=nxt; time.sleep(2)
          if pending: raise SystemExit('PUKA LIVE CONTACT FAILED: '+', '.join(rel or '/' for rel,_ in pending))
          PY

      - name: Seal PUKA proof receipt
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          receipt={
            'schema':'JM.PUKA.ProofReceipt/0.11A',
            'verified_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ.get('GITHUB_SHA'),
            'workflow_run':os.environ.get('GITHUB_RUN_ID'),
            'host':'https://jmisjustme-estate.pages.dev',
            'single_link':'https://jmisjustme-estate.pages.dev/games-beyond/puka/',
            'source_code_ding':'PASS',
            'browser_runtime_ding':'PASS',
            'real_viewport_visual_proof':'PASS',
            'browser_viewports':['390x844 Android touch portrait','844x390 Android touch landscape','1440x1000 desktop','412x915 Visual Lab Android touch','1440x900 Visual Lab desktop'],
            'browser_gates':['exact real output viewport','separate mobile/touch and desktop contexts','zero horizontal overflow','44px visible contact floor','protected table-field floor','viewport-only ready/active screenshots','table entry','hidden House cards during active play','portrait-landscape-portrait hand continuity','zero console/page errors'],
            'public_contact':'PASS',
            'art_layers':['puka-art.css','puka-v05.css','puka-v05-room.css','puka-v06.css','puka-v07.css','puka-v08.css','puka-v08-academy.css','puka-v09.css','puka-v10.css','puka-v11.css','puka-cards-v05.js','puka-character-v06.js','puka-world-v07.js','puka-table-theatre-v09.js','puka-living-table-v10.js'],
            'contacted':['/games-beyond/puka/','00_OPEN_FIRST.html','puka-v11.css','puka-v10.css','puka-living-table-v10.js','assets/puka-chip-column-v10.svg','puka-v09.css','puka-table-theatre-v09.js','assets/puka-board-runway-v09.svg','puka-v08.css','puka-v08-academy.css','puka-v07.css','puka-world-v07.js'],
            'cold_ding':False,
            'crowned':False,
            'claim_boundary':'Source/core/layout/art/character/world/material/academy/theatre/living-table, separate Chromium desktop/Android-touch real-output contexts, viewport-only screenshot evidence and public HTTP contact passed. Owner-side visual-quality acceptance, physical Android fit, lifecycle persistence and Cold Ding remain separate.'
          }
          Path('games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'JM PUKA Proof Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json
          git commit -m 'Seal PUKA v0.11A source browser visual viewport and public contact proof [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
