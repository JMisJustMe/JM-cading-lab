name: PUKA v0.17A Source + Browser + Pattern Window + Live Contact Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/puka-v017a-pattern-window
    paths:
      - ".github/workflows/puka-live-proof.yml"
      - "games-beyond/puka/**"
      - "games-beyond/tests/puka-estate-conformance.spec.mjs"
      - "games-beyond/tests/puka-human-game.spec.mjs"
      - "games-beyond/tests/puka-pattern-window.spec.mjs"
      - "games-beyond/package.json"
      - "games-beyond/playwright.config.mjs"
      - "!games-beyond/puka/*RECEIPT*.json"

permissions:
  contents: write

concurrency:
  group: puka-v017a-live-proof-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout current Estate authority
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove v0.17A source and inherited code gates
        shell: bash
        run: |
          set -euo pipefail
          cd games-beyond/puka
          for f in \
            00_OPEN_FIRST.html index.html manifest.webmanifest registry.json sw.js \
            puka-core.js puka-human-game-v02.js puka-ui.js puka-deep-house-v13.js \
            puka-read-lab-v01.js puka-read-lab-v01.css \
            puka-read-calibration-v01.js puka-read-calibration-v01.css \
            puka-pattern-window-v01.js puka-pattern-window-v01.css puka-pattern-window-v01.test.js; do
            test -s "$f" || { echo "MISSING $f"; exit 1; }
          done
          grep -Fq 'PUKA v0.17A' 00_OPEN_FIRST.html
          grep -Fq 'puka-pattern-window-v01.css' 00_OPEN_FIRST.html
          grep -Fq 'puka-pattern-window-v01.js' 00_OPEN_FIRST.html
          grep -Fq 'JM.PUKA.Room/0.17A' registry.json
          grep -Fq 'A PATTERN MAY EARN ATTENTION. CONTRADICTION KEEPS IT CORRIGIBLE.' registry.json
          grep -Fq "const CACHE='jm-puka-v17a'" sw.js
          grep -Fq 'puka-pattern-window-v01.js' sw.js
          grep -Fq 'puka-pattern-window-v01.css' sw.js
          grep -Fq 'PATTERN != PROOF' puka-pattern-window-v01.js
          grep -Fq 'CONTRADICTION != FAILURE' puka-pattern-window-v01.js
          node --check puka-core.js
          node --check puka-human-game-v02.js
          node --check puka-ui.js
          node --check puka-read-lab-v01.js
          node --check puka-read-calibration-v01.js
          node --check puka-pattern-window-v01.js
          node puka-core.test.js
          node puka-human-game-v02.test.js
          node puka-read-lab-v01.test.js
          node puka-read-calibration-v01.test.js
          node puka-pattern-window-v01.test.js
          node puka-deep-house.test.js
          node puka-estate-conformance.test.js
          echo 'PUKA v0.17A SOURCE + PATTERN WINDOW CODE DING PASS'

      - name: Set up browser proof environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Games&Beyond proof dependencies
        working-directory: games-beyond
        run: npm install

      - name: Install Chromium
        working-directory: games-beyond
        run: npx playwright install --with-deps chromium

      - name: Prove Estate viewport body
        working-directory: games-beyond
        run: npx playwright test tests/puka-estate-conformance.spec.mjs --project=desktop-chromium

      - name: Prove Human Game and Counterread inheritance
        working-directory: games-beyond
        run: npx playwright test tests/puka-human-game.spec.mjs --project=desktop-chromium

      - name: Prove v0.17A Pattern Window runtime and hidden-field membrane
        working-directory: games-beyond
        run: npx playwright test tests/puka-pattern-window.spec.mjs --project=desktop-chromium

      - name: Upload real viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puka-v017a-pattern-window-real-viewport-proof-${{ github.run_id }}
          path: |
            games-beyond/test-results
            games-beyond/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Prove PUKA v0.17A production contact through singular door
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          base='https://jmisjustme-estate.pages.dev/games-beyond/puka/'
          checks=[
            ('','PUKA v0.17A'),
            ('index.html','PUKA v0.17A'),
            ('00_OPEN_FIRST.html','puka-pattern-window-v01.js'),
            ('00_OPEN_FIRST.html','puka-pattern-window-v01.css'),
            ('puka-pattern-window-v01.js','A PATTERN MAY EARN ATTENTION. CONTRADICTION KEEPS IT CORRIGIBLE.'),
            ('puka-pattern-window-v01.js','PATTERN != PROOF'),
            ('puka-pattern-window-v01.css','min-height:44px'),
            ('registry.json','JM.PUKA.Room/0.17A'),
            ('registry.json','Pattern != proof'),
            ('sw.js',"const CACHE='jm-puka-v17a'"),
            ('manifest.webmanifest','"id":"./00_OPEN_FIRST.html"')
          ]
          run=os.environ.get('GITHUB_RUN_ID','manual')
          pending=checks[:]
          for attempt in range(1,61):
            nxt=[]
            for rel,marker in pending:
              try:
                req=Request(f'{base}{rel}?puka-v017a-proof={run}-{attempt}',headers={'User-Agent':'JM-PUKA-Proof/0.17A','Cache-Control':'no-cache'})
                with urlopen(req,timeout=20) as r:
                  body=r.read().decode('utf-8','replace'); code=r.status
              except Exception as exc:
                print('WAIT',rel or '/',type(exc).__name__); nxt.append((rel,marker)); continue
              if code==200 and marker in body:
                print('LIVE PASS',rel or '/',marker)
              else:
                print('WAIT',rel or '/',code,marker); nxt.append((rel,marker))
            if not nxt:
              pending=[]; break
            pending=nxt; time.sleep(3)
          if pending:
            raise SystemExit('PUKA v0.17A PUBLIC CONTACT HOLD: '+', '.join(rel or '/' for rel,_ in pending))
          print('PUKA v0.17A PUBLIC CONTACT DING PASS')
          PY

      - name: Seal PUKA v0.17A proof receipt
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          receipt={
            'schema':'JM.PUKA.ProofReceipt/0.17A',
            'product_body':'PUKA v0.17A — Human Game Pattern Window / Contradiction Handling',
            'verified_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ.get('GITHUB_SHA'),
            'workflow_run':os.environ.get('GITHUB_RUN_ID'),
            'canonical_door':'https://jmisjustme-estate.pages.dev/games-beyond/puka/',
            'front_door':'00_OPEN_FIRST.html',
            'code_ding':'PASS',
            'browser_runtime_ding':'PASS',
            'real_viewport_visual_proof':'PASS',
            'public_contact':'PASS',
            'visible_action_membrane':'PASS',
            'declared_read_inheritance':'PASS',
            'counterread_inheritance':'PASS',
            'pattern_window_runtime_mount':'PASS',
            'pattern_window_sizes':'PASS — LAST 3 / LAST 6 / LAST 12',
            'same_signal_contradiction_visibility':'PASS',
            'hidden_private_field_non_leakage':'PASS',
            'horizontal_overflow':'ZERO IN PROVED CONTEXTS',
            'interaction_floor':'44px minimum retained for Pattern Window selectors',
            'pattern_window_source_boundary':'Resolved declared-read signal/confidence/street/public-consequence trace only; no poker engine, deck, House hole cards, hidden motive, personality, private notes or real-world people.',
            'pattern_window_claim_boundary':'PATTERN != PROOF; CONTRADICTION != FAILURE; CONTEXT MAY CHANGE THE READ.',
            'art_layers':['puka-table-read-v02.css','puka-read-lab-v01.css','puka-read-calibration-v01.css','puka-pattern-window-v01.css'],
            'reasoning_layers':['puka-human-game-v02.js','puka-read-lab-v01.js','puka-read-calibration-v01.js','puka-pattern-window-v01.js'],
            'canonical_door_unchanged':True,
            'installed_physical_android_lifecycle':'UNCLAIMED',
            'owner_physical_cold_ding':False,
            'crowned':False,
            'claim_boundary':'Automated source, Chromium runtime/viewport and canonical public HTTP contact prove the mounted v0.17A Pattern Window body and its bounded contradiction handling. They do not prove hidden motive, personality, truth about a real-world person, installed physical Android lifecycle, owner aesthetic acceptance, Cold Ding or final crown.'
          }
          Path('games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'JM PUKA Proof Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Seal PUKA v0.17A Pattern Window browser and public proof [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
