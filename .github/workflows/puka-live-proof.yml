name: PUKA Source + Live Contact Proof

on:
  workflow_dispatch:
  push:
    branches: [main, puka-v05-art]
    paths:
      - ".github/workflows/puka-live-proof.yml"
      - "games-beyond/puka/**"

permissions:
  contents: write

concurrency:
  group: puka-proof-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout current PUKA descendant
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove PUKA source body — Code Ding gate
        shell: bash
        run: |
          set -euo pipefail
          test -s games-beyond/puka/00_OPEN_FIRST.html
          test -s games-beyond/puka/index.html
          test -s games-beyond/puka/puka-core.js
          test -s games-beyond/puka/puka-ui.js
          test -s games-beyond/puka/puka.css
          test -s games-beyond/puka/puka-art.css
          test -s games-beyond/puka/puka-v05.css
          test -s games-beyond/puka/puka-v05-room.css
          test -s games-beyond/puka/puka-cards-v05.js
          test -s games-beyond/puka/manifest.webmanifest
          test -s games-beyond/puka/sw.js
          test -s games-beyond/puka/registry.json
          test -s games-beyond/puka/assets/puka-card-back.svg
          test -s games-beyond/puka/assets/royal-felt-medallion.svg
          test -s games-beyond/puka/assets/royal-room-backdrop.svg
          test -s games-beyond/puka/assets/portrait-academy-backdrop.svg
          test -s games-beyond/puka/assets/puka-chip-stack.svg
          test -s games-beyond/puka/assets/felt-grain.svg
          grep -Fq 'PUKA v0.5A' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'PUKA v0.5A' games-beyond/puka/index.html
          grep -Fq 'puka-v05.css' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'puka-v05-room.css' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'puka-cards-v05.js' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'jm-puka-v05a' games-beyond/puka/sw.js
          grep -Fq 'Card body: actual card composition' games-beyond/puka/puka-v05.css
          grep -Fq 'portrait-academy-backdrop.svg' games-beyond/puka/puka-v05-room.css
          grep -Fq 'const PIPS' games-beyond/puka/puka-cards-v05.js
          grep -Fq "isPhone()" games-beyond/puka/puka-ui.js
          node --check games-beyond/puka/puka-core.js
          node --check games-beyond/puka/puka-ui.js
          node --check games-beyond/puka/puka-cards-v05.js
          node games-beyond/puka/puka-core.test.js
          node games-beyond/puka/puka-layout.test.js

      - name: Prove PUKA production contact
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time
          from urllib.request import Request, urlopen
          base = 'https://jmisjustme-estate.pages.dev/games-beyond/puka/'
          checks = [
              ('', 'PUKA v0.5A'),
              ('00_OPEN_FIRST.html', 'puka-cards-v05.js'),
              ('puka-v05.css', 'Card body: actual card composition'),
              ('puka-v05-room.css', 'portrait-academy-backdrop.svg'),
              ('puka-cards-v05.js', 'const PIPS'),
              ('puka-art.css', 'Royal Table gets its own room'),
              ('puka-core.js', 'PUKA CORE v0.2A'),
              ('puka-ui.js', 'orientation: portrait'),
              ('puka.css', 'Phone landscape: true royal composition'),
              ('assets/puka-card-back.svg', 'PUKA'),
              ('assets/royal-felt-medallion.svg', 'PUKA'),
              ('assets/royal-room-backdrop.svg', '<svg'),
              ('assets/portrait-academy-backdrop.svg', 'PUKA Portrait Academy hall'),
              ('assets/puka-chip-stack.svg', '<svg'),
              ('assets/felt-grain.svg', 'feTurbulence'),
          ]
          run = os.environ.get('GITHUB_RUN_ID', 'manual')
          pending = checks[:]
          for attempt in range(1, 31):
              next_pending = []
              for rel, marker in pending:
                  url = f'{base}{rel}?jm-puka-proof={run}-{attempt}'
                  try:
                      req = Request(url, headers={'User-Agent':'JM-PUKA-Proof/0.5A','Cache-Control':'no-cache'})
                      with urlopen(req, timeout=15) as response:
                          body = response.read().decode('utf-8', 'replace')
                          code = response.status
                  except Exception as exc:
                      print('WAIT', rel or '/', type(exc).__name__)
                      next_pending.append((rel, marker)); continue
                  if code == 200 and marker in body: print('LIVE PASS', rel or '/', marker)
                  else: next_pending.append((rel, marker))
              if not next_pending:
                  pending=[]; break
              pending=next_pending; time.sleep(2)
          if pending: raise SystemExit('PUKA LIVE CONTACT FAILED: ' + ', '.join(rel or '/' for rel,_ in pending))
          PY

      - name: Seal PUKA proof receipt
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt={
            'schema':'JM.PUKA.ProofReceipt/0.5A',
            'verified_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ.get('GITHUB_SHA'),
            'workflow_run':os.environ.get('GITHUB_RUN_ID'),
            'host':'https://jmisjustme-estate.pages.dev',
            'single_link':'https://jmisjustme-estate.pages.dev/games-beyond/puka/',
            'source_code_ding':'PASS','public_contact':'PASS',
            'art_layers':['puka-art.css','puka-v05.css','puka-v05-room.css','puka-cards-v05.js'],
            'contacted':['/games-beyond/puka/','00_OPEN_FIRST.html','puka-v05.css','puka-v05-room.css','puka-cards-v05.js','puka-art.css','puka-core.js','puka-ui.js','puka.css','assets/puka-card-back.svg','assets/royal-felt-medallion.svg','assets/royal-room-backdrop.svg','assets/portrait-academy-backdrop.svg','assets/puka-chip-stack.svg','assets/felt-grain.svg'],
            'cold_ding':False,'crowned':False,
            'claim_boundary':'Source/core/layout/art tests and public HTTP contact passed. Owner-side visual-quality acceptance, portrait/landscape fit, lifecycle persistence and Cold Ding remain separate.'
          }
          Path('games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'JM PUKA Proof Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json
          git commit -m 'Seal PUKA v0.5A source and public contact proof [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
