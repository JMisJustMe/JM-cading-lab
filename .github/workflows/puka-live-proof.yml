name: PUKA Source + Live Contact Proof

on:
  workflow_dispatch:
  push:
    branches: [main, puka-v07-court-ascent]
    paths:
      - ".github/workflows/puka-live-proof.yml"
      - "games-beyond/puka/**"

permissions:
  contents: write

concurrency:
  group: puka-proof-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout current PUKA descendant
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove PUKA source body — Code Ding gate
        shell: bash
        run: |
          set -euo pipefail
          for f in 00_OPEN_FIRST.html index.html puka-core.js puka-ui.js puka.css puka-art.css puka-v05.css puka-v05-room.css puka-v06.css puka-v07.css puka-cards-v05.js puka-character-v06.js puka-world-v07.js manifest.webmanifest sw.js registry.json; do test -s "games-beyond/puka/$f"; done
          for f in puka-card-back.svg royal-felt-medallion.svg royal-room-backdrop.svg portrait-academy-backdrop.svg puka-chip-stack.svg felt-grain.svg court-lower-v07.svg court-middle-v07.svg court-high-v07.svg court-heir-v07.svg court-throne-v07.svg; do test -s "games-beyond/puka/assets/$f"; done
          grep -Fq 'PUKA v0.7A' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'PUKA v0.7A' games-beyond/puka/index.html
          grep -Fq 'puka-v07.css' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'puka-world-v07.js' games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'jm-puka-v07a' games-beyond/puka/sw.js
          grep -Fq "'King':{tier:'throne'" games-beyond/puka/puka-world-v07.js
          grep -Fq "'Heir':{tier:'heir'" games-beyond/puka/puka-world-v07.js
          grep -Fq 'court-throne-v07.svg' games-beyond/puka/puka-v07.css
          grep -Fq "html[data-puka-mode='royal'] .card-spirit{display:none!important}" games-beyond/puka/puka-v06.css
          node --check games-beyond/puka/puka-core.js
          node --check games-beyond/puka/puka-ui.js
          node --check games-beyond/puka/puka-cards-v05.js
          node --check games-beyond/puka/puka-character-v06.js
          node --check games-beyond/puka/puka-world-v07.js
          node games-beyond/puka/puka-core.test.js
          node games-beyond/puka/puka-layout.test.js

      - name: Prove PUKA production contact
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          base='https://jmisjustme-estate.pages.dev/games-beyond/puka/'
          checks=[
            ('','PUKA v0.7A'),
            ('00_OPEN_FIRST.html','puka-world-v07.js'),
            ('puka-v07.css','court-throne-v07.svg'),
            ('puka-world-v07.js',"'King':{tier:'throne'"),
            ('puka-v06.css',"html[data-puka-mode='royal'] .card-spirit{display:none!important}"),
            ('puka-v05.css','Card body: actual card composition'),
            ('puka-core.js','PUKA CORE v0.2A'),
            ('puka-ui.js','orientation: portrait'),
            ('puka.css','Phone landscape: true royal composition'),
            ('assets/court-lower-v07.svg','lower court chamber overlay'),
            ('assets/court-middle-v07.svg','court training chamber overlay'),
            ('assets/court-high-v07.svg','royal service hall overlay'),
            ('assets/court-heir-v07.svg','heir chamber overlay'),
            ('assets/court-throne-v07.svg','throne room overlay'),
          ]
          run=os.environ.get('GITHUB_RUN_ID','manual'); pending=checks[:]
          for attempt in range(1,31):
            nxt=[]
            for rel,marker in pending:
              try:
                req=Request(f'{base}{rel}?jm-puka-proof={run}-{attempt}',headers={'User-Agent':'JM-PUKA-Proof/0.7A','Cache-Control':'no-cache'})
                with urlopen(req,timeout=15) as r: body=r.read().decode('utf-8','replace'); code=r.status
              except Exception:
                nxt.append((rel,marker)); continue
              if code==200 and marker in body: print('LIVE PASS',rel or '/',marker)
              else: nxt.append((rel,marker))
            if not nxt: pending=[]; break
            pending=nxt; time.sleep(2)
          if pending: raise SystemExit('PUKA LIVE CONTACT FAILED: '+', '.join(rel or '/' for rel,_ in pending))
          PY

      - name: Seal PUKA proof receipt
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          receipt={
            'schema':'JM.PUKA.ProofReceipt/0.7A',
            'verified_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ.get('GITHUB_SHA'),
            'workflow_run':os.environ.get('GITHUB_RUN_ID'),
            'host':'https://jmisjustme-estate.pages.dev',
            'single_link':'https://jmisjustme-estate.pages.dev/games-beyond/puka/',
            'source_code_ding':'PASS','public_contact':'PASS',
            'art_layers':['puka-art.css','puka-v05.css','puka-v05-room.css','puka-v06.css','puka-v07.css','puka-cards-v05.js','puka-character-v06.js','puka-world-v07.js'],
            'contacted':['/games-beyond/puka/','00_OPEN_FIRST.html','puka-v07.css','puka-world-v07.js','assets/court-lower-v07.svg','assets/court-middle-v07.svg','assets/court-high-v07.svg','assets/court-heir-v07.svg','assets/court-throne-v07.svg'],
            'cold_ding':False,'crowned':False,
            'claim_boundary':'Source/core/layout/art/character/world tests and public HTTP contact passed. Owner-side visual-quality acceptance, portrait/landscape fit, lifecycle persistence and Cold Ding remain separate.'
          }
          Path('games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'JM PUKA Proof Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add games-beyond/puka/PUBLIC_CONTACT_RECEIPT.json
          git commit -m 'Seal PUKA v0.7A source and public contact proof [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
