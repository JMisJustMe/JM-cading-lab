name: PUKA Owner Recovery Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/puka-owner-recovery-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: puka-owner-recovery-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current PUKA source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prove PUKA v0.17A source exists
        shell: bash
        run: |
          set -euo pipefail
          test -s games-beyond/puka/index.html
          test -s games-beyond/puka/00_OPEN_FIRST.html
          grep -Fq 'PUKA v0.17A' games-beyond/puka/index.html
          grep -Fq 'puka-pattern-window-v01.js' games-beyond/puka/00_OPEN_FIRST.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload current Estate for recovery carrier
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy PUKA recovery carrier
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Prove owner-recovery public PUKA route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time
          from urllib.request import Request, urlopen
          url = 'https://jmisjustme.github.io/JM-cading-lab/games-beyond/puka/'
          ok = False
          for attempt in range(1, 41):
              try:
                  req = Request(url + f'?owner-recovery={attempt}', headers={'Cache-Control':'no-cache','User-Agent':'JM-PUKA-Owner-Recovery/1.0'})
                  with urlopen(req, timeout=20) as r:
                      body = r.read().decode('utf-8','replace')
                      if r.status == 200 and 'PUKA v0.17A' in body:
                          print('PUKA GITHUB PAGES OWNER-RECOVERY LIVE PASS')
                          ok = True
                          break
              except Exception as exc:
                  print('WAIT', type(exc).__name__)
              time.sleep(3)
          if not ok:
              raise SystemExit('PUKA GITHUB PAGES OWNER-RECOVERY LIVE CONTACT FAILED')
          PY
