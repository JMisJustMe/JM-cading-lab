name: PUKA v0.15A Read Lab Proof

on:
  push:
    branches:
      - puka-v015a-bluff-counterread
    paths:
      - 'games-beyond/puka/**'
      - '.github/workflows/puka-v015a-read-lab-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puka-read-lab-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout descendant
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax gates
        run: |
          node --check games-beyond/puka/puka-core.js
          node --check games-beyond/puka/puka-human-game-v02.js
          node --check games-beyond/puka/puka-ui.js
          node --check games-beyond/puka/puka-read-lab-v01.js
          node --check games-beyond/puka/sw.js

      - name: Inherited core gate
        run: node games-beyond/puka/puka-core.test.js

      - name: Human Game authority gate
        run: node games-beyond/puka/puka-human-game-v02.test.js

      - name: Declared Read Lab gate
        run: node games-beyond/puka/puka-read-lab-v01.test.js
