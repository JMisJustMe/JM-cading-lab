name: QA JM File Grabber CP09 Side-By-Side Native Share APK
on:
  pull_request:
    branches:
      - main
      - feat/jm-file-grabber-native-cp08-verified-recovery-20261027
    paths:
      - "android/JMFileGrabberVisualang-v0.4/cp09/**"
      - ".github/workflows/qa-jm-file-grabber-cp09-native-share-apk.yml"
  workflow_dispatch:

jobs:
  cp09-native-share:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Recover original v0.4 app and verify CP09 source, identity, and share confirmation
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path('.')
          java = gzip.decompress(base64.b64decode((root / 'source/MainActivity.java.gz.b64').read_text().strip(), validate=True))
          html = gzip.decompress(base64.b64decode(''.join((root / f'source/index.part{i:02d}.b64').read_text().strip() for i in range(5)), validate=True))
          assert hashlib.sha256(java).hexdigest() == 'a2c4d0cc0c39b9fb691ba2bccc3c3585e9be04caaa66ad336a3372382a898dd6', 'Protected parent Java wrong'
          assert hashlib.sha256(html).hexdigest() == 'f578278ee50fbce6b38d28f2fa4db69202a2a2b9e9af4eb0cfbac78c00d8ff47', 'Protected Visualang HTML wrong'
          cp = root / 'cp09'
          receipt = json.loads((cp / 'CP09_SOURCE_RECEIPT.json').read_text())
          for file, expected in receipt['files'].items():
              data = (cp / file).read_bytes()
              assert len(data) == expected['bytes'] and hashlib.sha256(data).hexdigest() == expected['sha256'], f'CP09 source mismatch: {file}'
          gradle = (cp / 'build.gradle.kts').read_text()
          manifest = (cp / 'AndroidManifest.xml').read_text()
          activity = (cp / 'MainActivity.java').read_text()
          assert 'applicationId = "com.jmisjustme.filegrabbervisualang.cp09"' in gradle, 'Unsafe package ID'
          assert 'applicationId = "com.jmisjustme.filegrabbervisualang"' not in gradle, 'Old package targeted'
          assert 'JM File Grabber CP09 TEST' in manifest and 'android:allowBackup="false"' in manifest, 'Visual/custody marker missing'
          assert 'android.intent.action.SEND' in manifest and 'android.intent.action.SEND_MULTIPLE' in manifest, 'Native shares missing'
          assert 'new AlertDialog.Builder(this)' in activity and 'setNegativeButton("Cancel"' in activity, 'Consent missing'
          assert 'NativeVaultTruth.verify' in activity and 'restoreVerifiedVault' in activity, 'Byte-verification regression'
          dst = root / 'app/src/main/java/com/jmisjustme/filegrabbervisualang'
          dst.mkdir(parents=True, exist_ok=True)
          for file in ['MainActivity.java', 'NativeVaultTruth.java','NativeShareGate.java']:
              (dst / file).write_bytes((cp / file).read_bytes())
          (root / 'app/src/main/AndroidManifest.xml').write_bytes((cp / 'AndroidManifest.xml').read_bytes())
          (root / 'app/build.gradle.kts').write_bytes((cp / 'build.gradle.kts').read_bytes())
          (root / 'app/src/main/assets/index.html').write_bytes(html)
          print('PASS verified sovereign v0.4 parent + CP09 exact source; distinct package ID; owner consent')
          PY
      - name: Run both inherited and new native JVM regression suites
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: |
          mkdir -p cp09/classes
          javac -d cp09/classes cp09/NativeVaultTruth.java cp09/NativeVaultTruthTest.java cp09/NativeShareGate.java cp09/NativeShareGateTest.java
          java -cp cp09/classes NativeVaultTruthTest
          java -cp cp09/classes NativeShareGateTest
      - name: Compile real Android CP09 staging debug APK
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: gradle --no-daemon :app:assembleDebug
      - name: Package and hash real CP09 staging APK
        run: |
          mkdir -p dist
          cp android/JMFileGrabberVisualang-v0.4/app/build/outputs/apk/debug/app-debug.apk dist/JM_FILE_GRABBER_CP09_SIDE_BY_SIDE_DEBUG.apk
          sha256sum dist/JM_FILE_GRABBER_CP09_SIDE_BY_SIDE_DEBUG.apk | tee dist/JM_FILE_GRABBER_CP09_SIDE_BY_SIDE_DEBUG.sha256
      - name: Upload compiled candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: JM_FILE_GRABBER_CP09_SIDE_BY_SIDE_DEBUG
          path: dist/JM_FILE_GRABBER_CP09_SIDE_BY_SIDE_DEBUG.*
          if-no-files-found: error
          retention-days: 30
