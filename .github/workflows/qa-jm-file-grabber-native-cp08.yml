name: QA JM File Grabber Native CP08 Verified Recovery
on:
  pull_request:
    branches: ["main"]
    paths:
      - "android/JMFileGrabberVisualang-v0.4/cp08/**"
      - ".github/workflows/qa-jm-file-grabber-native-cp08.yml"
  workflow_dispatch:

jobs:
  cp08-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Recover protected v0.4 parent and overlay CP08 changes
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path('.')
          java = gzip.decompress(base64.b64decode((root / 'source/MainActivity.java.gz.b64').read_text().strip(), validate=True))
          html = gzip.decompress(base64.b64decode(''.join((root / f'source/index.part{i:02d}.b64').read_text().strip() for i in range(5)), validate=True))
          assert hashlib.sha256(java).hexdigest() == 'a2c4d0cc0c39b9fb691ba2bccc3c3585e9be04caaa66ad336a3372382a898dd6', 'Parent Java mismatch'
          assert hashlib.sha256(html).hexdigest() == 'f578278ee50fbce6b38d28f2fa4db69202a2a2b9e9af4eb0cfbac78c00d8ff47', 'Parent Visualang mismatch'
          incoming = root / 'cp08/MainActivity.java'
          helper = root / 'cp08/NativeVaultTruth.java'
          receipt = json.loads((root / 'cp08/CP08_SOURCE_RECEIPT.json').read_text())
          assert hashlib.sha256(incoming.read_bytes()).hexdigest() == receipt['descendant_java_sha256'], 'CP08 Activity SHA mismatch'
          assert hashlib.sha256(helper.read_bytes()).hexdigest() == receipt['helper_sha256'], 'CP08 helper SHA mismatch'
          dst = root / 'app/src/main/java/com/jmisjustme/filegrabbervisualang'
          dst.mkdir(parents=True, exist_ok=True)
          (dst / 'MainActivity.java').write_bytes(incoming.read_bytes())
          (dst / 'NativeVaultTruth.java').write_bytes(helper.read_bytes())
          (root / 'app/src/main/assets/index.html').write_bytes(html)
          gradle = (root / 'app/build.gradle.kts').read_text()
          assert 'versionCode = 4' in gradle and 'versionName = "0.4"' in gradle, 'Parent version mismatch'
          (root / 'app/build.gradle.kts').write_text(gradle.replace('versionCode = 4', 'versionCode = 5').replace('versionName = "0.4"', 'versionName = "0.4.1-cp08"'))
          print('PASS exact parent SHA and CP08 overlay SHA, preserved app ID, v0.4.1-cp08')
          PY
      - name: Run portable Java vault/security regression tests
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: |
          mkdir -p cp08/classes
          javac -d cp08/classes cp08/NativeVaultTruth.java cp08/NativeVaultTruthTest.java
          java -cp cp08/classes NativeVaultTruthTest
      - name: Build native debug APK
        working-directory: android/JMFileGrabberVisualang-v0.4
        run: gradle --no-daemon :app:assembleDebug
      - name: Capture exact debug APK and digest
        run: |
          mkdir -p dist
          cp android/JMFileGrabberVisualang-v0.4/app/build/outputs/apk/debug/app-debug.apk dist/JM_FILE_GRABBER_CP08_NATIVE_DEBUG.apk
          sha256sum dist/JM_FILE_GRABBER_CP08_NATIVE_DEBUG.apk | tee dist/JM_FILE_GRABBER_CP08_NATIVE_DEBUG.sha256
      - name: Upload CP08 Android debug candidate
        uses: actions/upload-artifact@v4
        with:
          name: JM_FILE_GRABBER_CP08_NATIVE_DEBUG
          path: dist/JM_FILE_GRABBER_CP08_NATIVE_DEBUG.*
          if-no-files-found: error
          retention-days: 30
