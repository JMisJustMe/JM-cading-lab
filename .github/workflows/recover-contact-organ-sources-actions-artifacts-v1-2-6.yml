name: Recover Contact Organ Sources from Actions Artifacts v1.2.6

on:
  push:
    branches: [main]
    paths:
      - 'governance/contact-organ/recover_contact_sources_from_actions_artifacts_v1_2_6.py'
      - '.github/workflows/recover-contact-organ-sources-actions-artifacts-v1-2-6.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: contact-organ-actions-artifact-recovery-v1-2-6
  cancel-in-progress: false

jobs:
  recover-artifact-vault-recursive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate recursive recovery descendant
        run: |
          set -euo pipefail
          python3 -m py_compile governance/contact-organ/recover_contact_sources_from_actions_artifacts_v1_2_6.py
          python3 governance/contact-organ/seat_contact_source_v1_2_5.py --authority-selftest
          python3 governance/contact-organ/recover_contact_sources_from_actions_artifacts_v1_2_5.py --selftest
          python3 governance/contact-organ/recover_contact_sources_from_actions_artifacts_v1_2_6.py --wrapper-selftest
          command -v curl >/dev/null

      - name: Sweep retained artifact vault recursively
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 governance/contact-organ/recover_contact_sources_from_actions_artifacts_v1_2_6.py \
            --start 2026-08-27T04:30:00Z \
            --end 2026-08-27T05:20:00Z \
            --max-artifacts 240 \
            --max-artifact-bytes 188743680 \
            --max-download-bytes 786432000 \
            | tee estate-publication/contact-organ-descendants/ACTIONS_ARTIFACT_RUNTIME_DIAGNOSTIC_v1_2_6.txt

      - name: Verify real vault contact and absolute accounting
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('estate-publication/contact-organ-descendants')
          receipt=json.loads((root/'ACTIONS_ARTIFACT_SOURCE_RECOVERY_RECEIPT_v1_2_6.json').read_text())
          accounting=json.loads((root/'PROPAGATION_RECEIPT_v1_2_3.json').read_text())
          nested=receipt['nestedArchiveInspection']
          assert receipt['runsScanned'] > 0
          assert receipt['retainedArtifactsDiscovered'] > 0
          assert receipt['artifactsInspected'] > 0, 'vault metadata without archive contact is not a recovery search'
          assert receipt['downloadBytes'] > 0
          assert nested['outerArtifactsOpened'] == receipt['artifactsInspected']
          assert nested['membersVisited'] > 0
          assert accounting['totalRecipients'] == 28
          assert accounting['unresolved'] == 0
          assert accounting['materialized'] >= 6
          assert accounting['materialized'] + accounting['materializationOpen'] == 28
          assert receipt['exactArtifactSourcesSeated'] == len(receipt['seatedRecipientIds'])
          for rid in receipt['seatedRecipientIds']:
              pr=root/rid/'PATCH_RECEIPT_v1_2_3.json'
              assert pr.exists(), (rid, 'missing patch receipt')
              row=json.loads(pr.read_text())
              assert row['parentMutated'] is False
              assert row['commonOrganMounted'] is True
              assert row['physicalDing'] == 'OPEN'
          print('Artifact vault v1.2.6 PASS', {
              'runs':receipt['runsScanned'],
              'retained':receipt['retainedArtifactsDiscovered'],
              'inspected':receipt['artifactsInspected'],
              'membersVisited':nested['membersVisited'],
              'targetNameEntries':nested['targetNameEntriesExposed'],
              'candidateHits':receipt['candidateFilenameHits'],
              'exactSeats':receipt['exactArtifactSourcesSeated'],
              'materialized':accounting['materialized'],
              'open':accounting['materializationOpen'],
          })
          PY

      - name: Commit earned recoveries and recovery receipt
        run: |
          set -euo pipefail
          git config user.name 'JM Contact Organ Recursive Artifact Gate v1.2.6'
          git config user.email 'actions@users.noreply.github.com'
          git add estate-publication/contact-organ-descendants
          if [ -d estate-publication/source-carriage/contact-organ-v1.2.3 ]; then
            git add estate-publication/source-carriage/contact-organ-v1.2.3
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record recursive Contact Organ artifact recovery v1.2.6 [skip ci]'
          for attempt in $(seq 1 20); do
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
