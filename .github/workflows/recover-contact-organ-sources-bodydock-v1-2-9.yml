name: Recover Contact Organ Sources from Body Dock Carriers v1.2.9

on:
  push:
    branches: [main]
    paths:
      - 'governance/contact-organ/recover_contact_sources_from_bodydock_artifacts_v1_2_9.py'
      - '.github/workflows/recover-contact-organ-sources-bodydock-v1-2-9.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover-bodydock-carriers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Body Dock wrapper and inherited nested/source-seat gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile governance/contact-organ/recover_contact_sources_from_bodydock_artifacts_v1_2_9.py
          python3 -m py_compile governance/contact-organ/recover_contact_sources_from_nested_artifacts_v1_2_8.py
          python3 -m py_compile governance/contact-organ/seat_contact_source_v1_2_5.py
          python3 governance/contact-organ/seat_contact_source_v1_2_5.py --authority-selftest
          python3 governance/contact-organ/recover_contact_sources_from_bodydock_artifacts_v1_2_9.py --selftest

      - name: Sweep later Full Complete Body Dock packaging epoch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/contact-organ/recover_contact_sources_from_bodydock_artifacts_v1_2_9.py \
            | tee estate-publication/contact-organ-descendants/BODY_DOCK_NESTED_RUNTIME_DIAGNOSTIC_v1_2_9.txt

      - name: Absolute-accounting and complete-window gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('estate-publication/contact-organ-descendants')
          receipt=json.loads((root/'BODY_DOCK_NESTED_CARRIER_SOURCE_RECOVERY_RECEIPT_v1_2_9.json').read_text())
          accounting=json.loads((root/'PROPAGATION_RECEIPT_v1_2_3.json').read_text())

          assert receipt['schema'].endswith('/1.2.9')
          assert receipt['window']['start'] == '2026-08-28T23:30:00Z'
          assert receipt['window']['end'] == '2026-08-29T00:10:00Z'
          assert receipt['outerArtifactsSkippedOversize'] == 0, receipt
          assert receipt['outerArtifactsInspected'] == receipt['retainedArtifactsDiscovered'], receipt
          assert receipt['limitsExhausted'] is False, receipt
          assert accounting['totalRecipients'] == 28
          assert accounting['unresolved'] == 0
          assert accounting['materialized'] + accounting['materializationOpen'] == 28
          assert accounting['materialized'] >= receipt['accountingBefore']['materialized'] >= 6
          assert receipt['accountingAfter']['materialized'] == accounting['materialized']
          assert receipt['exactHtmlSourcesSeated'] == len(receipt['seatedRecipientIds'])

          for rid in receipt['seatedRecipientIds']:
              pr=root/rid/'PATCH_RECEIPT_v1_2_3.json'
              assert pr.exists(), (rid, 'missing patch receipt')
              d=json.loads(pr.read_text())
              assert d['parentMutated'] is False
              assert d['commonOrganMounted'] is True
              assert d['physicalDing'] == 'OPEN'

          print('Body Dock nested recovery v1.2.9 PASS', {
              'artifacts': receipt['outerArtifactsInspected'],
              'nestedContainers': receipt['nestedContainersOpened'],
              'sourceMembersHashed': receipt['sourceMembersHashed'],
              'exactHits': receipt['exactAuthorityHits'],
              'exactSeats': receipt['exactHtmlSourcesSeated'],
              'nativeExact': receipt['exactNativePackagesFound'],
              'materialized': accounting['materialized'],
              'open': accounting['materializationOpen'],
          })
          PY

      - name: Commit earned descendants and Body Dock recovery receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JM Contact Organ Body Dock Recovery v1.2.9'
          git config user.email 'actions@users.noreply.github.com'
          git add estate-publication/contact-organ-descendants
          for p in estate-publication/source-carriage/contact-organ-v1.2 estate-publication/source-carriage/contact-organ-v1.2.3; do
            [ -d "$p" ] && git add "$p"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'Record Contact Organ Body Dock nested recovery v1.2.9 [skip ci]'
          for attempt in $(seq 1 20); do
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
