name: Restore TheOverTime Record 10 Wave 01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-theovertime-record-10-wave01.yml"
      - "governance/restore_theovertime_record_10_wave01.py"
      - "theory/BODY_STANDALONES/10_THEOVERTIME_APPROACH_MODEL.md"
      - "theory/BODY_STANDALONES/10_THEOVERTIME_APPROACH_MODEL.txt"
  workflow_dispatch:

concurrency:
  group: theory-record-10-restoration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out current v0.4 carrier
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Align restoration with record source and body vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('governance/restore_theovertime_record_10_wave01.py')
          lines=path.read_text(encoding='utf-8').splitlines(keepends=True)
          output=[]
          source_replaced=False
          body_replaced=False
          index=0
          while index < len(lines):
              line=lines[index]
              if 'if before_record.get("source_file") != EXPECTED_SOURCE_PATH:' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  output.extend([
                      indent+'source_key = next(\n',
                      indent+'    (\n',
                      indent+'        key\n',
                      indent+'        for key in ("source_file", "source_path", "source", "path")\n',
                      indent+'        if isinstance(before_record.get(key), str)\n',
                      indent+'    ),\n',
                      indent+'    None,\n',
                      indent+')\n',
                      indent+'source_value = before_record.get(source_key) if source_key else None\n',
                      indent+'if source_value != EXPECTED_SOURCE_PATH:\n',
                      indent+'    raise RuntimeError(\n',
                      indent+'        f"Record 10 source path mismatch: key={source_key!r}, "\n',
                      indent+'        f"value={source_value!r}, keys={sorted(before_record.keys())!r}"\n',
                      indent+'    )\n',
                  ])
                  index += 2
                  source_replaced=True
                  continue
              if 'old_body = before_record.get("body_text")' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  output.extend([
                      indent+'body_key = next(\n',
                      indent+'    (\n',
                      indent+'        key\n',
                      indent+'        for key in ("body_text", "body", "text", "full_body", "source_body")\n',
                      indent+'        if isinstance(before_record.get(key), str)\n',
                      indent+'    ),\n',
                      indent+'    None,\n',
                      indent+')\n',
                      indent+'old_body = before_record.get(body_key) if body_key else None\n',
                      indent+'if not isinstance(old_body, str):\n',
                      indent+'    raise RuntimeError(\n',
                      indent+'        f"Record 10 exposes no recognised body field; keys={sorted(before_record.keys())!r}"\n',
                      indent+'    )\n',
                  ])
                  index += 3
                  body_replaced=True
                  continue
              line=line.replace('records[index]["body_text"] = source_body','records[index][body_key] = source_body')
              line=line.replace('after_matches[0].get("body_text") != source_body','after_matches[0].get(body_key) != source_body')
              output.append(line)
              index += 1

          if not source_replaced:
              raise SystemExit('Expected source-file assertion line was not found')
          if not body_replaced:
              raise SystemExit('Expected body_text assertion block was not found')
          path.write_text(''.join(output),encoding='utf-8')
          PY

      - name: Restore exact Gmail source into record 10
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile governance/restore_theovertime_record_10_wave01.py
          python3 governance/restore_theovertime_record_10_wave01.py
          test -s registry/theovertime-record-10-source-restoration-wave01.json
          python3 - <<'PY'
          import json
          receipt=json.load(open('registry/theovertime-record-10-source-restoration-wave01.json',encoding='utf-8'))
          assert receipt['status']=='PASS_EXACT_SOURCE_RESTORED'
          assert receipt['record_id']=='10'
          assert receipt['record_after']['body_characters']>=993
          assert receipt['record_after']['integrity_floor_993']=='PASS'
          assert receipt['payload']['records']==297
          assert receipt['payload']['changed_record_ids']==['10']
          assert receipt['payload']['unchanged_non_target_records']==296
          assert receipt['authority']['normalized_md_txt_parity']=='PASS'
          assert receipt['whole_estate_ding']=='OPEN'
          print('THEOVERTIME RECORD 10 EXACT SOURCE RESTORATION PASS')
          PY

      - name: Commit restored seven-part carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JM TheOverTime Source Restoration Rail'
          git config user.email 'actions@users.noreply.github.com'
          git add theory/data/v0_4/part-01.txt
          git add theory/data/v0_4/part-02.txt
          git add theory/data/v0_4/part-03.txt
          git add theory/data/v0_4/part-04.txt
          git add theory/data/v0_4/part-05.txt
          git add theory/data/v0_4/part-06.txt
          git add theory/data/v0_4/part-07.txt
          git add registry/theovertime-record-10-source-restoration-wave01.json
          git commit -m 'Restore TheOverTime record 10 from exact Gmail source'
          git pull --rebase origin main
          git push origin HEAD:main
