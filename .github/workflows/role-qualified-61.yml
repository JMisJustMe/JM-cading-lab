name: Role-qualified 61 coding identity

on:
  pull_request:
    paths:
      - "coding-estate/everybody/role-qualified-61/**"
      - "coding-estate/everybody/body-registry-extension-03.json"
      - "coding-estate/everybody/parity-105/**"
      - ".github/workflows/role-qualified-61.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-and-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare receipt directory
        run: mkdir -p "$RUNNER_TEMP/role-qualified-61"

      - name: Produce 61-body identity diagnostic
        continue-on-error: true
        run: |
          python coding-estate/everybody/role-qualified-61/validate_role_qualified_61.py \
            --out "$RUNNER_TEMP/role-qualified-61/ROLE_QUALIFIED_61_IDENTITY.json"

      - name: Upload identity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jm-role-qualified-61-identity-diagnostic
          path: ${{ runner.temp }}/role-qualified-61/ROLE_QUALIFIED_61_IDENTITY.json
          if-no-files-found: warn

      - name: Hard identity gate
        run: |
          python coding-estate/everybody/role-qualified-61/validate_role_qualified_61.py

      - name: Validate foundation donor authority
        run: |
          python coding-estate/everybody/role-qualified-61/validate_foundation_donors.py \
            > "$RUNNER_TEMP/role-qualified-61/P1_FOUNDATION_DONOR_VALIDATION.json"

      - name: Prove Mark-Level Syntax forward-native bridge
        run: |
          node coding-estate/everybody/role-qualified-61/native/mark-level-syntax.selftest.mjs \
            > "$RUNNER_TEMP/role-qualified-61/MARK_LEVEL_SYNTAX_SELFTEST.json"

      - name: Prove P0 five-body mesh without merge
        run: |
          node coding-estate/everybody/role-qualified-61/native/p0-five-body-route.selftest.mjs \
            > "$RUNNER_TEMP/role-qualified-61/P0_FIVE_BODY_ROUTE_SELFTEST.json"

      - name: Build existing 105-body engineering-ecology role depth
        run: |
          python coding-estate/everybody/parity-105/patch_105_descendant.py
          python coding-estate/everybody/parity-105/role_depth_factory.py \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/role-depth-105"

      - name: Intersect role depth with actual 61 code identities
        run: |
          python coding-estate/everybody/role-qualified-61/validate_role_qualified_61.py \
            --role-depth-manifest "$RUNNER_TEMP/role-depth-105/ROLE_DEPTH_MANIFEST.json" \
            --out "$RUNNER_TEMP/role-qualified-61/ROLE_QUALIFIED_61_VALIDATION.json"

      - name: Upload 61-body maturation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jm-role-qualified-61-maturation-receipts
          path: |
            ${{ runner.temp }}/role-qualified-61/ROLE_QUALIFIED_61_VALIDATION.json
            ${{ runner.temp }}/role-qualified-61/P1_FOUNDATION_DONOR_VALIDATION.json
            ${{ runner.temp }}/role-qualified-61/MARK_LEVEL_SYNTAX_SELFTEST.json
            ${{ runner.temp }}/role-qualified-61/P0_FIVE_BODY_ROUTE_SELFTEST.json
          if-no-files-found: warn
