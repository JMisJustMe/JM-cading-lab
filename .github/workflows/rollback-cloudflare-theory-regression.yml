name: Roll Back Theory Regression

# One-time recovery trigger: preservation rail completed before this revision.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rollback-cloudflare-theory-regression.yml"
  workflow_dispatch:

concurrency:
  group: jmisjustme-estate-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rollback:
    name: Restore pre-automation production body
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Estate source
        uses: actions/checkout@v6

      - name: Locate last successful production deployment before regression
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jmisjustme-estate
          REGRESSION_CUTOFF: 2026-07-20T13:08:12Z
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments?per_page=100"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$api" > "$RUNNER_TEMP/deployments.json"

          python3 <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path

          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'deployments.json').read_text())
          if not payload.get('success'):
              raise SystemExit(f"Cloudflare deployment listing failed: {payload}")

          cutoff = datetime.fromisoformat(os.environ['REGRESSION_CUTOFF'].replace('Z', '+00:00'))
          candidates = []
          for deployment in payload.get('result', []):
              created = datetime.fromisoformat(deployment['created_on'].replace('Z', '+00:00'))
              stage = deployment.get('latest_stage') or {}
              if (
                  deployment.get('environment') == 'production'
                  and stage.get('status') == 'success'
                  and created < cutoff
              ):
                  candidates.append((created, deployment))

          if not candidates:
              raise SystemExit('No successful production deployment exists before the regression cutoff.')

          created, target = max(candidates, key=lambda item: item[0])
          env_path = Path(os.environ['GITHUB_ENV'])
          with env_path.open('a') as f:
              f.write(f"ROLLBACK_DEPLOYMENT_ID={target['id']}\n")
              f.write(f"ROLLBACK_DEPLOYMENT_CREATED={target['created_on']}\n")
              f.write(f"ROLLBACK_DEPLOYMENT_URL={target.get('url', '')}\n")
          print(f"Selected production deployment {target['id']} from {target['created_on']}")
          PY

      - name: Roll production back to the preserved v1.14 body
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jmisjustme-estate
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$endpoint" > "$RUNNER_TEMP/rollback.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'rollback.json').read_text())
          if not payload.get('success'):
              raise SystemExit(f"Cloudflare rollback failed: {payload}")
          result = payload.get('result') or {}
          print(f"Rollback accepted: {result.get('id', 'unknown deployment')}")
          PY

      - name: Prove the newer Theory body is live
        shell: bash
        run: |
          set -euo pipefail
          proved=0
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --location \
              "https://jmisjustme-estate.pages.dev/theory/?rollback-proof=${GITHUB_RUN_ID}-${attempt}" \
              > "$RUNNER_TEMP/live-theory.html" || true
            if grep -q "Project Source Census Edition" "$RUNNER_TEMP/live-theory.html"; then
              proved=1
              break
            fi
            sleep 2
          done
          test "$proved" -eq 1
          grep -q "Human Pattern Calibration" "$RUNNER_TEMP/live-theory.html"
          echo "Project Source Census Edition restored and independently fetched from the canonical host."

      - name: Record rollback proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry
          cat > registry/cloudflare-theory-rollback-receipt.json <<EOF
          {
            "schema": "JM.CloudflareTheoryRollbackReceipt/1.0",
            "status": "SUCCESS",
            "project": "jmisjustme-estate",
            "canonical_host": "jmisjustme-estate.pages.dev",
            "restored_deployment_id": "${ROLLBACK_DEPLOYMENT_ID}",
            "restored_deployment_created_at": "${ROLLBACK_DEPLOYMENT_CREATED}",
            "restored_title_proof": "JM Theory Multihub — Project Source Census Edition",
            "content_proof": "Human Pattern Calibration",
            "workflow_run": "${GITHUB_RUN_ID}",
            "proved_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "regression": "Older repository v0.4 Theory body had overwritten the newer canonical body.",
            "future_policy": "Automatic deployments preserve the live canonical Theory body until its full newer source is seated."
          }
          EOF
          git config user.name "JM Estate Recovery Rail"
          git config user.email "actions@users.noreply.github.com"
          git add registry/cloudflare-theory-rollback-receipt.json
          git commit -m "Record successful Theory production rollback"
          git push
