name: RouteOS Kernel Hard-Body Proof

on:
  push:
    branches:
      - agent/routeos-kernel-hard-body-v0-1a
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-hard-body-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4

      - name: Restore v0.1A source carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .routeos-proof
          base64 -d systems/routeos-kernel-convergence-v0.1A/routeos-kernel-v0.1A-ci-source.tar.gz.b64 \
            > .routeos-proof/source.tar.gz
          echo 'b54dc630332255667e099ce2bafb00e3b927b5b5ff966e6e0898bbb2e2c54654  .routeos-proof/source.tar.gz' | sha256sum -c -
          tar -xzf .routeos-proof/source.tar.gz -C .routeos-proof

      - name: Install open proof carriers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld binutils grub-pc-bin grub-common grub2-common \
            xorriso mtools qemu-system-x86
          command -v grub-mkrescue
          command -v xorriso
          command -v qemu-system-x86_64
          grub-mkrescue --version
          xorriso -version | head -n 2
          qemu-system-x86_64 --version | head -n 1

      - name: Build and run GRUB to QEMU proof
        id: hard_body
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ROOT=.routeos-proof/routeos-kernel-v0.1A
          chmod +x "$ROOT"/build.sh "$ROOT"/tests/*.sh "$ROOT"/tests/*.py
          "$ROOT/tests/run_qemu_proof.sh" 2>&1 | tee .routeos-proof/PROOF_RUN.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Freeze machine-run receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.routeos-proof/routeos-kernel-v0.1A
          mkdir -p hard-body-receipt
          for f in \
            .routeos-proof/PROOF_RUN.log \
            "$ROOT/proof/QEMU_BOOT_TRACE.txt" \
            "$ROOT/build/routeos-kernel.elf" \
            "$ROOT/build/routeos-kernel.iso"; do
            if [[ -f "$f" ]]; then cp "$f" hard-body-receipt/; fi
          done
          {
            echo "hard_body_step_outcome=${{ steps.hard_body.outcome }}"
            echo "hard_body_exit_status=${{ steps.hard_body.outputs.exit_status }}"
            echo
            echo "--- tool paths ---"
            command -v grub-mkrescue || true
            command -v xorriso || true
            command -v qemu-system-x86_64 || true
            echo
            echo "--- grub platform files ---"
            find /usr/lib/grub -maxdepth 2 -type f \( -name 'eltorito.img' -o -name 'modinfo.sh' \) -print 2>/dev/null || true
            echo
            echo "--- build tree ---"
            find "$ROOT/build" -maxdepth 4 -printf '%y %s %p\n' 2>/dev/null | sort || true
          } > hard-body-receipt/ENVIRONMENT_AND_BUILD_TREE.txt
          (cd hard-body-receipt && sha256sum * > SHA256SUMS.txt) || true

      - name: Upload hard-body receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeos-kernel-v0.1A-hard-body-receipt
          path: hard-body-receipt
          if-no-files-found: error

      - name: Enforce hard-body result
        if: always()
        shell: bash
        run: |
          test '${{ steps.hard_body.outcome }}' = 'success'
