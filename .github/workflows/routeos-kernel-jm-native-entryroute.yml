name: RouteOS JM-Generated EntryRoute

on:
  push:
    branches: [agent/routeos-kernel-jm-native-entryroute-v1-7a]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jm-generated-entryroute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout v1.7A branch with lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify readable v1.7A authority and mount frozen v1.2A body
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "bd501c1fa6bbc263a76cee219f4155018e9db323c5336d21cafd897c99003aae  systems/routeos-kernel-jm-native-v1.7A/generated/entryroute.json" \
            "37cda9b49c9f481517d74f5bcd0361fabf11e847f43dab9b8e2327e0817db068  systems/routeos-kernel-jm-native-v1.7A/generated/entryroute_head.inc" \
            "014c792c9d29b07612f09879ae03d66a3ea73f77ee6b225afc3ec598f4a88077  systems/routeos-kernel-jm-native-v1.7A/generated/entryroute_tail.inc" \
            "b21d58124ea69cb9e57394163a1b83294a6dac1c31f452e9098fb7e144e70647  systems/routeos-kernel-jm-native-v1.7A/source/entryroute.jmroute" \
            "c1f443959754806a704a3f0e9bdc428c01c532cbb3f2d9d899aec1a4ba7b9fbc  systems/routeos-kernel-jm-native-v1.7A/tests/test_entryroute.py" \
            "290d72a22d0772b6ddcf62ddeda458513e5164792e0f91d72198ebe647cce06f  systems/routeos-kernel-jm-native-v1.7A/tools/ci_enforce_entryroute.py" \
            "78c554927d730490b849f5aad61396b22636c472008354851dbfd1cffd9277f0  systems/routeos-kernel-jm-native-v1.7A/tools/ci_prepare_entryroute.sh" \
            "bbeb73f93e1440d88f80aa4faa62ac5d2ff98f31494c8f82f696f67ad9f7b57f  systems/routeos-kernel-jm-native-v1.7A/tools/entryroutec.py" \
            "55dfc3834f38fd60a7292f117571d30ca9f1ad76e1d06c1ada6d21cfa56f8482  systems/routeos-kernel-jm-native-v1.7A/tools/integrate_entryroute.py" | sha256sum -c -
          git merge-base --is-ancestor 989d204383ad7e3ea03c749aa0472d6f3c10b199 HEAD

          V12=systems/routeos-kernel-jm-native-v1.2A
          for spec in \
            "5f364d15567327a60b0d8a03ed6b78479bae313ba82b229d0a87013b2cd5c5ec  $V12/routeos-v1.2A-body.tar.gz.b64  0be9af24c7fe7de2b0efb004a88393f23509903df2b13660afc8894517135316  /tmp/v12-base.tar.gz" \
            "6f83905abdbc6f6e438f27187a9d394e784499d5dcb727b658873f4752d6b730  $V12/routeos-v1.2A-pre-idt-correction.tar.gz.b64  9274ad896d84951856def1ac339d4d5d6ccc9246f642beb849941bd20f52aff3  /tmp/v12-abi.tar.gz" \
            "8c88a35eb8f01f2190107a79db6e3a9f4337a43d347cd8f730398bd270d17e98  $V12/routeos-v1.2A-symbol-range-proof-correction.tar.gz.b64  e38a984c1fdd658796b355a897e3b998f3ea44f56b5983bb3a7bbe65c6d1e1ff  /tmp/v12-proof.tar.gz"; do
            set -- $spec
            echo "$1  $2" | sha256sum -c -
            base64 -d "$2" > "$4"
            echo "$3  $4" | sha256sum -c -
            tar -xzf "$4" -C .
          done

      - name: Install open machine-proof carriers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils grub-pc-bin grub-common grub2-common xorriso mtools qemu-system-x86

      - name: Verify and rebuild complete generated stack
        run: bash systems/routeos-kernel-jm-native-v1.7A/tools/ci_prepare_entryroute.sh

      - name: Build and run extended JM kernel in QEMU
        id: machine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          KERNEL=.routeos-v17a/routeos-kernel-v0.1A
          chmod +x "$KERNEL"/build.sh "$KERNEL"/tests/*.sh "$KERNEL"/tests/*.py
          "$KERNEL/tests/run_qemu_proof.sh" 2>&1 | tee .routeos-v17a/JM_ENTRYROUTE_MACHINE_RUN.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Freeze v1.7A machine receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          V=systems/routeos-kernel-jm-native-v1.7A
          KERNEL=.routeos-v17a/routeos-kernel-v0.1A
          OUT=entryroute-v17a-receipt
          mkdir -p "$OUT"
          if [[ -f "$KERNEL/build/routeos-kernel.elf" ]]; then
            nm -n "$KERNEL/build/routeos-kernel.elf" > .routeos-v17a/JM_ENTRYROUTE_SYMBOLS.txt
            objdump -d "$KERNEL/build/routeos-kernel.elf" > .routeos-v17a/JM_ENTRYROUTE_DISASSEMBLY.txt
          fi
          for f in .routeos-v17a/*_INTEGRATION_RECEIPT.json .routeos-v17a/JM_ENTRYROUTE* \
            "$KERNEL/proof/QEMU_BOOT_TRACE.txt" "$KERNEL/build/routeos-kernel.elf" "$KERNEL/build/routeos-kernel.iso" \
            "$KERNEL/kernel/routeos_kernel.c" "$V/source/entryroute.jmroute" "$V/generated"/*; do
            [[ -f "$f" ]] && cp "$f" "$OUT/"
          done
          printf '%s\n' \
            "machine_step_outcome=${{ steps.machine.outcome }}" \
            "machine_exit_status=${{ steps.machine.outputs.exit_status }}" \
            "frozen_parent=989d204383ad7e3ea03c749aa0472d6f3c10b199" \
            "source_sha256=b21d58124ea69cb9e57394163a1b83294a6dac1c31f452e9098fb7e144e70647" > "$OUT/GATE_STATUS.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt) || true

      - name: Upload v1.7A receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeos-kernel-jm-native-v1.7A-entryroute-receipt
          path: entryroute-v17a-receipt
          if-no-files-found: error

      - name: Enforce EntryRoute operational result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.machine.outcome }}' = 'success'
          KERNEL=.routeos-v17a/routeos-kernel-v0.1A
          python3 systems/routeos-kernel-jm-native-v1.7A/tools/ci_enforce_entryroute.py \
            "$KERNEL/proof/QEMU_BOOT_TRACE.txt" "$KERNEL/kernel/routeos_kernel.c" \
            "$KERNEL/build/routeos-kernel.elf" .routeos-v17a/ENTRYROUTE_INTEGRATION_RECEIPT.json
          echo 'JM_GENERATED_ENTRYROUTE DING: PASS'
