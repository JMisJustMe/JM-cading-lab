name: RouteOS JM-Generated FrameCarrier InterruptEntry

on:
  push:
    branches: [agent/routeos-kernel-jm-native-framecarrier-v1-0a]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jm-generated-framecarrier-interruptentry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout v1.0A branch with lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install open machine-proof carriers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils grub-pc-bin grub-common grub2-common xorriso mtools qemu-system-x86
      - name: Verify and rebuild complete generated stack
        run: bash systems/routeos-kernel-jm-native-v1.0A/tools/ci_prepare_framecarrier.sh
      - name: Build and run twelve-office JM kernel in QEMU
        id: machine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          KERNEL=.routeos-v10a/routeos-kernel-v0.1A
          chmod +x "$KERNEL"/build.sh "$KERNEL"/tests/*.sh "$KERNEL"/tests/*.py
          "$KERNEL/tests/run_qemu_proof.sh" 2>&1 | tee .routeos-v10a/JM_FRAMECARRIER_INTERRUPTENTRY_MACHINE_RUN.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Freeze v1.0A machine receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          V10=systems/routeos-kernel-jm-native-v1.0A
          KERNEL=.routeos-v10a/routeos-kernel-v0.1A
          mkdir -p framecarrier-interruptentry-v10a-receipt
          if [[ -f "$KERNEL/build/routeos-kernel.elf" ]]; then
            nm -n "$KERNEL/build/routeos-kernel.elf" > .routeos-v10a/JM_FRAMECARRIER_SYMBOLS.txt
            objdump -d "$KERNEL/build/routeos-kernel.elf" > .routeos-v10a/JM_FRAMECARRIER_DISASSEMBLY.txt
          fi
          for f in .routeos-v10a/*_INTEGRATION_RECEIPT.json .routeos-v10a/JM_FRAMECARRIER_* \
            "$KERNEL/proof/QEMU_BOOT_TRACE.txt" "$KERNEL/build/routeos-kernel.elf" "$KERNEL/build/routeos-kernel.iso" \
            "$KERNEL/kernel/routeos_kernel.c" "$KERNEL/kernel/routeos_authority.h" "$KERNEL/arch/x86_64/boot.S" \
            "$V10/source/framecarrier_interruptentry.jmroute" "$V10/generated/framecarrier_interruptentry.S" \
            "$V10/generated/framecarrier_interruptentry.json"; do
            [[ -f "$f" ]] && cp "$f" framecarrier-interruptentry-v10a-receipt/
          done
          printf '%s\n' \
            "machine_step_outcome=${{ steps.machine.outcome }}" \
            "machine_exit_status=${{ steps.machine.outputs.exit_status }}" \
            "frozen_anchor=a05b26b3901460cfa5623cbb3063d961a9952214" \
            "framecarrier_interruptentry_source_sha256=50d810e82c54655df58936e17c4d0f67eee026d10de6c6a82db422fef40f1914" \
            > framecarrier-interruptentry-v10a-receipt/GATE_STATUS.txt
          (cd framecarrier-interruptentry-v10a-receipt && sha256sum * > SHA256SUMS.txt) || true
      - name: Upload v1.0A FrameCarrier InterruptEntry receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeos-kernel-jm-native-v1.0A-framecarrier-interruptentry-receipt
          path: framecarrier-interruptentry-v10a-receipt
          if-no-files-found: error
      - name: Enforce twelve-office operational result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.machine.outcome }}' = 'success'
          KERNEL=.routeos-v10a/routeos-kernel-v0.1A
          python3 systems/routeos-kernel-jm-native-v1.0A/tools/ci_enforce_framecarrier.py \
            "$KERNEL/proof/QEMU_BOOT_TRACE.txt" "$KERNEL/arch/x86_64/boot.S" "$KERNEL/build/routeos-kernel.elf"
          ELF="$KERNEL/build/routeos-kernel.elf"
          for hash in 50d810e82c54655df58936e17c4d0f67eee026d10de6c6a82db422fef40f1914 \
            c84db3d5aaad07e90b45d4ac84216cd9c60c0fbc22d25a00caeccb6354bda99f \
            680ba2c31be8dfa7b8ebde7ea518ca385c7faa3906f5ac8af8ecb7c52c4165ea \
            e038b1549e6831de566ef2180a1b83a5c2071aa2b3951bb415e3c1002e4d0c22 \
            2bbcf026b977de46e10ea9d8a337b96a901e69bd6514880fb32fb8d79dedfd00 \
            847e3d7266a5873d099c0b3403df5e7dd6fea3f8e09ab1092bc28178083fcbe8 \
            13d2d2cc90d338cd7a1177caa150dd16f3ec2aa32d0f0fb5c1959e11898b632c \
            2bc50156fe908d6bb9eff42e27296736c2235ecd5a065dec75bccbb15fa7fac2; do
            strings "$ELF" | grep -F "$hash"
          done
          echo 'JM_GENERATED_FRAMECARRIER_INTERRUPTENTRY DING: PASS'
