name: RouteOS JM-Generated Observatory Continuity v2.0A

on:
  push:
    branches: [agent/routeos-kernel-jm-native-observatorycontinuity-v2-0a]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observatory-continuity-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen parent and deterministic authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 110909c7199bcfbd7007ed56437d05a8aea5967b HEAD
          V=systems/routeos-kernel-jm-native-v2.0A
          C="$V/carrier"
          echo '587a27880a6b728891726b54112c9093bd841677df4e661ae871f16dbd4d8952  '"$C"'/routeos-v2.0A-source.part00.b64' | sha256sum -c -
          echo '5a7273415623de8cb1cae07d2ea55a1e6e1308b7e0abe0225b072bf71384913a  '"$C"'/routeos-v2.0A-source.part01.b64' | sha256sum -c -
          cat "$C"/routeos-v2.0A-source.part*.b64 > /tmp/routeos-v2.0A-source.tar.gz.b64
          echo '39f5afba3f791fead75518b2e7a568e3b239fa7d4f66d415d07da26b22b1f7af  /tmp/routeos-v2.0A-source.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/routeos-v2.0A-source.tar.gz.b64 > /tmp/routeos-v2.0A-source.tar.gz
          echo '5e1b9c7b1d62bb336961837fc4a2478ed8c7c85aa31c9b483b82054bb6420d26  /tmp/routeos-v2.0A-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/routeos-v2.0A-source.tar.gz
          python3 "$V/tools/observatorycontinuityc.py" \
            "$V/source/observatory_continuity.jmroute" \
            --out-dir "$V/generated" --check
          python3 -m unittest discover -s "$V/tests" -v

      - name: Install machine and visual carriers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld binutils grub-pc-bin grub-common grub2-common \
            xorriso mtools qemu-system-x86 graphviz zip

      - name: Rebuild inherited stack and mount v2.0A
        run: bash systems/routeos-kernel-jm-native-v2.0A/tools/ci_prepare_observatorycontinuity.sh

      - name: Run QEMU proof
        id: machine
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          K=.routeos-v20a/routeos-kernel-v0.1A
          chmod +x "$K/build.sh" "$K/tests/"*
          set -o pipefail
          "$K/tests/run_qemu_proof.sh" 2>&1 | tee .routeos-v20a/JM_OBSERVATORYCONTINUITY_MACHINE_RUN.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Decode, render, package and capture receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          V=systems/routeos-kernel-jm-native-v2.0A
          K=.routeos-v20a/routeos-kernel-v0.1A
          O=observatorycontinuity-v20a-receipt
          OBS=.routeos-v20a/observatory
          PKG=.routeos-v20a/JM_ROUTEOS_V2_0A_ZIONFOLDER
          mkdir -p "$O" "$OBS"
          nm -n "$K/build/routeos-kernel.elf" > .routeos-v20a/JM_OBSERVATORYCONTINUITY_SYMBOLS.txt
          objdump -d "$K/build/routeos-kernel.elf" > .routeos-v20a/JM_OBSERVATORYCONTINUITY_DISASSEMBLY.txt
          python3 "$V/tools/decode_trace.py" "$K/proof/QEMU_BOOT_TRACE.txt" \
            --out .routeos-v20a/JM_OBSERVATORYCONTINUITY_TRACE.json
          python3 "$V/tools/render_observatory.py" \
            .routeos-v20a/JM_OBSERVATORYCONTINUITY_TRACE.json \
            "$V/generated/observatory_continuity.json" --out-dir "$OBS"
          python3 "$V/tools/package_release.py" \
            --kernel-dir "$K" \
            --trace "$K/proof/QEMU_BOOT_TRACE.txt" \
            --symbols .routeos-v20a/JM_OBSERVATORYCONTINUITY_SYMBOLS.txt \
            --disassembly .routeos-v20a/JM_OBSERVATORYCONTINUITY_DISASSEMBLY.txt \
            --decoded .routeos-v20a/JM_OBSERVATORYCONTINUITY_TRACE.json \
            --observatory "$OBS" \
            --source-root "$V" \
            --out-dir "$PKG"
          cp .routeos-v20a/OBSERVATORYCONTINUITY_INTEGRATION_RECEIPT.json "$O/"
          cp .routeos-v20a/JM_OBSERVATORYCONTINUITY_MACHINE_RUN.log "$O/"
          cp .routeos-v20a/JM_OBSERVATORYCONTINUITY_SYMBOLS.txt "$O/"
          cp .routeos-v20a/JM_OBSERVATORYCONTINUITY_DISASSEMBLY.txt "$O/"
          cp .routeos-v20a/JM_OBSERVATORYCONTINUITY_TRACE.json "$O/"
          cp "$K/proof/QEMU_BOOT_TRACE.txt" "$O/"
          cp "$K/build/routeos-kernel.elf" "$O/"
          cp "$K/build/routeos-kernel.iso" "$O/"
          cp "$K/kernel/routeos_kernel.c" "$O/"
          cp "$V/source/observatory_continuity.jmroute" "$O/"
          cp "$V/generated/"* "$O/"
          cp -R "$OBS" "$O/"
          printf 'machine_step_outcome=%s\nmachine_exit_status=%s\nfrozen_parent=%s\nsource_sha256=%s\n' \
            '${{ steps.machine.outcome }}' '${{ steps.machine.outputs.exit_status }}' \
            '110909c7199bcfbd7007ed56437d05a8aea5967b' \
            'd36b935c3a5ee6b467c469045b7bfa200589f87196fac8b4dc4c611f98080271' \
            > "$O/GATE_STATUS.txt"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload machine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeos-kernel-jm-native-v2.0A-observatorycontinuity-receipt
          path: observatorycontinuity-v20a-receipt

      - name: Upload Zionfolder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeos-kernel-jm-native-v2.0A-zionfolder
          path: |
            .routeos-v20a/JM_ROUTEOS_V2_0A_ZIONFOLDER
            .routeos-v20a/JM_ROUTEOS_V2_0A_ZIONFOLDER.zip

      - name: Enforce machine result and visual handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.machine.outcome }}' = success
          K=.routeos-v20a/routeos-kernel-v0.1A
          python3 systems/routeos-kernel-jm-native-v2.0A/tools/ci_enforce_observatorycontinuity.py \
            "$K/proof/QEMU_BOOT_TRACE.txt" \
            "$K/kernel/routeos_kernel.c" \
            "$K/build/routeos-kernel.elf" \
            .routeos-v20a/OBSERVATORYCONTINUITY_INTEGRATION_RECEIPT.json \
            .routeos-v20a/JM_OBSERVATORYCONTINUITY_TRACE.json \
            .routeos-v20a/observatory/index.html
