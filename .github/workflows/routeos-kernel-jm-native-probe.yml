name: RouteOS JM-Native Integration Probe

on:
  push:
    branches:
      - agent/routeos-kernel-jm-native-v0-2a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-frozen-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Open exact frozen source carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .routeos-probe
          base64 -d systems/routeos-kernel-convergence-v0.1A/routeos-kernel-v0.1A-ci-source.tar.gz.b64 > .routeos-probe/source.tar.gz
          echo 'b54dc630332255667e099ce2bafb00e3b927b5b5ff966e6e0898bbb2e2c54654  .routeos-probe/source.tar.gz' | sha256sum -c -
          tar -xzf .routeos-probe/source.tar.gz -C .routeos-probe

      - name: Report integration surfaces
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.routeos-probe/routeos-kernel-v0.1A
          echo '=== SOURCE TREE ==='
          find "$ROOT" -maxdepth 4 -type f -printf '%p\n' | sort
          echo '=== BUILD SCRIPT ==='
          sed -n '1,260p' "$ROOT/build.sh"
          echo '=== C AND HEADER SURFACES ==='
          while IFS= read -r file; do
            echo "--- $file ---"
            sed -n '1,320p' "$file"
          done < <(find "$ROOT" -maxdepth 4 -type f \( -name '*.c' -o -name '*.h' \) | sort)
          echo '=== PROOF RUNNER ==='
          sed -n '1,320p' "$ROOT/tests/run_qemu_proof.sh"
