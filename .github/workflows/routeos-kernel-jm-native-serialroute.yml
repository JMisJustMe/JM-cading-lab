name: RouteOS JM-Generated SerialRoute

on:
  push:
    branches: [agent/routeos-kernel-jm-native-serialroute-v1-3a]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jm-generated-serialroute:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout v1.3A branch with lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mount frozen v1.2A body and v1.3A SerialRoute
        shell: bash
        run: |
          set -euo pipefail
          V12=systems/routeos-kernel-jm-native-v1.2A
          for spec in \
            "5f364d15567327a60b0d8a03ed6b78479bae313ba82b229d0a87013b2cd5c5ec  $V12/routeos-v1.2A-body.tar.gz.b64  0be9af24c7fe7de2b0efb004a88393f23509903df2b13660afc8894517135316  /tmp/v12-base.tar.gz" \
            "6f83905abdbc6f6e438f27187a9d394e784499d5dcb727b658873f4752d6b730  $V12/routeos-v1.2A-pre-idt-correction.tar.gz.b64  9274ad896d84951856def1ac339d4d5d6ccc9246f642beb849941bd20f52aff3  /tmp/v12-abi.tar.gz" \
            "8c88a35eb8f01f2190107a79db6e3a9f4337a43d347cd8f730398bd270d17e98  $V12/routeos-v1.2A-symbol-range-proof-correction.tar.gz.b64  e38a984c1fdd658796b355a897e3b998f3ea44f56b5983bb3a7bbe65c6d1e1ff  /tmp/v12-proof.tar.gz"; do
            set -- $spec
            echo "$1  $2" | sha256sum -c -
            base64 -d "$2" > "$4"
            echo "$3  $4" | sha256sum -c -
            tar -xzf "$4" -C .
          done
          V13=systems/routeos-kernel-jm-native-v1.3A
          echo "154dd249d15d7cb10ad4279377ca0957b10cfa13f9896dca31ccd0be9f49fa32  $V13/routeos-v1.3A-body.tar.gz.b64" | sha256sum -c -
          base64 -d "$V13/routeos-v1.3A-body.tar.gz.b64" > /tmp/v13.tar.gz
          echo "2a5a9b5eb03875e2b2ceb65718a237f7ec19c5fbe7ad71a2551bf8de1432bda7  /tmp/v13.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v13.tar.gz -C .
      - name: Install open machine-proof carriers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils grub-pc-bin grub-common grub2-common xorriso mtools qemu-system-x86
      - name: Verify and rebuild complete generated stack
        run: bash systems/routeos-kernel-jm-native-v1.3A/tools/ci_prepare_serialroute.sh
      - name: Build and run twenty-office JM kernel in QEMU
        id: machine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          KERNEL=.routeos-v13a/routeos-kernel-v0.1A
          chmod +x "$KERNEL"/build.sh "$KERNEL"/tests/*.sh "$KERNEL"/tests/*.py
          "$KERNEL/tests/run_qemu_proof.sh" 2>&1 | tee .routeos-v13a/JM_SERIALROUTE_MACHINE_RUN.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Freeze v1.3A construction receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          V13=systems/routeos-kernel-jm-native-v1.3A
          KERNEL=.routeos-v13a/routeos-kernel-v0.1A
          OUT=serialroute-v13a-receipt
          mkdir -p "$OUT"
          if [[ -f "$KERNEL/build/routeos-kernel.elf" ]]; then
            nm -n "$KERNEL/build/routeos-kernel.elf" > .routeos-v13a/JM_SERIALROUTE_SYMBOLS.txt
            objdump -d "$KERNEL/build/routeos-kernel.elf" > .routeos-v13a/JM_SERIALROUTE_DISASSEMBLY.txt
          fi
          for f in .routeos-v13a/*_INTEGRATION_RECEIPT.json .routeos-v13a/JM_SERIALROUTE* \
            "$KERNEL/proof/QEMU_BOOT_TRACE.txt" "$KERNEL/build/routeos-kernel.elf" "$KERNEL/build/routeos-kernel.iso" \
            "$KERNEL/kernel/routeos_kernel.c" "$V13/source/serialroute.jmroute" "$V13/generated"/*; do
            [[ -f "$f" ]] && cp "$f" "$OUT/"
          done
          printf '%s\n' \
            "machine_step_outcome=${{ steps.machine.outcome }}" \
            "machine_exit_status=${{ steps.machine.outputs.exit_status }}" \
            "frozen_parent=5ccde5f1c8f1692cbffcc87595fecddf7b25b349" \
            "serialroute_source_sha256=7a8f084140170c348bce0fac29e912ad9c7ea1b4a1772b1751d2ca9fbbf45190" > "$OUT/GATE_STATUS.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt) || true
      - name: Upload v1.3A receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeos-kernel-jm-native-v1.3A-serialroute-receipt
          path: serialroute-v13a-receipt
          if-no-files-found: error
      - name: Enforce twenty-office operational result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.machine.outcome }}' = 'success'
          KERNEL=.routeos-v13a/routeos-kernel-v0.1A
          python3 systems/routeos-kernel-jm-native-v1.3A/tools/ci_enforce_serialroute.py \
            "$KERNEL/proof/QEMU_BOOT_TRACE.txt" "$KERNEL/kernel/routeos_kernel.c" \
            "$KERNEL/build/routeos-kernel.elf" .routeos-v13a/SERIALROUTE_INTEGRATION_RECEIPT.json
          for hash in 7a8f084140170c348bce0fac29e912ad9c7ea1b4a1772b1751d2ca9fbbf45190 \
            1ab1556c2e674a42d85089b1235e353c5a694d4bdce9eafa6668efcc40845bb1 \
            b02be640fe482dc36633084e0e4601533ea3ed3b38892d723ab37f2bfc98a638; do
            strings "$KERNEL/build/routeos-kernel.elf" | grep -F "$hash"
          done
          echo 'JM_GENERATED_SERIALROUTE DING: PASS'
