name: JM Sovereign Ten Native Conformance

on:
  push:
    paths:
      - 'coding-estate/sovereign-ten/**'
      - '.github/workflows/sovereign-ten.yml'
  pull_request:
    paths:
      - 'coding-estate/sovereign-ten/**'
      - '.github/workflows/sovereign-ten.yml'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run readable ten-body native conformance
        id: conformance
        continue-on-error: true
        run: node coding-estate/sovereign-ten/direct/native-selftest.mjs > sovereign-ten-receipt.json
      - name: Upload conformance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-ten-conformance-receipt
          path: sovereign-ten-receipt.json
      - name: Enforce conformance result
        if: always()
        shell: bash
        run: |
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('sovereign-ten-receipt.json','utf8')); console.log(JSON.stringify({passed:r.passed,failed:r.failed,digest:r.digest,failures:r.checks.filter(x=>!x.passed)},null,2)); if(r.failed) process.exit(1);"
