name: JM Sovereign Ten Native Conformance

on:
  push:
    paths:
      - 'coding-estate/sovereign-ten/**'
      - '.github/workflows/sovereign-ten.yml'
  pull_request:
    paths:
      - 'coding-estate/sovereign-ten/**'
      - '.github/workflows/sovereign-ten.yml'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run readable ten-body native conformance
        shell: bash
        run: |
          set +e
          node coding-estate/sovereign-ten/direct/native-selftest.mjs > /tmp/sovereign-ten-receipt.json
          status=$?
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/sovereign-ten-receipt.json','utf8')); console.log(JSON.stringify({passed:r.passed,failed:r.failed,digest:r.digest,failures:r.checks.filter(x=>!x.passed)},null,2));"
          exit $status
