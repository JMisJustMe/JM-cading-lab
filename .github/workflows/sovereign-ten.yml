name: JM Sovereign Ten Native Conformance

on:
  push:
    paths:
      - 'coding-estate/sovereign-ten/**'
      - '.github/workflows/sovereign-ten.yml'
  pull_request:
    paths:
      - 'coding-estate/sovereign-ten/**'
      - '.github/workflows/sovereign-ten.yml'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run readable ten-body native conformance
        run: node coding-estate/sovereign-ten/direct/native-selftest.mjs
