name: Test JM Owner Vault source and protected-use identities

on:
  push:
    branches: [main]
    paths:
      - 'estate-app.js'
      - 'estate-owner-vault.js'
      - 'functions/api/owner/vault.js'
      - 'tools/apply-owner-vault-v0.1.py'
      - 'tools/test-owner-vault-v0.1.mjs'
      - 'tools/owner-vault-lineage-recover.mjs'
      - 'docs/JM_OWNER_VAULT_v0_1.md'
      - 'registry/owner-vault-contract-v0.1.json'
      - 'sw.js'
      - '.github/workflows/test-owner-vault-v0-1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'estate-app.js'
      - 'estate-owner-vault.js'
      - 'functions/api/owner/vault.js'
      - 'tools/apply-owner-vault-v0.1.py'
      - 'tools/test-owner-vault-v0.1.mjs'
      - 'tools/owner-vault-lineage-recover.mjs'
      - 'docs/JM_OWNER_VAULT_v0_1.md'
      - 'registry/owner-vault-contract-v0.1.json'
      - 'sw.js'
      - '.github/workflows/test-owner-vault-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jm-owner-vault-source-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Prove vault identity, write/readback and non-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR or mainline source
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and private storage contract
        shell: bash
        run: |
          set -euo pipefail
          node --check estate-owner-vault.js
          node --check tools/owner-vault-lineage-recover.mjs
          node --input-type=module --check < functions/api/owner/vault.js
          node tools/test-owner-vault-v0.1.mjs
          python3 -m json.tool registry/owner-vault-contract-v0.1.json >/dev/null
          grep -Fq 'ONLY_SAME_SOURCE_INSTANCE_AND_BYTES' registry/owner-vault-contract-v0.1.json
          python3 -m py_compile tools/apply-owner-vault-v0.1.py
      - name: CP09 custody fail-closed hard gate (required)
        run: node tools/test-owner-vault-v0.1.mjs --require-custody-safe
      - name: Distinguish synthetic source pass from real-owner proof
        run: |
          echo "CP09_SYNTHETIC_CUSTODY=SOURCE_TEST_ONLY"
          echo "REAL_OWNER_PRIVATE_STORAGE=NOT_ACCESSED"
          echo "DEPLOYED_OWNER_EDIT_ROUNDTRIP=HOLD"

      - name: Verify exact one-body owner-room graft and service worker preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-owner-vault-v0.1.py
          git diff --exit-code -- estate-app.js sw.js
          node --check estate-app.js
          grep -Fq 'sourceInstanceId: body.id || null' estate-app.js
          grep -Fq 'SAME_SOURCE_INSTANCE_AND_BYTES_ONLY' functions/api/owner/vault.js
          grep -Fq 'PRIVATE_VERSIONED_SOURCE_READBACK_WITH_ANCESTOR_CUSTODY' functions/api/owner/vault.js
          grep -Fq 'Edit SOURCE' estate-owner-vault.js || grep -Fq 'EDIT SOURCE' estate-owner-vault.js
          grep -Fq 'REVISION_READBACK_MISMATCH' estate-app.js
          grep -Fq 'RESTORE TO DEVICE' estate-app.js
          grep -Fq 'Prove private save → reload → recovery' estate-app.js
          grep -Fq 'CP08_CLEANUP_NOT_AUTHORISED' estate-app.js
          grep -Fq 'temporary_body_exact_cleanup' estate-app.js
          grep -Fq 'No existing body was removed.' estate-app.js
          grep -Fq 'Previous mounted bodies remain unchanged.' estate-app.js
          ! grep -Fq "state.mounted=[];localStorage.removeItem('jm-estate-mounted')" estate-app.js
          grep -Fq "url.pathname.startsWith('/api/owner/')" sw.js
          python3 - <<'PY'
          from pathlib import Path
          text=Path('estate-app.js').read_text()
          source=Path('estate-owner-vault.js').read_text().strip()
          begin='// JM_OWNER_VAULT_V0_1_BEGIN'
          end='// JM_OWNER_VAULT_V0_1_END'
          assert text.count(begin)==text.count(end)==1
          assert text.split(begin,1)[1].split(end,1)[0].strip()==source
          assert 'jm-web-estate-v1.4.7-owner-vault-v0-1' not in Path('sw.js').read_text()
          print('PASS: single original owner bridge is exact, no stale cache reversion')
          PY
          git diff --check
