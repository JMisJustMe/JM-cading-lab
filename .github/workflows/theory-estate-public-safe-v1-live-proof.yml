name: Theory Estate Public-Safe v1 Live Proof

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/theory-estate-public-safe-v1-live-proof.yml"
      - "theory/publications/jm-theory-estate-public-safe-v1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Prove exact public carriers on both rails
        shell: bash
        env:
          GH_BASE: https://jmisjustme.github.io/JM-cading-lab
          CF_BASE: https://jmisjustme-estate.pages.dev
          HTML_PATH: /theory/publications/jm-theory-estate-public-safe-v1/index.html
          MD_PATH: /theory/publications/jm-theory-estate-public-safe-v1/JM_THEORY_ESTATE_PUBLIC_SAFE_EDITION_v1_0.md
          HTML_SHA256: 6af903409d97e853ae77519d672fac32fe9fb5384774a7f1c113c9c501a4b8b8
          MD_SHA256: 2f42acf027db5847e1cc4ebeebf2b23281381f3f07871da8358bffb88b3001ea
          HTML_BYTES: "10940"
          MD_BYTES: "10632"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request, urllib.error

          hosts = {
              "github_pages": os.environ["GH_BASE"].rstrip("/"),
              "cloudflare_estate": os.environ["CF_BASE"].rstrip("/"),
          }
          targets = {
              "html": {
                  "path": os.environ["HTML_PATH"],
                  "sha256": os.environ["HTML_SHA256"],
                  "bytes": int(os.environ["HTML_BYTES"]),
                  "markers": [
                      b"JM Theory Estate",
                      "51 / 51".encode(),
                      "MESH â  MERGE".encode("latin1").decode("latin1").encode("latin1") if False else "MESH ≠ MERGE".encode("utf-8"),
                      "LITERATURE CONTACT COMPLETE â  EMPIRICAL VALIDATION COMPLETE.".encode("latin1").decode("latin1").encode("latin1") if False else "LITERATURE CONTACT COMPLETE ≠ EMPIRICAL VALIDATION COMPLETE.".encode("utf-8"),
                      "BODY â  CARRIER. CARRIER â  NEW CREATION.".encode("latin1").decode("latin1").encode("latin1") if False else "BODY ≠ CARRIER. CARRIER ≠ NEW CREATION.".encode("utf-8"),
                  ],
              },
              "markdown": {
                  "path": os.environ["MD_PATH"],
                  "sha256": os.environ["MD_SHA256"],
                  "bytes": int(os.environ["MD_BYTES"]),
                  "markers": [
                      b"JM THEORY ESTATE",
                      "51 / 51 strict theory bodies".encode("utf-8"),
                      "7 / 7 first-order strengthening runs".encode("utf-8"),
                      "7 / 7 second-order bridge-to-bridge runs".encode("utf-8"),
                      "Empirical validation transferred:** **NO".encode("utf-8"),
                  ],
              },
          }

          results = {}
          for host_name, base in hosts.items():
              results[host_name] = {}
              for target_name, spec in targets.items():
                  last = None
                  for attempt in range(1, 25):
                      url = f"{base}{spec['path']}?theory-factory-live={os.environ.get('GITHUB_RUN_ID','manual')}-{attempt}"
                      req = urllib.request.Request(
                          url,
                          headers={
                              "Cache-Control": "no-cache",
                              "Pragma": "no-cache",
                              "User-Agent": "JM-Theory-Factory-Live-Proof/1.0",
                          },
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=25) as response:
                              raw = response.read()
                              code = response.status
                      except Exception as exc:
                          last = {"attempt": attempt, "error": repr(exc), "url": url}
                          time.sleep(3)
                          continue

                      digest = hashlib.sha256(raw).hexdigest()
                      marker_pass = all(marker in raw for marker in spec["markers"])
                      fallback = b"Returning to the JM Web Estate" in raw
                      exact = (
                          code == 200
                          and len(raw) == spec["bytes"]
                          and digest == spec["sha256"]
                          and marker_pass
                          and not fallback
                      )
                      last = {
                          "attempt": attempt,
                          "url": url,
                          "http": code,
                          "bytes": len(raw),
                          "sha256": digest,
                          "marker_pass": marker_pass,
                          "fallback_detected": fallback,
                          "exact": exact,
                      }
                      if exact:
                          break
                      time.sleep(3)

                  results[host_name][target_name] = last
                  if not last or not last.get("exact"):
                      raise SystemExit(f"LIVE HOLD {host_name} {target_name}: {last}")

          receipt = {
              "schema": "JM.TheoryEstate.PublicSafeLiveProof/1",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "state": "PASS_EXACT_PUBLIC_CONTACT_BOTH_RAILS",
              "operation_id": "JMOP-34a6830ec08dc884d9bcca49",
              "manufactured_html_sha256": os.environ["HTML_SHA256"],
              "manufactured_markdown_sha256": os.environ["MD_SHA256"],
              "results": results,
              "boundary": "Proves exact public delivery of the manufactured carrier on GitHub Pages and canonical Cloudflare Estate. Does not transfer empirical validation, peer review, independent replication, market uptake or owner-device interaction proof.",
          }
          with open("JM_THEORY_ESTATE_PUBLIC_SAFE_V1_LIVE_PROOF.json","w",encoding="utf-8") as f:
              json.dump(receipt,f,ensure_ascii=False,indent=2)
              f.write("\n")
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Upload live proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: JM_THEORY_ESTATE_PUBLIC_SAFE_V1_LIVE_PROOF
          path: JM_THEORY_ESTATE_PUBLIC_SAFE_V1_LIVE_PROOF.json
          if-no-files-found: error
