name: Validate Wix Authority Room Proposal

on:
  push:
    branches:
      - jm-proposal/wix-v2-authority-rebuild
    paths:
      - ".github/workflows/validate-wix-authority-room-proposal.yml"
      - "governance/wix-rebuilds/jm-estate-v2-authority-rebuild/JM_WIX_AUTHORITY_ROOM_v0_2_R2.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-wix-authority-room-proposal-v02-r2
  cancel-in-progress: false

jobs:
  validate:
    name: Parse, test and receipt current-Estate room v0.2 R2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@v6
        with:
          ref: jm-proposal/wix-v2-authority-rebuild
          fetch-depth: 0

      - name: Validate R2 HTML and interaction body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import hashlib, re

          class RoomParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rooms=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs); classes=set(attrs.get('class','').split())
                  if tag=='section' and 'room' in classes and attrs.get('data-room'):
                      self.rooms.append(attrs['data-room'])

          path=Path('governance/wix-rebuilds/jm-estate-v2-authority-rebuild/JM_WIX_AUTHORITY_ROOM_v0_2_R2.html')
          raw=path.read_bytes(); text=raw.decode('utf-8')
          parser=RoomParser(); parser.feed(text)
          expected={'open','map','command','use','play','read','verify','owner'}
          required={
            'whole_estate_count':'1,074/1,074',
            'residual_blockers':'973',
            'final_corpus_open':'OPEN BY LAW',
            'crocodile_freeze':'Crocodile Fallacy v1.0',
            'constitution_freeze':'From Source to Constitution v1.0',
            'picture_freeze':'The Picture Became Visible v1.0',
            'public_subset':'Public Estate Head v0.3.0',
            'theory_open_seam':'Theory v0.19/v0.20.1',
            'other_body_words_gap':'Other Body Words',
            'nol_exact_state':'FROZEN WORKING ANCHOR',
            'nol_owner_contact':'OWNER-PHONE VISUAL CONTACT',
            'nol_decisive_run':'31455871123',
            'routeos_v21a':'DynamicBodyRegistryRoute v2.1A',
            'routeos_v21a_matrix':'22/22 PASS',
            'routeos_v22a':'FaultClassRecoveryRoute',
            'routeos_v22a_run':'30719246085',
            'routeos_v22a_failure':'FAILED',
            'scoped_ding_law':'scoped/internal Ding Pass ≠ Estate-wide Ding',
            'no_ding_law':'No Ding, no claim',
            'noncollapse_head_law':'current head ≠ first function',
            'noncollapse_version_law':'latest version ≠ universal authority',
            'noncollapse_mount_law':'mounted ≠ crowned'
          }
          checks={
            'non_empty_file':len(raw)>0,
            'eight_room_sections':len(parser.rooms)==8,
            'eight_unique_room_ids':len(set(parser.rooms))==8,
            'exact_room_id_set':set(parser.rooms)==expected,
            'mobile_viewport':'width=device-width,initial-scale=1,viewport-fit=cover' in text,
            'mobile_bottom_rail':'grid-template-columns:repeat(5' in text,
            'command_search':'id="search"' in text,
            'scope_filter':'data-filter="freeze"' in text,
            'engineering_filter':'data-filter="engineering"' in text,
            'open_seam_filter':'data-filter="seam"' in text,
            'robots_noindex':'noindex,nofollow,noarchive' in text
          }
          checks.update({k:v in text for k,v in required.items()})
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S)
          checks['single_inline_script']=len(scripts)==1
          for name,passed in checks.items(): print(('PASS ' if passed else 'FAIL ')+name)
          failed=[k for k,v in checks.items() if not v]
          assert not failed,'failed checks: '+', '.join(failed)
          Path('/tmp/jm-wix-room-v02-r2.js').write_text(scripts[0],encoding='utf-8')
          print('PASS exact_size_bytes',len(raw))
          print('PASS exact_sha256',hashlib.sha256(raw).hexdigest())
          PY
          node --check /tmp/jm-wix-room-v02-r2.js
          echo 'PASS javascript_syntax'

      - name: Seal R2 reconciliation receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os
          root=Path('governance/wix-rebuilds/jm-estate-v2-authority-rebuild')
          body=root/'JM_WIX_AUTHORITY_ROOM_v0_2_R2.html'; raw=body.read_bytes()
          receipt={
            'schema':'JM.WixAuthorityRoomReconciliationReceipt/0.2-R2',
            'recorded_utc':datetime.now(timezone.utc).isoformat(),
            'authority':'Theodore Benjamin Scott / JM / JMISJUSTME',
            'source_event_commit':os.environ.get('GITHUB_SHA'),
            'current_room_file':str(body),
            'current_room_size_bytes':len(raw),
            'current_room_sha256':hashlib.sha256(raw).hexdigest(),
            'preserved_proof_lineage':{
              'v0_1':{'size_bytes':21941,'sha256':'aeae292bf1ae8f4164cd7b2b1f16938f8c144c8415855c0c918a873b09a5a062'},
              'v0_2_r1':{'size_bytes':27778,'sha256':'4507f8d5bb07ae9fac819711f6783750a0a7c3e157d7131f66c8a9ba2852d94c'}
            },
            'whole_estate_control':{'lineages':'1074/1074','houses':'14/14 PASS','residual_blockers':973,'final_corpus':'OPEN_BY_LAW'},
            'native_corrections':{
              'natural_operational_language':'FROZEN_WORKING_ANCHOR_OWNER_PHONE_VISUAL_CONTACT_OBSERVED_NOT_CROWNED_PARTIAL_DEVICE_PROOF',
              'routeos_jm_native_v2_1a':'LAST_FROZEN_ANCHORED_SCOPED_CONSTRUCTION_DING_PASS_22_OF_22',
              'routeos_jm_native_v2_2a':'HELD_SUCCESSOR_DECISIVE_RUN_30719246085_FAILED_ANCHOR_ABSENT'
            },
            'checks':{'html_parser_contact':'PASS','eight_room_navigation':'PASS','mobile_first_bottom_rail':'PASS','command_search':'PASS','authority_scope_filters':'PASS','javascript_syntax':'PASS','native_authority_markers':'PASS','open_seams_visible':'PASS'},
            'state':'CURRENT_ESTATE_AUTHORITY_ROOM_V0_2_R2_VALIDATED_AWAITING_ISOLATED_PREVIEW_REPROOF',
            'wix_static_layout_translated':False,'published':False,'production_deployed':False,'physical_device_accepted':False,'ding':False,
            'boundary':'R2 validation preserves v0.1 and first v0.2 receipts. It is not Wix editor translation, publication, physical acceptance or JM Ding.'
          }
          (root/'JM_WIX_AUTHORITY_ROOM_RECONCILIATION_RECEIPT_v0_2_R2.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Commit R2 receipt to proposal branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JM Wix Authority Room Proof Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add governance/wix-rebuilds/jm-estate-v2-authority-rebuild/JM_WIX_AUTHORITY_ROOM_RECONCILIATION_RECEIPT_v0_2_R2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Seal Wix current-Estate authority room v0.2 R2 receipt [skip ci]'
          git pull --rebase origin jm-proposal/wix-v2-authority-rebuild
          git push origin HEAD:jm-proposal/wix-v2-authority-rebuild
