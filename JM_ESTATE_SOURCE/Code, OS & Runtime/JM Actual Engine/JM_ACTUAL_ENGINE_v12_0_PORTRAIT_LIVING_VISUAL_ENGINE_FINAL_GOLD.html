shapePath(c,o,x=o.x,y=o.y,r=o.size){c.beginPath();if(o.shape==="square")roundRect(c,x-r,y-r,r*2,r*2,13);else if(o.shape==="diamond"){c.moveTo(x,y-r);c.lineTo(x+r,y);c.lineTo(x,y+r);c.lineTo(x-r,y);c.closePath()}else if(o.shape==="hex"){for(let i=0;i<6;i++){let a=Math.PI/3*i+Math.PI/6,xx=x+Math.cos(a)*r,yy=y+Math.sin(a)*r;if(i)c.lineTo(xx,yy);else c.moveTo(xx,yy)}c.closePath()}else c.arc(x,y,r,0,Math.PI*2)},
shape(c,o){const sel=this.obj().id===o.id;c.save();c.shadowColor=o.energy<o.minEnergy?rgba("#fbbf24",.85):rgba(o.color,.62);c.shadowBlur=sel?24:13;c.fillStyle=rgba(o.color,.18);this.shapePath(c,o,o.x+5,o.y+5,o.size);c.fill();c.strokeStyle=rgba(o.color,.45);c.stroke();this.shapePath(c,o);c.fillStyle=o.color;c.strokeStyle=sel?"#fff":"rgba(255,255,255,.72)";c.lineWidth=sel?4:2;c.fill();c.stroke();c.shadowBlur=0;c.font=`900 ${Math.max(10,o.size*.28)}px system-ui`;c.textAlign="center";c.lineWidth=3;c.strokeStyle="rgba(7,17,31,.88)";c.strokeText(o.name,o.x,o.y+4);c.fillStyle="#06111f";c.fillText(o.name,o.x,o.y+4);c.font="900 8.2px system-ui";let label=shortText(o.motion,8)+" · E"+Math.round(o.energy);c.strokeText(label,o.x,o.y-o.size-8);c.fillStyle=o.energy<o.minEnergy?"#fbbf24":"#f8fafc";c.fillText(label,o.x,o.y-o.size-8);if(sel){c.strokeStyle="rgba(251,191,36,.8)";c.lineWidth=3;c.beginPath();c.arc(o.x,o.y,o.size+7+Math.sin(this.frame*.08)*3,0,Math.PI*2);c.stroke()}c.restore()},
dockDraw(c){this.data.docks.forEach(d=>{let occ=this.objs().find(o=>o.docked===d.name);c.save();c.globalAlpha=this.data.view.trayOpen?.88:.58;c.strokeStyle=occ?"#fff":rgba(d.color,.56);c.fillStyle=rgba(d.color,occ?.18:.075);c.lineWidth=occ?3:1.3;roundRect(c,d.x,d.y,d.w,d.h,12);c.fill();c.stroke();c.fillStyle="#f8fafc";c.font=this.data.view.trayOpen?"1000 11px system-ui":"900 8px system-ui";c.textAlign="center";c.fillText(this.data.view.trayOpen?d.name:d.name[0],d.x+d.w/2,d.y+d.h/2+(this.data.view.trayOpen?0:3));if(this.data.view.trayOpen){c.font="800 7.2px system-ui";c.fillStyle="rgba(248,250,252,.7)";c.fillText(occ?occ.short+"→"+d.fn:d.fn,d.x+d.w/2,d.y+d.h-7)}c.restore()})},
charts(c,w,h){c.save();c.fillStyle="rgba(255,255,255,.045)";roundRect(c,10,48,w-20,h-104,18);c.fill();this.pie(c,w*.64,h*.54,Math.min(w,h)*.32,true);c.fillStyle="#f8fafc";c.font="900 16px system-ui";this.safeFill(c,"Living Graphics Charts",18,75,w-36);let os=this.objs(),maxS=Math.max(...os.map(o=>this.speed(o)),1),maxM=Math.max(...os.map(o=>o.mass),1),y=100,t=this.frame*.045;os.forEach((o,i)=>{let wob=1+Math.sin(t+i)*.05,rowH=39,right=w-12,barX=82,barW=Math.max(120,w-152);c.fillStyle="#cbd5e1";c.font="800 10px system-ui";this.safeFill(c,o.name,18,y+10,60);c.fillStyle=rgba(o.color,.95);c.fillRect(barX,y,clamp(this.speed(o)/maxS,0,1)*barW*wob,7);c.fillStyle=rgba(o.color,.48);c.fillRect(barX,y+10,clamp(o.mass/maxM,0,1)*barW,7);c.fillStyle=rgba("#fbbf24",.84);c.fillRect(barX,y+20,clamp(o.energy/100,0,1)*barW*(1+Math.sin(t*1.4+i)*.035),7);let bx=barX+((this.frame*1.6+i*37)%barW);c.fillStyle=o.color;c.beginPath();c.arc(bx,y+30,3.5,0,Math.PI*2);c.fill();c.fillStyle="#f8fafc";c.font="800 8px system-ui";c.textAlign="right";this.safeFill(c,"S"+this.speed(o).toFixed(1)+" M"+o.mass.toFixed(1)+" E"+Math.round(o.energy),right,y+18,94,"right");y+=rowH});c.fillStyle="#cbd5e1";c.font="800 9.5px system-ui";this.safeFill(c,"Translucent pie = live energy field",18,h-82,w-36);c.restore()},
pie(c,x,y,r,ghost=false){let os=this.objs(),sum=os.reduce((a,o)=>a+o.energy,0)||1,a=-Math.PI/2+this.frame*.007;c.save();c.globalAlpha=ghost?.22:.95;os.forEach(o=>{let s=o.energy/sum*Math.PI*2;c.beginPath();c.moveTo(x,y);c.arc(x,y,r,a,a+s);c.closePath();c.fillStyle=o.color;c.fill();a+=s});c.strokeStyle="rgba(255,255,255,.30)";c.lineWidth=2;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke();c.restore()},
compass(c,w,h){c.save();let cx=w/2,cy=h/2+18,maxR=Math.min(w,h)/2-44;c.translate(cx,cy);c.rotate(this.data.view.rotation);for(let r=54;r<maxR;r+=42){c.strokeStyle=r%84<10?"rgba(251,191,36,.55)":"rgba(251,191,36,.32)";c.lineWidth=2;c.beginPath();c.arc(0,0,r+Math.sin(this.frame*.025+r)*3,0,Math.PI*2);c.stroke()}c.strokeStyle="rgba(103,232,249,.55)";for(let i=0;i<8;i++){let a=Math.PI/4*i;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*maxR,Math.sin(a)*maxR);c.stroke()}c.fillStyle="#f8fafc";c.font="1000 16px system-ui";c.textAlign="center";c.fillText("N",0,-maxR-7);c.fillText("S",0,maxR+18);c.fillText("E",maxR+14,5);c.fillText("W",-maxR-14,5);this.objs().forEach((o,i)=>{let ang=this.frame*.014*(1.2/o.mass)+i*Math.PI*2/this.objs().length,rr=55+(o.energy/100)*(maxR-68);let ox=Math.cos(ang)*rr,oy=Math.sin(ang)*rr;c.fillStyle=o.color;c.shadowColor=rgba(o.color,.7);c.shadowBlur=12;c.beginPath();c.arc(ox,oy,8+o.mass*2+Math.sin(this.frame*.06+i)*1.6,0,Math.PI*2);c.fill();c.shadowBlur=0;c.fillStyle="#06111f";c.font="900 8px system-ui";c.fillText(o.short,ox,oy+3)});c.restore();c.fillStyle="#f8fafc";c.font="900 15px system-ui";this.safeFill(c,"Compass / Living Orientation",16,72,w-32);c.fillStyle="#cbd5e1";c.font="800 10px system-ui";this.safeFill(c,"Tap or Pulse to rotate/recharge.",16,91,w-32)},
sync(c,w,h){c.save();c.fillStyle="rgba(255,255,255,.045)";roundRect(c,10,48,w-20,h-104,18);c.fill();c.fillStyle="#f8fafc";c.font="900 16px system-ui";this.safeFill(c,"Code Hand Sync",18,75,w-36);const cards=[["Source", "JM keeps full meaning"],["Code", "bounded implementation"],["Law", "source meaning ≠ code meaning"],["Host", "Master Studio holds wider body"],["Move", "Visual Engine stays alive"],["Boundary", "not deployed / not full 3D"]];let y=100;cards.forEach((row,i)=>{let x=18+(i%2)*((w-48)/2+8),yy=y+Math.floor(i/2)*62,cw=(w-56)/2;c.fillStyle=i===2?"rgba(251,191,36,.14)":"rgba(255,255,255,.055)";c.strokeStyle=i===2?"rgba(251,191,36,.42)":"rgba(255,255,255,.12)";roundRect(c,x,yy,cw,50,14);c.fill();c.stroke();c.fillStyle="#fbbf24";c.font="900 10px system-ui";this.safeFill(c,row[0],x+10,yy+17,cw-20);c.fillStyle="#cbd5e1";c.font="800 9px system-ui";this.safeFill(c,row[1],x+10,yy+34,cw-20)});c.fillStyle="rgba(103,232,249,.18)";c.strokeStyle="rgba(103,232,249,.36)";roundRect(c,18,h-160,w-36,74,16);c.fill();c.stroke();c.fillStyle="#f8fafc";c.font="900 11px system-ui";this.safeFill(c,"Connector Law",30,h-136,w-60);c.fillStyle="#cbd5e1";c.font="800 9px system-ui";this.safeFill(c,"JM32-1DA governs · Master Studio hosts · Code Hand implements",30,h-116,w-60);this.safeFill(c,"TraceBox proves · BodyVault preserves · Public Door translates",30,h-100,w-60);c.restore()},
hud(){let o=this.obj();document.getElementById("hud").innerHTML=`<div class="name">${shortText(o.name+" · "+o.motion,18)}</div><div class="chip"><b>M</b>${o.mass.toFixed(1)} · <b>S</b>${this.speed(o).toFixed(1)} · <b>E</b>${Math.round(o.energy)}</div><div class="chip"><b>Bal</b>${this.balance()} · Safe</div>`},
metrics(){let os=this.objs();return {moving:os.filter(o=>this.speed(o)>1).length,low:os.filter(o=>o.energy<o.minEnergy+5).length,docked:os.filter(o=>o.docked).length,balance:this.balance(),screen:["Arena","Charts","Compass","Sync"][this.data.view.screen]}},
strip(){let m=this.metrics();document.getElementById("strip").innerHTML=`<span><b>${m.screen}</b></span><span><b>Move</b> ${m.moving}/6</span><span><b>Low</b> ${m.low}</span><span><b>Bal</b> ${m.balance}</span>`},
help(){let el=document.getElementById("help");if(!this.data.view.helpOpen){el.classList.remove("open");return}el.classList.add("open");el.innerHTML="Safe-edge pass: labels clamp, chart text stays inside, Code Hand sync carries boundary. Tap object/chart/compass/gate still works."},
point(e){let r=this.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}},
hit(x,y){let best=-1,dist=9999;this.objs().forEach((o,i)=>{let d=Math.hypot(x-o.x,y-o.y);if(d<o.size+28&&d<dist){best=i;dist=d}});return best},
gateHit(x,y){return (this.gates||[]).find(g=>x>=g.x&&x<=g.x+g.w&&y>=g.y&&y<=g.y+g.h)},
dockHit(x,y){return this.data.docks.find(d=>x>=d.x&&x<=d.x+d.w&&y>=d.y&&y<=d.y+d.h)},
down(e){e.preventDefault();let p=this.point(e);this.swipe={x:p.x,y:p.y};if(this.data.view.screen===0){let i=this.hit(p.x,p.y);if(i>=0){this.selected=i;let o=this.obj();o.docked=null;this.drag={id:o.id,dx:p.x-o.x,dy:p.y-o.y,moved:false}}}},
move(e){if(!this.drag)return;e.preventDefault();let p=this.point(e),o=this.objs().find(x=>x.id===this.drag.id);if(Math.hypot(p.x-this.swipe.x,p.y-this.swipe.y)>8)this.drag.moved=true;o.x=p.x-this.drag.dx;o.y=p.y-this.drag.dy;let b=this.bounds();o.x=clamp(o.x,b.left,b.right);o.y=clamp(o.y,44,this.canvas.clientHeight-42);o.homeX+=(o.x-o.homeX)*.012;o.homeY+=(o.y-o.homeY)*.012},
up(e){let p=this.point(e),screen=this.data.view.screen;if(this.drag){let o=this.objs().find(x=>x.id===this.drag.id),d=this.dockHit(o.x,o.y),g=this.gateHit(o.x,o.y);if(d){o.docked=d.name;this.rule(o,d);this.toast(o.name+" → "+d.name)}else if(g){this.gate(o,g);this.toast(o.name+" → "+g.n)}else if(!this.drag.moved){this.objectPulse(o);this.toast("Pulse "+o.name)}this.drag=null;this.save();return}if(this.swipe){let dx=p.x-this.swipe.x;if(Math.abs(dx)>70){this.page(screen+(dx<0?1:-1));this.swipe=null;return}}if(screen===1){let idx=Math.floor((p.y-96)/39);if(idx>=0&&idx<this.objs().length){this.selected=idx;this.objectPulse(this.obj());this.toast("Chart pulse "+this.obj().name)}}else if(screen===2){this.pulse()}else if(screen===3){this.toast("Source meaning ≠ code meaning")}else {let g=this.gateHit(p.x,p.y);if(g)this.gate(this.obj(),g)}this.swipe=null;this.save()},
objectPulse(o){o.energy=clamp(o.energy+24,0,100);o.pulse=1;o.vx+=(Math.random()*2-1)*(38/o.mass);o.vy+=(Math.random()*2-1)*(38/o.mass)-2;this.log("PULSE","Revive/maximise "+o.name)},
gate(o,g){let b=this.bounds();if(g.pull==="up"){o.vy-=40/o.mass;o.homeY=b.top+56}if(g.pull==="down"){o.vy+=22/o.mass;o.homeY=b.bottom-70}if(g.pull==="left"){o.vx-=40/o.mass;o.homeX=b.left+55}if(g.pull==="right"){o.vx+=40/o.mass;o.homeX=b.right-55}o.energy=clamp(o.energy+18,0,100);o.pulse=.85;this.log("GATE","Gate "+g.n+" routed "+o.name)},
rule(o,d){if(d.fn==="PULL"){o.vx*=1.35;o.vy*=1.35;o.energy=clamp(o.energy+15,0,100)}if(d.fn==="BUILD"){o.baseSize=clamp(o.baseSize+3,24,48);o.mass=clamp(o.mass+.25,.7,4)}if(d.fn==="TRACE")this.data.state.trace++;if(d.fn==="LIGHT"){o.energy=clamp(o.energy+10,0,100);o.pulse=1}if(d.fn==="MARK")o.pulse=1;this.log("DOCK",d.fn+" on "+o.name)},
toggle(){this.playing=!this.playing;this.toast(this.playing?"Playing":"Paused");this.save()},
toggleTray(){this.data.view.trayOpen=!this.data.view.trayOpen;this.layout();this.keepIn();this.save()},
toggleHelp(){this.data.view.helpOpen=!this.data.view.helpOpen;this.save()},
next(){this.selected=(this.selected+1)%this.objs().length;this.toast(this.obj().name);this.save()},
prev(){this.selected=(this.selected-1+this.objs().length)%this.objs().length;this.toast(this.obj().name);this.save()},
pulse(){if(this.data.view.screen===2){this.data.view.rotation+=Math.PI/4;this.objectPulse(this.obj());this.toast("Compass pulse")}else this.objectPulse(this.obj());this.save()},
resetGold(){this.data=structuredClone(START);this.selected=1;this.playing=true;this.frame=0;this.traces=[];this.layout();this.keepIn();this.page(0);this.toast("Reset");this.save()},
log(k,b){this.traces.unshift({at:new Date().toISOString(),kind:k,body:b,selected:this.obj()?.name,screen:this.data.view.screen,balance:this.balance?.()});if(this.traces.length>80)this.traces.pop()},
toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1050)},
exportReceipt(){let o=this.obj(),m=this.metrics();let txt=["JM Actual Engine v12.0 — Portrait Living Visual Engine Final Gold","Created: "+MANIFEST.created,"Exported: "+new Date().toISOString(),"Status: "+MANIFEST.status,"Selected: "+o.name,"Speed "+this.speed(o).toFixed(2)+" · Energy "+Math.round(o.energy)+" · Balance "+m.balance,"Screen: "+m.screen,"Code Hand law: "+MANIFEST.sync_source.code_hand_law,"Connector law: "+MANIFEST.sync_source.connector_law,"Boundary: "+MANIFEST.claim_boundary,"","Gold laws:",...MANIFEST.gold_laws.map(x=>"- "+x),"","Latest trace:",JSON.stringify(this.traces.slice(0,8),null,2)].join("\n");download("JM_ACTUAL_ENGINE_v12_0_FINAL_GOLD_RECEIPT.txt",txt);this.log("EXPORT","Receipt exported")}
};
