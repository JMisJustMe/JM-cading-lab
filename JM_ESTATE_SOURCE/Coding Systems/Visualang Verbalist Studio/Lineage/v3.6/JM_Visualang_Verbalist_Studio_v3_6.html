<title>JM Visualang — Verbalist Studio v3.6</title>

<style>

:root{
  --bg:#05070a;--bg2:#080c12;--panel:#0a1018;--panel2:#0e1621;--panel3:#121d2b;
  --line:#293546;--line2:#3a4960;--text:#f6f8fb;--muted:#93a1b5;--dim:#647085;
  --green:#76e15b;--blue:#48bdff;--purple:#b66cff;--orange:#ff8a3c;--gold:#f2ca4d;
  --red:#ff6079;--cyan:#65e1d1;--paper:#f7f3e8;--ink:#111318;
  --r:16px;--safeT:max(0px,env(safe-area-inset-top));--safeB:max(8px,env(safe-area-inset-bottom));
  --mode:var(--green);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}.hidden{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{width:100%;max-width:100%;min-width:0;height:100dvh;display:grid;overflow:hidden;grid-template-rows:auto 1fr;background:radial-gradient(circle at 8% -10%,rgba(72,189,255,.10),transparent 32%),radial-gradient(circle at 104% 5%,rgba(182,108,255,.09),transparent 30%),var(--bg)}
.topbar{width:100%;max-width:100%;min-width:0;height:64px;padding:calc(8px + var(--safeT)) 14px 8px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(5,7,10,.96);backdrop-filter:blur(12px);z-index:50}
.brand{min-width:0;flex:1}.brand-main{font-weight:950;letter-spacing:.035em;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-main b{color:var(--green)}.brand-sub{font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:4px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn,.square-btn{border:1px solid var(--line);background:#080d14;border-radius:12px;display:grid;place-items:center}.icon-btn{width:42px;height:42px}.square-btn{width:38px;height:38px}.save-pill{height:38px;padding:0 12px;border:1px solid var(--green);border-radius:11px;background:rgba(118,225,91,.06);color:var(--green);font-size:10px;font-weight:950;letter-spacing:.06em}.version{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font:900 10px/1 ui-monospace,monospace;color:var(--muted)}
.route{width:100%;max-width:100%;min-width:0;min-height:0;overflow:hidden}.screen{width:100%;height:100%;min-height:0}.screen-scroll{overflow:auto;overscroll-behavior:contain;padding-bottom:calc(24px + var(--safeB));scrollbar-width:thin}
/* HOME / MOCKUP BODY */
.home{padding:12px;display:grid;grid-template-columns:minmax(0,1.42fr) minmax(320px,.96fr);gap:10px;max-width:1440px;margin:0 auto}
.home-left,.home-right{display:grid;gap:10px;align-content:start}.hero-card,.section-card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(14,22,33,.96),rgba(7,11,17,.98));border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.23)}
.hero-card{padding:16px 17px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.hero-title{margin:0;font-size:clamp(25px,4vw,52px);line-height:.96;letter-spacing:-.04em}.hero-title span{color:var(--green)}.hero-copy{color:var(--muted);margin:10px 0 0;max-width:760px;line-height:1.5}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.primary,.secondary,.danger{height:44px;border-radius:11px;padding:0 15px;font-weight:950;letter-spacing:.03em}.primary{border:1px solid var(--green);background:var(--green);color:#071006}.secondary{border:1px solid var(--line2);background:#0b111a}.danger{border:1px solid var(--red);background:rgba(255,96,121,.06);color:var(--red)}
.ding-card{min-width:170px;border:1px solid var(--green);border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 0 26px rgba(118,225,91,.08)}.ding-card strong{display:block;padding:14px 12px;color:var(--green);font-size:22px}.ding-card span{display:block;border-top:1px solid var(--green);padding:9px;color:var(--purple);font-weight:950;letter-spacing:.08em}
.section-card{padding:13px}.section-title{display:flex;gap:8px;align-items:center;color:var(--green);font-size:13px;font-weight:950;letter-spacing:.035em;margin-bottom:10px}.section-title .num{font:950 11px/1 ui-monospace,monospace}.muted{color:var(--muted)}
.checks{display:grid;gap:6px;font-size:12px}.check{display:flex;align-items:center;gap:8px}.check i{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#061005;font:950 11px/1 system-ui}
.core-loop{display:grid;grid-template-columns:repeat(9,auto);gap:8px;align-items:center;justify-content:start;overflow-x:auto;padding:3px 0 2px}.loop-step{width:78px;text-align:center}.loop-icon{height:58px;border:1px solid currentColor;border-radius:12px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,currentColor,transparent 94%)}.loop-step b{display:block;font-size:11px;margin-top:7px}.loop-step small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.arrow{color:var(--muted);font-size:20px}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.demo-card{min-width:0;border:1px solid var(--line);background:#080d14;border-radius:13px;overflow:hidden;text-align:left;padding:0}.demo-preview{height:160px;position:relative;background:var(--paper);overflow:hidden}.demo-meta{padding:10px}.demo-meta strong{display:block}.demo-meta small{display:block;color:var(--muted);margin-top:4px;line-height:1.3}.demo-card:hover,.demo-card:focus-visible{border-color:var(--blue);transform:translateY(-1px)}
.mini-word{position:absolute;transform:translate(-50%,-50%);color:#101319;white-space:nowrap;line-height:1;font-family:ui-monospace,monospace}.mini-action{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;color:#12151a;font:800 10px/1 ui-monospace,monospace}.mini-action span{white-space:pre;text-align:center}.dimension-stack{display:grid;gap:8px}.dimension-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}.dimension-row label{font-weight:800;font-size:12px}.dimension-field{min-height:35px;border:1px solid var(--line2);background:#070a0e;border-radius:7px;padding:8px 10px;font:500 12px/1.35 ui-monospace,monospace;position:relative;overflow:hidden}.dimension-field.traverse::after{content:"START  ───→  END";display:block;color:var(--muted);margin-top:5px;font-size:9px}.dimension-field.next{border-color:rgba(118,225,91,.55)}.dimension-field.next small{display:block;color:var(--green);margin-top:5px}
.carry-list{display:grid;gap:8px}.carry-row{display:grid;grid-template-columns:32px 1fr;gap:9px}.carry-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:950}.carry-row strong{display:block;font-size:12px}.carry-row small{display:block;color:var(--muted);font-size:10px;margin-top:2px;line-height:1.35}.carry-row:nth-child(1) .carry-icon{background:var(--blue)}.carry-row:nth-child(2) .carry-icon{background:#5eb846}.carry-row:nth-child(3) .carry-icon{background:#d6aa31}.carry-row:nth-child(4) .carry-icon{background:#9760d8}
.schema-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.schema-box{border:1px solid var(--line);border-radius:10px;padding:9px;background:#080d14}.schema-box strong{font-size:11px}.schema-box ul{margin:7px 0 0;padding-left:14px;color:var(--muted);font:500 9px/1.55 ui-monospace,monospace}
.interactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.interaction{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center}.interaction b{display:block;font-size:11px}.interaction small{color:var(--muted);font-size:9px}.gesture{font-size:28px;text-align:center}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:7px}.road-row{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);padding:7px 0}.road-row .road-num{width:28px;height:28px;border:1px solid var(--green);border-radius:8px;display:grid;place-items:center;color:var(--green);font-weight:950}.road-row b{font-size:10px}.road-row small{color:var(--muted);font-size:9px;margin-left:5px}
.bottom-crown{grid-column:1/-1;text-align:center;color:var(--orange);font-weight:950;letter-spacing:.08em;padding:5px}.bottom-crown span:nth-child(2){color:var(--purple)}.bottom-crown span:nth-child(3){color:var(--green)}
/* STUDIO */
.studio{width:100%;max-width:100%;height:100%;min-height:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.modes{width:100%;min-width:0;max-width:100%;display:flex;gap:7px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);background:#070a0f;overflow-x:auto;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}.mode{height:48px;flex:1 0 86px;min-width:82px;border:1px solid var(--line);border-radius:12px;background:#0a1018;font-weight:950;letter-spacing:.03em;position:relative}.mode::before{content:"";width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:2px;background:var(--accent)}.mode[data-mode=write]{--accent:var(--green)}.mode[data-mode=see]{--accent:var(--blue)}.mode[data-mode=flip]{--accent:var(--purple)}.mode[data-mode=play]{--accent:var(--orange)}.mode[data-mode=sound]{--accent:var(--cyan)}.mode[data-mode=trace]{--accent:var(--gold)}.mode.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent),transparent 94%);box-shadow:0 0 18px color-mix(in srgb,var(--accent),transparent 80%)}
.studio-body{width:100%;max-width:100%;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:9px;padding:9px;overflow:hidden}.workspace,.inspector{min-width:0;min-height:0;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,#0c121b,#070b11)}.workspace{width:100%;max-width:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;overflow:hidden}.toolbar{display:flex;align-items:center;gap:7px;padding:8px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.07);scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}.toolbar>*{flex:0 0 auto}.input{height:42px;border:1px solid var(--line);border-radius:10px;background:#070b11;padding:0 12px;min-width:180px}.tool{height:42px;border:1px solid var(--line);border-radius:10px;background:#0b111a;padding:0 12px;font-size:11px;font-weight:950}.tool.green{background:var(--green);border-color:var(--green);color:#061005;font-size:14px}.tool.blue{border-color:var(--blue);color:var(--blue)}.tool.purple{border-color:var(--purple);color:var(--purple)}.tool.orange{border-color:var(--orange);color:var(--orange)}.tool.gold{border-color:var(--gold);color:var(--gold)}.tool.red{border-color:var(--red);color:var(--red)}.control{height:42px;border:1px solid var(--line);border-radius:10px;background:#0b111a;padding:0 10px;display:flex;align-items:center;gap:8px}.control span{color:var(--muted);font-size:9px;font-weight:950}.control input[type=range]{width:100px}.control input[type=color]{width:28px;height:28px;background:none;border:0;padding:0}
.stage-wrap{width:100%;max-width:100%;min-width:0;min-height:0;display:grid;grid-template-rows:32px 1fr;overflow:hidden}.stage-status{width:100%;max-width:100%;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--muted);font:800 9px/1 ui-monospace,monospace;letter-spacing:.04em}.stage-status span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage-status span:first-child{flex:1}.stage-status .pos{color:var(--green);flex:0 0 auto;margin:0 8px}.stage-status span:last-child{flex:0 0 auto}.viewport{width:100%;max-width:100%;min-width:0;min-height:0;position:relative;display:grid;place-items:center;perspective:900px;padding:8px;overflow:hidden;background:linear-gradient(90deg,transparent 49.8%,rgba(255,255,255,.018) 50%,transparent 50.2%),linear-gradient(#0b1119,#070b10)}
.artboard{position:relative;overflow:hidden;touch-action:none;user-select:none;background:var(--paper);color:var(--ink);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 50px rgba(0,0,0,.55);transform-style:preserve-3d;transition:transform .3s ease}.artboard.grid{background-image:linear-gradient(rgba(28,55,75,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(28,55,75,.08) 1px,transparent 1px);background-size:20px 20px}.node{position:absolute;left:0;top:0;transform:translate(-50%,-50%);transform-origin:center;white-space:pre;line-height:.92;user-select:none;touch-action:none;cursor:grab;padding:1px 2px;border-radius:3px;will-change:left,top,transform;transition:opacity .18s,color .18s}.node.selected{outline:2px dashed var(--blue);outline-offset:4px;background:rgba(72,189,255,.11);box-shadow:0 0 0 5px rgba(72,189,255,.05)}.node.locked{cursor:not-allowed}.node.reference{opacity:.16!important;filter:grayscale(.5);pointer-events:none}.group-box{position:absolute;border:2px solid var(--green);box-shadow:0 0 0 4px rgba(118,225,91,.08);border-radius:8px;pointer-events:none}.node.role-overlay::after{content:attr(data-role);position:absolute;left:50%;top:-15px;transform:translateX(-50%);font:800 7px/1 ui-monospace,monospace;color:var(--blue);background:#05070a;padding:2px 3px;border-radius:3px}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#7e8795;padding:28px;font-size:12px}.empty strong{display:block;color:#313d4a;font-size:20px;margin-bottom:5px}
.artboard.holo-mode{background:radial-gradient(circle at 50% 42%,rgba(25,157,190,.18),transparent 34%),linear-gradient(rgba(48,211,235,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(48,211,235,.08) 1px,transparent 1px),#02080d!important;background-size:auto,22px 22px,22px 22px;border-color:rgba(101,225,209,.7);box-shadow:0 0 40px rgba(72,189,255,.24),inset 0 0 50px rgba(24,150,184,.12)}.artboard.holo-mode .node{color:var(--cyan)!important;text-shadow:0 0 4px rgba(101,225,209,.9),0 0 12px rgba(72,189,255,.55);filter:saturate(1.3)}.holo-floor{position:absolute;left:50%;bottom:3%;width:64%;height:8%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(72,189,255,.18),transparent 68%);filter:blur(5px);pointer-events:none}.trace-view{position:absolute;inset:8px;border:1px solid var(--line);border-radius:12px;background:#070b11;overflow:auto;padding:12px}.trace-list{margin:0;padding:0;list-style:none;display:grid;gap:7px}.trace-list li{border-left:3px solid var(--gold);padding:8px 10px;background:#0b1119;border-radius:0 8px 8px 0;font:600 10px/1.45 ui-monospace,monospace}.trace-list time{color:var(--muted);display:block;font-size:8px;margin-bottom:2px}
.frame-rail{border-top:1px solid rgba(255,255,255,.07);padding:7px 8px calc(8px + var(--safeB));background:#070a0f}.frames{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}.frames::-webkit-scrollbar{display:none}.frame{flex:0 0 120px;height:88px;border:1px solid var(--line);border-radius:11px;background:#0b1119;padding:5px;text-align:left}.frame.active{border-color:var(--purple);box-shadow:0 0 16px rgba(182,108,255,.20)}.thumb{height:56px;background:var(--paper);border-radius:6px;overflow:hidden;position:relative}.frame footer{display:flex;justify-content:space-between;margin-top:5px;color:var(--muted);font:900 8px/1 ui-monospace,monospace}.frame-actions{display:grid;grid-template-columns:1.2fr 1fr 1fr 40px 40px;gap:7px}.frame-actions button{height:38px;border:1px solid var(--line);border-radius:9px;background:#0b1119;font-size:10px;font-weight:950}.frame-actions .add{color:var(--green);border-color:var(--green)}.frame-actions .del{color:var(--red);border-color:var(--red)}
.inspector{overflow:auto;padding:12px;scrollbar-width:thin}.inspector-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}.inspector-head strong{font-size:12px;letter-spacing:.05em}.inspector-head span{color:var(--green);font:950 10px/1 ui-monospace,monospace;margin-right:8px}.inspector-section{display:grid;gap:8px}.inspector-section label{display:grid;gap:5px}.inspector-section label>span{color:var(--muted);font-size:9px;font-weight:950}.inspector-section input,.inspector-section select,.inspector-section textarea{border:1px solid var(--line);border-radius:8px;background:#070b11;padding:0 9px}.inspector-section input,.inspector-section select{height:38px}.inspector-section textarea{min-height:70px;padding-top:8px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.nudge button{height:35px;border:1px solid var(--line);border-radius:8px;background:#0a1018}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.metric{border:1px solid var(--line);border-radius:9px;padding:9px;background:#080d14}.metric span{display:block;color:var(--muted);font-size:8px;font-weight:950}.metric b{display:block;margin-top:4px}.room-list{display:grid;gap:6px}.room{border:1px solid var(--line);border-radius:9px;padding:9px;background:#080d14;display:flex;justify-content:space-between;gap:10px}.room b{font-size:10px}.room small{color:var(--muted);font-size:8px}.room.active{border-color:var(--green)}
/* MODALS / DRAWER */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:16px}.modal{width:min(720px,100%);max-height:min(820px,90dvh);overflow:auto;border:1px solid var(--line2);border-radius:18px;background:linear-gradient(180deg,#101824,#080c12);box-shadow:0 28px 80px rgba(0,0,0,.68)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:15px;border-bottom:1px solid var(--line)}.modal-head small{color:var(--green);font-weight:950;letter-spacing:.08em}.modal-head h2{margin:4px 0 0;font-size:20px}.modal-body{padding:15px}.carry-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.carry-option{border:1px solid var(--line);border-radius:12px;padding:13px;background:#0a1018;text-align:left}.carry-option strong{display:block}.carry-option small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.carry-option:hover{border-color:var(--green)}
.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shape-choice{height:88px;border:1px solid var(--line);border-radius:12px;background:#080d14;font-weight:950}.shape-choice.active{border-color:var(--blue);color:var(--blue);background:rgba(72,189,255,.05)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.form-grid label{display:grid;gap:5px}.form-grid label span{color:var(--muted);font-size:9px;font-weight:950}.form-grid input,.form-grid select{height:40px;border:1px solid var(--line);border-radius:9px;background:#070b11;padding:0 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);z-index:120;background:#080d14;border-right:1px solid var(--line2);padding:calc(16px + var(--safeT)) 12px 16px;transform:translateX(-104%);transition:transform .22s ease;box-shadow:20px 0 60px rgba(0,0,0,.5)}.drawer.open{transform:none}.drawer-brand{display:flex;gap:10px;align-items:center;padding:4px 4px 18px}.drawer-brand b{width:44px;height:44px;border:1px solid var(--green);border-radius:12px;display:grid;place-items:center;color:var(--green)}.drawer-brand strong{font-size:13px}.drawer button,.drawer label{width:100%;height:44px;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;display:flex;align-items:center;gap:11px;padding:0 9px;text-align:left;font-weight:850;font-size:12px}.drawer label input{display:none}.drawer-foot{position:absolute;left:15px;right:15px;bottom:calc(12px + var(--safeB));color:var(--muted);font:800 9px/1.4 ui-monospace,monospace}.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:110}
.toast{position:fixed;left:50%;bottom:calc(15px + var(--safeB));transform:translate(-50%,20px);z-index:200;background:#111a25;border:1px solid var(--line2);border-radius:11px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;font-size:11px;font-weight:850;box-shadow:0 16px 45px rgba(0,0,0,.5)}.toast.show{opacity:1;transform:translate(-50%,0)}

function animateFaceCrown(base,pose){let face=base.map(n=>({...n,state:pose}));const eye=roleCentre(face,'SEE'),mouth=roleCentre(face,'SPEAK');if(pose==='GAZE')face.forEach(n=>{if(n.role==='SEE')n.x+=1.05;if(n.role==='THINK')n.rotation+=2});if(pose==='BLINK')face.forEach(n=>{if(n.role==='SEE'){n.y=eye.y+(n.y-eye.y)*.10;n.size*=.72;n.rotation*=.35}});if(pose==='MOUTH OPEN')face.forEach(n=>{if(n.role==='SPEAK'){n.y=mouth.y+(n.y-mouth.y)*1.85;n.x=mouth.x+(n.x-mouth.x)*.94;n.size*=1.02}});if(pose==='MOUTH WIDE')face.forEach(n=>{if(n.role==='SPEAK'){n.y=mouth.y+(n.y-mouth.y)*2.35;n.x=mouth.x+(n.x-mouth.x)*1.06;n.size*=1.08}if(n.role==='BREATHE')n.y-=.35});if(pose==='MOUTH CLOSE')face.forEach(n=>{if(n.role==='SPEAK'){n.y=mouth.y+(n.y-mouth.y)*.34;n.x=mouth.x+(n.x-mouth.x)*1.08}});if(pose==='HEAD LIFT')face.forEach(n=>{n.y-=1.25;n.z+=4;if(n.role==='SEE')n.y-=.35});return face}
function animateCatCrown(base,pose,dx,phase){

function drawCover(ctx,img,w,h){const ir=img.width/img.height,tr=w/h;let sx=0,sy=0,sw=img.width,sh=img.height;if(ir>tr){sw=img.height*tr;sx=(img.width-sw)/2}else{sh=img.width/tr;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h)}
function imageToWordNodes(img,word,opts={}){const w=360,h=480,cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d',{willReadFrequently:true});c.fillStyle='#f7f3e8';c.fillRect(0,0,w,h);drawCover(c,img,w,h);const data=c.getImageData(0,0,w,h).data,density=clamp(opts.density||11,8,26),nodes=[],gid=uid('g'),root=(word||'IMAGE').trim().toUpperCase()||'IMAGE';let seed=0;for(let y=density/2;y<h;y+=density){for(let x=density/2;x<w;x+=density){const i=(Math.floor(y)*w+Math.floor(x))*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];if(a<20)continue;const lum=(.2126*r+.7152*g+.0722*b)/255;const dx=Math.min(w-1,Math.floor(x+density/2)),dy=Math.min(h-1,Math.floor(y+density/2)),j=(dy*w+dx)*4;const local=Math.abs(r-data[j])+Math.abs(g-data[j+1])+Math.abs(b-data[j+2]);const threshold=opts.detail??22;if(opts.coverage==='detail'&&local<threshold&&seed%3)continue;seed++;const rc=clamp(Math.round((r-128)*1.22+128),0,255),gc=clamp(Math.round((g-128)*1.22+128),0,255),bc=clamp(Math.round((b-128)*1.22+128),0,255);let colour=`rgb(${rc},${gc},${bc})`;if(opts.palette==='mono'){const v=Math.round(lum*210+18);colour=`rgb(${v},${v},${v})`}if(opts.palette==='holo'){const q=Math.round(75+lum*160);colour=`rgb(${Math.round(q*.35)},${Math.round(q*.8)},${q})`}const size=clamp((density*.40)/(1+Math.max(0,root.length-3)*.075),3.0,6.8);nodes.push(node(root,x/w*100,y/h*100,size,colour,{role:'IMAGE',state:'source-sampled',z:(.5-lum)*64+(seed%5-2)*1.5,weight:opts.weight||820,rotation:(seed%9-4)*.25,opacity:.90+(seed%5)*.022,groupId:gid}))}}return nodes}
function showImageWordLab(){let img=null,fileName='';modalRoot.innerHTML=`<div class="backdrop"><section class="modal formula-modal"><div class="modal-head"><div><small>SEARCH BEFORE SCRATCH · IMAGE → WORDBODY</small><h2>Turn an existing picture into repeated readable words</h2></div><button class="square-btn" data-close>×</button></div><div class="modal-body"><div class="image-word-grid"><label class="image-drop"><input id="imageFile" type="file" accept="image/*"><span>CHOOSE IMAGE</span><small>The picture becomes sampled colour, position and depth — the repeated word remains the visible material.</small></label><canvas id="imagePreview" width="360" height="480"></canvas></div><div class="form-grid"><label><span>REPEATED WORD</span><input id="imageWord" value="IMAGE"></label><label><span>FORMENUM / DENSITY</span><input id="imageDensity" type="range" min="8" max="24" value="11"></label><label><span>VISUALANG COLOUR</span><select id="imagePalette"><option value="source">Source colours</option><option value="holo">Holographic</option><option value="mono">Monochrome</option></select></label><label><span>SAMPLING</span><select id="imageCoverage"><option value="full">Full field</option><option value="detail">Detail / contrast points</option></select></label></div><div class="formula-preview" id="imageFormula"><small>LIVE FORMEULA</small><b>IMAGE + WORD × SAMPLE POSITION + SOURCE COLOUR + Z(LIGHT) = WORDBODY</b></div><div class="modal-actions"><button class="secondary" data-close>CANCEL</button><button class="primary" id="formImage" disabled>FORM IMAGE BODY</button></div></div></section></div>`;$$('[data-close]').forEach(b=>b.onclick=closeModal);const preview=$('#imagePreview'),pc=preview.getContext('2d');pc.fillStyle='#0a1018';pc.fillRect(0,0,360,480);pc.fillStyle='#93a1b5';pc.font='700 16px system-ui';pc.textAlign='center';pc.fillText('CHOOSE AN IMAGE',180,240);$('#imageFile').onchange=e=>{const file=e.target.files?.[0];if(!file)return;fileName=file.name;const reader=ne
