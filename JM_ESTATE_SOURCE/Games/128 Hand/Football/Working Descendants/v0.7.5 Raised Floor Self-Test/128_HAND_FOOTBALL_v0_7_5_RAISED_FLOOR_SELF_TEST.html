<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d",{alpha:true}),pitch=$("pitch"),score=$("score"),state=$("stateMain"),route=$("routeRead"),burst=$("burst"),buttons={PASS:$("passBtn"),SHOOT:$("shootBtn"),TACKLE:$("tackleBtn"),DEFEND:$("defendBtn")},reset=$("reset");
let W=1,H=1,dpr=1,last=performance.now(),pScore=0,oScore=0,field=12,gTop=0,gBot=0,gL=0,gR=0,gDepth=40,drag=false,pid=null,audio=null,paused=false,match=false,serve=0,shake=0,flashL=0,flashR=0,particles=[],grass=[],thumb=false,cx=0,cy=0,action="MOVE",actT=0,carry=0,poss="free";
const hand={x:0,y:0,r:34,vx:0,vy:0},ally={x:0,y:0,r:28,vx:0,vy:0},keeper={x:0,y:0,r:30,vx:0,vy:0},def={x:0,y:0,r:27,vx:0,vy:0},ball={x:0,y:0,r:15,vx:0,vy:0,spin:0,spinV:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mag=(x,y)=>Math.hypot(x,y),rand=(a,b)=>a+Math.random()*(b-a);
function setState(t){state.textContent=t}function setRoute(t,hot=false){route.textContent=t;route.classList.toggle("hot",hot)}function setScore(){score.textContent=`${pScore} – ${oScore}`}
function msg(t){burst.textContent=t;burst.classList.remove("show");void burst.offsetWidth;burst.classList.add("show")}
function clearBtns(){Object.values(buttons).forEach(b=>b.classList.remove("active"))}
function ensureAudio(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}if(audio&&audio.state==="suspended")audio.resume()}
function sound(type="kick",pow=.5){if(!audio)return;const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain(),f=audio.createBiquadFilter();osc.type=type==="goal"?"sine":type==="trap"?"square":"triangle";f.type="lowpass";f.frequency.value=type==="goal"?1500:type==="trap"?560:900;osc.frequency.setValueAtTime(type==="goal"?300:type==="trap"?84:130+pow*80,now);osc.frequency.exponentialRampToValueAtTime(type==="goal"?540:58,now+(type==="goal"?.2:.09));gain.gain.setValueAtTime(type==="goal"?.12:.035+pow*.045,now);gain.gain.exponentialRampToValueAtTime(.001,now+(type==="goal"?.22:.11));osc.connect(f).connect(gain).connect(audio.destination);osc.start(now);osc.stop(now+(type==="goal"?.23:.12))}
function resize(){const r=pitch.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);const base=Math.min(W,H);field=clamp(base*.035,13,25);gDepth=clamp(W*.052,30,56);gTop=H*.27;gBot=H*.73;gL=field+gDepth;gR=W-field-gDepth;hand.r=clamp(base*.07,27,48);ally.r=clamp(base*.055,22,37);keeper.r=clamp(base*.06,24,41);def.r=clamp(base*.054,22,37);ball.r=clamp(base*.03,13,20);if(!hand.x)resetMatch();else clampAll();makeGrass()}
function clampAll(){hand.x=clamp(hand.x,gL+hand.r,gR-hand.r);hand.y=clamp(hand.y,field+hand.r,H-field-hand.r);ally.x=clamp(ally.x,gL+ally.r,gR-ally.r);ally.y=clamp(ally.y,field+ally.r,H-field-ally.r);keeper.x=clamp(keeper.x,W*.42,gR-gDepth-keeper.r-10);keeper.y=clamp(keeper.y,field+keeper.r,H-field-keeper.r);def.x=clamp(def.x,W*.38,gR-gDepth-def.r-10);def.y=clamp(def.y,field+def.r,H-field-def.r);ball.x=clamp(ball.x,field+ball.r,W-field-ball.r);ball.y=clamp(ball.y,field+ball.r,H-field-ball.r)}
function makeGrass(){grass=[];for(let i=0,n=Math.floor(clamp(W*H/9500,18,80));i<n;i++)grass.push({x:rand(0,W),y:rand(0,H),l:rand(7,20),a:rand(-.35,.35),o:rand(.025,.07)})}
function resetBall(dir=Math.random()<.5?1:-1){Object.assign(ball,{x:W*.5,y:H*(.38+Math.random()*.24),vx:clamp(W*.08,50,125)*dir,vy:rand(-30,30),spinV:rand(-.35,.35)});poss="free";paused=false;serve=0}
function resetMatch(){pScore=oScore=0;setScore();Object.assign(hand,{x:W*.24,y:H*.58,vx:0,vy:0});Object.assign(ally,{x:W*.34,y:H*.34,vx:0,vy:0});Object.assign(keeper,{x:W*.76,y:H*.48,vx:0,vy:0});Object.assign(def,{x:W*.63,y:H*.70,vx:0,vy:0});particles=[];paused=match=false;flashL=flashR=0;action="MOVE";actT=0;carry=0;thumb=false;clearBtns();setState("FOOTBALL FLOW");setRoute("LANES READY");resetBall()}

function goal(w){paused=true;serve=1;sound("goal",1);shake=9;if(w==="p"){pScore++;flashR=1;spawn(gR,ball.y,48,"goal");setState("GOAL");setRoute("FOOTBALL SCORE",true);msg("GOAL!")}else{oScore++;flashL=1;spawn(gL,ball.y,48,"goal");setState("CONCEDED");setRoute("RESET SHAPE",true);msg("THEY SCORED")}setScore();if(pScore>=3||oScore>=3){match=true;serve=0;ball.vx=ball.vy=0;setTimeout(()=>{setState(pScore>=3?"MATCH WON":"MATCH LOST");setRoute("RESET TO PLAY",true);msg(pScore>=3?"YOU WIN 3!":"TRY AGAIN 3!")},160)}}
function moveToward(a,x,y,dt,mul=.4){const acc=clamp(W*1.05,560,1050),max=clamp(W*mul,190,390);a.vx+=clamp((x-a.x)*2.8,-acc,acc)*dt;a.vy+=clamp((y-a.y)*2.8,-acc,acc)*dt;let s=mag(a.vx,a.vy);if(s>max){a.vx=a.vx/s*max;a.vy=a.vy/s*max}a.vx*=Math.pow(.18,dt);a.vy*=Math.pow(.18,dt);a.x+=a.vx*dt;a.y+=a.vy*dt}
function lanePoint(off=0){const t=clamp((ball.x-W*.34)/(W*.54),0,1),gx=gR,gy=(gTop+gBot)/2;return{x:ball.x+(gx-ball.x)*t*.58,y:ball.y+(gy-ball.y)*t*.58+off}}
function updateAI(dt){const side=ball.y<H*.5?1:-1,support=clamp(Math.min(W,H)*.2,62,112);let ax=clamp(ball.x-72,gL+ally.r,gR-ally.r),ay=clamp(ball.y+side*support,field+ally.r,H-field-ally.r);if(ball.x<gL+W*.1){ax=W*.34;ay=H*.5+side*support*.75}moveToward(ally,ax,ay,dt,.38);let blend=clamp((ball.x-W*.42)/(W*.44),0,1),ky=clamp(H*.5*(1-blend)+ball.y*blend,gTop+keeper.r,gBot-keeper.r);moveToward(keeper,gR-gDepth-keeper.r-14,ky,dt,.38);let l=lanePoint(ball.y>H*.5?-70:70);moveToward(def,clamp(l.x,W*.43,gR-gDepth-def.r-22),clamp(l.y,field+def.r,H-field-def.r),dt,.37);separateActors();clampAll()}
function separateActors(){const arr=[hand,ally,keeper,def];for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){let a=arr[i],b=arr[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.max(.001,mag(dx,dy)),min=a.r+b.r+8;if(d<min){let nx=dx/d,ny=dy/d,p=(min-d)*.5;a.x-=nx*p;b.x+=nx*p;a.y-=ny*p;b.y+=ny*p}}}

function needBall(a){setState("NEED BALL");setRoute(a+" NEEDS TOUCH",true);spawn(hand.x,hand.y,8,"defend");if(navigator.vibrate)navigator.vibrate([6,18,6])}
function choose(a){if(match||paused)return;action=a;actT=a==="DEFEND"?.8:.22;clearBtns();buttons[a].classList.add("active");if(a==="PASS"){if(reachable())directPass();else needBall("PASS")}if(a==="SHOOT"){if(reachable())directShoot();else needBall("SHOOT")}if(a==="TACKLE")directTackle();if(a==="DEFEND")directDefend()}
function directPass(){let dx=ally.x-ball.x,dy=ally.y-ball.y,l=Math.max(.001,mag(dx,dy));dx/=l;dy/=l;let p=clamp(185+mag(hand.vx,hand.vy)*.12,165,330);ball.vx=dx*p;ball.vy=dy*p;ball.spinV+=clamp((hand.vx*dy-hand.vy*dx)/900,-1.6,1.6);carry=0;poss="free";spawn(ball.x,ball.y,22,"pass");setState("PASSED");setRoute("ALLY LANE",true);sound("kick",.45)}

function directTackle(){let dx=ball.x-hand.x,dy=ball.y-hand.y,l=Math.max(.001,mag(dx,dy));dx/=l;dy/=l;hand.vx+=dx*220;hand.vy+=dy*220;if(reachable()){ball.vx=dx*295+hand.vx*.14;ball.vy=dy*295+hand.vy*.14;spawn(ball.x,ball.y,24,"tackle");setState("TACKLED");setRoute("INTERRUPT",true);shake=4}else{spawn(hand.x,hand.y,16,"tackle");setState("TACKLE LUNGE");setRoute("CLOSE GAP",true)}sound("kick",.52)}

function control(dt){if(match||paused)return;let dx=ball.x-hand.x,dy=ball.y-hand.y,d=mag(dx,dy),near=d<hand.r+ball.r+hand.r*.86,calm=mag(ball.vx,ball.vy)<260&&mag(hand.vx,hand.vy)<300;if(near&&calm){let tx=hand.x+hand.r+ball.r+14,ty=hand.y+dy*.34,k=Math.min(1,dt*3);ball.x+=(tx-ball.x)*k;ball.y+=(ty-ball.y)*k;ball.vx+=(hand.vx*.34-ball.vx)*Math.min(1,dt*2.2);ball.vy+=(hand.vy*.34-ball.vy)*Math.min(1,dt*2.2);carry+=(1-carry)*Math.min(1,dt*6);poss="hand";setState("POSSESSION");setRoute("CONTROL TOUCH",true)}else{carry+=(0-carry)*Math.min(1,dt*4.5);if(carry<.1&&poss==="hand")poss="free"}}
function collide(a,label){let dx=ball.x-a.x,dy=ball.y-a.y,d=Math.max(.001,mag(dx,dy)),extra=(label==="HAND"&&action==="DEFEND"&&actT>0)?hand.r*.32:0,min=a.r+ball.r+extra;if(d>=min)return;let nx=dx/d,ny=dy/d;ball.x+=nx*(min-d+1);ball.y+=ny*(min-d+1);if(label==="HAND"&&action==="DEFEND"&&actT>0){ball.vx=ball.vx*.28+nx*70;ball.vy=ball.vy*.28+ny*70;spawn(ball.x,ball.y,12,"defend");return}let soft=label==="HAND"?.34:label==="ALLY"?.30:.48;ball.vx=ball.vx*(1-soft)+a.vx*.10+nx*(label==="HAND"?22:label==="ALLY"?34:52);ball.vy=ball.vy*(1-soft)+a.vy*.10+ny*(label==="HAND"?22:label==="ALLY"?34:52);ball.spinV*=.6;spawn(ball.x,ball.y,7,label==="ALLY"?"pass":"grass");setState(label==="ALLY"?"SUPPORT TOUCH":label==="HAND"?"FIRST TOUCH":"INTERCEPT");setRoute(label==="HAND"?"CONTROL SPACE":label==="ALLY"?"SUPPORT":"PRESSURE",true)}
function updateBall(dt){let speed=mag(ball.vx,ball.vy),roll=Math.pow(.972,dt*60),drag=Math.max(0,1-(.30+speed/2100)*dt);ball.vx*=roll*drag;ball.vy*=roll*drag;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.spin+=ball.spinV*dt+(ball.vx*dt)/(ball.r*2.8);ball.spinV*=Math.pow(.92,dt*60);if(speed>20&&Math.random()<.42)particles.push({x:ball.x-ball.vx*.03,y:ball.y-ball.vy*.03,vx:-ball.vx*.012+rand(-6,6),vy:-ball.vy*.012+rand(-6,6),life:rand(.12,.24),max:.28,r:rand(1,2.1),kind:"trail"});if(ball.y-ball.r<field){ball.y=field+ball.r;ball.vy=Math.abs(ball.vy)*.12+8;ball.vx*=.52;setState("TOUCHLINE")}else if(ball.y+ball.r>H-field){ball.y=H-field-ball.r;ball.vy=-Math.abs(ball.vy)*.12-8;ball.vx*=.52;setState("TOUCHLINE")}let inGoal=ball.y>gTop&&ball.y<gBot;if(ball.x-ball.r<gL){if(inGoal)goal("o");else{ball.x=gL+ball.r;ball.vx=Math.abs(ball.vx)*.12+10;ball.vy*=.48;setState("POST")}}else if(ball.x+ball.r>gR){if(inGoal)goal("p");else{ball.x=gR-ball.r;ball.vx=-Math.abs(ball.vx)*.12-10;ball.vy*=.48;setState("POST")}}if(mag(ball.vx,ball.vy)<4){ball.vx=0;ball.vy=0}}
function updateParticles(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.13,dt);p.vy*=Math.pow(.13,dt);p.life-=dt}particles=particles.filter(p=>p.life>0)}
