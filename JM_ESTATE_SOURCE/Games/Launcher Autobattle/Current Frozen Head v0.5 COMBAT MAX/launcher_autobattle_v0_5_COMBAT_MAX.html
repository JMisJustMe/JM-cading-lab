 const tm=terrainMods(u);const t=chooseTarget(u);u.target=t;if(!t)return;const dx=t.x-u.x,dy=t.y-u.y,d=Math.max(.001,Math.hypot(dx,dy));u.facing=dx>=0?1:-1;let effectiveRange=u.ran*tm.range+(t.r||0);
 if(u.ai==='healer'){
   let ally=null,missing=0;for(const q of S.units){if(q===u||q.dead||q.faction!==u.faction)continue;const m=q.maxHp-q.hp;if(m>missing){missing=m;ally=q}}
   if(ally){const ad=dist(u.x,u.y,ally.x,ally.y);if(ad>u.ran*.65){u.vx+=(ally.x-u.x)/ad*u.spd*tm.speed*dt*5;u.vy+=(ally.y-u.y)/ad*u.spd*tm.speed*dt*5}if(ad<u.ran&&u.attackTimer<=0){heal(u,ally,u.heal||22);u.attackTimer=u.cd}}
   else if(d>100){u.vx+=dx/d*u.spd*tm.speed*dt*3;u.vy+=dy/d*u.spd*tm.speed*dt*3}

 } else {
   if(u.ai==='assassin'&&d>85&&d<190&&u.dashCd<=0){u.vx+=dx/d*150;u.vy+=dy/d*150;u.dashCd=2.2;burst(u.x,u.y,u.col,5,45)}

drawBoss=function(){_v04DrawBossCombat();const x=BOSS.x(),y=BOSS.y(),p=S.bossPhase||0,hp=clamp(S.bossHp/S.bossMax,0,1);CTX.save();CTX.translate(x,y);CTX.strokeStyle=rgba('#d7c08d',.32);CTX.lineWidth=2;CTX.beginPath();CTX.moveTo(-50,38);CTX.lineTo(-56,-8);CTX.lineTo(-36,-22);CTX.moveTo(50,38);CTX.lineTo(56,-8);CTX.lineTo(36,-22);CTX.stroke();for(let i=0;i<3;i++){const side=i%2?-1:1,yy=-30+i*24;CTX.strokeStyle=rgba('#1a0b0d',.45+.12*p);CTX.lineWidth=1.6;CTX.beginPath();CTX.moveTo(side*9,yy);CTX.lineTo(side*(20+i*3),yy+11);CTX.lineTo(side*(12+i),yy+22);CTX.stroke()}if(p>=1){CTX.fillStyle=rgba('#ff8a58',.32+.1*p);for(let i=0;i<3+p;i++){const fx=-24+i*11,fy=29-Math.abs(Math.sin(S.t*5+i))*18;CTX.beginPath();CTX.moveTo(fx,33);CTX.quadraticCurveTo(fx-5,fy,fx,fy-8);CTX.quadraticCurveTo(fx+7,fy,fx+5,33);CTX.fill()}}if(p>=2){CTX.strokeStyle=rgba('#ffb066',.35);CTX.lineWidth=2;CTX.beginPath();CTX.arc(0,4,45+Math.sin(S.t*5)*3,0,Math.PI*2);CTX.stroke()}if(p>=3){CTX.strokeStyle=rgba('#ff5e65',.65);CTX.lineWidth=2;CTX.setLineDash([4,5]);CTX.beginPath();CTX.arc(0,4,54+Math.sin(S.t*7)*4,0,Math.PI*2);CTX.stroke();CTX.setLineDash([])}CTX.restore();if(UI.phase&&!S.over){const nm=phaseNames[p];UI.phase.textContent='PHASE '+['I','II','III','IV'][p]+' • '+nm;UI.phase.classList.toggle('danger',p>=2)}};

const _v04DrawFXCombat=drawFX;
drawFX=function(){for(const p of S.projectiles||[]){CTX.save();CTX.translate(p.x,p.y-p.z);const a=Math.atan2(p.vy,p.vx);CTX.rotate(a);if(p.kind==='arrow'){CTX.strokeStyle='#f3dfb0';CTX.lineWidth=1.4;CTX.beginPath();CTX.moveTo(-9,0);CTX.lineTo(7,0);CTX.stroke();CTX.fillStyle='#f7e8c5';CTX.beginPath();CTX.moveTo(9,0);CTX.lineTo(3,-3);CTX.lineTo(3,3);CTX.closePath();CTX.fill();CTX.strokeStyle=rgba(p.col,.28);CTX.beginPath();CTX.moveTo(-20,0);CTX.lineTo(-7,0);CTX.stroke()}else{CTX.shadowColor=p.col;CTX.shadowBlur=12;CTX.fillStyle=p.col;CTX.beginPath();CTX.arc(0,0,4.5,0,Math.PI*2);CTX.fill();CTX.strokeStyle=rgba('#fff',.6);CTX.lineWidth=1;CTX.beginPath();CTX.arc(0,0,2,0,Math.PI*2);CTX.stroke()}CTX.restore()}_v04DrawFXCombat()};

const _v04RenderCombat=render;
render=function(){_v04RenderCombat();if(S.bossPhase>=2&&!S.over){CTX.save();CTX.globalAlpha=.035+.02*S.bossPhase;const g=CTX.createRadialGradient(BOSS.x(),BOSS.y(),20,BOSS.x(),BOSS.y(),Math.max(W,H)*.7);g.addColorStop(0,'#ff704f');g.addColorStop(1,'#ff704f00');CTX.fillStyle=g;CTX.fillRect(0,0,W,H);CTX.restore()}};

// Stronger role-specific sound punctuation layered over existing procedural audio.
const oldSfxImpact=sfx.impact;sfx.impact=(heavy=1)=>{oldSfxImpact(heavy);if(heavy>1.15)tone(44,.09,'triangle',.025,-8)};
// v0.5 correction: QUICK FIRE preserves the route, not a stale previous body selection.
CodeHand.mount('QUICK_FIRE',()=>{let a=S.lastAim?{...S.lastAim}:defaultAim();const sel=selectedSpec();a.sel=sel;a.impact=sel.spec.impact*(a.zone==='breakfield'?(zones().breakfield.source.landingImpact||1.55):1);beginFlight(a)});
TraceBox.ding('v0.5.CombatBodiesMounted',{combat:Kading.section('COMBAT').length,relation:Kading.section('RELATION').length,world:Kading.section('WORLD').length});


// refresh visual cards under v0.5 body language
buildCards();

const GameForge={step(dt){update(dt)}};const GlyphPlay={draw(){render()}};
function loop(now){const dt=Math.min(.034,(now-last)/1000);last=now;GameForge.step(dt);GlyphPlay.draw();requestAnimationFrame(loop)}

window.__JM_LAUNCHER__={
 version:'v0.5-JM-native-combat-max',source:CADING_SOURCE,IR:TheoC_IR,Kading,JMLogic,FlowTalk,RouteOS,CodeHand,PrimeBody,TraceBox,GameForge,GlyphPlay,CadenVM,state:S,
 receipt(){return {version:this.version,sourceStatus:TheoC_IR.status,blocks:TheoC_IR.blocks.length,dings:[...TraceBox.dings],events:[...TraceBox.events],snapshot:TraceBox.snapshot('manual',S)}}
};

})();
