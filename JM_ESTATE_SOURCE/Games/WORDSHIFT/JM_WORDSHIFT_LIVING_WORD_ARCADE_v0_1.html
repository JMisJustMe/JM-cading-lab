// JM actual donor: verbatim bounded operators and metrics, recovered from JM Meaning Door Lab v0.7.
// Identity retained; the new game employs their behaviour but does not replace or modify that original body.
function compute(kind,before,args){if(typeof before!=='string'||!args||typeof args!=='object')throw Error('Missing expression/arguments');
 let out='';
 if(kind==='echo'){const n=Number(args.times);if(!Number.isInteger(n)||n<2||n>8)throw Error('Echo requires 2–8 copies');out=Array(n).fill(before).join(' ')}
 else if(kind==='replace'){let f=args.find,r=args.replacement;if(typeof f!=='string'||!f||typeof r!=='string'||!before.includes(f))throw Error('Exact source fragment not found');out=args.all?before.split(f).join(r):before.replace(f,r)}
 else if(kind==='segment'){if(!args.fragment||typeof args.fragment!=='string'||!before.includes(args.fragment))throw Error('Fragment for division not found');let index=before.indexOf(args.fragment)+args.fragment.length;out=before.slice(0,index)+' | '+before.slice(index)}
 else if(kind==='fuse'){if(!args.delimiter||typeof args.delimiter!=='string'||!before.includes(args.delimiter))throw Error('Delimiter not found');out=before.split(args.delimiter).join('')}
 else if(kind==='rotate'){const parts=before.trim().split(/\s+/);if(parts.length<2)throw Error('Need at least two words to rotate');out=args.direction==='right'?[parts.at(-1),...parts.slice(0,-1)].join(' '):[...parts.slice(1),parts[0]].join(' ')}
 else if(kind==='attach'){if(typeof args.material!=='string'||!args.material)throw Error('Add a prefix or suffix');out=args.direction==='prefix'?args.material+before:before+args.material}
 else if(kind==='acronym'){
  if(args.direction==='compress'){const words=before.trim().split(/\s+/).filter(Boolean);if(words.length<2)throw Error('Use at least two words to extract initials');out=words.map(x=>Array.from(x)[0]||'').join('').toUpperCase()}
  else {const words=String(args.expansion||'').trim().split(/\s+/).filter(Boolean),initials=words.map(w=>Array.from(w)[0]||'').join('').toUpperCase(),key=before.replace(/[^\p{L}]/gu,'').toUpperCase();if(!key||initials!==key)throw Error('Expansion initials '+initials+' do not match '+key);out=words.join(' ')}
 }
 else if(kind==='sound'){if(typeof args.proposal!=='string'||!args.proposal.trim())throw Error('Give the proposed sounding explicitly');out=args.proposal}
 else throw Error('Unrecognised operator');
 if(out===before)throw Error('No change: the proposed operation did not create a distinct form');if(!out.trim()||out.length>2000)throw Error('Result must contain 1–2000 characters');return out;
}
function unicodeParts(t){return Array.from(t||'')}
function levDistance(a,b){a=unicodeParts(a);b=unicodeParts(b);if(a.length>300||b.length>300)return null;let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));row=next}return row[b.length]}
function soundShape(str){const chars=unicodeParts(str);return chars.map(c=>({c,kind:/[aeiou]/i.test(c)?'vowel-letter':/[a-z]/i.test(c)?'consonant-letter':/\s/.test(c)?'space':'other'}))}

<script>

function rand(n){return Math.floor(Math.random()*n)}function shuffle(a){let q=[...a];for(let i=q.length-1;i>0;i--){let j=rand(i+1);[q[i],q[j]]=[q[j],q[i]]}return q}

function graphLevel(level){const l=MORPH[level%MORPH.length];let pool=[...new Set(l.pool.split(' '))];if(!pool.includes(l.a))pool.push(l.a);if(!pool.includes(l.b))pool.push(l.b);return {...l,pool}}
