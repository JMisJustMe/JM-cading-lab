const OneBody={
 parse(source){const body={schema:'jm.onebody/v1',name:null,kind:'body',sources:[],route:[],benefits:[],target:['js','c']};for(const raw of source.split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('#'))continue;if(!line.includes(':'))throw new Error('Missing colon: '+line);const i=line.indexOf(':'),k=line.slice(0,i).trim(),v=line.slice(i+1).trim();if(k==='body')body.name=v;else if(k==='kind')body.kind=v;else if(['sources','benefits','target'].includes(k))body[k]=v.split(',').map(x=>x.trim()).filter(Boolean);else if(k==='route')body.route=v.split('>').map(x=>x.trim()).filter(Boolean);else(body.fields||(body.fields={}))[k]=v}if(!body.name||!body.route.length)throw new Error('body and route required');return body},
 emitJS(b){return `// JS carrier for ${b.name}\nexport const BODY=${JSON.stringify(b)};\nexport function run(input={}){let state={...input};const trace=[];for(const step of BODY.route){trace.push({step,before:{...state}});state[step]=true;state.last=step}return {body:BODY.name,state,trace,status:'PASS'}}`},
 emitC(b){const safe=s=>String(s).replace(/[\"\\]/g,'');return `/* C carrier for ${safe(b.name)} */\n#include <stdio.h>\nint main(void){puts("${safe(b.name)} :: ${safe(b.route.join(' > '))} :: PASS");return 0;}`}
};


const Kaleido={
 analyse(bodies){const all=bodies.map(b=>new Set(b.benefits||[])),counts={};for(const s of all)for(const x of s)counts[x]=(counts[x]||0)+1;const shared=Object.keys(counts).filter(x=>counts[x]>1),edges=bodies.map((b,i)=>({id:b.id,only:[...all[i]].filter(x=>counts[x]===1)}));const tensions=[];const offices=new Set(bodies.map(b=>b.office));if(offices.size<bodies.length)tensions.push('shared office / distinct body');if(bodies.some(b=>b.status.includes('lite')))tensions.push('lite reflection / active engine boundary');return {shared,edges,tensions,coverage:new Set(bodies.flatMap(b=>b.benefits||[])).size}},
 cast3to2(bodies){if(bodies.length<2)throw new Error('Bring at least two bodies into contact');const a=this.analyse(bodies);const names=bodies.map(b=>b.name);return [
  {id:'cast-'+Date.now().toString(36),name:'Joined Difference Cast',kind:'new-body',sources:bodies.map(b=>b.id),office:'composite',benefits:[...new Set(bodies.flatMap(b=>b.benefits||[]))],route:['reflect','compare','extract','join-without-erasure','execute','trace'],claim:`${names.join(' + ')} remain source-visible`},
  {id:'counter-'+Date.now().toString(36),name:'Counterpart Beyond Cast',kind:'new-body',sources:bodies.map(b=>b.id),office:'counterpart',benefits:[...a.shared.map(x=>'invert:'+x),...a.tensions],route:['rotate','find-missing','counter-cast','beam','bounce'],claim:'Counterpart generated from shared form and jagged difference'}
 ]}
};


const GameCore={challenges:[
 {name:'Recoverable Contact Body',need:['persistent cursor','fault containment','SHA-256 action chain']},
 {name:'Playable Meaning Cast',need:['three-to-two handoff','meaning-bearing geometry','goal']},
 {name:'Sovereign Browser Bridge',need:['search','lineage return','own-room identity']}
],evaluate(bodies,index){const c=this.challenges[index%this.challenges.length],have=new Set(bodies.flatMap(b=>b.benefits||[])),hit=c.need.filter(x=>have.has(x));return {challenge:c,hit,score:Math.round(hit.length/c.need.length*100),pass:hit.length===c.need.length}}};


const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const field=$('#field'), svg=$('#relations'), core=$('#core'), cursor=$('#contactCursor');
let state={bodies:[...REGISTRY.active_engines.map(x=>({...x,kind:'engine'})),...REGISTRY.lite_family_reflections.map(x=>({...x,kind:'lite'}))],active:[],casts:[],pins:[],visibleLite:[],mode:'field',challenge:0,selected:null,query:'',lastCast:null};
const trace=new TraceBox();
const snapshot=()=>structuredClone(state), restore=s=>{state=s;renderAll()};
const route=new RouteOS(trace,snapshot,restore);
const directions=[[50,15],[74,23],[86,49],[75,76],[50,87],[24,76],[14,49],[25,23]];
const ring2=[[50,7],[68,11],[83,23],[93,42],[92,62],[80,80],[63,92],[39,93],[21,82],[8,64],[7,41],[18,21]];
let drag=null,holdTimer=null,lastTap={id:null,time:0};

function byId(id){return state.bodies.find(b=>b.id===id)||state.casts.find(b=>b.id===id)}
function activeBodies(){return state.active.map(byId).filter(Boolean)}
function layout(){const all=[...state.bodies,...state.casts],mobile=innerWidth<=620;all.forEach((b,i)=>{if(b.x==null){if(mobile&&i<REGISTRY.active_engines.length){const angle=-Math.PI/2+(Math.PI*2*i/REGISTRY.active_engines.length);b.x=50+Math.cos(angle)*38;b.y=49+Math.sin(angle)*35}else{const pos=i<8?directions[i]:ring2[(i-8)%ring2.length];b.x=pos[0]+(((i/12)|0)%3-1)*2;b.y=pos[1]+(((i/8)|0)%3-1)*2}}})}
function bodyHtml(b){return `<b>${b.name}</b><small>${b.office}</small>`}
function renderBodies(){layout();const keep=new Set();for(const b of [...state.bodies,...state.casts]){if(b.kind==='lite'&&!state.visibleLite.includes(b.id)&&!state.active.includes(b.id)&&!state.pins.includes(b.id))continue;if(state.query&&!(`${b.name} ${b.office} ${(b.benefits||[]).join(' ')}`.toLowerCase().includes(state.query.toLowerCase())))continue;keep.add(b.id);let el=field.querySelector(`.shard[data-id="${CSS.escape(b.id)}"]`);if(!el){el=document.createElement('button');el.className='shard';el.dataset.id=b.id;el.innerHTML=bodyHtml(b);field.append(el);bindShard(el)}el.style.setProperty('--x',b.x);el.style.setProperty('--y',b.y);el.classList.toggle('active',state.active.includes(b.id));el.classList.toggle('cast',b.kind==='new-body');el.classList.toggle('lite',b.kind==='lite');el.classList.toggle('pinned',state.pins.includes(b.id))}$$('.shard').forEach(el=>{if(!keep.has(el.dataset.id))el.remove()});core.classList.toggle('ready',state.active.length>=2);$('#status').textContent=`${REGISTRY.active_engines.length} engines · ${REGISTRY.lite_family_reflections.length} lite · ${state.active.length} contact`}
function centreOf(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}
function renderLines(){svg.innerHTML='';const selected=state.active.map(id=>field.querySelector(`.shard[data-id="${CSS.escape(id)}"]`)).filter(Boolean),cr=core.getBoundingClientRect(),c={x:cr.left+cr.width/2,y:cr.top+cr.height/2};for(const el of selected){const p=centreOf(el),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',p.x);line.setAttribute('y1',p.y);line.setAttribute('x2',c.x);line.setAttribute('y2',c.y);line.classList.add('shared');svg.append(line)}for(let i=0;i<selected.length;i++)for(let j=i+1;j<selected.length;j++){const a=centreOf(selected[i]),b=centreOf(selected[j]),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);svg.append(line)}}
function renderAll(){renderBodies();requestAnimationFrame(renderLines);$('#castBtn').disabled=state.active.length<2;$('#reflectBtn').disabled=state.active.length<2}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1500)}
function bindShard(el){el.addEventListener('pointerdown',e=>{const b=byId(el.dataset.id);if(!b)return;e.preventDefault();el.setPointerCapture(e.pointerId);const r=field.getBoundingClientRect();drag={id:b.id,pid:e.pointerId,startX:e.clientX,startY:e.clientY,ox:b.x,oy:b.y,moved:false};cursor.classList.add('grab');holdTimer=setTimeout(()=>{if(drag&&!drag.moved){pinBody(b.id);drag.hold=true}},520)});el.addEventListener('pointermove',e=>{if(!drag||drag.pid!==e.pointerId)return;const b=byId(drag.id),r=field.getBoundingClientRect(),dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.hypot(dx,dy)>5){drag.moved=true;clearTimeout(holdTimer)}b.x=Math.max(4,Math.min(96,drag.ox+dx/r.width*100));b.y=Math.max(7,Math.min(93,drag.oy+dy/r.height*100));el.style.setProperty('--x',b.x);el.style.setProperty('--y',b.y);el.classList.add('dragging');renderLines()});const up=e=>{if(!drag||drag.pid!==e.pointerId)return;clearTimeout(holdTimer);el.classList.remove('dragging');cursor.classList.remove('grab');const b=byId(drag.id),fc=field.getBoundingClientRect(),cx=fc.width/2,cy=fc.height/2,px=b.x/100*fc.width,py=b.y/100*fc.height,near=Math.hypot(px-cx,py-cy)<Math.min(fc.width,fc.height)*.19;if(drag.moved){route.dispatch(near?'CONTACT_CORE':'MOVE_BODY',{id:b.id,x:b.x,y:b.y})}else if(!drag.hold){const now=Date.now();if(lastTap.id===b.id&&now-lastTap.time<330){openBody(b);trace.write('DOUBLE_TAP_SOURCE',{id:b.id})}else{toggleBody(b.id);lastTap={id:b.id,time:now}}}drag=null;renderAll()};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
function toggleBody(id){route.dispatch('TOGGLE_BODY',{id})}
function pinBody(id){if(!state.pins.includes(id))state.pins.push(id);else state.pins=state.pins.filter(x=>x!==id);trace.write('PIN_CONTACTBODY',{id,pinned:state.pins.includes(id)});renderAll();toast(state.pins.includes(id)?'ContactBody pinned':'Pin released')}
function openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetContent').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
function openBody(b){state.selected=b.id;openSheet(b.name,`<div class="formula">${b.contract||'lite reflection → source route'}</div><div class="chips" style="margin-top:9px">${(b.benefits||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div><p class="mini"><strong>Status:</strong> ${b.status}<br><strong>Office:</strong> ${b.office}<br><strong>Source:</strong> ${b.source||'generated in JaggedMirror'}</p><div class="row"><button class="action hot" id="contactThis">CONTACT</button><button class="action" id="copySource">COPY LITEBODY</button></div>`);$('#contactThis').onclick=()=>{toggleBody(b.id);closeSheet()};$('#copySource').onclick=()=>navigator.clipboard?.writeText(JSON.stringify(b,null,2)).then(()=>toast('LiteBody copied'))}
function reflect(){const bodies=activeBodies();if(bodies.length<2)return;const a=Kaleido.analyse(bodies);const formula=`${bodies.map(b=>b.name).join(' ⟷ ')}\nSHARED[${a.shared.join(' · ')||'none yet'}]\nJAGGED[${a.edges.map(x=>x.id+':'+x.only.join('/')).join(' | ')}]\nCOVERAGE=${a.coverage}`;trace.write('KALEIDOSCOPE_SPOT',{sources:bodies.map(b=>b.id),analysis:a});openSheet('Kaleidoscope Spot',`<div class="formula">${formula.replaceAll('\n','<br>')}</div><div class="chips" style="margin-top:9px">${a.tensions.map(x=>`<span class="chip">${x}</span>`).join('')}</div><p class="mini">This compares declared functions and boundaries—not word frequency.</p>`)}
function cast(){const bodies=activeBodies();if(bodies.length<2)return;const casts=Kaleido.cast3to2(bodies);casts[0].x=43;casts[0].y=50;casts[1].x=57;casts[1].y=50;state.casts.push(...casts);state.lastCast=casts.map(x=>x.id);state.active=casts.map(x=>x.id);trace.write('THREE_TO_TWO_CAST',{sources:bodies.map(b=>b.id),outputs:casts.map(x=>x.id)});renderAll();toast('Two bodies cast from one contact field');openCast(casts)}
function openCast(casts){const source=`body: ${casts[0].name}\nkind: coding-body\nsources: ${casts[0].sources.join(', ')}\nbenefits: ${casts[0].benefits.join(', ')}\nroute: ${casts[0].route.join(' > ')}\ntarget: js, c`;const ob=OneBody.parse(source);openSheet('3 → 2 Cast',`<div class="row"><div style="flex:1"><b>${casts[0].name}</b><p class="mini">${casts[0].claim}</p></div><div style="flex:1"><b>${casts[1].name}</b><p class="mini">${casts[1].claim}</p></div></div><textarea class="code" id="bodySource">${source}</textarea><div class="row" style="margin-top:7px"><button class="action hot" id="emitJs">EMIT JS</button><button class="action hot" id="emitC">EMIT C</button><button class="action" id="beam">BEAM PACKAGE</button></div><textarea class="code" id="targetOut" placeholder="carrier output"></textarea>`);$('#emitJs').onclick=()=>{$('#targetOut').value=OneBody.emitJS(OneBody.parse($('#bodySource').value));trace.write('JS_EMIT',{body:ob.name})};$('#emitC').onclick=()=>{$('#targetOut').value=OneBody.emitC(OneBody.parse($('#bodySource').value));trace.write('C_EMIT',{body:ob.name})};$('#beam').onclick=()=>exportBeyond(ob,casts)}
function exportBeyond(ob,casts){const pack={schema:'jm.jaggedmirror.beam/v1',created:new Date().toISOString(),onebody:ob,casts,trace:trace.export(),sourcePointers:POINTERS};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JAGGEDMIRROR_BEAM_'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);trace.write('BEAM_BOUNCE_EXPORT',{body:ob.name,casts:casts.map(x=>x.id)});toast('Beyond package beamed')}
function play(){const result=GameCore.evaluate(activeBodies(),state.challenge);openSheet('PLAYFORM Challenge',`<p class="mini"><strong>${result.challenge.name}</strong><br>Bring benefits into contact:</p><div class="chips">${result.challenge.need.map(n=>`<span class="chip">${result.hit.includes(n)?'✓ ':'○ '}${n}</span>`).join('')}</div><div class="score">${result.score}%</div><div class="row"><button class="action hot" id="retry">NEXT</button></div>`);trace.write('GAME_EVALUATE',{challenge:result.challenge.name,score:result.score,pass:result.pass});$('#retry').onclick=()=>{state.challenge=(state.challenge+1)%GameCore.challenges.length;play()}}
function showSearch(){openSheet('Stringline Summon',`<div class="row"><input class="search" id="q" placeholder="body, benefit, office or source"><button class="action hot" id="go">SUMMON</button></div><p class="mini">Navigator benefit: find the body, preserve source route, return it to the field.</p><div id="results"></div>`);const go=()=>{const q=$('#q').value.trim().toLowerCase(),res=[...state.bodies,...state.casts].filter(b=>`${b.name} ${b.office} ${(b.benefits||[]).join(' ')} ${b.source||''}`.toLowerCase().includes(q)).slice(0,12);$('#results').innerHTML=res.map(b=>`<button class="action" data-summon="${b.id}" style="margin:5px 5px 0 0">${b.name}</button>`).join('')||'<p class="mini">No reflected body found.</p>';$$('[data-summon]').forEach(x=>x.onclick=()=>{state.query='';const b=byId(x.dataset.summon);if(b.kind==='lite'&&!state.visibleLite.includes(b.id))state.visibleLite.push(b.id);b.x=50+Math.random()*8-4;b.y=24+Math.random()*8-4;toggleBody(b.id);closeSheet();toast('Body summoned')});trace.write('NAVIGATOR_SEARCH',{query:q,results:res.map(x=>x.id)})};$('#go').onclick=go;$('#q').onkeydown=e=>{if(e.key==='Enter')go()}}
function showTrace(){const rows=trace.chain.slice(-16).reverse().map(r=>`<div class="mini"><strong>${r.seq} ${r.type}</strong><br>${r.hash.slice(0,16)}… ← ${r.prev.slice(0,10)}</div>`).join('<hr style="border:0;border-top:1px solid var(--line)">');openSheet('TraceBox',`${rows||'<p class="mini">No receipts yet.</p>'}<div class="row" style="margin-top:8px"><button class="action hot" id="exportTrace">EXPORT</button><button class="action" id="replay">REPLAY FIELD</button></div>`);$('#exportTrace').onclick=()=>{const blob=new Blob([JSON.stringify(trace.export(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JAGGEDMIRROR_TRACE.json';a.click()};$('#replay').onclick=()=>{closeSheet();$$('.shard').forEach((e,i)=>setTimeout(()=>{e.animate([{filter:'brightness(1)'},{filter:'brightness(2.2)'},{filter:'brightness(1)'}],{duration:300})},i*30));trace.write('REPLAY',{bodies:state.bodies.length})}}

route.register('TOGGLE_BODY',({id})=>{state.active=state.active.includes(id)?state.active.filter(x=>x!==id):[...state.active,id].slice(-4);trace.write('CONTACT_TOGGLE',{id,active:state.active.includes(id)});renderAll()});
route.register('CONTACT_CORE',({id})=>{if(!state.active.includes(id))state.active=[...state.active,id].slice(-4);const b=byId(id),i=state.active.indexOf(id),ang=(Math.PI*2/Math.max(2,state.active.length))*i;b.x=50+Math.cos(ang)*15;b.y=50+Math.sin(ang)*15;renderAll()});
route.register('MOVE_BODY',()=>renderAll());

field.addEventListener('pointermove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});field.addEventListener('pointerleave',()=>{cursor.style.left='-50px'});
core.onclick=()=>state.active.length>=2?reflect():toast('Bring two bodies into contact');
$('#reflectBtn').onclick=reflect;$('#castBtn').onclick=cast;$('#playBtn').onclick=play;$('#searchBtn').onclick=showSearch;$('#traceBtn').onclick=showTrace;$('#undoBtn').onclick=()=>route.undo().then(renderAll);$('#closeSheet').onclick=closeSheet;
window.addEventListener('resize',()=>requestAnimationFrame(renderLines));window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();route.undo().then(renderAll)}});
trace.write('OPEN',{body:'JaggedMirror Convergence Body 0001',engines:REGISTRY.active_engines.length,lite:REGISTRY.lite_family_reflections.length});renderAll();
</script></body></html>
