plugins { id 'com.android.application' }
android {
    namespace 'com.jmisjustme.foldultra'
    compileSdk 36
    defaultConfig {
        applicationId 'com.jmisjustme.foldultra'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.4.0'
    }
    // Additive QA identity: never signs over, updates, or shares data with original JM Fold Ultra.
    buildTypes {
        homeLabQa {
            initWith debug
            applicationIdSuffix '.homelabqa'
            versionNameSuffix '-home-lab-qa'
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    // Dedicated widget proof package: never upgrades production or pre-existing Home Lab QA.
    buildTypes {
        widgetQa {
            initWith debug
            applicationIdSuffix '.widgetqa'
            versionNameSuffix '-widget-qa'
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
    // v2 isolated interactive proof: retain the installed v1 widget package and layout.
    buildTypes {
        widgetV2Qa {
            initWith debug
            applicationIdSuffix '.widgetv2qa'
            versionNameSuffix '-widget-v2-qa'
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
    // V3 source-backed widget pilot: separate from every previous installed package.
    buildTypes {
        widgetV3Qa {
            initWith debug
            applicationIdSuffix '.widgetv3qa'
            versionNameSuffix '-widget-v3-qa'
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
    // JM OS HOME: separately installed, opt-in candidate. Does not touch Samsung default.
    buildTypes {
        jmOsHomeQa {
            initWith debug
            applicationIdSuffix '.jmoshomeqa'
            versionNameSuffix '-jm-os-home-qa'
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
    // Optional side-by-side QA only. assembleDebug remains original package identity.
    buildTypes {
        homeqa {
            initWith debug
            applicationIdSuffix '.homeqa'
            versionNameSuffix '-qa'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
}
