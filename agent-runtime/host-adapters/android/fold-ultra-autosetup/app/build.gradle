plugins { id 'com.android.application' }
android {
    namespace 'com.jmisjustme.foldultra'
    compileSdk 36
    defaultConfig {
        applicationId 'com.jmisjustme.foldultra'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.1.0'
    }
    // Additive QA identity: never signs over, updates, or shares data with original JM Fold Ultra.
    buildTypes {
        homeLabQa {
            initWith debug
            applicationIdSuffix '.homelabqa'
            versionNameSuffix '-home-lab-qa'
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    // Optional side-by-side QA only. assembleDebug remains original package identity.
    buildTypes {
        homeqa {
            initWith debug
            applicationIdSuffix '.homeqa'
            versionNameSuffix '-qa'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
}
