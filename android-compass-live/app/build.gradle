plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jmestate.estatecompass'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jmestate.estatecompass'
        minSdk 26
        targetSdk 35
        versionCode 2200
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
