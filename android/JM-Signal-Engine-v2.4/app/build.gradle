plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jmisjustme.signalengine'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jmisjustme.signalengine'
        minSdk 26
        targetSdk 36
        versionCode 240
        versionName '2.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
