plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jm.livingmultihub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jm.livingmultihub'
        minSdk 26
        targetSdk 35
        versionCode 6001
        versionName '6.0A-field'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['html', 'cading', 'json']
    }
}
