<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JM Estate — Sovereign Integration v1</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#080b10;color:#f3f6fb}body{margin:0}main{max-width:900px;margin:auto;padding:24px}.card{border:1px solid #283141;border-radius:16px;padding:16px;margin:12px 0;background:#101620}a{color:#9ee7ff}.muted{color:#aab4c5}.state{font-weight:800}.ok{color:#9ef0ad}.hold{color:#ffd68a}code{word-break:break-word}</style>
</head>
<body>
<main>
<h1>JM Estate — Sovereign Integration v1</h1>
<p class="muted">One canonical public door, many distinct Estate bodies. This surface reports routes and roles; it does not collapse authority boundaries.</p>
<div id="status" class="card">Loading integration state…</div>
<div id="routes"></div>
<script>
async function run(){
  const status=document.getElementById('status'),routes=document.getElementById('routes');
  try{
    const r=await fetch('./public-status.json',{cache:'no-store'});
    if(!r.ok) throw new Error('status '+r.status);
    const d=await r.json();
    status.innerHTML=`<div class="state hold">${d.status}</div><p>Canonical root: <a href="${d.canonical_root}">${d.canonical_root}</a></p>`;
    routes.innerHTML=Object.entries(d.routes).map(([k,v])=>`<div class="card"><strong>${k.replaceAll('_',' ')}</strong><br><a href="${v}">${v}</a></div>`).join('');
  }catch(e){
    status.innerHTML=`<div class="state hold">INTEGRATION STATUS UNAVAILABLE</div><p class="muted">${String(e.message||e)}</p>`;
  }
}
run();
</script>
</main>
</body>
</html>
