<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JM Active Keeper Dashboard v0.1 · Human-Scale Descendant</title><style>:root{--bg:#0b0d10;--panel:#14181d;--panel2:#1b2027;--text:#f4f5f7;--muted:#aeb7c2;--line:#303844;--accent:#ffd66b;--bad:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b0d10e8;border-bottom:1px solid var(--line);padding:14px 16px}h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.88rem}main{max-width:980px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}label{display:grid;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:10px}input,textarea,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}textarea{min-height:110px;resize:vertical}button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#17120a;border-color:transparent}.row{display:flex;flex-wrap:wrap;gap:8px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:.78rem}.small{font-size:.78rem;color:var(--muted)}.list{display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}button.bad{color:#ffc1c1}@media(max-width:560px){main{padding:10px}.card{padding:12px}button,.btn{min-height:44px}}</style></head><body><header><h1>JM Active Keeper Dashboard v0.1</h1><div class="sub">Keep current authority visible. Preserve lineage without letting it steal the head.</div></header><main><section class="card"><div class="grid"><label>Keeper / body<input id="name"></label><label>Family / house<input id="family"></label><label>Version<input id="version"></label><label>Status<select id="status"><option>CURRENT</option><option>PROVEN</option><option>WORKING</option><option>FORMING</option><option>HOLD</option><option>LINEAGE</option></select></label><label>Authority / source<input id="authority"></label><label>Next action<input id="next"></label></div><label>Notes<textarea id="notes"></textarea></label><div class="row"><button class="primary" onclick="addKeeper()">Add keeper</button><button onclick="importInbox()">Import Wave 1 inbox as trace</button><label class="btn">Import JSON<input type="file" id="file" accept=".json" hidden></label><button onclick="exportAll()">Export dashboard</button></div></section><section class="card"><h2>Active keepers</h2><div id="list" class="list"></div></section><section class="card"><h2>Attached trace</h2><div id="trace" class="list"></div></section></main><script>const JMAPP={key(app){return`jm_wave1_${app}_v01`},save(app,data){localStorage.setItem(this.key(app),JSON.stringify(data))},load(app,fallback){try{return JSON.parse(localStorage.getItem(this.key(app)))||fallback}catch{return fallback}},packet(kind,payload,source){return{schema:"jm.packet/1.0",id:"JMP-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),created_at:new Date().toISOString(),source,kind,payload}},download(filename,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},importFile(file,cb){const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch{alert("That file is not valid JSON.")}};r.readAsText(file)},busRead(){try{return JSON.parse(localStorage.getItem("jm_wave1_bus_v1")||"[]")}catch{return[]}}};function toast(msg){let x=document.getElementById("_toast");if(!x){x=document.createElement("div");x.id="_toast";Object.assign(x.style,{position:"fixed",bottom:"18px",left:"50%",transform:"translateX(-50%)",background:"#222a33",color:"white",padding:"10px 14px",borderRadius:"999px",zIndex:99});document.body.appendChild(x)}x.textContent=msg;x.style.display="block";setTimeout(()=>x.style.display="none",1500)}const APP="keepers";let state=JMAPP.load(APP,{keepers:[],trace:[]});file.onchange=()=>{if(file.files[0])JMAPP.importFile(file.files[0],o=>{state.trace.unshift(o);save();render()})};function save(){JMAPP.save(APP,state)}function addKeeper(){if(!name.value.trim())return toast("Name required");state.keepers.unshift({id:"K-"+Date.now(),name:name.value,family:family.value,version:version.value,status:status.value,authority:authority.value,next:next.value,notes:notes.value,updated:new Date().toISOString()});save();render();["name","family","version","authority","next","notes"].forEach(k=>document.getElementById(k).value="")}function del(id){if(confirm("Remove this keeper from this dashboard?")){state.keepers=state.keepers.filter(x=>x.id!==id);save();render()}}function importInbox(){const bus=JMAPP.busRead(),known=new Set(state.trace.map(x=>x.id));bus.forEach(x=>{if(!known.has(x.id))state.trace.push(x)});save();render();toast(`${bus.length} inbox packet(s) checked`)}function esc(x){return String(x??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}function render(){list.innerHTML=state.keepers.map(k=>`<div class="item"><b>${esc(k.name)}</b> <span class="pill">${esc(k.status)}</span><div class="small">${esc(k.family)} · ${esc(k.version||"no version")}</div><div>${esc(k.next||"No next action")}</div><div class="small">${esc(k.authority||"No authority source")}</div><button class="bad" onclick="del('${k.id}')">Remove</button></div>`).join("")||'<div class="small">No active keepers entered yet.</div>';trace.innerHTML=state.trace.slice(0,30).map(t=>`<div class="item"><b>${esc(t.kind||"packet")}</b><div class="small">${esc(t.source||"unknown")} · ${esc(t.created_at||"")}</div></div>`).join("")||'<div class="small">No attached Wave 1 trace yet.</div>'}function exportAll(){const p=JMAPP.packet("keeper.dashboard",state,"JM Active Keeper Dashboard v0.1");JMAPP.download(`JM_ACTIVE_KEEPERS_${Date.now()}.json`,p)}render();</script><script>window.JM_HUMAN_SCALE_CONFIG={mode:'guided',title:'Active Keeper Dashboard',intention:'KEEP THE CURRENT AUTHORITY VISIBLE',primaryLabel:'ADD KEEPER',primarySelector:'button[onclick="addKeeper()"]',resultSelector:'#list',bodyId:'JM Active Keeper Dashboard',version:'v0.1 · Human-Scale descendant v1.0',sourceAuthority:'Exact File Library Wave 1 source recovered 2026-09-07',receiverProofState:'ASSISTANT-SIDE MATERIALIZED · OWNER CONTACT OPEN',ownerContactRequired:true};</script><script src="../../../governance/human-scale/JM_HUMAN_SCALE_INTERACTION_ORGAN_v1_0.js"></script></body></html>
