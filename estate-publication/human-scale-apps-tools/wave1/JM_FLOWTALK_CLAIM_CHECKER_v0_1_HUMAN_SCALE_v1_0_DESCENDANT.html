<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JM FlowTalk Claim Checker v0.1 · Human-Scale Descendant</title><style>:root{--bg:#0b0d10;--panel:#14181d;--panel2:#1b2027;--text:#f4f5f7;--muted:#aeb7c2;--line:#303844;--accent:#ffd66b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b0d10e8;border-bottom:1px solid var(--line);padding:14px 16px}h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.88rem}main{max-width:980px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}label{display:grid;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:10px}input,textarea,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}textarea{min-height:110px;resize:vertical}button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#17120a;border-color:transparent}.row{display:flex;flex-wrap:wrap;gap:8px}pre{white-space:pre-wrap;word-break:break-word;background:#090b0e;border:1px solid var(--line);padding:12px;border-radius:12px;color:#dfe6ee}@media(max-width:560px){main{padding:10px}.card{padding:12px}button{min-height:44px}}</style></head><body><header><h1>JM FlowTalk Claim Checker v0.1</h1><div class="sub">Separate report, interpretation, symbol, testable fact and scientific reach.</div></header><main><section class="card"><label>Claim / statement<textarea id="claim" placeholder="Enter the exact claim you want to inspect."></textarea></label><div class="grid"><label>Claim class<select id="kind"><option>Personal / lived report</option><option>Interpretation / opinion</option><option>Symbolic / metaphorical usefulness</option><option>Testable factual claim</option><option>Scientific / generalising claim</option><option>Normative / value claim</option><option>Unknown / mixed</option></select></label><label>Evidence status<select id="evidence"><option>None supplied</option><option>Source only</option><option>Observation</option><option>Repeated observation</option><option>Independent evidence</option><option>Strong converging evidence</option></select></label><label>Confidence<select id="confidence"><option>Low</option><option>Medium</option><option>High</option></select></label></div><div class="grid"><label>What supports it?<textarea id="support"></textarea></label><label>What could correct it?<textarea id="recourse"></textarea></label></div><label>Claim radius / limit<input id="radius" placeholder="Exactly how far can this claim lawfully reach?"></label><div class="row"><button class="primary" onclick="assess()">Assess</button><button onclick="exportClaim()">Export packet</button><button onclick="sendClaim()">Send to shared inbox</button></div></section><section class="card"><h2>Checker output</h2><pre id="out"></pre></section></main><script>const JMAPP={key(app){return`jm_wave1_${app}_v01`},save(app,data){localStorage.setItem(this.key(app),JSON.stringify(data))},load(app,fallback){try{return JSON.parse(localStorage.getItem(this.key(app)))||fallback}catch{return fallback}},packet(kind,payload,source){return{schema:"jm.packet/1.0",id:"JMP-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),created_at:new Date().toISOString(),source,kind,payload}},download(filename,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},busSend(packet){try{const arr=JSON.parse(localStorage.getItem("jm_wave1_bus_v1")||"[]");arr.unshift(packet);localStorage.setItem("jm_wave1_bus_v1",JSON.stringify(arr.slice(0,100)));toast("Sent to Wave 1 shared inbox")}catch{toast("Shared inbox unavailable")}}};function toast(msg){let x=document.getElementById("_toast");if(!x){x=document.createElement("div");x.id="_toast";Object.assign(x.style,{position:"fixed",bottom:"18px",left:"50%",transform:"translateX(-50%)",background:"#222a33",color:"white",padding:"10px 14px",borderRadius:"999px",zIndex:99});document.body.appendChild(x)}x.textContent=msg;x.style.display="block";setTimeout(()=>x.style.display="none",1500)}const APP="claim";let st=JMAPP.load(APP,{});["claim","support","recourse","radius"].forEach(k=>{if(st[k])document.getElementById(k).value=st[k]});["kind","evidence","confidence"].forEach(k=>{if(st[k])document.getElementById(k).value=st[k]});document.addEventListener("input",save);function save(){const d={};["claim","support","recourse","radius","kind","evidence","confidence"].forEach(k=>d[k]=document.getElementById(k).value);JMAPP.save(APP,d)}function verdict(){const k=kind.value,e=evidence.value;let gate="HOLD / DEFINE";if(k.includes("Personal"))gate="VALID AS REPORT — do not silently universalise";else if(k.includes("Interpretation")||k.includes("Symbolic")||k.includes("Normative"))gate="VALID AS FRAMING — label it as framing";else if(k.includes("Testable"))gate=e==="None supplied"?"EVIDENCE NEEDED":"TESTABLE — evidence route present";else if(k.includes("Scientific"))gate=["Independent evidence","Strong converging evidence"].includes(e)?"EVIDENCE-BEARING — still preserve scope":"DO NOT CROWN AS SCIENTIFIC";return gate}function packet(){return JMAPP.packet("claim.check",{claim:claim.value,class:kind.value,evidence:evidence.value,confidence:confidence.value,support:support.value,recourse:recourse.value,radius:radius.value,verdict:verdict()},"JM FlowTalk Claim Checker v0.1")}function assess(){out.textContent=JSON.stringify(packet().payload,null,2)}function exportClaim(){const p=packet();out.textContent=JSON.stringify(p,null,2);JMAPP.download(`JM_CLAIM_CHECK_${Date.now()}.json`,p)}function sendClaim(){const p=packet();out.textContent=JSON.stringify(p,null,2);JMAPP.busSend(p)}</script><script>window.JM_HUMAN_SCALE_CONFIG={mode:'guided',title:'FlowTalk Claim Checker',intention:'CHECK THIS CLAIM WITHOUT INFLATING IT',primaryLabel:'ASSESS CLAIM',primarySelector:'button[onclick="assess()"]',resultSelector:'#out',bodyId:'JM FlowTalk Claim Checker',version:'v0.1 · Human-Scale descendant v1.0',sourceAuthority:'Exact File Library Wave 1 source recovered 2026-09-07',receiverProofState:'ASSISTANT-SIDE MATERIALIZED · OWNER CONTACT OPEN',ownerContactRequired:true};</script><script src="../../../governance/human-scale/JM_HUMAN_SCALE_INTERACTION_ORGAN_v1_0.js"></script></body></html>
