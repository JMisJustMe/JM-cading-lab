<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JM Gem Extraction App v0.1 · Human-Scale Descendant</title><style>
:root{--bg:#0b0d10;--panel:#14181d;--panel2:#1b2027;--text:#f4f5f7;--muted:#aeb7c2;--line:#303844;--accent:#ffd66b;--good:#89e3a5;--warn:#ffc66d;--bad:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b0d10e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.88rem}main{max-width:980px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}label{display:grid;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:10px}input,textarea,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}textarea{min-height:110px;resize:vertical}button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button.primary,.btn.primary{background:var(--accent);color:#17120a;border-color:transparent}.row{display:flex;flex-wrap:wrap;gap:8px}pre{white-space:pre-wrap;word-break:break-word;background:#090b0e;border:1px solid var(--line);padding:12px;border-radius:12px;color:#dfe6ee}.small{font-size:.78rem;color:var(--muted)}.list{display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}nav{display:flex;gap:7px;overflow:auto;padding-top:8px}@media(max-width:560px){main{padding:10px}.card{padding:12px}button,.btn{min-height:44px}header{padding:12px}}</style></head>
<body><header><h1>JM Gem Extraction App v0.1</h1><div class="sub">SOURCE → RAW GEM → CLEAN LOCK → USE → HOMES → OUTPUT</div></header>
<main><section class="card"><div class="grid"><label>Source / raw material<textarea id="src" placeholder="Paste a chat passage, note, lyric, observation, source extract…"></textarea></label><div><label>Source label<input id="sourceLabel" placeholder="Chat / note / file / moment"></label><label>Output lane<select id="lane"><option>Theory / Book</option><option>App / Tool</option><option>Music / Lyrics</option><option>Game / Playable</option><option>FTR / Product</option><option>Public Output</option><option>Recovery / Archive</option></select></label></div></div><div class="row"><button class="primary" onclick="splitSource()">Split into candidates</button><button onclick="clearAll()">Clear</button></div></section><section class="card"><h2>Candidate gems</h2><div id="candidates" class="list"></div></section><section class="card"><h2>Selected lock</h2><div class="grid"><label>Gem / cleaned lock<textarea id="gem"></textarea></label><label>Why it matters<textarea id="why"></textarea></label></div><div class="grid"><label>Keeper / title<input id="keeper"></label><label>Homes / routes<input id="homes" placeholder="Theory; Apps; Lyrics…"></label><label>Tags<input id="tags"></label></div><div class="row"><button class="primary" onclick="exportGem()">Export packet</button><button onclick="sendGem()">Send to shared inbox</button></div><pre id="out"></pre></section></main>
<script>const JMAPP={key(app){return `jm_wave1_${app}_v01`},save(app,data){localStorage.setItem(this.key(app),JSON.stringify(data))},load(app,fallback){try{return JSON.parse(localStorage.getItem(this.key(app)))||fallback}catch{return fallback}},packet(kind,payload,source){return{schema:"jm.packet/1.0",id:"JMP-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),created_at:new Date().toISOString(),source,kind,payload}},download(filename,obj){const b=new Blob([typeof obj==="string"?obj:JSON.stringify(obj,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},busSend(packet){try{const arr=JSON.parse(localStorage.getItem("jm_wave1_bus_v1")||"[]");arr.unshift(packet);localStorage.setItem("jm_wave1_bus_v1",JSON.stringify(arr.slice(0,100)));toast("Sent to Wave 1 shared inbox")}catch(e){toast("Shared inbox unavailable")}}};function toast(msg){let x=document.getElementById("_toast");if(!x){x=document.createElement("div");x.id="_toast";Object.assign(x.style,{position:"fixed",bottom:"18px",left:"50%",transform:"translateX(-50%)",background:"#222a33",color:"white",padding:"10px 14px",borderRadius:"999px",zIndex:99,border:"1px solid #3a4653"});document.body.appendChild(x)}x.textContent=msg;x.style.display="block";setTimeout(()=>x.style.display="none",1500)}const APP="gem";let st=JMAPP.load(APP,{});for(const k of["src","sourceLabel","gem","why","keeper","homes","tags"])if(st[k])document.getElementById(k).value=st[k];if(st.lane)lane.value=st.lane;document.addEventListener("input",()=>save());function save(){const d={};["src","sourceLabel","gem","why","keeper","homes","tags"].forEach(k=>d[k]=document.getElementById(k).value);d.lane=lane.value;JMAPP.save(APP,d)}function splitSource(){const raw=src.value.trim();const parts=raw.split(/\n+|(?<=[.!?])\s+(?=[A-Z0-9“"'])/).map(x=>x.trim()).filter(x=>x.length>20);candidates.innerHTML=parts.map((x,i)=>`<button class="item" style="text-align:left" data-i="${i}">${x.replace(/</g,"&lt;")}</button>`).join("")||'<div class="small">No substantial candidates yet.</div>';[...candidates.querySelectorAll("button")].forEach((b,i)=>b.onclick=()=>{gem.value=parts[i];keeper.value=parts[i].split(/\s+/).slice(0,8).join(" ");save()})}function packet(){return JMAPP.packet("gem.extraction",{source:src.value,source_label:sourceLabel.value,gem:gem.value,why:why.value,keeper:keeper.value,lane:lane.value,homes:homes.value.split(";").map(x=>x.trim()).filter(Boolean),tags:tags.value.split(",").map(x=>x.trim()).filter(Boolean)},"JM Gem Extraction App v0.1")}function exportGem(){const p=packet();out.textContent=JSON.stringify(p,null,2);JMAPP.download(`JM_GEM_${Date.now()}.json`,p)}function sendGem(){const p=packet();out.textContent=JSON.stringify(p,null,2);JMAPP.busSend(p)}function clearAll(){if(confirm("Clear this working state?")){localStorage.removeItem(JMAPP.key(APP));location.reload()}}</script>
<script>window.JM_HUMAN_SCALE_CONFIG={mode:'guided',title:'Gem Extraction',intention:'TURN THIS SOURCE INTO A CLEAN GEM',primaryLabel:'SPLIT SOURCE',primarySelector:'button[onclick="splitSource()"]',resultSelector:'#candidates',bodyId:'JM Gem Extraction App',version:'v0.1 · Human-Scale descendant v1.0',sourceAuthority:'Exact File Library Wave 1 source recovered 2026-09-07',receiverProofState:'ASSISTANT-SIDE MATERIALIZED · OWNER CONTACT OPEN',ownerContactRequired:true};</script><script src="../../../governance/human-scale/JM_HUMAN_SCALE_INTERACTION_ORGAN_v1_0.js"></script>
</body></html>
