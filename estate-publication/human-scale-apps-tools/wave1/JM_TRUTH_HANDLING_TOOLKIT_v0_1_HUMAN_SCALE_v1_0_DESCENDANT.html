<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JM Truth Handling Toolkit v0.1 · Human-Scale Descendant</title><style>:root{--bg:#0b0d10;--panel:#14181d;--panel2:#1b2027;--text:#f4f5f7;--muted:#aeb7c2;--line:#303844;--accent:#ffd66b;--good:#89e3a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b0d10e8;border-bottom:1px solid var(--line);padding:14px 16px}h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.88rem}main{max-width:980px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}label{display:grid;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:10px}input,textarea,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}input[type=checkbox]{width:auto}textarea{min-height:110px;resize:vertical}button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#17120a;border-color:transparent}.row{display:flex;flex-wrap:wrap;gap:8px}pre{white-space:pre-wrap;word-break:break-word;background:#090b0e;border:1px solid var(--line);padding:12px;border-radius:12px;color:#dfe6ee}@media(max-width:560px){main{padding:10px}.card{padding:12px}button{min-height:44px}}</style></head><body><header><h1>JM Truth Handling Toolkit v0.1</h1><div class="sub">Define first. Route second. Test third. Correct always.</div></header><main><section class="card"><div class="grid"><label>Statement<textarea id="statement"></textarea></label><div><label>Primary handling<select id="handling"><option>Truth-claim</option><option>Fact claim</option><option>Opinion</option><option>Belief</option><option>Meaning / interpretation</option><option>Definition</option></select></label><label>Source<input id="source" placeholder="Where did this come from?"></label></div></div></section><section class="card"><h2>Clean handling checks</h2><div class="grid"><label><input type="checkbox" id="exact"> Exact wording/source preserved where needed</label><label><input type="checkbox" id="labelled"> Claim type is labelled honestly</label><label><input type="checkbox" id="radius"> Scope/radius is not inflated</label><label><input type="checkbox" id="correction"> Correction/re-entry route exists</label><label><input type="checkbox" id="authority"> Authority is not substituted for evidence</label><label><input type="checkbox" id="meaning"> Meaning is distinguished from literal fact</label></div><div class="grid"><label>Meaning carried<textarea id="meaningText"></textarea></label><label>Correction / recourse<textarea id="recourse"></textarea></label></div><label>Public-safe wording<textarea id="public"></textarea></label><div class="row"><button class="primary" onclick="review()">Review</button><button onclick="exportTruth()">Export packet</button><button onclick="sendTruth()">Send to shared inbox</button></div></section><section class="card"><h2>Handling report</h2><pre id="out"></pre></section></main><script>const JMAPP={key(app){return`jm_wave1_${app}_v01`},save(app,data){localStorage.setItem(this.key(app),JSON.stringify(data))},load(app,fallback){try{return JSON.parse(localStorage.getItem(this.key(app)))||fallback}catch{return fallback}},packet(kind,payload,source){return{schema:"jm.packet/1.0",id:"JMP-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),created_at:new Date().toISOString(),source,kind,payload}},download(filename,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},busSend(packet){try{const arr=JSON.parse(localStorage.getItem("jm_wave1_bus_v1")||"[]");arr.unshift(packet);localStorage.setItem("jm_wave1_bus_v1",JSON.stringify(arr.slice(0,100)));toast("Sent to Wave 1 shared inbox")}catch{toast("Shared inbox unavailable")}}};function toast(msg){let x=document.getElementById("_toast");if(!x){x=document.createElement("div");x.id="_toast";Object.assign(x.style,{position:"fixed",bottom:"18px",left:"50%",transform:"translateX(-50%)",background:"#222a33",color:"white",padding:"10px 14px",borderRadius:"999px",zIndex:99});document.body.appendChild(x)}x.textContent=msg;x.style.display="block";setTimeout(()=>x.style.display="none",1500)}const APP="truth";let st=JMAPP.load(APP,{});const textIds=["statement","source","meaningText","recourse","public","handling"],checks=["exact","labelled","radius","correction","authority","meaning"];textIds.forEach(k=>{if(st[k]!=null)document.getElementById(k).value=st[k]});checks.forEach(k=>document.getElementById(k).checked=!!st[k]);document.addEventListener("input",save);document.addEventListener("change",save);function save(){const d={};textIds.forEach(k=>d[k]=document.getElementById(k).value);checks.forEach(k=>d[k]=document.getElementById(k).checked);JMAPP.save(APP,d)}function report(){const passed=checks.filter(k=>document.getElementById(k).checked).length;return{statement:statement.value,handling:handling.value,source:source.value,checks_passed:`${passed}/6`,status:passed===6?"CLEAN HANDLING":"OPEN CHECKS",meaning:meaningText.value,recourse:recourse.value,public_safe_wording:public.value}}function packet(){return JMAPP.packet("truth.handling",report(),"JM Truth Handling Toolkit v0.1")}function review(){out.textContent=JSON.stringify(report(),null,2)}function exportTruth(){const p=packet();out.textContent=JSON.stringify(p,null,2);JMAPP.download(`JM_TRUTH_HANDLING_${Date.now()}.json`,p)}function sendTruth(){const p=packet();out.textContent=JSON.stringify(p,null,2);JMAPP.busSend(p)}</script><script>window.JM_HUMAN_SCALE_CONFIG={mode:'guided',title:'Truth Handling',intention:'HANDLE THIS STATEMENT WITHOUT LOSING ITS SOURCE OR LIMITS',primaryLabel:'REVIEW HANDLING',primarySelector:'button[onclick="review()"]',resultSelector:'#out',bodyId:'JM Truth Handling Toolkit',version:'v0.1 · Human-Scale descendant v1.0',sourceAuthority:'Exact File Library Wave 1 source recovered 2026-09-07',receiverProofState:'ASSISTANT-SIDE MATERIALIZED · OWNER CONTACT OPEN',ownerContactRequired:true};</script><script src="../../../governance/human-scale/JM_HUMAN_SCALE_INTERACTION_ORGAN_v1_0.js"></script></body></html>
