<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>T‑Boys Combat Anchor v0.1</title><style>
:root{--bg:#050914;--panel:#0b1525;--line:#27435e;--ink:#f6fbff;--mut:#9eb2c7;--cyan:#55e8ff;--red:#ff667a;--gold:#ffd166}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0,#122b48,#050914 58%,#02040a);color:var(--ink);font-family:system-ui,sans-serif}button{font:inherit;color:inherit}#app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}header{padding:10px 14px;border-bottom:1px solid var(--line);background:#07111ddd;display:flex;justify-content:space-between;gap:10px;align-items:center}h1{font-size:clamp(1.05rem,2vw,1.5rem);margin:0;color:var(--gold)}.sub{color:var(--mut);font-size:.78rem}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#0d1b2c;font-size:.72rem}#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:8px 12px;background:#07111d;border-bottom:1px solid var(--line)}.fighterHud{display:grid;gap:5px}.fighterHud.right{text-align:right}.nameRow{display:flex;justify-content:space-between;font-weight:800;font-size:.82rem}.right .nameRow{flex-direction:row-reverse}.meter{height:16px;background:#020711;border:1px solid #314d69;border-radius:999px;overflow:hidden}.fill{height:100%;transition:width .18s}.hp1{background:linear-gradient(90deg,var(--cyan),#b8f7ff)}.hp2{background:linear-gradient(90deg,#ffc0ca,var(--red))}.pressure{height:8px}.pr1{background:linear-gradient(90deg,#23516a,var(--gold))}.pr2{background:linear-gradient(90deg,var(--gold),#6b3140)}#roundBox{text-align:center;min-width:90px}.round{font-weight:900;color:var(--gold)}.timer{font-size:1.4rem;font-weight:900}#stageWrap{position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:.2s}#banner.show{opacity:1}#banner div{font-weight:1000;font-size:clamp(2rem,8vw,5rem);background:#07111ddd;bo </style></head><body><div id="app"><header><div><h1>T‑Boys — Combat Anchor v0.1</h1><div class="sub">Different role bodies meet inside one fight without becoming interchangeable.</div></div><div class="badges"><span class="badge">RUNTIME: COMBAT</span><span class="badge" id="receiptBadge">RECEIPT: OPEN</span></div></header><section id="hud"><div class="fighterHud"><div class="nameRow"><span>JAX</span><span id="p1State">READY</span></div><div class="meter"><div id="p1hp" class="fill hp1" style="width:100%"></div></div><div class="meter pressure"><div id="p1pr" class="fill pr1"></div></div></div><div id="roundBox"><div class="round">ROUND <span id="round">1</span></div><div class="timer" id="timer">60</div></div><div class="fighterHud right"><div class="nameRow"><span>RIVAL</span><span id="p2State">READY</span></div><div class="meter"><div id="p2hp" class="fill hp2" style="width:100%"></div></div><div class="meter pressure"><div id="p2pr" class="fill pr2"></div></div></div></section><div id="stageWrap"><canvas id="game"></canvas><button id="reset">Reset round</button><div id="banner"><div id="bannerText">FIGHT</div></div><div id="status">Move A/D or arrows · Strike J · Guard K · Burst L</div></div><footer id="controls"><div class="cluster"><button class="ctrl" data-hold="left">◀</button><button class="ctrl" data-hold="right">▶</button></div><div class="cluster right"><button class="ctrl attack" data-action="strike">STRIKE</button><button class="ctrl guard" data-hold="guard">GUARD</button><button class="ctrl special" data-action="burst">BURST</button></div></footer></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#game'),x=c.getContext('2d'),keys=new Set(),parts=[];let W,H,last=0,time=60,round=0,end=false,shake=0,flash=0;const A={l:90,r:800,f:500};const F=(id,pos,face,col)=>({id,x:pos,vx:0,face,col,hp:100,pr:0,state:'IDLE',st:0,guard:false,hit:0,atk:0,rounds:0});let p1,p2;function rz(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);A.r=W-90;A.f=H-90;if(p1){p1.x=Math.min(p1.x,A.r);p2.x=Math.min(p2.x,A.r)}}addEventListener('resize',rz);const cl=(v,a,b)=>Math.max(a,Math.min(b,v));function st(f,s,t=.1){f.state=s;f.st=t}function spark(px,py,col,n=18){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*320,vy:(Math.random()-.8)*260,l:.35+Math.random()*.35,c:col,z:2+Math.random()*5})}function strike(a,d){if(end||a.atk||a.hit||a.guard)return;a.atk=.28;st(a,'STRIKE',.28);setTimeout(()=>{let dist=Math.abs(a.x-d.x),tow=(d.x-a.x)*a.face>0;if(end||dist>112||!tow)return;let g=d.guard,dam=g?4:12,push=g?22:58;d.hp=cl(d.hp-dam,0,100);d.pr=cl(d.pr+(g?14:22),0,100);a.pr=cl(a.pr+8,0,100);d.x+=a.face*push;d.hit=g?.12:.28;st(d,g?'BLOCK':'HIT',d.hit);shake=g?5:12;flash=.08;spark((a.x+d.x)/2,A.f-76,g?'#9edcff':'#ffd166',g?10:22);if(d.hp<=0||d.x<A.l-30||d.x>A.r+30)finish(a,d)},95)}function burst(a,d){if(end||a.pr<100||a.atk)return;a.pr=0;a.atk=.55;st(a,'BURST',.55);spark(a.x,A.f-70,a.col,36);setTimeout(()=>{if(Math.abs(a.x-d.x)<190){d.hp=cl(d.hp-22,0,100);d.x+=a.face*110;d.hit=.42;st(d,'LAUNCHED',.42);shake=18;spark(d.x,A.f-90,'#fff',38);if(d.hp<=0)finish(a,d)}},160)}function finish(w,l){end=true;w.rounds++;st(l,'DOWN',99);st(w,'VICTORY',99);banner(w.id+' WINS');receipt()}function banner(t){$('#bannerText').textContent=t;$('#banner').classList.add('show');setTimeout(()=>$('#banner').classList.remove('show'),1100)}function reset(){end=false;time=60;round++;p1=F('JAX',Math.max(A.l+90,W*.28),1,'#55e8ff');p2=F('RIVAL',Math.min(A.r-90,W*.72),-1,'#ff667a');$('#round').textContent=round;banner('FIGHT')}function receipt(){let s=[p1.hp,p2.hp,p1.pr,p2.pr,round].join('|'),h=2166136261;for(const q of s){h^=q.charCodeAt(0);h=Math.imul(h,16777619)}$('#receiptBadge').textContent='RECEIPT: '+(h>>>0).toString(16)}function ai(dt){if(end||p2.hit)return;p2.guard=false;let d=p1.x-p2.x;p2.face=Math.sign(d)||-1;if(Math.abs(d)>115)p2.vx=Math.sign(d)*115;else{p2.vx=0;if(Math.random()<dt*1.8)strike(p2,p1);else if(Math.random()<dt*.8){p2.guard=true;st(p2,'GUARD',.15)}}if(p2.pr>=100&&Math.random()<dt*.7)burst(p2,p1)}function upd(f,dt){f.st=Math.max(0,f.st-dt);f.hit=Math.max(0,f.hit-dt);f.atk=Math.max(0,f.atk-dt);if(!f.st&&!end&&!f.guard)st(f,Math.abs(f.vx)>1?'MOVE':'IDLE',.05);f.x=cl(f.x+f.vx*dt,A.l-45,A.r+45);f.vx*=Math.pow(.002,dt)}function player(){if(end)return;p1.guard=keys.has('guard');if(p1.hit)return;if(p1.guard){st(p1,'GUARD',.08);p1.vx=0}else{let d=(keys.has('right')?1:0)-(keys.has('left')?1:0);p1.vx=d*190;p1.face=(p2.x-p1.x)>=0?1:-1}}function arena(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#102a48');g.addColorStop(.58,'#071321');g.addColorStop(1,'#02050a');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(shake?(Math.random()-.5)*shake:0,shake?(Math.random()-.5)*shake:0);let fy=A.f+22;x.fillStyle='#101b2b';x.beginPath();x.moveTo(40,fy);x.lineTo(W-40,fy);x.lineTo(W-120,H);x.lineTo(120,H);x.closePath();x.fill();x.strokeStyle='#2a4d6a';x.lineWidth=2;for(let i=0;i<10;i++){let q=80+i*(W-160)/9;x.beginPath();x.moveTo(q,fy);x.lineTo(W/2+(q-W/2)*1.35,H);x.stroke()}for(let i=0;i<5;i++){let y=fy+i*(H-fy)/4;x.beginPath();x.moveTo(80-i*10,y);x.lineTo(W-80+i*10,y);x.stroke()}x.fillStyle='#8fdcff18';x.fillRect(A.l,A.f-4,A.r-A.l,5)}function fighter(f){let y=A.f,lean=f.state==='STRIKE'?f.face*14:0,g=f.state==='GUARD',hit=['HIT','LAUNCHED'].includes(f.state);x.save();x.translate(f.x+lean,y);if(hit)x.rotate(-f.face*.16);x.shadowColor=f.col;x.shadowBlur=18;x.fillStyle='#0008';x.beginPath();x.ellipse(0,12,34,10,0,0,Math.PI*2);x.fill();x.shadowBlur=12;x.fillStyle=f.col;x.fillRect(-18,-86,36,52);x.fillStyle='#d9f8ff';x.fillRect(-13,-112,26,26);x.strokeStyle=f.col;x.lineWidth=11;x.lineCap='round';x.beginPath();x.moveTo(-8,-35);x.lineTo(-20,-2);x.moveTo(8,-35);x.lineTo(20,-2);x.moveTo(-14,-75);x.lineTo(g?-34:-24,-52);x.moveTo(14,-75);x.lineTo(f.state==='STRIKE'?f.face*62:g?34:24,f.state==='STRIKE'?-67:-52);x.stroke();if(g){x.strokeStyle='#9edcff';x.lineWidth=5;x.beginPath();x.arc(f.face*28,-68,33,-1.2,1.2);x.stroke()}x.fillStyle='#041018';x.font='900 12px system-ui';x.textAlign='center';x.fillText(f.id,0,-72);x.restore()}function particles(dt){for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;if(p.l<=0){parts.splice(i,1);continue}x.globalAlpha=Math.min(1,p.l*3);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.z,p.z)}x.globalAlpha=1}function draw(dt){arena();fighter(p1);fighter(p2);particles(dt);x.restore();if(flash>0){x.fillStyle='#fff6';x.fillRect(0,0,W,H)}}function hud(){for(const [id,f] of [['p1',p1],['p2',p2]]){$('#'+id+'hp').style.width=f.hp+'%';$('#'+id+'pr').style.width=f.pr+'%';$('#'+id+'State').textContent=f.state}$('#timer').textContent=Math.max(0,Math.ceil(time))}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(!end){time-=dt;if(time<=0)finish(p1.hp>=p2.hp?p1:p2,p1.hp>=p2.hp?p2:p1)}player();ai(dt);upd(p1,dt);upd(p2,dt);shake*=.82;flash=Math.max(0,flash-dt);draw(dt);hud();requestAnimationFrame(loop)}function hold(el,k){let on=e=>{e.preventDefault();keys.add(k);el.classList.add('active')},off=e=>{e.preventDefault();keys.delete(k);el.classList.remove('active')};el.onpointerdown=on;el.onpointerup=el.onpointercancel=el.onpointerleave=off}document.querySelectorAll('[data-hold]').forEach(e=>hold(e,e.dataset.hold));document.querySelectorAll('[data-action]').forEach(e=>e.onpointerdown=q=>{q.preventDefault();e.dataset.action==='strike'?strike(p1,p2):burst(p1,p2)});addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['a','arrowleft'].includes(k))keys.add('left');if(['d','arrowright'].includes(k))keys.add('right');if(k==='k')keys.add('guard');if(k==='j')strike(p1,p2);if(k==='l')burst(p1,p2)});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['a','arrowleft'].includes(k))keys.delete('left');if(['d','arrowright'].includes(k))keys.delete('right');if(k==='k')keys.delete('guard')});$('#reset').onclick=reset;rz();reset();requestAnimationFrame(loop)})();
</script></body></html>
