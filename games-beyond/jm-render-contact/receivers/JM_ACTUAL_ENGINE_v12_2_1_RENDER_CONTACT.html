  gl.uniform4fv(R.locations.uColor,new Float32Array(col));
  gl.uniform1f(R.locations.uSelected,o.selected?1:0);
  gl.drawArrays(gl.TRIANGLES,0,m.count);
  R.jmRenderStats.draws++;
}
function drawFloor(vp){
  const o={mesh:"cube",pos:[0,-4.75,0],rot:[0,0,0],scale:[5.2,.08,5.2],color:[.05,.10,.16,1],selected:false};
  drawMesh(o,vp);
}
function project(vp,pos,w,h){
  const q=transformPoint(vp,pos);
  if(!q[3]||q[3]<=0)return null;
  const nx=q[0]/q[3],ny=q[1]/q[3],nz=q[2]/q[3];
  if(nz<-1||nz>1)return null;
  return {x:(nx*.5+.5)*w,y:(1-(ny*.5+.5))*h,z:nz};
}
function drawLabels(scene,vp){
  const w=labelCanvas.clientWidth,h=labelCanvas.clientHeight;
  labelCtx.clearRect(0,0,w,h);
  const points=new Map();
  for(const o of scene.objects){
    const p=project(vp,o.pos,w,h);if(p)points.set(o.id,p);
  }
  labelCtx.lineWidth=1.2;
  for(const link of scene.links){
    const a=points.get(link.from),b=points.get(link.to);if(!a||!b)continue;
    const g=labelCtx.createLinearGradient(a.x,a.y,b.x,b.y);
    g.addColorStop(0,"rgba(103,232,249,.35)");g.addColorStop(1,"rgba(251,191,36,.24)");
    labelCtx.strokeStyle=g;labelCtx.beginPath();labelCtx.moveTo(a.x,a.y);labelCtx.lineTo(b.x,b.y);labelCtx.stroke();
  }
  labelCtx.textAlign="center";labelCtx.textBaseline="middle";
  for(const o of scene.objects){
    const p=points.get(o.id);if(!p)continue;
    labelCtx.font=o.selected?"800 12px system-ui":"700 10px system-ui";
    const label=`${o.short||o.name} · ${Math.round(o.energy)}`;
    const mw=labelCtx.measureText(label).width+12;
    labelCtx.fillStyle=o.selected?"rgba(3,8,20,.92)":"rgba(3,8,20,.66)";
    labelCtx.fillRect(p.x-mw/2,p.y-28,mw,18);
    labelCtx.strokeStyle=o.selected?"rgba(103,232,249,.9)":"rgba(255,255,255,.16)";
    labelCtx.strokeRect(p.x-mw/2,p.y-28,mw,18);
    labelCtx.fillStyle="#f8fbff";labelCtx.fillText(label,p.x,p.y-19);
  }
}
function render3D(){
  const jmFrameStarted=performance.now();
  R.jmRenderStats.draws=0;R.jmRenderStats.bufferBindCalls=0;R.jmRenderStats.meshSwitches=0;R.jmRenderStats.normalUniforms=0;
  resize3D();
  if(!R.webglRunning){
    badge.textContent=`WebGL HOLD · ${R.fallback||"unavailable"} · 2D remains authoritative`;
    return;
  }
  const gl=R.gl,scene=sceneFromLive(),vp=viewProjection();
  gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);
  gl.clearColor(.012,.025,.055,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(R.program);
  gl.uniform3fv(R.locations.uLight,new Float32Array(vec3Norm([.45,.88,.52])));
  drawFloor(vp);
  for(const o of scene.objects)drawMesh(o,vp);
  drawLabels(scene,vp);
  R.jmRenderStats.frames++;
  R.jmRenderStats.glRenderMs=Math.max(0,performance.now()-jmFrameStarted);
  badge.textContent=
    `WebGL RUNNING · ${scene.objects.length} bodies · ${scene.links.length} routes · `+
    `scene ${scene.scene_hash} · selected ${scene.selected_id||"—"}`;
}
function setMode(mode){
  R.mode=mode==="3d"?"3d":"2d";
  stage.classList.toggle("render3d",R.mode==="3d");
  buttons.d2.classList.toggle("active",R.mode==="2d");
  buttons.d3.classList.toggle("active",R.mode==="3d");
  if(R.mode==="3d")render3D();
  App.log("RENDER_MODE",R.mode==="3d"?"REAL 3D":"LIVE 2D");
}
function resetCamera(){
  R.camera={yaw:.62,pitch:-.34,distance:10.2,fov:56};
  if(R.mode==="3d")render3D();
  App.log("CAMERA_RESET","v12.1 3D camera reset");
}
function syncCheck(){
  const rect=glCanvas.getBoundingClientRect();
  const a=Core.liveTo3D(App.data,App.selected,{w:Math.max(1,rect.width),h:Math.max(1,rect.height)},App.frame);
  const b=Core.liveTo3D(App.data,App.selected,{w:Math.max(1,rect.width),h:Math.max(1,rect.height)},App.frame);
  R.syncPass=a.scene_hash===b.scene_hash&&a.objects.length===App.data.objects.length&&a.selected_id===App.data.objects[App.selected]?.id;
  buttons.sync.classList.toggle("active",R.syncPass);
  buttons.sync.textContent=R.syncPass?"SYNC DING":"SYNC HOLD";
  badge.textContent=`STATE↔RENDER ${R.syncPass?"DING":"HOLD"} · ${a.scene_hash}`;
  App.log("RENDER_SYNC",R.syncPass?`DING ${a.scene_hash}`:"HOLD");
  return R.syncPass;
}

buttons.d2.onclick=()=>setMode("2d");
buttons.d3.onclick=()=>setMode("3d");
buttons.sync.onclick=()=>syncCheck();
buttons.reset.onclick=()=>resetCamera();

glCanvas.addEventListener("pointerdown",e=>{
  glCanvas.setPointerCapture?.(e.pointerId);
  R.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(R.pointers.size===2){
    const pts=[...R.pointers.values()];
    R.lastPinch=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  }
});
glCanvas.addEventListener("pointermove",e=>{
  const old=R.pointers.get(e.pointerId);if(!old)return;
  R.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(R.pointers.size===1){
    const dx=e.clientX-old.x,dy=e.clientY-old.y;
    R.camera.yaw+=dx*.007;
    R.camera.pitch=Math.max(-1.25,Math.min(1.08,R.camera.pitch+dy*.006));
  }else if(R.pointers.size===2){
    const pts=[...R.pointers.values()];
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(R.lastPinch){
      R.camera.distance=Math.max(4,Math.min(20,R.camera.distance-(d-R.lastPinch)*.025));
    }
    R.lastPinch=d;
  }
});
function pointerEnd(e){
  R.pointers.delete(e.pointerId);
  if(R.pointers.size<2)R.lastPinch=null;
}
glCanvas.addEventListener("pointerup",pointerEnd);
glCanvas.addEventListener("pointercancel",pointerEnd);
glCanvas.addEventListener("wheel",e=>{
  e.preventDefault();
  R.camera.distance=Math.max(4,Math.min(20,R.camera.distance+Math.sign(e.deltaY)*.55));
},{passive:false});

function loop(t){

window.JMActualDualRenderer=Object.freeze({

window.__JM_APP__={

<script id="jm-actual-engine-v12-2-closure">
(()=>{
'use strict';
const VERSION='12.2.0';
const PACK_SCHEMA='JM.ActualEngine.EnginePack/1.0';
const CONTRACT=Object.freeze({
  schema:'JM.EngineContract/1.0',
  engine:{id:'jm-actual-engine',name:'JM Actual Engine / Visual Engine',version:VERSION,class:'SOVEREIGN_CROSS_DOMAIN_VISUAL_RENDER_ENGINE'},
  purpose:'Translate one live visual-system state into multiple coherent render faces without importing a game identity.',
  inputs:['live object state','links','selection','view/camera state','bounded interaction'],
  capabilities:[
    'portrait-first living visual surface','2D canvas render face','WebGL render face with honest fallback','deterministic live-state → render-scene mapping',
    'shared-state dual-render synchronization','shape → mesh adaptation','touch orbit / pinch camera','safe-edge visual containment',
    'render receipts / trace','versioned snapshot / validate / restore'
  ],
  outputs:['visible 2D state','visible 3D projection','render receipt','recovery pack'],
  nonDependencies:['T-Boys','Core Clash','SS','LG','LL','any named game profile','HANDISCOVERED'],
  boundaries:['not commercial-grade 3D','not native GPU/API proof','not public deployment proof','not full physics simulator'],
  laws:['VISIBLE BODY FIRST; SYSTEM PROOF SECOND.','ONE LIVE STATE; MULTIPLE RENDER FACES.','RENDER DONATION != ENGINE IDENTITY MERGE.','WEBGL CONTEXT != COMMERCIAL 3D CROWN.','GAME PRESSURE MAY FORM AN ORGAN; GAME IDENTITY DOES NOT OWN THE ENGINE.']
});
const copy=v=>JSON.parse(JSON.stringify(v));
const cleanPack=p=>{const q=copy(p);delete q.integrity;return q};
const hash=v=>JMActualDualCore.hash(v);
function snapshot(){
  const rr=window.JMActualDualRenderer?.state||{};
  return {
    schema:'JM.ActualEngine.Snapshot/12.2',
    app:{data:copy(App.data),selected:App.selected,playing:!!App.playing,frame:Number(App.frame)||0,traces:copy(App.traces||[])},
    renderer:{mode:rr.mode||'2d',yaw:Number(rr.yaw)||0,pitch:Number(rr.pitch)||0,dist:Number(rr.dist)||0},
    capturedAt:new Date().toISOString()
  };
}
function pack(){
  const body={schema:PACK_SCHEMA,engine:'jm-actual-engine',version:VERSION,parent:'12.1.0',contract:CONTRACT,lineage:copy(JMActualDualCore.LINEAGE),snapshot:snapshot(),fingerprint:['v12.0-portrait-living-parent','v10-webgl-donor','v12.1-dual-render-rejoin','v12.2-neutral-contract','single-live-state','dual-render-faces','validated-recovery-roundtrip','game-identity-not-required']};
  body.integrity={algorithm:'FNV1A32-STABLE',hash:hash(body)};
  return body;
}
function validate(p){
  const checks=[];const add=(name,pass,detail='')=>checks.push({name,pass:!!pass,detail});
  add('schema',p?.schema===PACK_SCHEMA,p?.schema||'missing');
  add('engine',p?.engine==='jm-actual-engine',p?.engine||'missing');
  add('versioned',typeof p?.version==='string'&&/^12\\.2/.test(p.version),p?.version||'missing');
  add('state-body',Array.isArray(p?.snapshot?.app?.data?.objects)&&Array.isArray(p?.snapshot?.app?.data?.links),'objects + links');
  add('render-state',!!p?.snapshot?.renderer?.mode,p?.snapshot?.renderer?.mode||'missing');
  const got=p?.integrity?.hash||''; const want=hash(cleanPack(p));
  add('integrity',got===want,got+'/'+want);
  add('neutral-contract',Array.isArray(p?.contract?.nonDependencies)&&p.contract.nonDependencies.includes('T-Boys'),'game identity excluded');
  return {ok:checks.every(x=>x.pass),checks,expectedHash:want};
}
function restore(p){
  const v=validate(p); if(!v.ok) throw new Error('Recovery pack failed validation');
  const a=p.snapshot.app;
  App.data=copy(a.data);App.selected=Math.max(0,Math.min(App.data.objects.length-1,Number(a.selected)||0));App.playing=!!a.playing;App.frame=Number(a.frame)||0;App.traces=copy(a.traces||[]);
  const rs=p.snapshot.renderer||{}; const live=window.JMActualDualRenderer?.state;
  if(live){if(Number.isFinite(+rs.yaw))live.yaw=+rs.yaw;if(Number.isFinite(+rs.pitch))live.pitch=+rs.pitch;if(Number.isFinite(+rs.dist)&&+rs.dist>0)live.dist=+rs.dist;}
  if(rs.mode==='3d')window.__JM_APP__?.actions?.render3d?.();else window.__JM_APP__?.actions?.render2d?.();
  App.layout?.();App.keepIn?.();App.page?.(Math.max(0,Math.min(3,App.data.view?.screen||0)));App.save?.();
  return v;
}
function proof(){
  const checks=[];const add=(name,pass,detail='')=>checks.push({name,pass:!!pass,detail});
  try{
    const parent=JMActualDualCore.selfTest();add('dual-core-parent',parent.state==='DING'&&parent.passed===parent.total,`${parent.passed}/${parent.total}`);
    add('engine-contract',CONTRACT.schema==='JM.EngineContract/1.0'&&CONTRACT.capabilities.length>=8,`${CONTRACT.capabilities.length} capabilities`);
    add('game-neutral',CONTRACT.nonDependencies.includes('T-Boys')&&!CONTRACT.inputs.some(x=>/game profile/i.test(x)),'named game not required');
    const p=pack();const v=validate(JSON.parse(JSON.stringify(p)));add('pack-validates',v.ok,p.integrity.hash);
    const fp1=hash(p.snapshot.app.data);const wire=JSON.stringify(p);const q=JSON.parse(wire);const fp2=hash(q.snapshot.app.data);add('roundtrip-state',fp1===fp2,fp1+'/'+fp2);
    const scene=JMActualDualCore.liveTo3D(q.snapshot.app.data,Math.max(0,Math.min((q.snapshot.app.data.objects||[]).length-1,q.snapshot.app.selected||0)),{w:360,h:640},12);add('render-projection',scene?.objects?.length===(q.snapshot.app.data.objects||[]).length,`${scene?.objects?.length||0} projected`);
    add('recovery-contract',typeof restore==='function'&&v.checks.some(x=>x.name==='integrity'&&x.pass),'validate before restore');
    add('boundary-honest',CONTRACT.boundaries.some(x=>/not commercial-grade 3D/i.test(x)),'commercial crown excluded');
  }catch(e){add('closure-harness',false,String(e?.stack||e))}
  const passed=checks.filter(x=>x.pass).length;return {schema:'JM.ActualEngine.ClosureProof/12.2',version:VERSION,passed,total:checks.length,state:passed===checks.length?'FLAZ':'HOLD',checks};
}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),900)}
function show(obj){const el=document.getElementById('jmClosureRead');if(el)el.textContent=typeof obj==='string'?obj:JSON.stringify(obj,null,2)}
function openPanel(){document.getElementById('jmClosurePanel')?.classList.add('open');document.getElementById('jmClosurePanel')?.setAttribute('aria-hidden','false');show(proof())}
function closePanel(){document.getElementById('jmClosurePanel')?.classList.remove('open');document.getElementById('jmClosurePanel')?.setAttribute('aria-hidden','true')}
const originalSave=App.save.bind(App);
App.save=function(){originalSave();try{localStorage.setItem('JM_ACTUAL_ENGINE_v12_2_ENGINE_PACK',JSON.stringify(pack()))}catch(e){}};
const chip=document.getElementById('jmClosureChip');chip?.addEventListener('click',openPanel);chip?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel()}});
document.getElementById('jmClosureClose')?.addEventListener('click',closePanel);
document.getElementById('jmClosurePanel')?.addEventListener('click',e=>{if(e.target?.id==='jmClosurePanel')closePanel()});
document.getElementById('jmClosureContract')?.addEventListener('click',()=>{show(CONTRACT);download('JM_ACTUAL_ENGINE_v12_2_ENGINE_CONTRACT.json',JSON.stringify(CONTRACT,null,2))});
document.getElementById('jmClosureExport')?.addEventListener('click',()=>{const p=pack();show({status:'PACK EXPORTED',integrity:p.integrity,version:p.version});download('JM_ACTUAL_ENGINE_v12_2_RECOVERY_PACK.json',JSON.stringify(p,null,2))});
document.getElementById('jmClosureImport')?.addEventListener('click',()=>document.getElementById('jmClosureFile')?.click());
document.getElementById('jmClosureFile')?.addEventListener('change',async e=>{try{const f=e.target.files?.[0];if(!f)return;const p=JSON.parse(await f.text());const v=validate(p);if(!v.ok){show({status:'HOLD',validation:v});return}restore(p);show({status:'RESTORED',validation:v})}catch(err){show({status:'HOLD',error:String(err?.message||err)})}finally{e.target.value=''}});
document.getElementById('jmClosureProof')?.addEventListener('click',()=>show(proof()));
const p0=proof();chip.textContent=`${p0.state} 12.2 · ${p0.passed}/${p0.total}`;chip.style.borderColor=p0.state==='FLAZ'?'rgba(52,211,153,.62)':'rgba(251,191,36,.62)';
try{localStorage.setItem('JM_ACTUAL_ENGINE_v12_2_ENGINE_PACK',JSON.stringify(pack()))}catch(e){}
window.__JM_ACTUAL_ENGINE_CLOSURE__=Object.freeze({version:VERSION,contract:()=>copy(CONTRACT),snapshot,pack,validate,restore,proof});
window.dispatchEvent(new CustomEvent('jm-engine-closure-ready',{detail:{engine:'JM Actual Engine',version:VERSION,state:p0.state}}));
})();
