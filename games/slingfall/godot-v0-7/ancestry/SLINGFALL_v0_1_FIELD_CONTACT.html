<style>
:root{--bg:#091821;--panel:#102833;--edge:#356275;--teal:#60f4c9;--orange:#ff875f;--paper:#f3e9c9;--quiet:#aac1c3;--gold:#ffd27b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--paper);font:700 14px system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}#game{width:100%;height:100%;display:block;touch-action:none;background:#263b3c;cursor:crosshair}#vignette{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 42%,#07151b8a 100%)}.hud{position:fixed;inset:0;pointer-events:none;z-index:3}.top{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(9px,env(safe-area-inset-left));right:max(9px,env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.top>*{pointer-events:auto}.pill{background:#102936ec;border:1px solid #5c88916a;border-radius:14px;padding:8px 12px;box-shadow:0 5px 18px #061016ad;backdrop-filter:blur(9px)}.brand{font-size:21px;line-height:1;letter-spacing:1px;color:var(--paper);text-shadow:0 2px #06151c}.brand em{color:var(--gold);font-style:normal}.sub{color:#add3d1;font-size:9px;letter-spacing:2px;line-height:1.7;text-transform:uppercase}.scoreboard{display:flex;align-items:center;gap:10px;text-align:center;justify-content:center}.score{font-size:26px;font-weight:1000;line-height:1}.score.blue{color:var(--teal)}.score.red{color:var(--orange)}.time{font-size:20px}.topright{display:flex;gap:7px;align-items:center}.smallbtn{border:1px solid #7194949e;background:#193843e3;padding:10px 11px;border-radius:12px;min-height:41px}.smallbtn:active,.action:active{transform:scale(.97)}.resource{font-size:13px;white-space:nowrap}.resource strong{color:var(--gold)}.energybar{margin-top:4px;height:5px;border-radius:5px;background:#22424a;overflow:hidden;width:100px}.energybar>i{display:block;background:linear-gradient(90deg,#30a4a7,var(--teal));height:100%;width:100%;transition:width .1s}.bottom{position:absolute;bottom:max(9px,env(safe-area-inset-bottom));left:9px;right:9px;display:flex;align-items:flex-end;justify-content:center;gap:8px;flex-wrap:nowrap}.bottom>*{pointer-events:auto}.champion{position:relative;min-height:79px;width:clamp(89px,18vw,156px);padding:9px 7px 7px;border:1px solid #4f7884;background:linear-gradient(145deg,#19343eea,#0a1c27ed);border-radius:13px;text-align:left;box-shadow:0 3px 12px #041018bb;overflow:hidden}.champion.selected{border:2px solid var(--teal);box-shadow:0 0 0 1px #a4fff6,0 0 26px #39dbb64b;padding:8px 6px 6px}.champion:disabled{opacity:.75}.champion .num{position:absolute;top:8px;right:8px;color:#8cabad;font-size:10px}.champion .symbol{display:inline-flex;border-radius:8px;width:28px;height:28px;align-items:center;justify-content:center;font-size:18px;background:#284853;color:var(--gold)}.champion .name{display:block;font-size:13px;letter-spacing:.7px;margin-top:4px}.champion .status{display:block;font-size:10px;color:var(--teal);font-weight:800;white-space:nowrap}.champion .status.wait{color:#fbbb7b}.champion .status.field{color:#aed6e0}.bottom .action{width:112px;min-height:79px;background:#23464bdf;border:1px solid #6d9e9f;border-radius:13px;font-size:12px;text-align:center;padding:6px}.bottom .action b{display:block;font-size:21px;margin:3px}.bottom .action:disabled{opacity:.38}.toast{position:absolute;left:50%;top:21%;transform:translateX(-50%);background:#0c283cdd;border:1px solid #9bc7bc7a;border-radius:99px;padding:9px 18px;font-size:13px;letter-spacing:.3px;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1}.tip{position:absolute;bottom:103px;left:50%;transform:translateX(-50%);background:#061820af;color:#c7dcce;padding:6px 11px;border-radius:9px;font-size:11px;white-space:nowrap;pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:linear-gradient(#061720c9,#061720df);backdrop-filter:blur(8px);overflow-y:auto;touch-action:pan-y}.hidden{display:none!important}.sheet{border:1px solid #648e8e92;box-shadow:0 25px 70px #000b;background:linear-gradient(150deg,#1a3b45 0%,#0e212d 64%);border-radius:22px;width:min(550px,100%);max-height:95vh;overflow:auto;padding:clamp(18px,4vw,35px);position:relative}.crest{font-size:12px;letter-spacing:4px;color:var(--teal)}h1{font-size:clamp(40px,10vw,70px);letter-spacing:-2px;line-height:.94;margin:12px 0;color:#f5edd7;text-shadow:0 4px #071a21}h1 span{color:var(--gold)}h2{font-size:26px;margin:9px 0 12px}p{color:#bed0cc;line-height:1.5;font-weight:500}.tagline{font-size:16px;color:#f1e1b2}.btnrow{display:flex;gap:10px;margin-top:21px;flex-wrap:wrap}.primary,.secondary{border-radius:13px;padding:12px 17px;min-height:46px;border:1px solid #4a7980;background:#203b46;font-weight:900}.primary{color:#08252b;background:linear-gradient(130deg,#7af9d6,#addfbc);border-color:#adffe2;box-shadow:0 4px 20px #46cfaa3b}.secondary{background:#183641;color:#e6ece0}.primary:disabled{opacity:.4;cursor:default}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}.stat{background:#0b2530;border:1px solid #3b5c62;border-radius:12px;padding:12px 14px;flex:1;min-width:85px}.stat b{display:block;font-size:22px;color:var(--gold)}.stat small{display:block;color:#abcbcb;letter-spacing:.5px}.rowline{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #37576176}.roomtitle{color:#fbefcf;font-weight:900}.roomdesc{color:#aac5c4;font-size:12px;font-weight:500;margin-top:4px}.roomstatus{font-size:11px;color:var(--teal);white-space:nowrap}.roomstatus.locked{color:#758e94}.roomstatus.next{color:var(--gold)}.smallnote{font-size:11px;color:#91b0b2;margin-top:17px}.progress{height:8px;background:#223e43;border-radius:5px;overflow:hidden}.progress>i{display:block;background:linear-gradient(90deg,#59bdab,#ffe29c);height:100%;width:0}.resulttitle{color:var(--teal)}.resulttitle.loss{color:#ff9d7b}.help{background:#0b2932;border:1px solid #426669;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.7;font-weight:500;color:#d1ddd0}.kbd{background:#234651;border:1px solid #537177;border-radius:4px;padding:1px 6px}.help strong{color:var(--gold)}.bottom.hidehud,.top.hidehud,.tip.hidehud{display:none}
@media(max-width:660px){.brand{font-size:16px}.sub{font-size:7px;letter-spacing:1px}.pill{padding:6px 8px;border-radius:10px}.score{font-size:18px}.time{font-size:15px}.scoreboard{gap:5px}.topright{gap:4px}.smallbtn{padding:7px;min-height:32px;font-size:12px}.resource{font-size:10px}.energybar{width:64px}.champion{width:24vw;min-height:70px;padding:6px}.champion.selected{padding:5px}.champion .symbol{width:23px;height:22px;font-size:15px}.champion .name{font-size:10px}.champion .status{font-size:9px}.champion .num{font-size:8px}.bottom{gap:4px}.bottom .action{min-height:70px;width:70px;font-size:9px}.bottom .action b{font-size:17px}.tip{bottom:86px;font-size:9px}}
@media(max-height:440px){.champion,.bottom .action{min-height:52px}.champion .symbol{display:none}.champion .name{margin-top:7px}.tip{bottom:67px}.sheet{padding:15px}.top{top:4px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Slingfall animated battlefield"></canvas><div id="vignette"></div>
<div class="hud" id="hud">
 <div class="top" id="top">
  <div class="pill"><div class="brand">SLING<em>FALL</em></div><div class="sub">No Man's Landing // Sector 01</div></div>
  <div class="pill scoreboard"><div><div class="score blue" id="blueScore">0</div><div class="sub">YOU</div></div><div><div class="time" id="clock">02:00</div><div class="sub">HOLD ZONES</div></div><div><div class="score red" id="redScore">0</div><div class="sub">FOE</div></div></div>
  <div class="topright"><div class="pill resource">⚡ <strong id="energyNum">100</strong><div class="energybar"><i id="energyFill"></i></div></div><button class="smallbtn" id="ordersBtn" title="Squad rally" hidden>⚑ Rally</button><button class="smallbtn" id="pauseBtn" aria-label="Pause">Ⅱ</button></div>
 </div>
 <div class="toast" id="toast"></div><div class="tip" id="tip">Select a champion • drag anywhere on the field to aim • release to fling</div>
 <div class="bottom" id="bottom">
  <button class="champion selected" data-type="bulwark"><span class="num">1</span><span class="symbol">◆</span><span class="name">BULWARK</span><span class="status">READY • 32 ⚡</span></button>
  <button class="champion" data-type="dart"><span class="num">2</span><span class="symbol">➤</span><span class="name">DART</span><span class="status">READY • 26 ⚡</span></button>
  <button class="champion" data-type="warden"><span class="num">3</span><span class="symbol">✚</span><span class="name">WARDEN</span><span class="status">READY • 28 ⚡</span></button>
  <button class="action" id="recallBtn" disabled><b>↶</b>RECALL</button>
 </div>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<script>
(()=>{'use strict';
// SLINGFALL field-contact build. Self-contained canvas renderer + state mechanics; no external runtime dependency.
const W=1200,H=700,MAXTIME=140,GOAL=105,SAVEKEY='jm.slingfall.v01.profile',BATTLEKEY='jm.slingfall.v01.battle';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),overlay=$('overlay'),sheet=$('sheet');
const TYPES={bulwark:{name:'Bulwark',cost:32,hp:160,speed:61,power:1.25,dmg:17,range:64,cool:1.0,symbol:'◆',desc:'Heavy shockwave • holds territory'},dart:{name:'Dart',cost:26,hp:90,speed:125,power:1.75,dmg:12,range:56,cool:.66,symbol:'➤',desc:'Fast entry • steals territory'},warden:{name:'Warden',cost:28,hp:125,speed:69,power:1.3,dmg:11,range:75,cool:1.05,symbol:'✚',desc:'Landing shield • heals allies'}};
const ZONES=[{id:'RIDGE',x:448,y:216,r:79,mult:.95},{id:'CROSSROADS',x:608,y:351,r:91,mult:1.55},{id:'SUPPLY',x:755,y:488,r:79,mult:1.13}];
const COLORS={blue:'#67f3cb',red:'#ff8b67',neutral:'#e9c99b'};
const INITIAL={scrap:0,wins:0,losses:0,matches:0,level:1,unlocks:[],best:0};
const safeParse=(key)=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):null}catch{return null}};
const store=(key,obj)=>{try{localStorage.setItem(key,JSON.stringify(obj));return true}catch{return false}};
const clearBattle=()=>{try{localStorage.removeItem(BATTLEKEY)}catch{}};
function validProfile(p){return p&&Number.isFinite(p.scrap)&&Number.isFinite(p.level)&&p.level>=1&&p.level<=3}
let profile=validProfile(safeParse(SAVEKEY))?{...INITIAL,...safeParse(SAVEKEY)}:{...INITIAL};
let state='menu',battle=null,view={w:0,h:0,s:1,ox:0,oy:0},last=performance.now(),frame=0,preview=null,pointer=null,toastUntil=0,toastText='',selected='bulwark',rally=false,shake=0,decor=[],particles=[],floaters=[],clouds=[];
let uid=1,rngSeed=940715;
function rand(){rngSeed=(Math.imul(1664525,rngSeed)+1013904223)>>>0;return rngSeed/4294967296}
const rr=(a,b)=>a+rand()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function scenery(){rngSeed=314159;decor=[];clouds=[];for(let i=0;i<400;i++){let x=rr(230,970),y=rr(76,616);decor.push({x,y,s:rr(1,7),t:rand()})}for(let i=0;i<27;i++)clouds.push({x:rr(-250,1450),y:rr(-30,230),r:rr(60,150),a:rr(.018,.065)});rngSeed=940715}
scenery();
function prepCanvas(){const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(view.w!==w||view.h!==h||canvas.width!==Math.round(w*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}view={w,h,dpr,s:Math.min(w/W,h/H),ox:(w-W*Math.min(w/W,h/H))/2,oy:(h-H*Math.min(w/W,h/H))/2};}
function screenToWorld(cx,cy){return {x:(cx-view.ox)/view.s,y:(cy-view.oy)/view.s}}
function positiveCost(type){return Math.max(16,TYPES[type].cost-(profile.level>=3?4:0))}
function newBattle(){uid=1;const b={elapsed:0,score:{blue:0,red:0},energy:{blue:100,red:100},zones:ZONES.map(z=>({...z,control:0,owner:null,prevOwner:null})),heroes:[],slots:{blue:{},red:{}},enemyTick:2.8,seconds:0,events:[],captures:{blue:0,red:0},ended:false};for(const t of Object.keys(TYPES)){b.slots.blue[t]={active:null,readyAt:0};b.slots.red[t]={active:null,readyAt:0}}return b}
function alertMsg(msg,sec=2.2){toastText=msg;toastUntil=performance.now()/1000+sec;const t=$('toast');t.textContent=msg;t.classList.add('show')}
function popup(x,y,msg,color=COLORS.neutral){floaters.push({x,y,txt:msg,color,ttl:1.2,ma:1.2});if(floaters.length>25)floaters.shift()}
function burst(x,y,color,n=16,power=1){for(let i=0;i<n&&particles.length<210;i++){let a=rr(0,Math.PI*2),sp=rr(40,190)*power;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:rr(70,180),z:0,life:rr(.45,.95),max:1,color,r:rr(2,5)})}}
function saveSkirmish(){if(state==='playing'||state==='paused'){if(battle&&!battle.ended)store(BATTLEKEY,{version:1,battle,selected,at:Date.now()})}}
function resumeBattle(){const s=safeParse(BATTLEKEY);if(!s||s.version!==1||!s.battle||!Array.isArray(s.battle.zones)||s.battle.zones.length!==3||!Array.isArray(s.battle.heroes))return false;const b=s.battle;if(!b.slots||!b.score||!b.energy||!Number.isFinite(b.elapsed))return false;battle=b;uid=Math.max(1,...battle.heroes.map(h=>h.id+1));selected=TYPES[s.selected]?s.selected:'bulwark';state='playing';hideOverlay();syncUI();alertMsg('SKIRMISH RESTORED');return true}
function startBattle(){battle=newBattle();clearBattle();selected='bulwark';state='playing';preview=null;pointer=null;rally=false;hideOverlay();syncUI();alertMsg('FRONTLINE ACTIVE — SECURE THE ZONES',3)}
function hideOverlay(){overlay.classList.add('hidden');$('top').classList.remove('hidehud');$('bottom').classList.remove('hidehud');$('tip').classList.remove('hidehud')}
function showOverlay(){overlay.classList.remove('hidden');$('top').classList.add('hidehud');$('bottom').classList.add('hidehud');$('tip').classList.add('hidehud')}
function menu(){state='menu';showOverlay();const saved=safeParse(BATTLEKEY);sheet.innerHTML=`<div class="crest">JM // FRONTLINE SYSTEMS</div><h1>SLING<span>FALL</span></h1><p class="tagline">Command the frontline. Fling over the wire. Claim the ground.</p><div class="help"><strong>HOW TO PLAY</strong><br>Choose a champion at the bottom. Drag across the battlefield to choose a landing point, then release to fling.<br>Capture glowing zones and hold them to score. Fight enemies automatically. Tap an active champion card, then tap the field to redirect them. Recover champions with RECALL.</div><div class="stats"><div class="stat"><b>${profile.wins}</b><small>VICTORIES</small></div><div class="stat"><b>${profile.scrap}</b><small>SCRAP</small></div><div class="stat"><b>${profile.level}</b><small>BUNKER LVL</small></div></div><div class="btnrow"><button class="primary" id="startNew">▶ DEPLOY</button>${saved?.battle&&!saved.battle.ended?'<button class="secondary" id="continue">↻ RESUME MATCH</button>':''}<button class="secondary" id="bunker">▤ BUNKER</button></div><p class="smallnote">Offline • One HTML file • Auto-saves matches on this device • Best played landscape</p>`;$('startNew').onclick=startBattle;if($('continue'))$('continue').onclick=()=>{if(!resumeBattle())startBattle()};$('bunker').onclick=bunkerScreen}
function bunkerScreen(){state='bunker';showOverlay();const rooms=[['FORWARD POST','Basic launch array • three champions',1],['SIGNAL ROOM','Rally your full squad to a selected zone',2],['LAUNCH BAY','+15% deployment energy regeneration • cheaper launches',3],['ARMOURY','Advanced loadouts',4],['COMMAND BUNKER','Elite operations and defence',5],['DEEP COMMAND','Future Drop-In capsules',6]];const cost=profile.level===1?45:profile.level===2?90:null;sheet.innerHTML=`<div class="crest">THE UNDERGROUND WAR</div><h2>COMMAND BUNKER</h2><p>Win matches and hold territory to salvage Scrap. Restore real facilities to improve your next skirmish.</p><div class="stats"><div class="stat"><b>${profile.scrap}</b><small>AVAILABLE SCRAP</small></div><div class="stat"><b>0${profile.level}</b><small>DEPTH LEVEL</small></div><div class="stat"><b>${profile.matches}</b><small>DEPLOYMENTS</small></div></div><div class="progress"><i style="width:${profile.level/6*100}%"></i></div><div style="margin-top:12px">${rooms.map(([name,desc,level])=>`<div class="rowline"><div><div class="roomtitle">${level<profile.level?'✓ ':level===profile.level?'◆ ':'◇ '}${String(level).padStart(2,'0')} // ${name}</div><div class="roomdesc">${desc}</div></div><span class="roomstatus ${level>profile.level?(level===profile.level+1&&level<=3?'next':'locked'):''}">${level<=profile.level?'ACTIVE':level===profile.level+1&&level<=3?'NEXT':'FUTURE'}</span></div>`).join('')}</div><div class="btnrow">${cost!==null?`<button class="primary" id="upgrade" ${profile.scrap<cost?'disabled':''}>RESTORE NEXT ROOM • ${cost} ◈</button>`:''}<button class="secondary" id="bunkerBack">← BACK</button></div><p class="smallnote">Rooms 4–6 are planned and are not falsely marked playable. Progress is saved locally on this device.</p>`;$('bunkerBack').onclick=menu;if($('upgrade'))$('upgrade').onclick=()=>{if(profile.level>=3)return;const price=profile.level===1?45:90;if(profile.scrap<price)return;profile.scrap-=price;profile.level++;store(SAVEKEY,profile);bunkerScreen()}}
function togglePause(){if(state==='playing'){state='paused';saveSkirmish();showOverlay();sheet.innerHTML=`<div class="crest">FIELD COMMAND</div><h2>SKIRMISH PAUSED</h2><p>The battlefield is frozen. Your ongoing match is saved and can be resumed after reopening the file on this device.</p><div class="btnrow"><button class="primary" id="go">▶ CONTINUE</button><button class="secondary" id="leave">⌂ RETURN TO POST</button></div><p class="smallnote">ESC pauses • 1 / 2 / 3 selects champions • R rallies after Signal Room</p>`;$('go').onclick=()=>{state='playing';hideOverlay();last=performance.now()};$('leave').onclick=menu}else if(state==='paused'){state='playing';hideOverlay();last=performance.now()}}
function finish(){if(!battle||battle.ended)return;const blue=battle.score.blue,red=battle.score.red,win=blue>=GOAL||(battle.elapsed>=MAXTIME&&blue>=red&&!(red>=GOAL));battle.ended=true;state='result';clearBattle();profile.matches++;profile[win?'wins':'losses']++;profile.best=Math.max(profile.best,Math.round(blue));const earned=Math.round(12+(win?26:8)+battle.captures.blue*5+Math.floor(blue/25)*2);profile.scrap+=earned;store(SAVEKEY,profile);showOverlay();sheet.innerHTML=`<div class="crest">AFTER ACTION REPORT // SECTOR 01</div><h1 class="resulttitle ${win?'':'loss'}">${win?'VICTORY':'DEFEAT'}</h1><p class="tagline">${win?'The line holds. The bunker grows.':'Fall back. Regroup. The frontline remains contested.'}</p><div class="stats"><div class="stat"><b>${Math.floor(blue)}–${Math.floor(red)}</b><small>FINAL SCORE</small></div><div class="stat"><b>${battle.captures.blue}</b><small>YOUR CAPTURES</small></div><div class="stat"><b>+${earned}</b><small>SCRAP SALVAGED</small></div></div><div class="btnrow"><button class="primary" id="retry">↻ NEW SKIRMISH</button><button class="secondary" id="bunk">▤ VISIT BUNKER</button><button class="secondary" id="home">⌂ HOME</button></div>`;$('retry').onclick=startBattle;$('bunk').onclick=bunkerScreen;$('home').onclick=menu}
function getHero(id){return battle?.heroes.find(h=>h.id===id&&h.hp>0&&!h.leaving)}
function nearestZone(x,y,team){const sorted=battle.zones.map(z=>({z,n:Math.hypot(z.x-x,z.y-y)+(z.owner===team?230:0)})).sort((a,b)=>a.n-b.n);return sorted[0].z}

function fieldDown(ev){if(state!=='playing'||!battle||ev.button>0)return;const rect=canvas.getBoundingClientRect(),p=screenToWorld(ev.clientX-rect.left,ev.clientY-rect.top);if(p.x<5||p.x>W-5||p.y<50||p.y>H-12)return;ev.preventDefault();clickCaptureId=ev.pointerId;try{canvas.setPointerCapture(ev.pointerId)}catch{}pointer={id:ev.pointerId,down:p,now:p,moved:false};if(!rally&&!battle.slots.blue[selected].active&&battle.slots.blue[selected].readyAt<=battle.elapsed){preview=p}else preview=null}
function fieldMove(ev){if(state!=='playing'||!pointer||pointer.id!==ev.pointerId)return;const rect=canvas.getBoundingClientRect(),p=screenToWorld(ev.clientX-rect.left,ev.clientY-rect.top);pointer.now=p;if(dist(pointer.down,p)>15)pointer.moved=true;if(preview)preview=p}
function fieldUp(ev){if(state!=='playing'||!pointer||pointer.id!==ev.pointerId)return;const p=pointer.now;const move=pointer.moved;pointer=null;preview=null;clickCaptureId=null;if(rally){if(!issueOrder(p))alertMsg('TAP NEAR A CAPTURE ZONE',1.25);return}const slot=battle.slots.blue[selected];if(slot.active){if(!issueOrder(p))alertMsg('TAP A GLOWING ZONE TO GIVE AN ORDER',1.3);return}if(slot.readyAt>battle.elapsed){alertMsg('CHAMPION RECOVERING',1.2);return}if(battle.energy.blue<positiveCost(selected)){alertMsg('NOT ENOUGH ENERGY',1.2);return}if(p.x<250||p.x>956||p.y<80||p.y>629){alertMsg('AIM FOR NO MAN’S LANDING',1.2);return}if(deploy('blue',selected,p)){const ready=Object.keys(TYPES).find(t=>!battle.slots.blue[t].active&&battle.slots.blue[t].readyAt<=battle.elapsed);if(ready)selected=ready;syncUI()} }
canvas.addEventListener('pointerdown',fieldDown);canvas.addEventListener('pointermove',fieldMove);canvas.addEventListener('pointerup',fieldUp);canvas.addEventListener('pointercancel',()=>{pointer=null;preview=null});
for(const b of document.querySelectorAll('.champion'))b.addEventListener('click',()=>selectType(b.dataset.type));$('pauseBtn').onclick=togglePause;$('ordersBtn').onclick=()=>{if(state!=='playing')return;rally=!rally;syncUI()};$('recallBtn').onclick=()=>{if(recHero('blue',selected)){alertMsg(selected.toUpperCase()+' EXTRACTED',1.2);syncUI()}};
window.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)&&state==='playing'){selectType(Object.keys(TYPES)[Number(e.key)-1])}else if(e.key==='Escape'){if(state==='paused'||state==='playing')togglePause()}else if(e.key.toLowerCase()==='r'&&state==='playing'&&profile.level>=2){rally=!rally;syncUI()} });
window.addEventListener('resize',prepCanvas);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){state='paused';saveSkirmish();togglePauseView()} });
function togglePauseView(){showOverlay();sheet.innerHTML='<div class="crest">FRONTLINE INTACT</div><h2>GAME PAUSED</h2><p>Match state saved. Your champions and zone progress are preserved on this device.</p><div class="btnrow"><button class="primary" id="resumeHidden">▶ RETURN TO SKIRMISH</button><button class="secondary" id="menuHidden">⌂ MAIN POST</button></div>';$('resumeHidden').onclick=()=>{state='playing';hideOverlay();last=performance.now()};$('menuHidden').onclick=menu}
function loop(now){const dt=Math.min(.07,(now-last)/1000||0);last=now;tick(dt);drawWorld(dt,now/1000);uiTimer+=dt;if(uiTimer>.17){uiTimer=0;if(state==='playing')syncUI()}$('toast').classList.toggle('show',performance.now()/1000<toastUntil);requestAnimationFrame(loop)}
// Read-only diagnostics are exposed for QA without modifying game state.
Object.defineProperty(window,'__slingfall',{value:Object.freeze({version:'0.1.0',getState:()=>state,getSnapshot:()=>battle?structuredClone(battle):null,getProfile:()=>({...profile}),getView:()=>({...view}),physicsPreview:(from,to)=>{const d=dist(from,to),T=clamp(d/385,1.03,2.25);return {flightSeconds:T,peakHeight:515*T*T/8,landing:{...to}}}})});
menu();prepCanvas();requestAnimationFrame(loop);
})();
</script>
