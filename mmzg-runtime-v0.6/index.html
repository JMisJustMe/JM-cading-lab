"runIt()">Execute Ding</button><button onclick="copyReceipt()">Copy receipt</button><button onclick="downloadReceipt()">Download receipt</button></div><div class="grid"><section><h2>Compiler</h2><pre id="compileOut">Ready.</pre></section><section><h2>Receipt</h2><pre id="receiptOut">No receipt yet.</pre></section></div></section><section><h2>Runtime state</h2><div class="row"><button onclick="showState()">Refresh</button><button onclick="resetState()">Reset</button><button onclick="selfTest()">Self-test</button></div><pre id="stateOut">Loading.</pre></section></main><script src="mmzg_runtime_core_v0_6.js"></script><script>let S=load(),LAST=null;function load(){try{return JSON.parse(localStorage.getItem('MMZG_BOUNDARY_v06'))||MMZG.state()}catch(e){return MMZG.state()}}function save(){localStorage.setItem('MMZG_BOUNDARY_v06',JSON.stringify(S))}function out(id,x){document.getElementById(id).textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function compileIt(){out('compileOut',MMZG.compile(document.getElementById('src').value))}function runIt(){let r=MMZG.exec(document.getElementById('src').value,S);S=r.state;LAST=r.receipt;save();out('compileOut',r.compiled);out('receiptOut',r.receipt);showState()}function showState(){out('stateOut',S)}function resetState(){S=MMZG.state();LAST=null;save();showState()}function selfTest(){out('stateOut',MMZG.selftest())}function dl(name,obj){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function downloadReceipt(){if(!LAST)return alert('Run first');dl(LAST.receiptId+'.json',LAST)}function copyReceipt(){navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('receiptOut').textContent)}showState();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service_worker.js').catch(()=>{});</script></body></html>
