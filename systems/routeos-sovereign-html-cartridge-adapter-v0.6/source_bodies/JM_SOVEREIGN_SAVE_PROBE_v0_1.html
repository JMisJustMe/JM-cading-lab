<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JM Sovereign Save Probe v0.1</title><style>body{font-family:system-ui;background:#0b1020;color:#eef3ff;padding:24px}button{padding:12px 16px;margin:6px;background:#5d7cff;color:white;border:0;border-radius:12px}.card{max-width:620px;background:#151d36;padding:20px;border-radius:18px}.ok{color:#82f0b2}</style></head><body><div class="card"><h1>JM Sovereign Save Probe</h1><p id="status">READY</p><button id="writeSave">WRITE SAVE</button><button id="increment">INCREMENT</button><pre id="value"></pre></div><script>(()=>{const KEY='JM_SOVEREIGN_SAVE_PROBE';let count=0;const status=document.getElementById('status'),value=document.getElementById('value');function render(){value.textContent=localStorage.getItem(KEY)||'EMPTY'}function write(){count++;localStorage.setItem(KEY,JSON.stringify({body:'jm.sovereign.save-probe',count,keeper:'Connected is not collapsed.'}));status.textContent='SAVE WRITTEN '+count;render()}document.getElementById('writeSave').onclick=write;document.getElementById('increment').onclick=write;addEventListener('jm-console-hold',()=>status.textContent='HELD');addEventListener('jm-console-resume',()=>status.textContent='RESUMED');addEventListener('jm-console-action',e=>{status.textContent='ACTION '+String(e.detail?.action||'UNKNOWN');});render();window.__JM_PROBE__={KEY,write,render,get count(){return count}}})();</script></body></html>
