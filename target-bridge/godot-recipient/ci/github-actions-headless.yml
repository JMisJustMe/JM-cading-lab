name: JM Target Bridge Godot recipient CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'target-bridge/godot-recipient/**'
  pull_request:
    paths:
      - 'target-bridge/godot-recipient/**'
jobs:
  godot-offline-and-headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Registered-source offline checks
        run: python3 target-bridge/godot-recipient/tests/test_bridge.py
      - name: Obtain Godot 4.7.2 editor binary
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          GODOT_BIN=$(find /tmp -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Native import / GDScript parse
        run: |
          "$GODOT_BIN" --headless --editor --path target-bridge/godot-recipient --import --quit
      - name: Native bounded logic regression
        run: |
          "$GODOT_BIN" --headless --path target-bridge/godot-recipient --script res://tests/host_logic_test.gd
