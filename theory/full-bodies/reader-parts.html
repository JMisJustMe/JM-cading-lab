<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071019"><title>JM Theory Full-Body Reader</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;--b:#050910;--l:#294158;--i:#f5fbff;--m:#adbdca;--c:#6ee7ff;--g:#ffd86f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#0d2b44,transparent 30%),var(--b);color:var(--i)}header{position:sticky;top:0;z-index:5;background:#050910ee;border-bottom:1px solid var(--l);padding:11px 14px;display:flex;gap:8px}.btn{min-height:46px;border:1px solid var(--l);border-radius:12px;padding:10px 13px;background:#102033;color:var(--i);font-weight:800;text-decoration:none;cursor:pointer;touch-action:manipulation}.sp{flex:1}main{max-width:980px;margin:auto;padding:22px 14px 90px}.hero,.body{border:1px solid var(--l);border-radius:18px;background:linear-gradient(145deg,#102033,#09121d)}.hero{padding:clamp(19px,4vw,36px);margin-bottom:13px}.tag{display:inline-block;border:1px solid #397454;color:#9ff5c1;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.hero h1{font-size:clamp(34px,7vw,62px);line-height:.98;letter-spacing:-.045em;margin:12px 0}.hero p{color:var(--m);line-height:1.55}.keep{border-left:3px solid var(--g);padding-left:13px;color:#ffeab0;font-weight:800}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.tools input{flex:1 1 220px;min-height:46px;border:1px solid var(--l);border-radius:12px;background:#07111c;color:var(--i);padding:11px}.head{padding:11px 15px;border-bottom:1px solid var(--l);color:var(--m);font-size:12px;display:flex;justify-content:space-between;gap:8px}.txt{margin:0;padding:clamp(18px,3vw,32px);white-space:pre-wrap;overflow-wrap:anywhere;font:500 16px/1.7 system-ui,sans-serif;color:#d7e1e9}.txt mark{background:#725b18;color:#fff2bb}.err{color:#ffc5c5}@media(max-width:600px){.txt{font-size:15px;padding:18px 15px}.head{flex-direction:column}}</style><header><a class="btn" href="./">← Vault</a><a class="btn" href="../">Theory Wing</a><span class="sp"></span><button class="btn" id="printButton" type="button">Print</button></header><main><section class="hero"><span class="tag" id="statusLabel">Full source body</span><h1 id="bodyTitle">Opening body…</h1><p id="bodyMeta">Loading source segments.</p><div class="keep">The body is where the door says it is.</div><div class="tools"><input id="bodySearch" type="search" placeholder="Find inside this body…" aria-label="Find inside this body"><button class="btn" id="clearSearch" type="button">Clear</button></div></section><section class="body"><div class="head"><span id="sourceLabel">Segmented source body</span><span id="bodyCount"></span></div><pre class="txt" id="bodyText">Opening full body…</pre></section></main><script>'use strict';const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);const base=p.get('base')||'';const parts=Math.max(1,Math.min(99,Number(p.get('parts')||1)));const title=p.get('title')||'JM Theory Full Body';const valid=/^[a-z0-9-]+$/i.test(base);const textEl=$('bodyText');let raw='';$('bodyTitle').textContent=title;document.title=title+' — JM Theory Vault';$('statusLabel').textContent=p.get('status')||'Full source body';function render(needle=''){textEl.textContent=raw;$('bodyCount').textContent=raw?`${raw.split(/\s+/).filter(Boolean).length.toLocaleString()} words · ${parts} source parts`:'';if(!needle)return;const lower=raw.toLowerCase(),query=needle.toLowerCase();let cursor=0,hit=lower.indexOf(query);if(hit<0)return;textEl.textContent='';while(hit>=0){textEl.append(document.createTextNode(raw.slice(cursor,hit)));const mark=document.createElement('mark');mark.textContent=raw.slice(hit,hit+needle.length);textEl.append(mark);cursor=hit+needle.length;hit=lower.indexOf(query,cursor)}textEl.append(document.createTextNode(raw.slice(cursor)));textEl.querySelector('mark')?.scrollIntoView({block:'center'})}if(!valid){textEl.textContent='Invalid source route.';textEl.classList.add('err')}else{Promise.all(Array.from({length:parts},(_,i)=>fetch(`${base}/part-${String(i+1).padStart(2,'0')}.txt`,{cache:'no-store'}).then(response=>{if(!response.ok)throw Error(`part ${i+1} returned ${response.status}`);return response.text()}))).then(chunks=>{raw=chunks.join('');$('sourceLabel').textContent=`${base} · ${parts} verified parts`;$('bodyMeta').textContent='Recovered owner-controlled source text · readable in full';render()}).catch(error=>{textEl.textContent='Source failed: '+error.message;textEl.classList.add('err');$('bodyMeta').textContent='One or more source segments did not open.'})}$('bodySearch').addEventListener('input',event=>render(event.target.value.trim()));$('clearSearch').addEventListener('click',()=>{$('bodySearch').value='';render();window.scrollTo({top:0,behavior:'smooth'})});$('printButton').addEventListener('click',()=>window.print());</script>
