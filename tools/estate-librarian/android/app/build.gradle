plugins { id 'com.android.application' }

android {
    namespace 'com.jmestate.librarian'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jmestate.librarian.v041a'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.4.1A'
    }

    buildTypes {
        debug {
            // Independent OPPO CP03 proof app: never upgrade or replace the preserved v0.4.1A identity.
            applicationIdSuffix '.cp03'
            versionNameSuffix '-CP03-TEST'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
