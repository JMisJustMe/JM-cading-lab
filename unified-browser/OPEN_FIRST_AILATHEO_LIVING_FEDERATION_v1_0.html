<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10">
<title>AILatheo — Living Federation</title>
<style>
:root{--bg:#05090f;--glass:#0b1420e8;--line:#26384d;--text:#f4f7fb;--muted:#93a4b8;--gold:#e7bc69;--cyan:#75ddff;--green:#78f0aa;--amber:#ffd166;--red:#ff8080}
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,textarea{font:inherit;color:inherit}button{touch-action:manipulation}.app{width:100%;max-width:100vw;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:10px;background:radial-gradient(circle at 50% -20%,#18304d 0,transparent 44%),linear-gradient(#05090f,#070d14)}
header{display:flex;align-items:center;gap:10px}.sigil{width:42px;height:42px;border:1px solid #e7bc6966;border-radius:50%;display:grid;place-items:center;color:var(--gold);box-shadow:0 0 28px #e7bc6922}.identity{min-width:0;flex:1}.identity b{font-size:1.08rem}.identity small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:.68rem;color:var(--green);border:1px solid #78f0aa44;border-radius:99px;padding:6px 9px}
.world{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#102239 0,#09111b 44%,#05090f 78%);box-shadow:0 24px 80px #0009}.field{position:absolute;inset:0}.orb{position:absolute;left:50%;top:45%;width:min(43vw,190px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #75ddff55;background:radial-gradient(circle at 40% 35%,#d7f7ff 0 2%,#75ddff88 3%,#173b5d 25%,#08111d 65%);box-shadow:0 0 30px #75ddff44,0 0 100px #75ddff1d;transition:.35s}.orb.live{box-shadow:0 0 42px #78f0aa66,0 0 130px #75ddff35;transform:translate(-50%,-50%) scale(1.04)}.ring{position:absolute;left:50%;top:45%;border:1px solid #75ddff20;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.r1{width:min(67vw,300px);aspect-ratio:1}.r2{width:min(92vw,420px);aspect-ratio:1}.node{position:absolute;width:92px;min-width:0;max-width:92px;padding:7px 8px;border:1px solid var(--line);border-radius:14px;background:#08111de8;text-align:center;font-size:.68rem;color:var(--muted);transition:.3s}.node b{display:block;color:var(--text);font-size:.72rem}.node.on{border-color:#78f0aa99;color:var(--green);box-shadow:0 0 18px #78f0aa22}.node.hold{border-color:#ffd16688;color:var(--amber)}.n0{left:50%;top:8%;transform:translateX(-50%)}.n1{right:2%;top:24%}.n2{right:2%;top:57%}.n3{left:50%;bottom:8%;transform:translateX(-50%)}.n4{left:2%;top:57%}.n5{left:2%;top:24%}.routeLine{position:absolute;left:50%;top:45%;width:2px;height:2px;pointer-events:none}.pulse{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 18px var(--green);opacity:0}.pulse.go{animation:pulse 1.1s ease-out}@keyframes pulse{0%{opacity:1;transform:scale(.5)}55%{opacity:1;transform:scale(3)}100%{opacity:0;transform:scale(7)}}.meaning{position:absolute;left:10px;right:10px;bottom:14px;border:1px solid #ffffff18;border-radius:18px;background:#07101bdc;backdrop-filter:blur(14px);padding:11px 12px;max-height:26%;overflow:auto}.meaning small{color:var(--gold);font-weight:800}.meaning p{margin:4px 0 0;font-size:.8rem;line-height:1.35;color:#dce7f4}.contact{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;min-width:0}.contact textarea{min-width:0;width:100%;resize:none;height:58px;border:1px solid var(--line);border-radius:18px;background:#0a1420;padding:10px 12px;outline:none}.contact textarea:focus{border-color:var(--cyan)}.contact button{min-width:0;padding:0 8px;font-size:.78rem}.contact button,.round{border:1px solid #e7bc6966;background:#201a10;border-radius:18px;padding:0 16px;color:var(--gold);font-weight:900}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tools .round{min-width:0;padding:8px 4px;font-size:.66rem;white-space:nowrap}.round{padding:8px 12px;background:#0a1420;border-color:var(--line);font-size:.72rem}.drawer{position:fixed;z-index:8;inset:auto 0 0 0;max-height:68dvh;background:#08111bf8;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px;transform:translateY(105%);transition:.28s;overflow:auto}.drawer.open{transform:none}.drawer pre{white-space:pre-wrap;font-size:.72rem;color:#cfe1f2}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:99px;padding:5px 7px;font-size:.65rem;color:var(--muted)}.chip.on{color:var(--green);border-color:#78f0aa55}.close{float:right}.diag{display:grid;gap:8px}.law{font-size:.72rem;color:var(--muted);border-left:2px solid var(--gold);padding-left:8px}@media(max-width:430px){.identity small{font-size:.68rem}.node{width:82px;max-width:82px;padding:6px 4px}.node b{font-size:.66rem}.node{font-size:.61rem}.n1,.n2{right:1%}.n4,.n5{left:1%}.meaning p{font-size:.74rem}.contact textarea{font-size:.82rem}}@media(min-width:800px){.app{max-width:720px;margin:auto}.world{min-height:520px}.node{font-size:.75rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="app">
<header><div class="sigil">AI</div><div class="identity"><b>AILatheo</b><small>Living Federation · touch first, language after Ding</small></div><span class="status" id="headStatus">READY</span></header>
<main class="world"><div class="field" id="field"><div class="ring r2"></div><div class="ring r1"></div><div class="orb" id="orb"></div><div class="routeLine"><i class="pulse" id="pulse"></i></div>
<div class="node n0" data-id="ailatheo"><b>AILatheo</b>operator</div><div class="node n1" data-id="rod"><b>ROD</b>relation</div><div class="node n2" data-id="ai-lab"><b>AI Lab</b>knowledge</div><div class="node n3" data-id="teo"><b>Teo OS</b>continuity</div><div class="node n4" data-id="adaptive"><b>ECOSTATE</b>action</div><div class="node n5" data-id="ehilatheo"><b>Ehilatheo</b>mobile build</div>
<div class="meaning"><small id="routeLabel">CONTACT FIELD</small><p id="meaningText">Give AILatheo something to work with. The federation stays underneath until the contact earns an office.</p></div></div></main>
<div><div class="contact"><textarea id="contact" aria-label="Contact">The stored evidence says the route caused a consequence, left a trace, persisted, and re-entry changed the next action.</textarea><button id="conduct">CONTACT</button></div><div class="tools"><button class="round" id="recover">↺ RECOVER</button><button class="round" id="traceBtn">⌁ TRACE</button><button class="round" id="proofBtn">◇ PROOF MODE</button></div></div></div>
<aside class="drawer" id="drawer"><button class="round close" id="close">×</button><h3 id="drawerTitle">TraceBox</h3><div id="drawerBody"></div></aside>
<script>
const KEY='jm-ailatheo-living-federation-v1';const $=id=>document.getElementById(id);
const offices=[
{id:'ailatheo',name:'AILatheo',role:'visible operator',test:s=>s.length>0},
{id:'rod',name:'ROD',role:'relational opportunity',test:s=>/(route|relation|trace|consequence|re-entry|connect|compare)/i.test(s)},
{id:'ai-lab',name:'JM AI Lab v2.0',role:'route agent / model / knowledge',test:s=>/(stored|evidence|source|knowledge|write|generate|status|trace|find|explain)/i.test(s)},
{id:'teo',name:'Teo OS',role:'continuity / trace',test:s=>/(trace|persist|continuity|re-entry|receipt|remember|return|recover)/i.test(s)},
{id:'adaptive',name:'Adaptive ECOSTATE',role:'execute / verify / recover',test:s=>/(action|execute|build|recover|route|next|make|do|test)/i.test(s)},
{id:'ehilatheo',name:'Ehilatheo',role:'mobile build cockpit',hold:true,test:s=>/(phone|cockpit|mobile build|android)/i.test(s)}];
let history=[];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function hash(text){if(globalThis.crypto?.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(const c of text)h=Math.imul(h^c.charCodeAt(0),16777619);return 'fallback-'+(h>>>0).toString(16)}
function render(state={}){document.querySelectorAll('.node').forEach(el=>{el.classList.remove('on','hold');const v=state[el.dataset.id];if(v)el.classList.add(v)});$('orb').classList.toggle('live',Object.values(state).includes('on'))}
function explain(active,contact){const names=active.filter(x=>x.state==='on').map(x=>x.name);const held=active.filter(x=>x.state==='hold').map(x=>x.name);let t=names.length?names.join(' → ')+' entered because this contact matched their distinct offices.':'No office earned contact.';if(held.length)t+=' '+held.join(', ')+' is visible but held: role recovered, exact current body remains claim-gated.';t+=' Trace is retained without merging identities.';return t}
async function conduct(){const text=$('contact').value.trim();if(!text){$('meaningText').textContent='No contact entered. Nothing is claimed.';return}const state={},active=[];for(const o of offices){if(!o.test(text))continue;state[o.id]=o.hold?'hold':'on';active.push({...o,state:state[o.id]})}const payload=JSON.stringify({contact:text,state,path:active.map(x=>x.id+':'+x.state.toUpperCase())});const rec={schema:'jm.ailatheo.living-federation/1.0',time:new Date().toISOString(),contact:text,state,path:active.map(x=>x.id+':'+x.state.toUpperCase()),payload_sha256:await hash(payload),ding:'AILATHEO_LIVING_FEDERATION_DING'};history.push(rec);localStorage.setItem(KEY,JSON.stringify({last:rec,history:history.slice(-24)}));render(state);$('routeLabel').textContent=rec.ding;$('meaningText').textContent=explain(active,text);$('headStatus').textContent='DING';$('pulse').classList.remove('go');void $('pulse').offsetWidth;$('pulse').classList.add('go')}
function openDrawer(title,html){$('drawerTitle').textContent=title;$('drawerBody').innerHTML=html;$('drawer').classList.add('open')}
$('conduct').addEventListener('click',()=>conduct().catch(e=>{$('meaningText').textContent='CONTACT HOLD — '+String(e?.message||e);$('headStatus').textContent='HOLD'}));
$('contact').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')conduct()});
$('traceBtn').onclick=()=>{const last=history.at(-1);openDrawer('TraceBox',last?'<pre>'+esc(JSON.stringify(last,null,2))+'</pre><button class="round" id="copyReceipt">COPY RETURN RECEIPT</button>':'<p>No Ding yet.</p>');setTimeout(()=>{const b=$('copyReceipt');if(b)b.onclick=async()=>{const rec=history.at(-1),packet=JSON.stringify({...rec,return_ding:'AILATHEO_RETURN_PACKET_READY'},null,2);try{await navigator.clipboard.writeText(packet);b.textContent='COPIED'}catch{openDrawer('Return receipt','<pre>'+esc(packet)+'</pre>')}}},0)};
$('proofBtn').onclick=()=>openDrawer('Proof / diagnostic mode','<div class="diag"><div class="law">RELATION ≠ MERGER · COMMON ROUTE ≠ COMMON BODY · NO DING, NO CLAIM</div><div class="chips">'+offices.map(o=>'<span class="chip '+(history.at(-1)?.state[o.id]||'')+'">'+esc(o.name)+' · '+esc(history.at(-1)?.state[o.id]||'DIM')+'</span>').join('')+'</div><pre>'+esc(JSON.stringify({carrier:'Living Federation v1',persistence:'localStorage',return_receipt:'SHA-256 packet',boundary:'Second authorised physical surface remains separately evidenced.'},null,2))+'</pre></div>');
$('recover').onclick=()=>{try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(!saved?.last){$('meaningText').textContent='No retained state to recover.';return}history=saved.history||[saved.last];render(saved.last.state);$('routeLabel').textContent='PERSISTED STATE RECOVERED';$('meaningText').textContent='Teo OS continuity office returned the last retained contact. Executed history is preserved; the next contact may differ.';$('headStatus').textContent='RECOVERED'}catch(e){$('meaningText').textContent='RECOVERY HOLD — '+String(e?.message||e)}};
$('close').onclick=()=>$('drawer').classList.remove('open');try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.last){history=saved.history||[saved.last];render(saved.last.state);$('routeLabel').textContent='RE-ENTRY';$('meaningText').textContent='A retained route was found on entry. Press RECOVER to make continuity explicit.';$('headStatus').textContent='RETURN'}else render({})}catch{render({})}
</script></body></html>
