<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JM WEBSITE 001 - Visualang Contact · Visualang Carrier</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#090b12;color:#f5f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#202b58,#090b12 58%)}main{width:min(900px,100%);border:1px solid #5261a5;border-radius:28px;padding:clamp(18px,4vw,40px);background:#111528e8;box-shadow:0 30px 80px #0008}h1{font-size:clamp(2rem,7vw,5rem);margin:0 0 8px}p{opacity:.75}.controls{display:flex;gap:12px;overflow-x:auto;padding:16px 0}button{border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:800;white-space:nowrap;cursor:pointer}pre{min-height:220px;white-space:pre-wrap;background:#070914;padding:18px;border-radius:18px;overflow:auto}.badge{display:inline-block;padding:6px 10px;border:1px solid #6979d5;border-radius:99px;font-size:.8rem}
</style></head><body><main><span class="badge">Visualang → Visualang/HTML carrier</span><h1>JM WEBSITE 001 - Visualang Contact</h1><p>Contact a route. Watch state, output and trace remain visible.</p><div class="controls"><button data-event="press">press → reveal</button></div><pre id="receipt">READY</pre></main><script type="module">
// Generated by JM Sovereign Language Family v1.0
// Source family: Visualang; carrier: JavaScript
const program = {
  identity: "JMContactDoor",
  family: "Visualang",
  state: {
  "visited": false
},
  events: {
  "press": "reveal"
},
  routes: {
    "reveal": (state, io, call, own) => {
    state["visited"] = true;
    io.output("Visualang executed an original JM route");
    io.trace("A native JM source action changed state");
    io.ding();
    }
  }
};

function createProgram() {
  const state = structuredClone(program.state);
  const trace = []; const output = []; const ownership = {};
  const io = { output: v => output.push(String(v)), trace: v => trace.push(String(v)), ding: () => trace.push("DING") };
  const call = name => { const route = program.routes[name]; if (!route) throw new Error("Missing route: " + name); trace.push("ROUTE:" + name); route(state, io, call, ownership); };
  return { state, trace, output, ownership, runRoute: call, runEvent(event) { const route = program.events[event]; if (!route) throw new Error("Missing event: " + event); call(route); return this.receipt(); }, receipt() { return { identity: program.identity, family: program.family, state, output, ownership, trace }; } };

const runtime=createProgram(); const view=document.querySelector('#receipt'); const render=()=>view.textContent=JSON.stringify(runtime.receipt(),null,2); render(); document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.event)runtime.runEvent(b.dataset.event);else runtime.runRoute(b.dataset.route);render()}catch(err){view.textContent=err.stack||err.message}}); if(new URLSearchParams(location.search).has('autotest')){try{runtime.runRoute("reveal");render();document.documentElement.dataset.autotest=runtime.trace.includes('DING')?'DING':'NO_DING'}catch(err){document.documentElement.dataset.autotest='FAULT';view.textContent=err.stack||err.message}};
